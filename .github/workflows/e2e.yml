name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright shard ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/4
            artifact: 1-of-4
          - shard: 2/4
            artifact: 2-of-4
          - shard: 3/4
            artifact: 3-of-4
          - shard: 4/4
            artifact: 4-of-4
    permissions:
      contents: read
      pull-requests: write
    env:
      CI: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.E2E_SUPER_ADMIN_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.E2E_SUPER_ADMIN_PASSWORD }}
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_VISUAL: ${{ vars.E2E_VISUAL }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sanity-check required secrets
        run: |
          missing=0
          for var in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_EMAIL E2E_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build checked-out commit for local E2E preview
        if: vars.E2E_BASE_URL == ''
        env:
          E2E_BASE_URL: ""
        run: bun run build

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-cfw-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}

      - name: Install Playwright browsers (Chromium + Firefox + WebKit)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium firefox webkit

      - name: Run CHRISMED PR suite (all engines · desktop+mobile)
        if: github.event_name == 'pull_request'
        env:
          E2E_BASE_URL: ""
        run: >-
          bun run test:e2e --
          e2e/chrismed-header-fixed.spec.ts
          e2e/chrismed-oliver-only.spec.ts
          --shard=${{ matrix.shard }}

      - name: Run full ecosystem suite on main/manual
        if: github.event_name != 'pull_request'
        run: bun run test:e2e -- --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload visual-diff PNGs (on failure)
        if: failure()
        id: upload-visual-diffs
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs-${{ matrix.artifact }}
          path: |
            test-results/**/*-expected.png
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces, videos & DOM snapshots (on failure)
        if: failure()
        id: upload-traces
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.artifact }}
          path: |
            test-results/**/trace.zip
            test-results/**/video.webm
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Generate visual regression report
        if: always()
        id: visual-report
        run: node scripts/playwright-visual-report.mjs test-results

      - name: Comment PR with visual diff + trace links
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DIFF_URL: ${{ steps.upload-visual-diffs.outputs.artifact-url }}
          TRACE_URL: ${{ steps.upload-traces.outputs.artifact-url }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VISUAL_ENABLED: ${{ vars.E2E_VISUAL }}
          VISUAL_REPORT: ${{ steps.visual-report.outputs.report }}
          DIFF_COUNT: ${{ steps.visual-report.outputs.diff_count }}
        with:
          script: |
            const { DIFF_URL, TRACE_URL, REPORT_URL, VISUAL_ENABLED, VISUAL_REPORT, DIFF_COUNT } = process.env;
            const lines = [
              "### ❌ Playwright E2E falhou",
              "",
              `- 📄 [Run completo](${REPORT_URL})`,
            ];
            if (DIFF_URL) lines.push(`- 🖼️ [Visual diffs (expected / actual / diff PNGs)](${DIFF_URL})`);
            if (TRACE_URL) lines.push(`- 🎞️ [Traces & vídeos](${TRACE_URL}) — abra com \`bunx playwright show-trace trace.zip\``);
            if (VISUAL_ENABLED === "1" && !DIFF_URL) lines.push("- ℹ️ Nenhum PNG de diff foi gerado — provável falha não-visual.");
            if (VISUAL_ENABLED !== "1") {
              lines.push("");
              lines.push("> 💡 Os cenários de visual regression só rodam com `E2E_VISUAL=1` (Settings → Variables).");
            }
            if (VISUAL_REPORT && Number(DIFF_COUNT ?? 0) > 0) {
              lines.push("");
              lines.push("<details><summary>📊 Relatório de visual regression (viewport × estado)</summary>");
              lines.push("");
              lines.push(VISUAL_REPORT);
              lines.push("</details>");
            }
            const body = lines.join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  e2e-gate:
    name: Playwright E2E + a11y + visual (Chromium / Firefox / WebKit · desktop+mobile)
    if: always()
    needs: playwright
    runs-on: ubuntu-latest
    steps:
      - name: Consolidate full-suite result
        env:
          SHARDS_RESULT: ${{ needs.playwright.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::At least one Playwright shard failed or was cancelled."
            exit 1
          fi
          echo "All Playwright shards passed."
