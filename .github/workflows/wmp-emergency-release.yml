name: WMP emergency release

on:
  push:
    paths:
      - .github/workflows/wmp-emergency-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wmp-emergency-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
