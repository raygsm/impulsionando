name: RETIRED - Tour IT publication

# Historical workflow kept as a fail-closed tombstone.
# It previously mutated Traefik/DNS and recreated the shared Core outside the canonical pipeline.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: Tour IT independent publication is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
