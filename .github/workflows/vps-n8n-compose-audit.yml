name: VPS n8n Compose Audit

on:
  push:
    branches:
      - agent/core-impulsionando-operational-foundation
    paths:
      - .github/workflows/vps-n8n-compose-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check public canonical n8n hostname
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -ksS -o /tmp/body -w "%{http_code}" --max-time 15 https://n8n.impulsionando.com.br/healthz || true)
          echo "n8n.impulsionando.com.br/healthz -> HTTP $code"
          head -c 200 /tmp/body 2>/dev/null | tr '\n' ' ' || true
          echo

      - name: Locate compose stack on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -eu
            C=$(docker ps --format '{{.Names}}' | grep -E '^n8n-.*-n8n-1$' | head -n1)
            test -n "$C"
            echo "container=$C"
            echo "project=$(docker inspect "$C" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            echo "service=$(docker inspect "$C" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
            echo "working_dir=$(docker inspect "$C" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            echo "config_files=$(docker inspect "$C" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
            WD=$(docker inspect "$C" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')
            if [ -n "$WD" ] && [ -d "$WD" ]; then
              echo "== files containing old hostname =="
              grep -RIl --exclude='*.log' --exclude-dir='.git' 'n8n-umlg.n8n.impulsionando.com.br' "$WD" 2>/dev/null | head -n 30 || true
              echo "== compose candidates =="
              find "$WD" -maxdepth 2 -type f \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' -o -name 'compose*.yml' -o -name 'compose*.yaml' -o -name '.env' \) -print 2>/dev/null | head -n 30 || true
            fi
