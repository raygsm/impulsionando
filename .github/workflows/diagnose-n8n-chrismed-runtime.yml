name: Diagnose N8N CHRISMED runtime
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-n8n-chrismed-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Audit n8n CHRISMED capability safely
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          echo "n8n_version=$(sudo docker exec "$N8N" n8n --version)"
          echo '=== required runtime variable presence only ==='
          sudo docker exec "$N8N" node -e 'for(const n of ["SUPABASE_URL","SUPABASE_ANON_KEY","SUPABASE_SERVICE_ROLE_KEY","IMPULSIONANDO_WEBHOOK_SECRET","CHRISMED_WORKER_TOKEN","N8N_ENCRYPTION_KEY"]) console.log(`${n}_PRESENT=${Boolean(process.env[n])}`)'
          echo '=== existing CHRISMED workflows ==='
          sudo docker exec "$N8N" n8n export:workflow --all --output=/tmp/all-workflows.json >/dev/null
          sudo docker exec "$N8N" node -e 'const fs=require("fs");const raw=JSON.parse(fs.readFileSync("/tmp/all-workflows.json","utf8"));const list=Array.isArray(raw)?raw:[raw];console.log(JSON.stringify(list.filter(w=>/chrismed/i.test(`${w.name||""} ${JSON.stringify(w.tags||[])}`)).map(w=>({id:w.id,name:w.name,active:w.active,activeVersionId:w.activeVersionId||null})),null,2))'
          REMOTE
