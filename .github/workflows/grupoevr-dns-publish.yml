name: Grupo EVR DNS publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/grupoevr-dns-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dns:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DOMAIN: grupoevr.impulsionando.com.br
      ORIGIN_IP: 187.77.232.52
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          for v in CF_API_TOKEN CF_ZONE_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!v}" || { echo "::error::Missing $v"; exit 1; }
          done
          echo "CF_ZONE_ID=$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Upsert Cloudflare A record
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/dns.json
          jq -e '.success == true' /tmp/dns.json >/dev/null
          id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/dns.json | head -n1)"
          payload="$(jq -nc --arg name "$DOMAIN" --arg ip "$ORIGIN_IP" '{type:"A",name:$name,content:$ip,ttl:1,proxied:true}')"
          if [ -n "$id" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" | jq -e '.success == true' >/dev/null
          else
            curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" | jq -e '.success == true' >/dev/null
          fi
          echo "DNS_UPSERT=PASS $DOMAIN -> $ORIGIN_IP"

      - name: Validate HTTPS
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -L -o /tmp/page -w '%{http_code}' --max-time 20 "https://$DOMAIN/" || true)"
            if [ "$code" = 200 ]; then
              echo "HTTPS=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "::error::HTTPS did not reach 200"
          exit 2

      - name: Persist verified Core status
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -nc --arg now "$now" '{dns_status:"active",ssl_status:"issued",dns_last_checked_at:$now,provisioned_at:$now,dns_error:null}')"
          curl -fsS -X PATCH -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' --data "$payload" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?subdomain=eq.grupoevr"
          endpoint_payload='{"status":"active","monitoring_enabled":true,"is_primary":true}'
          curl -fsS -X PATCH -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' --data "$endpoint_payload" \
            "$SUPABASE_URL/rest/v1/core_company_endpoints?endpoint_kind=eq.public_site&url=eq.https%3A%2F%2Fgrupoevr.impulsionando.com.br"
          echo "CORE_STATUS=ACTIVE"
