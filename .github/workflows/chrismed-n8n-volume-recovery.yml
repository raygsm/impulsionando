name: CHRISMED N8N volume recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-n8n-volume-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrismed-n8n-volume-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Back up persistent N8N volume and recover runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/chrismed-n8n-volume-recovery.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          N8N=n8n-umlg-n8n-1
          BACKUP_ROOT=/var/backups/impulsionando/n8n
          sudo docker inspect "$N8N" >/dev/null
          source_path="$(sudo docker inspect "$N8N" --format '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}')"
          test -n "$source_path"
          sudo mkdir -p "$BACKUP_ROOT"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          archive="$BACKUP_ROOT/chrismed-n8n-$stamp.tgz"
          before="$(sudo docker inspect "$N8N" --format '{{.State.Status}}')"
          echo "before=$before"
          sudo docker stop -t 30 "$N8N" >/dev/null
          sudo tar -czf "$archive" -C "$source_path" .
          sudo test -s "$archive"
          size="$(sudo stat -c %s "$archive")"
          echo "backup=$archive bytes=$size"
          sudo docker start "$N8N" >/dev/null
          ok=0
          for i in $(seq 1 90); do
            if sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
          echo "health=PASS"
          sudo docker exec "$N8N" n8n export:workflow --all --output=/tmp/chrismed-recovery-export.json >/tmp/chrismed-export.log 2>&1 || true
          if sudo docker exec "$N8N" test -s /tmp/chrismed-recovery-export.json; then
            count="$(sudo docker exec "$N8N" node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/chrismed-recovery-export.json','utf8'));console.log(Array.isArray(x)?x.length:1)")"
            echo "cli_export=PASS workflows=$count"
          else
            echo "cli_export=UNAVAILABLE volume_backup=PASS"
            sudo docker exec "$N8N" sh -lc 'cat /tmp/chrismed-export.log 2>/dev/null || true' || true
          fi
          echo 'CHRISMED_N8N_VOLUME_RECOVERY=PASS'
          REMOTE
      - name: Persist recovery proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          cp /tmp/chrismed-n8n-volume-recovery.txt docs/ops/chrismed-n8n-volume-recovery.txt || echo 'proof missing' > docs/ops/chrismed-n8n-volume-recovery.txt
          git config user.name 'Impulsionito CHRISMED QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/chrismed-n8n-volume-recovery.txt
          git commit -m 'chore(chrismed): record n8n volume recovery proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
