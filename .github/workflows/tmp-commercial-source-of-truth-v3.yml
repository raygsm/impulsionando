name: Temporary commercial source of truth patch v3
on:
  push:
    branches: [fix/core-commercial-source-of-truth-20260813]
    paths: [.github/workflows/tmp-commercial-source-of-truth-v3.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-commercial-source-of-truth-20260813
          fetch-depth: 0
      - run: python3 scripts/tmp_apply_commercial_source_of_truth.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(commercial): enforce backend as public pricing source"
          git push origin HEAD:fix/core-commercial-source-of-truth-20260813
