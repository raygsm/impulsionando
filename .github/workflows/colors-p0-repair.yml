name: Colors Front Verification (canonical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Colors canonical front and host retention
        run: |
          set -euo pipefail
          domain='colorssaude.impulsionando.com.br'
          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio; do
            read -r code final < <(curl -sS -L -o /tmp/page -w '%{http_code} %{url_effective}' -H 'Cache-Control: no-cache' --max-time 20 "https://$domain$path")
            host="$(printf '%s' "$final" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
            test "$code" = 200
            test "$host" = "$domain"
          done
          marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/impulsionando-front-sha.txt")"
          printf '%s' "$marker" | grep -Eq '^[0-9a-f]{40}$'
          echo "COLORS_CANONICAL_FRONT=PASS sha=$marker"
      - name: Architecture invariant
        run: |
          echo 'Colors frontend publication belongs exclusively to Production Front.'
          echo 'This workflow is verification-only and cannot mutate DNS, Traefik, images or containers.'
