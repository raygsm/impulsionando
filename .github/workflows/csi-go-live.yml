name: CSI Front Verification (canonical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify CSI canonical front
        run: |
          set -euo pipefail
          domain='csi.impulsionando.com.br'
          code="$(curl -sS -L -o /tmp/home -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 20 "https://$domain/")"
          marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/impulsionando-front-sha.txt")"
          test "$code" = 200
          printf '%s' "$marker" | grep -Eq '^[0-9a-f]{40}$'
          echo "CSI_CANONICAL_FRONT=PASS sha=$marker"
      - name: Architecture invariant
        run: |
          echo 'CSI frontend publication belongs exclusively to Production Front.'
          echo 'This workflow is verification-only and cannot mutate DNS, Traefik, images or containers.'
