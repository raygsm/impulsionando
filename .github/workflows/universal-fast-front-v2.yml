name: Universal Fast Front V2

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - vite.config.*
      - package.json
      - package-lock.json
      - .github/workflows/universal-fast-front-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-fast-front-v2
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: P0 guards
        run: |
          set -euo pipefail
          grep -Fq 'CANONICAL_RECOVERY_URL' src/routes/auth.tsx
          grep -Fq 'resetPasswordForEmail' src/routes/auth.tsx
          grep -Fq 'EyeOff' src/components/ui/input.tsx
          grep -Fq 'Área do Cliente' src/lib/niche-plans.ts
          grep -Fq 'Dashboard' src/lib/niche-plans.ts

      - name: Discover current Impulsionando subdomains
        run: |
          set -euo pipefail
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" \
            -o /tmp/tenants.json
          jq -e 'type=="array"' /tmp/tenants.json >/dev/null
          jq -r '.[] | select(.subdomain != null and .root_domain == "impulsionando.com.br" and .subdomain != "impulsionando") | (.subdomain + ".impulsionando.com.br")' /tmp/tenants.json | sort -u > /tmp/domains
          echo "TENANT_COUNT=$(wc -l < /tmp/domains | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Build once outside VPS
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt
          tar -czf /tmp/front.tgz .output scripts

      - name: Configure SSH and origin
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY; do test -n "${!v}" || { echo "missing $v"; exit 10; }; done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          echo "ORIGIN_IP=$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Ensure wildcard DNS for all current and future subdomains
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          set -euo pipefail
          wildcard='*.impulsionando.com.br'
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$wildcard&per_page=100" -o /tmp/wild.json
          jq -e '.success == true' /tmp/wild.json >/dev/null
          id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/wild.json | head -n1)"
          payload="$(jq -nc --arg name "$wildcard" --arg ip "$ORIGIN_IP" '{type:"A",name:$name,content:$ip,ttl:1,proxied:true}')"
          if [ -n "$id" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" | jq -e '.success == true' >/dev/null
          else
            curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" | jq -e '.success == true' >/dev/null
          fi
          echo WILDCARD_DNS_OK

      - name: Reconcile explicit current subdomains
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          set -euo pipefail
          while read -r domain; do
            [ -n "$domain" ] || continue
            curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$domain&per_page=100" -o /tmp/dns.json
            jq -e '.success == true' /tmp/dns.json >/dev/null
            id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/dns.json | head -n1)"
            if [ -n "$id" ]; then
              payload="$(jq -nc --arg name "$domain" --arg ip "$ORIGIN_IP" '{type:"A",name:$name,content:$ip,ttl:1,proxied:true}')"
              curl -fsS -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
                "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" | jq -e '.success == true' >/dev/null
            fi
          done < /tmp/domains

      - name: Upload immutable artifact
        run: |
          set -euo pipefail
          scp /tmp/front.tgz "$VPS_USER@$VPS_HOST:/tmp/uffv2-$GITHUB_SHA.tgz"

      - name: Canary then promote without build
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release="/var/www/impulsionando-core/releases/uffv2-$RELEASE_SHA"
          archive="/tmp/uffv2-$RELEASE_SHA.tgz"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.universal-fast-front-v2.yml
          envfile=/etc/impulsionando-core.env
          canary=impulsionando-fastfront-v2-canary
          live=impulsionando-core-universal-fastfront-v2

          sudo test -f "$base"
          sudo test -f "$envfile"
          sudo docker inspect impulsionando-core >/dev/null
          image="$(sudo docker inspect -f '{{.Config.Image}}' impulsionando-core)"
          network="$(sudo docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' impulsionando-core | awk '{print $1}')"
          test -n "$image"
          test -n "$network"

          sudo rm -rf "$release"
          sudo mkdir -p "$release"
          sudo tar -xzf "$archive" -C "$release"
          rm -f "$archive"
          sudo test -f "$release/.output/server/index.mjs"
          test "$(sudo cat "$release/.output/public/impulsionando-front-sha.txt")" = "$RELEASE_SHA"

          sudo docker rm -f "$canary" >/dev/null 2>&1 || true
          sudo docker run -d --name "$canary" --network "$network" --env-file "$envfile" \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -v "$release/.output:/app/.output:ro" -v "$release/scripts:/app/scripts:ro" \
            "$image" node scripts/start-core-runtime.mjs >/dev/null

          ok=0
          for i in $(seq 1 30); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$canary" 2>/dev/null || true)"
            if [ -n "$ip" ]; then
              code="$(curl -sS -H 'Host: impulsionando.com.br' -o /tmp/canary.html -w '%{http_code}' --max-time 8 "http://$ip:3000/" || true)"
              if [ "$code" = 200 ]; then ok=1; break; fi
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            sudo docker logs --tail 120 "$canary" || true
            sudo docker rm -f "$canary" >/dev/null 2>&1 || true
            exit 61
          fi
          sudo docker rm -f "$canary" >/dev/null

          cd /opt/impulsionando/deploy/hostinger
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core-universal-fastfront-v2:
              image: __IMAGE__
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              volumes:
                - __RELEASE__/.output:/app/.output:ro
                - __RELEASE__/scripts:/app/scripts:ro
              command: ["node", "scripts/start-core-runtime.mjs"]
              environment:
                NODE_ENV: production
                HOST: 0.0.0.0
                PORT: 3000
              labels:
                traefik.enable: "true"
                traefik.http.routers.uffv2-apex.entrypoints: websecure
                traefik.http.routers.uffv2-apex.rule: "(Host(`impulsionando.com.br`) || Host(`www.impulsionando.com.br`)) && !PathPrefix(`/api`)"
                traefik.http.routers.uffv2-apex.service: uffv2
                traefik.http.routers.uffv2-apex.tls: "true"
                traefik.http.routers.uffv2-apex.tls.certresolver: letsencrypt
                traefik.http.routers.uffv2-apex.priority: "9000"
                traefik.http.routers.uffv2-tenants.entrypoints: websecure
                traefik.http.routers.uffv2-tenants.rule: "HostRegexp(`{subdomain:[a-z0-9-]+}.impulsionando.com.br`) && !PathPrefix(`/api`)"
                traefik.http.routers.uffv2-tenants.service: uffv2
                traefik.http.routers.uffv2-tenants.tls: "true"
                traefik.http.routers.uffv2-tenants.tls.certresolver: letsencrypt
                traefik.http.routers.uffv2-tenants.priority: "8900"
                traefik.http.services.uffv2.loadbalancer.server.port: "3000"
          YAML
          sudo sed -i "s|__IMAGE__|$image|g; s|__RELEASE__|$release|g" "$override"
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate "$live"

          live_ok=0
          for i in $(seq 1 30); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$live" 2>/dev/null || true)"
            if [ -n "$ip" ]; then
              code="$(curl -sS -H 'Host: impulsionando.com.br' -o /tmp/live.html -w '%{http_code}' --max-time 8 "http://$ip:3000/" || true)"
              if [ "$code" = 200 ]; then live_ok=1; break; fi
            fi
            sleep 2
          done
          if [ "$live_ok" != 1 ]; then
            sudo docker logs --tail 120 "$live" || true
            sudo docker compose -f "$base" -f "$override" rm -sf "$live" || true
            sudo rm -f "$override"
            exit 62
          fi
          echo "UFFV2_PROMOTION_PASS sha=$RELEASE_SHA"
          REMOTE

      - name: Public SHA validation
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/proof.txt
          printf 'sha=%s\ngenerated_at_utc=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/proof.txt
          failed=0
          validate() {
            domain="$1"
            for i in $(seq 1 20); do
              code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/?sha=$GITHUB_SHA" || true)"
              sha="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 10 "https://$domain/impulsionando-front-sha.txt?sha=$GITHUB_SHA" 2>/dev/null || true)"
              if [ "$code" = 200 ] && [ "$sha" = "$GITHUB_SHA" ]; then return 0; fi
              sleep 3
            done
            return 1
          }
          if validate impulsionando.com.br; then echo "PASS impulsionando.com.br $GITHUB_SHA" | tee -a /tmp/proof.txt; else echo 'FAIL impulsionando.com.br' | tee -a /tmp/proof.txt; failed=1; fi
          while read -r domain; do
            [ -n "$domain" ] || continue
            if validate "$domain"; then echo "PASS $domain $GITHUB_SHA" | tee -a /tmp/proof.txt; else echo "FAIL $domain" | tee -a /tmp/proof.txt; failed=1; fi
          done < /tmp/domains
          echo "failed=$failed" >> /tmp/proof.txt
          exit "$failed"

      - name: Roll back V2 router on validation failure
        if: failure()
        run: |
          set +e
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.universal-fast-front-v2.yml
          if sudo test -f "$override"; then
            cd /opt/impulsionando/deploy/hostinger
            sudo docker compose -f "$base" -f "$override" rm -sf impulsionando-core-universal-fastfront-v2 || true
            sudo rm -f "$override"
          fi
          REMOTE

      - name: Persist proof
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          cp /tmp/proof.txt docs/ops/universal-fast-front-v2-proof.txt || printf 'proof_unavailable\n' > docs/ops/universal-fast-front-v2-proof.txt
          git config user.name 'Impulsionito Front Publisher V2'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/universal-fast-front-v2-proof.txt
          git commit -m 'chore(front): record universal fast front v2 proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
