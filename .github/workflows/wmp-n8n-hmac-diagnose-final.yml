name: WMP n8n HMAC diagnose final

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-hmac-diagnose-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect WMP verifier nodes and webhook options
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/$id-diag.json" >/dev/null
            sudo docker exec -e WID="$id" "$C" node - <<'NODE'
const fs=require('fs');
const id=process.env.WID;
const r=JSON.parse(fs.readFileSync('/tmp/'+id+'-diag.json','utf8'));
const w=Array.isArray(r)?r[0]:r;
const h=(w.nodes||[]).find(n=>n.type==='n8n-nodes-base.webhook');
const v=(w.nodes||[]).find(n=>n.name==='Verify signature in Core'||(n.type==='n8n-nodes-base.httpRequest'&&String(n.parameters?.url||'').includes('n8n-verify')));
console.log('WORKFLOW '+id+' active='+w.active+' activeVersionId='+w.activeVersionId);
console.log('WEBHOOK '+JSON.stringify({parameters:h?.parameters,webhookId:h?.webhookId,typeVersion:h?.typeVersion}));
console.log('VERIFIER '+JSON.stringify({parameters:v?.parameters,typeVersion:v?.typeVersion}));
NODE
          done
          REMOTE
