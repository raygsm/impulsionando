name: One-shot stabilize Core deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-stabilize-core-deploy.yml

permissions:
  contents: write

concurrency:
  group: one-shot-stabilize-core-deploy
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve running deploy and RioMed validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('.github/workflows/deploy-core-frontend.yml'),
              Path('.github/workflows/riomed-p0-validation.yml'),
          ]
          for path in targets:
              text = path.read_text()
              marker = 'concurrency:\n  group:'
              if marker not in text:
                  raise SystemExit(f'missing concurrency block in {path}')
              before = text
              head, tail = text.split(marker, 1)
              block = marker + tail
              old = '  cancel-in-progress: true'
              if old not in block:
                  if '  cancel-in-progress: false' in block:
                      continue
                  raise SystemExit(f'missing expected cancel policy in {path}')
              block = block.replace(old, '  cancel-in-progress: false', 1)
              path.write_text(head + block)
              if path.read_text() == before:
                  raise SystemExit(f'no change in {path}')
          PY
          rm -f .github/workflows/one-shot-stabilize-core-deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-core-frontend.yml .github/workflows/riomed-p0-validation.yml .github/workflows/one-shot-stabilize-core-deploy.yml
          if git diff --cached --quiet; then
            echo 'NO_CHANGES=1'
            exit 0
          fi
          git commit -m 'ci(core): preserve in-progress deploy and RioMed validation'
          git push origin HEAD:main
