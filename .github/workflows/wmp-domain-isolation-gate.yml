name: WMP domain isolation gate

on:
  workflow_run:
    workflows: ["Deploy Core Frontend"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wmp-domain-isolation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify published WMP domain-lock release marker
        run: |
          set -euo pipefail
          marker_url='https://wmp.impulsionando.com.br/wmp-domain-lock.txt'
          marker_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' -o "$marker_file" -w '%{http_code}' "$marker_url")"
          echo "WMP_RELEASE_MARKER HTTP=$code"
          [ "$code" = '200' ] || { echo '::error::WMP release marker unavailable'; exit 77; }
          grep -Fxq 'WMP_DOMAIN_LOCK_RELEASE=2026-08-18-v1' "$marker_file" || { echo '::error::Unexpected WMP release marker'; exit 78; }
          grep -Fxq 'WMP_CANONICAL_HOST=wmp.impulsionando.com.br' "$marker_file" || { echo '::error::Unexpected WMP canonical host marker'; exit 79; }
          grep -Fxq 'WMP_DOMAIN_ISOLATION=ENFORCED' "$marker_file" || { echo '::error::WMP isolation marker missing'; exit 80; }
          rm -f "$marker_file"
          echo 'WMP_RELEASE_MARKER=PASS'

      - name: Verify WMP never leaves its canonical host
        id: domain_gate
        run: |
          set -euo pipefail
          canonical_host='wmp.impulsionando.com.br'
          paths=( '/' '/djs' '/empresas' '/orcamento' '/parceiro' '/onde-estou' '/cases' '/pacotes' )
          for path in "${paths[@]}"; do
            url="https://${canonical_host}${path}"
            headers="$(mktemp)"
            body="$(mktemp)"
            final_url="$(curl --location --silent --show-error --max-time 30 -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -D "$headers" -o "$body" -w '%{url_effective}' "$url")"
            final_host="$(printf '%s' "$final_url" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
            echo "WMP_DOMAIN_GATE path=$path final_url=$final_url"
            [ "$final_host" = "$canonical_host" ] || { echo "::error::WMP escaped canonical host: $url -> $final_url"; exit 70; }
            ! grep -Eqi '^location:[[:space:]]*https?://(www\.)?impulsionando\.com\.br([/:]|$)' "$headers" || { echo "::error::WMP response chain attempted redirect to Impulsionando apex for $url"; exit 71; }
            grep -Eqi 'WMP|Wagner Miller' "$body" || { echo "::error::WMP identity marker missing after navigation: $final_url"; exit 72; }
            ! grep -Eqi '<title>[^<]*Impulsionando Tecnologia|Plataforma SaaS multiempresa' "$body" || { echo "::error::Impulsionando institutional home detected on WMP host: $final_url"; exit 73; }
            rm -f "$headers" "$body"
          done
          echo 'WMP_DOMAIN_ISOLATION=PASS'

      - name: Configure SSH for emergency rollback
        if: ${{ failure() }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 74

      - name: Restore previous known-good Core release
        if: ${{ failure() }}
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          restored_edge=false
          restored_systemd=false
          if sudo docker image inspect impulsionando-core:deploy-rollback >/dev/null 2>&1; then
            sudo docker tag impulsionando-core:deploy-rollback impulsionando-core:latest
            cd /opt/impulsionando/deploy/hostinger
            sudo docker compose -f docker-compose.yml up -d --no-build --force-recreate impulsionando-core
            restored_edge=true
          fi
          PREVIOUS_RELEASE="$(sudo cat /var/www/impulsionando-core/.previous-release 2>/dev/null || true)"
          if [ -n "$PREVIOUS_RELEASE" ] && [ -f "$PREVIOUS_RELEASE/.output/server/index.mjs" ]; then
            sudo ln -sfn "$PREVIOUS_RELEASE" /var/www/impulsionando-core/current
            sudo systemctl restart impulsionando-core
            restored_systemd=true
          fi
          if [ "$restored_edge" != true ] && [ "$restored_systemd" != true ]; then echo 'No rollback target available' >&2; exit 75; fi
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then echo 'WMP_DOMAIN_ROLLBACK=PASS'; exit 0; fi
            sleep 1
          done
          echo 'Rollback target did not become healthy' >&2
          exit 76
          REMOTE
