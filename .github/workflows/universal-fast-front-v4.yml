name: Universal Fast Front V4

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - vite.config.*
      - package.json
      - package-lock.json
      - .github/workflows/universal-fast-front-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-fast-front-v4
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Initialize proof
        run: |
          set -euo pipefail
          printf 'workflow=Universal Fast Front V4\nsha=%s\nstarted_at_utc=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/proof.txt

      - name: Validate production inputs
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!v}" || { echo "FAIL missing_secret=$v" | tee -a /tmp/proof.txt; exit 10; }
          done
          grep -Fq 'CANONICAL_RECOVERY_URL' src/routes/auth.tsx
          grep -Fq 'resetPasswordForEmail' src/routes/auth.tsx
          grep -Fq 'EyeOff' src/components/ui/input.tsx
          echo 'PASS product_guards' >> /tmp/proof.txt

      - name: Discover active client subdomains
        run: |
          set -euo pipefail
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" \
            -o /tmp/tenants.json
          jq -e 'type=="array"' /tmp/tenants.json >/dev/null
          jq -r '.[] | select(.subdomain != null and .root_domain == "impulsionando.com.br" and .subdomain != "impulsionando") | (.subdomain + ".impulsionando.com.br")' /tmp/tenants.json | sort -u > /tmp/domains
          count="$(wc -l < /tmp/domains | tr -d ' ')"
          echo "TENANT_COUNT=$count" >> "$GITHUB_ENV"
          echo "PASS tenant_count=$count" >> /tmp/proof.txt

      - name: Build once on GitHub runner
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt
          tar -czf /tmp/front-v4.tgz .output scripts
          echo 'PASS build_runner_only' >> /tmp/proof.txt

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          echo 'PASS ssh_configured' >> /tmp/proof.txt

      - name: Ensure wildcard DNS
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          set -euo pipefail
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          wildcard='*.impulsionando.com.br'
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$wildcard&per_page=100" -o /tmp/wild.json
          jq -e '.success == true' /tmp/wild.json >/dev/null
          id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/wild.json | head -n1)"
          payload="$(jq -nc --arg name "$wildcard" --arg ip "$ORIGIN_IP" '{type:"A",name:$name,content:$ip,ttl:1,proxied:true}')"
          if [ -n "$id" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" | jq -e '.success == true' >/dev/null
          else
            curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" | jq -e '.success == true' >/dev/null
          fi
          echo "PASS wildcard_dns=$ORIGIN_IP" >> /tmp/proof.txt

      - name: Upload immutable artifact
        run: |
          set -euo pipefail
          scp /tmp/front-v4.tgz "$VPS_USER@$VPS_HOST:/tmp/uffv4-$GITHUB_SHA.tgz"
          echo 'PASS artifact_uploaded' >> /tmp/proof.txt

      - name: Canary and direct Traefik promotion
        run: |
          set -o pipefail
          set +e
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE' 2>&1 | tee /tmp/remote-promotion.log
          set -Eeuo pipefail
          release="/var/www/impulsionando-core/releases/uffv4-$RELEASE_SHA"
          archive="/tmp/uffv4-$RELEASE_SHA.tgz"
          envfile=/etc/impulsionando-core.env
          canary=impulsionando-fastfront-v4-canary
          live=impulsionando-fastfront-v4-live

          sudo test -f "$envfile"
          sudo docker inspect impulsionando-core >/dev/null
          image="$(sudo docker inspect -f '{{.Config.Image}}' impulsionando-core)"
          network="$(sudo docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{printf "%s " $k}}{{end}}' impulsionando-core | awk '{print $1}')"
          test -n "$image"
          test -n "$network"
          sudo docker image inspect "$image" >/dev/null

          sudo rm -rf "$release"
          sudo mkdir -p "$release"
          sudo tar -xzf "$archive" -C "$release"
          rm -f "$archive"
          sudo test -f "$release/.output/server/index.mjs"
          test "$(sudo cat "$release/.output/public/impulsionando-front-sha.txt")" = "$RELEASE_SHA"

          sudo docker rm -f "$canary" >/dev/null 2>&1 || true
          sudo docker run -d \
            --name "$canary" \
            --network "$network" \
            --env-file "$envfile" \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -v "$release/.output:/app/.output:ro" \
            -v "$release/scripts:/app/scripts:ro" \
            "$image" node scripts/start-core-runtime.mjs >/dev/null

          ok=0
          for i in $(seq 1 30); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$canary" 2>/dev/null || true)"
            if [ -n "$ip" ]; then
              code="$(curl -sS -H 'Host: impulsionando.com.br' -o /tmp/canary.html -w '%{http_code}' --max-time 8 "http://$ip:3000/" || true)"
              if [ "$code" = 200 ]; then ok=1; break; fi
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo 'CANARY_FAIL'
            sudo docker logs --tail 160 "$canary" || true
            sudo docker rm -f "$canary" >/dev/null 2>&1 || true
            exit 61
          fi
          sudo docker rm -f "$canary" >/dev/null

          sudo docker rm -f "$live" >/dev/null 2>&1 || true
          sudo docker run -d \
            --name "$live" \
            --network "$network" \
            --env-file "$envfile" \
            --restart unless-stopped \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -v "$release/.output:/app/.output:ro" \
            -v "$release/scripts:/app/scripts:ro" \
            --label 'traefik.enable=true' \
            --label 'traefik.http.routers.uffv4-apex.entrypoints=websecure' \
            --label 'traefik.http.routers.uffv4-apex.rule=(Host(`impulsionando.com.br`) || Host(`www.impulsionando.com.br`)) && !PathPrefix(`/api`)' \
            --label 'traefik.http.routers.uffv4-apex.tls=true' \
            --label 'traefik.http.routers.uffv4-apex.tls.certresolver=letsencrypt' \
            --label 'traefik.http.routers.uffv4-apex.priority=11000' \
            --label 'traefik.http.routers.uffv4-apex.service=uffv4' \
            --label 'traefik.http.routers.uffv4-tenants.entrypoints=websecure' \
            --label 'traefik.http.routers.uffv4-tenants.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.impulsionando.com.br`) && !PathPrefix(`/api`)' \
            --label 'traefik.http.routers.uffv4-tenants.tls=true' \
            --label 'traefik.http.routers.uffv4-tenants.tls.certresolver=letsencrypt' \
            --label 'traefik.http.routers.uffv4-tenants.priority=10900' \
            --label 'traefik.http.routers.uffv4-tenants.service=uffv4' \
            --label 'traefik.http.services.uffv4.loadbalancer.server.port=3000' \
            "$image" node scripts/start-core-runtime.mjs >/dev/null

          live_ok=0
          for i in $(seq 1 30); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$live" 2>/dev/null || true)"
            if [ -n "$ip" ]; then
              code="$(curl -sS -H 'Host: impulsionando.com.br' -o /tmp/live.html -w '%{http_code}' --max-time 8 "http://$ip:3000/" || true)"
              if [ "$code" = 200 ]; then live_ok=1; break; fi
            fi
            sleep 2
          done
          if [ "$live_ok" != 1 ]; then
            echo 'LIVE_FAIL'
            sudo docker logs --tail 160 "$live" || true
            sudo docker rm -f "$live" >/dev/null 2>&1 || true
            exit 62
          fi

          echo "PROMOTION_PASS sha=$RELEASE_SHA image=$image network=$network"
          REMOTE
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "FAIL promotion_rc=$rc" >> /tmp/proof.txt
            sed -n '1,220p' /tmp/remote-promotion.log >> /tmp/proof.txt
            exit "$rc"
          fi
          echo 'PASS canary_and_promotion' >> /tmp/proof.txt

      - name: Validate exact public SHA everywhere
        run: |
          set -euo pipefail
          failed=0
          validate() {
            domain="$1"
            for i in $(seq 1 15); do
              code="$(curl -sS -L -o /tmp/home.html -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/?sha=$GITHUB_SHA" || true)"
              sha="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 10 "https://$domain/impulsionando-front-sha.txt?sha=$GITHUB_SHA" 2>/dev/null || true)"
              if [ "$code" = 200 ] && [ "$sha" = "$GITHUB_SHA" ]; then return 0; fi
              sleep 2
            done
            return 1
          }

          if validate impulsionando.com.br; then
            echo "PASS public=impulsionando.com.br sha=$GITHUB_SHA" | tee -a /tmp/proof.txt
          else
            echo 'FAIL public=impulsionando.com.br' | tee -a /tmp/proof.txt
            failed=1
          fi

          while read -r domain; do
            [ -n "$domain" ] || continue
            if validate "$domain"; then
              echo "PASS public=$domain sha=$GITHUB_SHA" | tee -a /tmp/proof.txt
            else
              echo "FAIL public=$domain" | tee -a /tmp/proof.txt
              failed=1
            fi
          done < /tmp/domains

          if [ "$failed" -ne 0 ]; then exit 70; fi
          echo 'RESULT=PASS' >> /tmp/proof.txt

      - name: Roll back V4 on any failure after promotion
        if: failure()
        run: |
          set +e
          ssh "$VPS_USER@$VPS_HOST" "sudo docker rm -f impulsionando-fastfront-v4-live >/dev/null 2>&1 || true"

      - name: Persist proof safely
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/proof.txt || printf 'workflow=Universal Fast Front V4\nsha=%s\nRESULT=FAIL_NO_PROOF\n' "$GITHUB_SHA" > /tmp/proof.txt
          printf 'finished_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/proof.txt
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git rebase origin/main
          mkdir -p docs/ops
          cp /tmp/proof.txt docs/ops/universal-fast-front-v4-proof.txt
          git config user.name 'Impulsionito Front Publisher V4'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/universal-fast-front-v4-proof.txt
          git commit -m 'chore(front): record universal fast front v4 proof' || exit 0
          git push origin HEAD:main
