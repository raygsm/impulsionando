name: Zero Legacy Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Block newly introduced forbidden legacy references
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
          fi
          changed="$(git diff --name-only "$base" HEAD -- . ':!docs/archive/**' ':!*.lock' || true)"
          if [ -z "$changed" ]; then
            echo 'ZERO_LEGACY_GUARD=PASS (no changed files to scan)'
            exit 0
          fi
          scan() {
            pattern="$1"
            label="$2"
            hits="$(printf '%s\n' "$changed" | while IFS= read -r f; do [ -f "$f" ] && grep -nI -E "$pattern" "$f" 2>/dev/null | sed "s#^#$f:#" || true; done)"
            if [ -n "$hits" ]; then
              echo "::error::$label newly present in changed files"
              printf '%s\n' "$hits"
              fail=1
            fi
          }
          scan 'grupocolors\.com\.br|checkout\.grupocolors\.com\.br' 'Forbidden Colors legacy domain'
          scan 'colors\.impulsionando\.com\.br|colors-saude\.impulsionando\.com\.br' 'Deprecated Colors hostname'
          scan 'raygsm/impulsionito|github\.com/raygsm/impulsionito' 'Wrong repository reference'
          scan 'impulsionando\.lovable\.app|lovable\.app|lovable\.dev' 'Lovable runtime/domain reference'
          [ "$fail" -eq 0 ]
      - name: Assert canonical Colors host exists
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -I 'colorssaude\.impulsionando\.com\.br' -- src supabase .github >/dev/null
          echo 'CANONICAL_COLORS_HOST=PASS'
