name: RETIRED - Grupo EVR isolated publish

# Historical workflow kept as a fail-closed tombstone.
# It previously built an isolated production runtime and mutated Traefik, DNS and tenant state.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: Grupo EVR isolated frontend publication is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
