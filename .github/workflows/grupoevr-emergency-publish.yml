name: Grupo EVR isolated publish

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grupoevr-isolated-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.number == 87 && github.event.comment.body == '/publish-grupoevr')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    env:
      DOMAIN: grupoevr.impulsionando.com.br
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate production credentials
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          test "$ORIGIN_IP" = "187.77.232.52" || { echo "::error::Unexpected origin IP $ORIGIN_IP"; exit 2; }
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Build Grupo EVR front from main
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          grep -Fq 'grupoevr: "/grupo-evr"' src/lib/subdomain.ts
          test -f src/routes/grupo-evr.index.tsx
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          tar -czf /tmp/grupoevr-release.tgz .output scripts package.json package-lock.json

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Upload release
        run: scp /tmp/grupoevr-release.tgz "$VPS_USER@$VPS_HOST:/tmp/grupoevr-release.tgz"

      - name: Deploy isolated Grupo EVR runtime and Traefik router
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          release="/var/www/impulsionando-core/releases/grupoevr-$RELEASE_SHA"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.grupoevr.yml
          envfile=/etc/impulsionando-core.env
          sudo test -f "$base"
          sudo test -f "$envfile"
          sudo mkdir -p "$release"
          sudo tar -xzf /tmp/grupoevr-release.tgz -C "$release"
          rm -f /tmp/grupoevr-release.tgz
          cat > /tmp/Dockerfile.grupoevr <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.grupoevr -t "impulsionando-core:grupoevr-$RELEASE_SHA" "$release"
          cd /opt/impulsionando/deploy/hostinger
          sudo tee "$override" >/dev/null <<YAML
          services:
            impulsionando-grupoevr:
              image: impulsionando-core:grupoevr-$RELEASE_SHA
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              labels:
                traefik.enable: "true"
                traefik.http.routers.grupoevr.entrypoints: websecure
                traefik.http.routers.grupoevr.rule: "Host(\`$DOMAIN\`)"
                traefik.http.routers.grupoevr.service: grupoevr
                traefik.http.routers.grupoevr.tls: "true"
                traefik.http.routers.grupoevr.tls.certresolver: letsencrypt
                traefik.http.routers.grupoevr.priority: "9900"
                traefik.http.services.grupoevr.loadbalancer.server.port: "3000"
          YAML
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-grupoevr
          for i in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-grupoevr 2>/dev/null || true)"
            code=000
            if [ -n "$ip" ]; then
              code="$(curl -sS -H "Host: $DOMAIN" -o /tmp/grupoevr-origin -w '%{http_code}' --max-time 10 "http://$ip:3000/" || true)"
            fi
            [ "$code" = '200' ] && break
            [ "$i" -lt 45 ] || { sudo docker logs --tail 200 impulsionando-grupoevr || true; exit 60; }
            sleep 2
          done
          grep -qi 'Grupo EVR' /tmp/grupoevr-origin || { echo '::error::Grupo EVR content not found at origin'; exit 61; }
          echo "GRUPOEVR_ORIGIN=PASS HTTP=$code"
          REMOTE

      - name: Reconcile Cloudflare DNS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/dns.json
          jq -e '.success == true' /tmp/dns.json >/dev/null
          current_id="$(jq -r --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip and .proxied==true) | .id' /tmp/dns.json | head -n1)"
          if [ -z "$current_id" ]; then
            jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/dns.json | while read -r id; do
              [ -z "$id" ] || curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
            done
            jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/new.json
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/created.json
            jq -e '.success == true' /tmp/created.json >/dev/null
          fi
          echo "GRUPOEVR_DNS=READY"

      - name: Validate public HTTPS and content
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            headers="$(mktemp)"
            code="$(curl -sS -L -A 'Mozilla/5.0 GrupoEVRPublish/1.0' -H 'Cache-Control: no-cache' -D "$headers" -o /tmp/grupoevr-public -w '%{http_code}' --max-time 30 "https://$DOMAIN/" || true)"
            if [ "$code" = '200' ] && grep -qi 'Grupo EVR' /tmp/grupoevr-public; then
              rm -f "$headers"
              echo "GRUPOEVR_PUBLIC=PASS HTTP=200"
              exit 0
            fi
            rm -f "$headers"
            sleep 5
          done
          echo '::error::Public Grupo EVR front did not validate'
          exit 70

      - name: Persist verified status in Core
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -nc --arg now "$now" '{dns_status:"active",ssl_status:"issued",dns_last_checked_at:$now,provisioned_at:$now,dns_error:null}')"
          curl --fail --silent --show-error -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            --data "$payload" "$SUPABASE_URL/rest/v1/core_tenant_identity?subdomain=eq.grupoevr"
          endpoint_payload="$(jq -nc '{status:"active",monitoring_enabled:true,is_primary:true}')"
          curl --fail --silent --show-error -X PATCH \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            --data "$endpoint_payload" "$SUPABASE_URL/rest/v1/core_company_endpoints?endpoint_kind=eq.public_site&url=eq.https%3A%2F%2Fgrupoevr.impulsionando.com.br"
          echo 'GRUPOEVR_CORE_STATUS=ACTIVE'
