name: Temporary repair Core n8n HMAC

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/tmp-repair-core-n8n-hmac.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Copy existing n8n HMAC secret to Core securely
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -eu
            CORE_ENV=/etc/impulsionando-core.env
            N8N_ENV=/docker/n8n-umlg/.env
            KEY=IMPULSIONANDO_WEBHOOK_SECRET

            SECRET=$(awk -v k="$KEY" 'index($0,k"=")==1 {print substr($0,length(k)+2); exit}' "$N8N_ENV")
            if [ -z "$SECRET" ]; then
              echo "HMAC_SOURCE=MISSING"
              exit 2
            fi

            BACKUP="${CORE_ENV}.bak.$(date +%Y%m%d%H%M%S)"
            cp -a "$CORE_ENV" "$BACKUP"
            TMP=$(mktemp)
            grep -v "^${KEY}=" "$CORE_ENV" > "$TMP" || true
            printf '%s=%s\n' "$KEY" "$SECRET" >> "$TMP"
            install -m 0600 "$TMP" "$CORE_ENV"
            rm -f "$TMP"
            unset SECRET

            systemctl restart impulsionando-core
            sleep 3
            systemctl is-active --quiet impulsionando-core

            CORE_VALUE=$(awk -v k="$KEY" 'index($0,k"=")==1 {print substr($0,length(k)+2); exit}' "$CORE_ENV")
            N8N_VALUE=$(awk -v k="$KEY" 'index($0,k"=")==1 {print substr($0,length(k)+2); exit}' "$N8N_ENV")
            if [ -n "$CORE_VALUE" ] && [ "$CORE_VALUE" = "$N8N_VALUE" ]; then
              echo "CORE_HMAC_SYNC=MATCH"
              echo "CORE_SERVICE=ACTIVE"
            else
              echo "CORE_HMAC_SYNC=MISMATCH"
              cp -a "$BACKUP" "$CORE_ENV"
              systemctl restart impulsionando-core || true
              exit 3
            fi
