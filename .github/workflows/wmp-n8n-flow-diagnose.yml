name: WMP n8n flow diagnose
on:
  push:
    paths:
      - .github/workflows/wmp-n8n-flow-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH
        env:
          H: ${{ secrets.VPS_HOST }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in $(seq 1 10); do ssh-keyscan -T 10 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null && exit 0; sleep 3; done
          exit 41
      - name: Inspect
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/$id-flow.json" >/dev/null
            sudo docker exec -e WID="$id" "$C" node -e "const fs=require('fs'),id=process.env.WID,r=JSON.parse(fs.readFileSync('/tmp/'+id+'-flow.json','utf8')),w=Array.isArray(r)?r[0]:r; console.log('WORKFLOW '+id); console.log('NODES='+JSON.stringify((w.nodes||[]).map(n=>({name:n.name,type:n.type})))); console.log('CONNECTIONS='+JSON.stringify(w.connections||{}));"
          done
          REMOTE
