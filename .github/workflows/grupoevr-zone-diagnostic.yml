name: Grupo EVR Cloudflare zone diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/grupoevr-zone-diagnostic.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    if: github.head_ref == 'ops/grupoevr-cloudflare-zone-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect Cloudflare zone and public DNS
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq dnsutils >/dev/null
          zone="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone" -o /tmp/zone.json
          zname="$(jq -r '.result.name // empty' /tmp/zone.json)"
          zstatus="$(jq -r '.result.status // empty' /tmp/zone.json)"
          auth_ns="$(jq -r '.result.name_servers[0] // empty' /tmp/zone.json)"
          ns_public="$(dig +short NS impulsionando.com.br | sort | tr '\n' ',' | sed 's/,$//')"
          a_auth="$(dig +short @$auth_ns grupoevr.impulsionando.com.br A | tr '\n' ',' | sed 's/,$//')"
          a_cf="$(dig +short @1.1.1.1 grupoevr.impulsionando.com.br A | tr '\n' ',' | sed 's/,$//')"
          a_google="$(dig +short @8.8.8.8 grupoevr.impulsionando.com.br A | tr '\n' ',' | sed 's/,$//')"
          status_cf="$(dig @1.1.1.1 grupoevr.impulsionando.com.br A +noall +comments | awk '/status:/{gsub(",",""); print $6; exit}')"
          ds_parent="$(dig +short DS impulsionando.com.br | head -1 | tr ' ' '_')"
          detail="zone=$zname status=$zstatus public_ns=$ns_public auth_a=$a_auth cf_a=$a_cf google_a=$a_google cf_status=$status_cf parent_ds=$ds_parent"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="GRUPOEVR_DNS_PATH: ${{ steps.diag.outputs.detail }}"
