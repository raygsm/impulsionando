name: Emergency Apex DNS Cutover

on:
  push:
    branches:
      - chore/remove-lovable-runtime-legacy
    paths:
      - .github/workflows/emergency-apex-dns-cutover.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/emergency-apex-dns-cutover.yml
  workflow_dispatch:

concurrency:
  group: emergency-apex-dns-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cutover:
    if: github.event_name != 'pull_request' || github.head_ref == 'chore/remove-lovable-runtime-legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      DOMAIN: impulsionando.com.br
      VPS_HOST: ${{ secrets.VPS_HOST }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve canonical VPS and validate secrets
        run: |
          set -euo pipefail
          for v in VPS_HOST CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!v:-}" || { echo "::error::Missing $v"; exit 10; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          VPS_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$VPS_IP"
          echo "CF_ZONE_ID=$CF_ZONE_ID" >> "$GITHUB_ENV"
          echo "VPS_IP=$VPS_IP" >> "$GITHUB_ENV"

      - name: Backup and update only apex A record
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"
          headers=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          curl --fail --silent --show-error "${headers[@]}" "$api?name=$DOMAIN&per_page=100" -o /tmp/apex-before.json
          jq -e '.success == true' /tmp/apex-before.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A")] | length' /tmp/apex-before.json)"
          [ "$count" = 1 ] || { echo "::error::Expected exactly one apex A record, found $count"; exit 20; }
          id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/apex-before.json)"
          echo "CF_RECORD_ID=$id" >> "$GITHUB_ENV"
          jq -nc --arg name "$DOMAIN" --arg content "$VPS_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/apex-new.json
          curl --fail --silent --show-error -X PUT "${headers[@]}" --data @/tmp/apex-new.json "$api/$id" -o /tmp/apex-updated.json
          jq -e --arg ip "$VPS_IP" '.success == true and .result.type == "A" and .result.content == $ip and .result.proxied == true' /tmp/apex-updated.json >/dev/null
          echo 'APEX_DNS_UPDATE=PASS'

      - name: Verify public apex
        id: verify
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://$DOMAIN/?apex_cutover=${GITHUB_RUN_ID}-$i" || true)"
            echo "ATTEMPT=$i HTTP=$code"
            if [ "$code" = 200 ]; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ]
          echo 'APEX_PUBLIC_HTTPS=PASS'

      - name: Roll back apex DNS on failure
        if: failure()
        run: |
          set -uo pipefail
          test -s /tmp/apex-before.json || exit 0
          old="$(jq -c '.result[] | select(.type=="A") | {type,name,content,ttl,proxied}' /tmp/apex-before.json | head -n1)"
          id="${CF_RECORD_ID:-}"
          [ -n "$id" ] || exit 0
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records"
          curl --silent --show-error -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$old" "$api/$id" >/dev/null || true
          echo 'APEX_DNS_ROLLBACK_ATTEMPTED'

      - name: Upload apex DNS backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-dns-before-${{ github.run_id }}
          path: /tmp/apex-before.json
          if-no-files-found: ignore
          retention-days: 30
