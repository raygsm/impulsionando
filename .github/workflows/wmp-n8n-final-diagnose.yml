name: WMP n8n final diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-final-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Diagnose WMP workflows and webhook registry
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/$id-diag.json" >/dev/null
            sudo docker exec -e WID="$id" "$C" node -e "const fs=require('fs'),id=process.env.WID,r=JSON.parse(fs.readFileSync('/tmp/'+id+'-diag.json','utf8')),w=Array.isArray(r)?r[0]:r,h=(w.nodes||[]).find(n=>n.type==='n8n-nodes-base.webhook');console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,activeVersionId:w.activeVersionId,versionId:w.versionId,webhookId:h?.webhookId,path:h?.parameters?.path,responseMode:h?.parameters?.responseMode,nodes:(w.nodes||[]).map(n=>n.name)}));"
          done
          echo '== LOCAL N8N HEALTH =='
          sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(async r=>console.log('health',r.status,await r.text())).catch(e=>{console.error(e);process.exit(1)})"
          echo '== LOCAL WEBHOOK PROBES =='
          for p in wmp-lead-intake wmp-proposal-lifecycle wmp-dj-booking-lifecycle wmp-post-event-relationship; do
            sudo docker exec -e P="$p" "$C" node -e "fetch('http://127.0.0.1:5678/webhook/'+process.env.P,{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(async r=>console.log(process.env.P,r.status,(await r.text()).slice(0,250))).catch(e=>console.error(process.env.P,e.message))"
          done
          echo '== EXTERNAL WEBHOOK PROBES =='
          for p in wmp-lead-intake wmp-proposal-lifecycle wmp-dj-booking-lifecycle wmp-post-event-relationship; do
            code="$(curl -sS -o /tmp/n8n-ext -w '%{http_code}' --max-time 20 -X POST "https://n8n.impulsionando.com.br/webhook/$p" -H 'content-type: application/json' -d '{}')"
            echo "$p external=$code body=$(head -c 220 /tmp/n8n-ext)"
          done
          echo '== RECENT N8N LOGS =='
          sudo docker logs --since 10m "$C" 2>&1 | grep -Ei 'wmp|webhook|workflow|error|warn' | tail -n 220 || true
          REMOTE
