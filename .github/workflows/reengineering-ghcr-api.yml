# Reengineering GHCR Nest API (Phase 3 Support pilot).
#
# Manual only — never push-to-main auto-deploy.
# Tags with full commit SHA only (never `latest` as authority).
#
# This file lives on `main` so GitHub registers the workflow.
# Default build ref is `reengineering/program` (Nest API + Dockerfile.api).

name: Reengineering GHCR API

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to build (must contain apps/api and infra/compose/Dockerfile.api)
        required: true
        default: reengineering/program
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: reengineering-ghcr-api-${{ inputs.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/impulsionando-api

jobs:
  build-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA-tagged API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.api
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=impulsionando-api

      - name: Job summary
        run: |
          {
            echo "## Reengineering GHCR API (Phase 3)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Built ref | \`${{ inputs.ref }}\` |"
            echo "| Image | \`${IMAGE_NAME}:${GITHUB_SHA}\` |"
            echo "| Tag authority | **full commit SHA only** |"
            echo "| Trigger | \`workflow_dispatch\` only |"
            echo "| Environment | **staging / clean host — not production** |"
            echo ""
            echo "Deploy: \`IMAGE_TAG=${GITHUB_SHA} ./scripts/deploy-reengineering-api-clean-host.sh\` on clean host \`2.25.123.224\`."
          } >> "$GITHUB_STEP_SUMMARY"
