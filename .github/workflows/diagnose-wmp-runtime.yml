name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect capability names only
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '== Core Supabase-related env names =='
          sudo docker exec impulsionando-core sh -lc "env | cut -d= -f1 | grep -E 'SUPABASE|DATABASE|POSTGRES' | sort -u" || true
          echo '== Core mail-related env names =='
          sudo docker exec impulsionando-core sh -lc "env | cut -d= -f1 | grep -Ei 'SMTP|MAIL|RESEND|EMAIL' | sort -u" || true
          echo '== n8n env names =='
          sudo docker exec n8n-umlg-n8n-1 sh -lc "env | cut -d= -f1 | grep -E 'N8N|WEBHOOK|DB_|POSTGRES|ENCRYPTION' | sort -u" || true
          echo '== n8n version =='
          sudo docker exec n8n-umlg-n8n-1 n8n --version || true
          echo '== n8n workflow list =='
          sudo docker exec n8n-umlg-n8n-1 n8n list:workflow 2>/dev/null | head -n 120 || true
          REMOTE
