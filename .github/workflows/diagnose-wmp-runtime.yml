name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect and activate WMP lead workflow
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          sudo docker inspect "$N8N" --format 'status={{.State.Status}} running={{.State.Running}} restart={{.RestartCount}}'
          sudo docker exec "$N8N" n8n --version
          sudo docker exec "$N8N" n8n update:workflow --id=wmpLeadIntake01 --active=true
          sudo docker restart "$N8N" >/dev/null
          sleep 12
          sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>{console.log('health='+r.status);if(!r.ok)process.exit(1)})"
          echo '== WMP workflows =='
          sudo docker exec "$N8N" n8n list:workflow 2>/dev/null | grep 'WMP' || true
          echo '== Lead webhook =='
          curl -fsS --max-time 20 -X POST https://n8n.impulsionando.com.br/webhook/wmp-lead-intake -H 'content-type: application/json' -d '{"tenant_slug":"wmp","event_code":"wmp.lead.received","correlation_id":"activation-smoke"}'
          echo
          REMOTE
