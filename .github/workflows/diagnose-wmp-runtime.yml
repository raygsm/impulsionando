name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect and recover WMP automation runtime
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          echo '== Containers relevantes =='
          sudo docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'NAMES|n8n|traefik|impulsionando-core' || true
          echo '== n8n existe? =='
          sudo docker inspect "$N8N" --format 'status={{.State.Status}} running={{.State.Running}} restart={{.RestartCount}}' || exit 21
          running="$(sudo docker inspect "$N8N" --format '{{.State.Running}}')"
          if [ "$running" != true ]; then
            echo 'n8n parado; iniciando container existente.'
            sudo docker start "$N8N"
            sleep 8
          fi
          echo '== Redes n8n =='
          sudo docker inspect "$N8N" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{$v.IPAddress}}{{println}}{{end}}'
          echo '== Labels de roteamento n8n =='
          sudo docker inspect "$N8N" --format '{{range $k,$v := .Config.Labels}}{{if or (eq $k "traefik.enable") (match "traefik.http" $k)}}{{$k}}={{$v}}{{println}}{{end}}{{end}}' || true
          echo '== Versao n8n =='
          sudo docker exec "$N8N" n8n --version
          echo '== Health interno =='
          if ! sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>{console.log(r.status);if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
            echo 'healthz falhou; reiniciando n8n uma vez.'
            sudo docker restart "$N8N"
            sleep 12
            sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>{console.log(r.status);if(!r.ok)process.exit(1)})"
          fi
          echo '== Variaveis relevantes (somente nomes) =='
          sudo docker exec "$N8N" sh -lc "env | cut -d= -f1 | grep -E 'N8N|WEBHOOK|DB_|POSTGRES|ENCRYPTION' | sort -u" || true
          echo '== Workflows =='
          sudo docker exec "$N8N" n8n list:workflow 2>/dev/null | head -n 200 || true
          echo '== HTTPS publico n8n =='
          curl -skI --max-time 20 https://n8n.impulsionando.com.br/ | head -n 12 || true
          REMOTE
