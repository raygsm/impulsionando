name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect n8n webhook registration
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1

          echo '=== runtime ==='
          sudo docker exec "$N8N" n8n --version
          sudo docker exec "$N8N" sh -lc 'printf "DB_TYPE=%s\nEXECUTIONS_MODE=%s\nN8N_PATH=%s\nWEBHOOK_URL_SET=%s\nN8N_HOST=%s\nN8N_PROTOCOL=%s\nN8N_PORT=%s\n" "${DB_TYPE:-sqlite}" "${EXECUTIONS_MODE:-regular}" "${N8N_PATH:-/}" "$([ -n "${WEBHOOK_URL:-}" ] && echo true || echo false)" "${N8N_HOST:-}" "${N8N_PROTOCOL:-}" "${N8N_PORT:-}"'

          echo '=== current workflow ==='
          sudo docker exec "$N8N" n8n export:workflow --id=wmpLeadIntake01 --output=/tmp/wmp-export.json >/dev/null
          sudo docker exec "$N8N" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/wmp-export.json','utf8'));const w=Array.isArray(r)?r[0]:r;console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,versionId:w.versionId,activeVersionId:w.activeVersionId,nodes:w.nodes&&w.nodes.map(n=>({id:n.id,name:n.name,type:n.type,typeVersion:n.typeVersion,webhookId:n.webhookId,parameters:n.parameters}))},null,2))"

          echo '=== sqlite schema / webhook rows (read-only) ==='
          sudo docker exec "$N8N" node - <<'NODE' || true
          const path='/home/node/.n8n/database.sqlite';
          let Database;
          try { Database=require('better-sqlite3'); } catch(e) { console.log('better-sqlite3-unavailable'); process.exit(0); }
          const db=new Database(path,{readonly:true});
          const tables=db.prepare("select name from sqlite_master where type='table' and (name like '%webhook%' or name like '%workflow%') order by name").all();
          console.log('tables='+JSON.stringify(tables));
          for (const candidate of ['webhook_entity','webhookEntity','workflow_entity','workflowEntity']) {
            try {
              const info=db.prepare(`pragma table_info(${candidate})`).all();
              if (!info.length) continue;
              console.log(candidate+'_columns='+JSON.stringify(info.map(x=>x.name)));
              if (candidate.toLowerCase().includes('webhook')) {
                const rows=db.prepare(`select * from ${candidate} where workflowId=?`).all('wmpLeadIntake01');
                console.log(candidate+'_rows='+JSON.stringify(rows));
              } else {
                const rows=db.prepare(`select id,name,active,versionId,activeVersionId from ${candidate} where id=?`).all('wmpLeadIntake01');
                console.log(candidate+'_rows='+JSON.stringify(rows));
              }
            } catch(e) { console.log(candidate+'_error='+e.message); }
          }
          db.close();
          NODE

          echo '=== recent startup logs ==='
          sudo docker logs --tail 250 "$N8N" 2>&1 | grep -Ei 'wmpLeadIntake01|WMP Lead|webhook|activate|active workflow|error|failed|warn' | tail -n 160 || true

          echo '=== internal/public probes ==='
          for url in \
            'http://127.0.0.1:5678/webhook/wmp-lead-intake' \
            'https://n8n.impulsionando.com.br/webhook/wmp-lead-intake'; do
            code="$(curl -sS -o /tmp/n8n-probe.out -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' -d '{"correlation_id":"registration-diagnostic"}')"
            echo "$url -> $code"
            head -c 500 /tmp/n8n-probe.out || true
            echo
          done
          REMOTE
