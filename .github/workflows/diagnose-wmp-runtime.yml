name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Inspect n8n activation commands
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          sudo docker exec "$N8N" n8n --version
          echo '== publish help =='
          sudo docker exec "$N8N" n8n publish:workflow --help || true
          echo '== update help =='
          sudo docker exec "$N8N" n8n update:workflow --help || true
          echo '== import help =='
          sudo docker exec "$N8N" n8n import:workflow --help || true
          echo '== top-level workflow commands =='
          sudo docker exec "$N8N" n8n --help | grep -E 'workflow|activate|publish' || true
          REMOTE
