name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Compare WMP and Core webhook registration
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          CORE_ID=kjdkkV9rjIMgAMdA
          WMP_ID=wmpLeadIntake01

          echo '=== exported node comparison ==='
          for spec in "core:$CORE_ID" "wmp:$WMP_ID"; do
            label="${spec%%:*}"; wid="${spec#*:}"
            sudo docker exec "$N8N" n8n export:workflow --id="$wid" --output="/tmp/${label}.json" >/dev/null
            echo "--- $label ---"
            sudo docker exec "$N8N" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/${label}.json','utf8'));const w=Array.isArray(r)?r[0]:r;console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,versionId:w.versionId,activeVersionId:w.activeVersionId,nodes:(w.nodes||[]).filter(n=>n.type==='n8n-nodes-base.webhook').map(n=>({id:n.id,name:n.name,type:n.type,typeVersion:n.typeVersion,webhookId:n.webhookId,parameters:n.parameters,disabled:n.disabled}))},null,2))"
          done

          echo '=== sqlite read-only registration comparison ==='
          sudo docker exec -i "$N8N" node - <<'NODE' || true
          let Database;
          try { Database=require('better-sqlite3'); } catch(e) { console.log('better-sqlite3-unavailable:'+e.message); process.exit(0); }
          const db=new Database('/home/node/.n8n/database.sqlite',{readonly:true});
          const tables=db.prepare("select name from sqlite_master where type='table' and (lower(name) like '%webhook%' or lower(name) like '%workflow%') order by name").all().map(x=>x.name);
          console.log('tables='+JSON.stringify(tables));
          for (const t of tables) {
            const cols=db.prepare(`pragma table_info('${t.replaceAll("'","''")}')`).all().map(x=>x.name);
            if (!cols.includes('workflowId') && !cols.includes('id')) continue;
            try {
              if (cols.includes('workflowId')) {
                const rows=db.prepare(`select * from "${t}" where workflowId in (?,?)`).all('kjdkkV9rjIMgAMdA','wmpLeadIntake01');
                if (rows.length) console.log(t+'='+JSON.stringify(rows));
              } else if (t.toLowerCase().includes('workflow')) {
                const select=['id','name','active','versionId','activeVersionId'].filter(c=>cols.includes(c)).map(c=>'"'+c+'"').join(',');
                if (select) {
                  const rows=db.prepare(`select ${select} from "${t}" where id in (?,?)`).all('kjdkkV9rjIMgAMdA','wmpLeadIntake01');
                  if (rows.length) console.log(t+'='+JSON.stringify(rows));
                }
              }
            } catch(e) { console.log(t+'_error='+e.message); }
          }
          db.close();
          NODE

          echo '=== container-local WMP probe ==='
          sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/webhook/wmp-lead-intake',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({correlation_id:'container-probe'})}).then(async r=>{console.log('status='+r.status);console.log((await r.text()).slice(0,500))}).catch(e=>{console.error(e);process.exit(1)})"
          REMOTE
