name: Diagnose WMP runtime capabilities
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Diagnose and activate WMP lead workflow
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "N8N_API_KEY='${N8N_API_KEY}' bash -s" <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          echo '=== n8n runtime ==='
          sudo docker exec "$N8N" n8n --version
          sudo docker exec "$N8N" sh -lc 'printf "DB_TYPE=%s\nEXECUTIONS_MODE=%s\n" "${DB_TYPE:-sqlite}" "${EXECUTIONS_MODE:-regular}"'

          cat >/tmp/wmp-lead.json <<'JSON'
          {"id":"wmpLeadIntake01","name":"WMP Lead Intake","active":false,"nodes":[{"parameters":{"httpMethod":"POST","path":"wmp-lead-intake","responseMode":"lastNode","options":{}},"id":"wmp-lead-webhook","name":"WMP Lead","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0],"webhookId":"wmp-lead-intake"}],"connections":{},"settings":{"executionOrder":"v1"}}
          JSON
          sudo docker cp /tmp/wmp-lead.json "$N8N:/tmp/wmp-lead.json"
          sudo docker exec "$N8N" n8n import:workflow --input=/tmp/wmp-lead.json
          sudo docker exec "$N8N" n8n publish:workflow --id=wmpLeadIntake01

          echo '=== exported workflow state ==='
          sudo docker exec "$N8N" n8n export:workflow --id=wmpLeadIntake01 --output=/tmp/wmp-export.json >/dev/null
          sudo docker exec "$N8N" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/wmp-export.json','utf8'));const w=Array.isArray(r)?r[0]:r;console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,versionId:w.versionId,activeVersionId:w.activeVersionId,webhookId:w.nodes&&w.nodes[0]&&w.nodes[0].webhookId},null,2))"

          if [ -n "${N8N_API_KEY:-}" ]; then
            echo '=== API activation ==='
            api_code="$(curl -sS -o /tmp/n8n-activate.out -w '%{http_code}' --max-time 20 -X POST "https://n8n.impulsionando.com.br/api/v1/workflows/wmpLeadIntake01/activate" -H "X-N8N-API-KEY: ${N8N_API_KEY}" -H 'content-type: application/json' -d '{}')"
            echo "activation_http=$api_code"
            cat /tmp/n8n-activate.out || true
            echo
          else
            echo 'N8N_API_KEY_PRESENT=false'
          fi

          sudo docker restart "$N8N" >/dev/null
          sleep 12
          sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>{console.log('health='+r.status);if(!r.ok)process.exit(1)})"
          code="$(curl -sS -o /tmp/wmp-lead-smoke.out -w '%{http_code}' --max-time 20 -X POST https://n8n.impulsionando.com.br/webhook/wmp-lead-intake -H 'content-type: application/json' -d '{"tenant_slug":"wmp","event_code":"wmp.lead.received","correlation_id":"activation-smoke"}')"
          cat /tmp/wmp-lead-smoke.out || true
          echo
          echo "webhook_http=$code"
          case "$code" in 2*|3*) ;; *) exit 22 ;; esac
          REMOTE
