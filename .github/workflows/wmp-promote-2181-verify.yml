name: RETIRED - WMP promote 2181 and verify

# Historical workflow kept as a fail-closed tombstone.
# It previously promoted a pinned release and force-recreated the shared Core.
# Verification may remain read-only, but publication belongs only to Production Front.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: WMP pinned Core release promotion is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
