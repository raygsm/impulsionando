name: Provision Evolution API - Impulsionando

on:
  workflow_dispatch:
  push:
    branches:
      - homologacao/impulsionando-go-live-20260817
    paths:
      - .github/workflows/provision-evolution-homologacao.yml
      - deploy/evolution/docker-compose.yml

concurrency:
  group: provision-evolution-impulsionando
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Provision private WhatsApp provider
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_SSH_KEY:-}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload Evolution compose template
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST:-}"
          test -n "${DEPLOY_USER:-}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo install -d -m 0700 /opt/impulsionando/evolution'
          scp deploy/evolution/docker-compose.yml "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/impulsionando-evolution-compose.yml"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo install -o root -g root -m 0600 /tmp/impulsionando-evolution-compose.yml /opt/impulsionando/evolution/docker-compose.yml && rm -f /tmp/impulsionando-evolution-compose.yml'

      - name: Provision provider on private Core network
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          STACK_DIR=/opt/impulsionando/evolution
          CORE_COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          CORE_ENV=/etc/impulsionando-core.env
          CORE_ENV_BACKUP=/etc/impulsionando-core.env.pre-evolution
          EVOLUTION_CONTAINER=impulsionando-evolution-api
          EVOLUTION_INSTANCE=impulsionando-impulsionito

          test -f "$CORE_COMPOSE"
          test -f "$STACK_DIR/docker-compose.yml"
          sudo docker inspect impulsionando-core >/dev/null

          CORE_NETWORK="$(sudo docker inspect impulsionando-core --format '{{range $name, $cfg := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' | head -n1)"
          test -n "$CORE_NETWORK"

          if ! sudo test -f "$STACK_DIR/.env"; then
            API_KEY="$(openssl rand -hex 32)"
            DB_PASSWORD="$(openssl rand -hex 32)"
            REDIS_PASSWORD="$(openssl rand -hex 32)"
            WEBHOOK_SECRET="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            printf '%s\n' \
              "EVOLUTION_API_KEY=$API_KEY" \
              "EVOLUTION_DB_PASSWORD=$DB_PASSWORD" \
              "EVOLUTION_REDIS_PASSWORD=$REDIS_PASSWORD" \
              "EVOLUTION_WEBHOOK_SECRET=$WEBHOOK_SECRET" \
              "CORE_NETWORK=$CORE_NETWORK" > "$tmp"
            sudo install -o root -g root -m 0600 "$tmp" "$STACK_DIR/.env"
            rm -f "$tmp"
            unset API_KEY DB_PASSWORD REDIS_PASSWORD WEBHOOK_SECRET
          else
            if ! sudo grep -q '^EVOLUTION_WEBHOOK_SECRET=.' "$STACK_DIR/.env"; then
              WEBHOOK_SECRET="$(openssl rand -hex 32)"
              printf 'EVOLUTION_WEBHOOK_SECRET=%s\n' "$WEBHOOK_SECRET" | sudo tee -a "$STACK_DIR/.env" >/dev/null
              unset WEBHOOK_SECRET
            fi
            tmp="$(mktemp)"
            sudo grep -v '^CORE_NETWORK=' "$STACK_DIR/.env" > "$tmp"
            printf 'CORE_NETWORK=%s\n' "$CORE_NETWORK" >> "$tmp"
            sudo install -o root -g root -m 0600 "$tmp" "$STACK_DIR/.env"
            rm -f "$tmp"
          fi

          cd "$STACK_DIR"
          sudo docker compose --env-file .env config >/dev/null
          sudo docker compose --env-file .env pull
          sudo docker compose --env-file .env up -d

          for attempt in $(seq 1 60); do
            if sudo docker run --rm --network "$CORE_NETWORK" curlimages/curl:8.12.1 -fsS --max-time 5 http://impulsionando-evolution-api:8080/ >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              sudo docker logs --tail 200 "$EVOLUTION_CONTAINER" || true
              exit 61
            fi
            sleep 2
          done

          API_KEY="$(sudo sed -n 's/^EVOLUTION_API_KEY=//p' "$STACK_DIR/.env" | head -n1)"
          WEBHOOK_SECRET="$(sudo sed -n 's/^EVOLUTION_WEBHOOK_SECRET=//p' "$STACK_DIR/.env" | head -n1)"
          test -n "$API_KEY"
          test -n "$WEBHOOK_SECRET"

          create_code="$(sudo docker run --rm --network "$CORE_NETWORK" curlimages/curl:8.12.1 -sS -o /tmp/evo-create.json -w '%{http_code}' \
            -X POST http://impulsionando-evolution-api:8080/instance/create \
            -H 'content-type: application/json' \
            -H "apikey: $API_KEY" \
            --data "{\"instanceName\":\"$EVOLUTION_INSTANCE\",\"qrcode\":true,\"integration\":\"WHATSAPP-BAILEYS\"}" || true)"
          case "$create_code" in
            200|201|403|409) ;;
            *)
              echo "Unexpected Evolution instance create HTTP=$create_code"
              sudo docker logs --tail 120 "$EVOLUTION_CONTAINER" || true
              exit 62
              ;;
          esac

          sudo cp "$CORE_ENV" "$CORE_ENV_BACKUP"
          tmp="$(mktemp)"
          sudo grep -v '^IMPULSIONANDO_EVOLUTION_BASE_URL=' "$CORE_ENV" \
            | grep -v '^IMPULSIONANDO_EVOLUTION_API_KEY=' \
            | grep -v '^IMPULSIONANDO_EVOLUTION_WEBHOOK_SECRET=' \
            | grep -v '^IMPULSIONANDO_EVOLUTION_INSTANCE=' > "$tmp"
          printf 'IMPULSIONANDO_EVOLUTION_BASE_URL=http://impulsionando-evolution-api:8080\n' >> "$tmp"
          printf 'IMPULSIONANDO_EVOLUTION_API_KEY=%s\n' "$API_KEY" >> "$tmp"
          printf 'IMPULSIONANDO_EVOLUTION_WEBHOOK_SECRET=%s\n' "$WEBHOOK_SECRET" >> "$tmp"
          printf 'IMPULSIONANDO_EVOLUTION_INSTANCE=%s\n' "$EVOLUTION_INSTANCE" >> "$tmp"
          sudo install -o root -g root -m 0600 "$tmp" "$CORE_ENV"
          rm -f "$tmp"
          unset API_KEY WEBHOOK_SECRET

          cd /opt/impulsionando/deploy/hostinger
          if ! sudo docker compose -f "$CORE_COMPOSE" up -d --no-build --force-recreate impulsionando-core; then
            sudo cp "$CORE_ENV_BACKUP" "$CORE_ENV"
            sudo docker compose -f "$CORE_COMPOSE" up -d --no-build --force-recreate impulsionando-core || true
            exit 63
          fi

          for attempt in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null | head -c 80 || true)"
            if [ -n "$ip" ] && curl -fsS -H 'Host: impulsionando.com.br' -H 'Accept: text/html' "http://$ip:3000/" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              sudo cp "$CORE_ENV_BACKUP" "$CORE_ENV"
              sudo docker compose -f "$CORE_COMPOSE" up -d --no-build --force-recreate impulsionando-core || true
              exit 64
            fi
            sleep 2
          done

          echo 'EVOLUTION_PROVIDER=PASS'
          echo "EVOLUTION_PRIVATE_NETWORK=$CORE_NETWORK"
          echo "EVOLUTION_INSTANCE=$EVOLUTION_INSTANCE"
          echo 'EVOLUTION_WEBHOOK_SECRET=CONFIGURED'
          echo 'CORE_AFTER_EVOLUTION=PASS'
          REMOTE
