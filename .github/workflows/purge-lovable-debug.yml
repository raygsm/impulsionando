name: Purge Lovable debug

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-lovable-debug.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Diagnose purge and build
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set +e
          mkdir -p docs/ops
          : > docs/ops/purge-lovable-debug.txt
          echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> docs/ops/purge-lovable-debug.txt
          npm uninstall @lovable.dev/cloud-auth-js @lovable.dev/email-js @lovable.dev/mcp-js @lovable.dev/webhooks-js @lovable.dev/vite-tanstack-config > /tmp/uninstall.log 2>&1
          uninstall_rc=$?
          echo "uninstall_rc=$uninstall_rc" >> docs/ops/purge-lovable-debug.txt
          tail -n 80 /tmp/uninstall.log >> docs/ops/purge-lovable-debug.txt
          echo "--- remaining lovable ---" >> docs/ops/purge-lovable-debug.txt
          grep -Rni --include='package.json' --include='package-lock.json' '@lovable.dev' . >> docs/ops/purge-lovable-debug.txt 2>&1
          grep_rc=$?
          echo "grep_rc=$grep_rc" >> docs/ops/purge-lovable-debug.txt
          npm ci --no-audit --no-fund > /tmp/npmci.log 2>&1
          ci_rc=$?
          echo "npm_ci_rc=$ci_rc" >> docs/ops/purge-lovable-debug.txt
          tail -n 100 /tmp/npmci.log >> docs/ops/purge-lovable-debug.txt
          npm run build > /tmp/build.log 2>&1
          build_rc=$?
          echo "build_rc=$build_rc" >> docs/ops/purge-lovable-debug.txt
          tail -n 140 /tmp/build.log >> docs/ops/purge-lovable-debug.txt
          echo "final_has_lovable=$(grep -Rli --include='package.json' --include='package-lock.json' '@lovable.dev' . | wc -l | tr -d ' ')" >> docs/ops/purge-lovable-debug.txt
          exit 0

      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/purge-lovable-debug.txt
          git commit -m 'chore(go-live): record Lovable purge diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
