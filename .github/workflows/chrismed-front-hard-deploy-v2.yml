name: RETIRED - CHRISMED final front hard deploy v2

# Historical workflow kept as a fail-closed tombstone.
# It previously built, switched and recreated the shared Core for one tenant.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: CHRISMED hard frontend deploy v2 is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
