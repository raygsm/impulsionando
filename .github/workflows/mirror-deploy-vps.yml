name: RETIRED - VPS Recovery Deploy Impulsionando

# Historical workflow kept as a fail-closed tombstone.
# A second PM2 publication path can diverge from the canonical Docker release.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: competing PM2 recovery deploy is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
