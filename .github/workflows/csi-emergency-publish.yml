name: CSI Emergency Publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/csi-emergency-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csi-emergency-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DOMAIN: csi.impulsionando.com.br
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build CSI-capable Core
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Upload release
        run: |
          set -euo pipefail
          tar -czf /tmp/csi-release.tgz .output scripts package.json package-lock.json
          scp /tmp/csi-release.tgz "$VPS_USER@$VPS_HOST:/tmp/csi-release.tgz"
      - name: Deploy isolated CSI runtime and Traefik router
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release="/var/www/impulsionando-core/releases/csi-$RELEASE_SHA"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.csi.yml
          envfile=/etc/impulsionando-core.env
          test -f "$base"
          sudo test -f "$envfile"
          mkdir -p "$release"
          tar -xzf /tmp/csi-release.tgz -C "$release"
          rm -f /tmp/csi-release.tgz
          printf 'node_modules\n' > "$release/.dockerignore"
          cat > /tmp/Dockerfile.csi <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.csi -t impulsionando-core:csi "$release"
          cd /opt/impulsionando/deploy/hostinger
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core-csi:
              image: impulsionando-core:csi
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              labels:
                traefik.enable: "true"
                traefik.http.routers.csi.entrypoints: websecure
                traefik.http.routers.csi.rule: Host(`csi.impulsionando.com.br`)
                traefik.http.routers.csi.service: impulsionando-core-csi
                traefik.http.routers.csi.tls: "true"
                traefik.http.routers.csi.tls.certresolver: letsencrypt
                traefik.http.routers.csi.priority: "300"
                traefik.http.services.impulsionando-core-csi.loadbalancer.server.port: "3000"
          YAML
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-core-csi
          for i in $(seq 1 60); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core-csi 2>/dev/null || true)"
            code=000
            if [ -n "$ip" ]; then code="$(curl -sS -H 'Host: csi.impulsionando.com.br' -o /tmp/csi-origin -w '%{http_code}' --max-time 10 "http://$ip:3000/" || true)"; fi
            [ "$code" = '200' ] && break
            [ "$i" -lt 60 ] || { sudo docker logs --tail 200 impulsionando-core-csi || true; exit 60; }
            sleep 2
          done
          echo "CSI_ORIGIN=PASS HTTP=$code"
          REMOTE
      - name: Create or replace CSI Cloudflare record
        run: |
          set -euo pipefail
          for value in CF_API_TOKEN CF_ZONE_ID VPS_HOST; do test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }; done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/csi-before.json
          jq -e '.success == true' /tmp/csi-before.json >/dev/null
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/csi-before.json | while read -r id; do [ -n "$id" ] && curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null; done
          jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/csi-new.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/csi-new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/csi-created.json
          jq -e '.success == true' /tmp/csi-created.json >/dev/null
          echo "CSI_DNS=APPLIED IP=$ORIGIN_IP"
      - name: Validate public CSI
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -L -H 'Accept: text/html,application/xhtml+xml' -o /tmp/csi-public -w '%{http_code}' --max-time 25 "https://$DOMAIN/" || true)"
            echo "CSI_PUBLIC attempt=$i HTTP=$code"
            if [ "$code" = '200' ] && grep -Eq 'CSI Invest|Inteligência, patrimônio|Mercado, patrimônio' /tmp/csi-public; then
              echo 'CSI_PUBLIC=PASS'
              exit 0
            fi
            sleep 5
          done
          exit 70
