name: Diagnose WMP compose
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-compose.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Read live compose service
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo sed -n '/impulsionando-core:/,/^[^[:space:]]/p' /opt/impulsionando/deploy/hostinger/docker-compose.yml | head -n 140"
