name: Diagnose WMP compose
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-compose.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Audit production HMAC wiring and compose metadata safely
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          GH_HMAC: ${{ secrets.IMPULSIONANDO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${GH_HMAC:-}" ]; then echo 'GITHUB_HMAC_PRESENT=true'; else echo 'GITHUB_HMAC_PRESENT=false'; fi
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          core=false
          if sudo test -s /etc/impulsionando-core.env && sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' /etc/impulsionando-core.env; then core=true; fi
          echo "CORE_HMAC_PRESENT=$core"
          C=n8n-umlg-n8n-1
          if sudo docker container inspect "$C" >/dev/null 2>&1; then
            n8n="$(sudo docker exec "$C" sh -lc 'if [ -n "${IMPULSIONANDO_WEBHOOK_SECRET:-}" ]; then echo true; else echo false; fi')"
            echo "N8N_HMAC_PRESENT=$n8n"
            echo '== n8n compose metadata =='
            sudo docker inspect "$C" --format 'project={{index .Config.Labels "com.docker.compose.project"}}'
            sudo docker inspect "$C" --format 'service={{index .Config.Labels "com.docker.compose.service"}}'
            sudo docker inspect "$C" --format 'working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
            sudo docker inspect "$C" --format 'config_files={{index .Config.Labels "com.docker.compose.project.config_files"}}'
            echo '== n8n environment variable names only =='
            sudo docker inspect "$C" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed 's/=.*//' | sort -u
          else
            echo 'N8N_HMAC_PRESENT=false'
          fi
          REMOTE
