name: Impulsionando Front Verification (canonical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify apex is served by canonical release
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/home -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 20 'https://impulsionando.com.br/')"
          marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 'https://impulsionando.com.br/impulsionando-front-sha.txt')"
          test "$code" = 200
          printf '%s' "$marker" | grep -Eq '^[0-9a-f]{40}$'
          echo "IMPULSIONANDO_CANONICAL_FRONT=PASS sha=$marker"
      - name: Architecture invariant
        run: |
          echo 'Production Front is the only frontend publication authority.'
          echo 'This workflow must never create containers, images, Traefik routers or DNS records.'
