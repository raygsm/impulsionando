name: Impulsionando Fast Front

on:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - vite.config.*
      - package.json
      - package-lock.json
      - .github/workflows/impulsionando-fast-front.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impulsionando-fast-front
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build latest front/runtime bundle
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Upload only built output
        run: |
          set -euo pipefail
          tar -czf /tmp/impulsionando-fast-front.tgz .output scripts
          scp /tmp/impulsionando-fast-front.tgz "$VPS_USER@$VPS_HOST:/tmp/impulsionando-fast-front.tgz"
      - name: Atomic parallel promotion on VPS
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release="/var/www/impulsionando-core/releases/fast-front-$RELEASE_SHA"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.fast-front.yml
          envfile=/etc/impulsionando-core.env
          test -f "$base"
          sudo test -f "$envfile"
          sudo docker inspect impulsionando-core >/dev/null

          sudo rm -rf "$release"
          sudo mkdir -p "$release"
          sudo tar -xzf /tmp/impulsionando-fast-front.tgz -C "$release"
          rm -f /tmp/impulsionando-fast-front.tgz

          cat > /tmp/Dockerfile.impulsionando-fast-front <<'DOCKERFILE'
          FROM impulsionando-core:latest
          WORKDIR /app
          COPY .output ./.output
          COPY scripts ./scripts
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          printf 'node_modules\n' | sudo tee "$release/.dockerignore" >/dev/null
          sudo docker build -f /tmp/Dockerfile.impulsionando-fast-front -t "impulsionando-core:fast-$RELEASE_SHA" "$release"
          sudo docker tag "impulsionando-core:fast-$RELEASE_SHA" impulsionando-core:fast-current

          cd /opt/impulsionando/deploy/hostinger
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core-fastfront:
              image: impulsionando-core:fast-current
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              labels:
                traefik.enable: "true"
                traefik.http.routers.impulsionando-fastfront.entrypoints: websecure
                traefik.http.routers.impulsionando-fastfront.rule: Host(`impulsionando.com.br`) || Host(`www.impulsionando.com.br`)
                traefik.http.routers.impulsionando-fastfront.service: impulsionando-core-fastfront
                traefik.http.routers.impulsionando-fastfront.tls: "true"
                traefik.http.routers.impulsionando-fastfront.tls.certresolver: letsencrypt
                traefik.http.routers.impulsionando-fastfront.priority: "1000"
                traefik.http.services.impulsionando-core-fastfront.loadbalancer.server.port: "3000"
          YAML
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-core-fastfront

          for i in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core-fastfront 2>/dev/null || true)"
            code=000
            if [ -n "$ip" ]; then code="$(curl -sS -H 'Host: impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/fastfront-origin -w '%{http_code}' --max-time 8 "http://$ip:3000/" || true)"; fi
            if [ "$code" = 200 ] && grep -Fq 'Impulsionito no centro de tudo' /tmp/fastfront-origin; then break; fi
            if [ "$i" -eq 45 ]; then
              sudo docker logs --tail 160 impulsionando-core-fastfront || true
              exit 61
            fi
            sleep 2
          done
          echo "FAST_FRONT_ORIGIN=PASS sha=$RELEASE_SHA"
          REMOTE
      - name: Validate public apex is exact new front
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' -H 'Accept: text/html,application/xhtml+xml' "https://impulsionando.com.br/?front_sha=$GITHUB_SHA" -o /tmp/public-home || true
            marker_ok=0
            price_ok=0
            old_ok=1
            grep -Fq 'Impulsionito no centro de tudo' /tmp/public-home && marker_ok=1 || true
            grep -Fq 'R$ 810,50' /tmp/public-home && grep -Fq 'R$ 1.621,00' /tmp/public-home && grep -Fq 'R$ 3.242,00' /tmp/public-home && price_ok=1 || true
            if grep -Fq 'Demonstração narrativa em produção' /tmp/public-home; then old_ok=0; fi
            if [ "$marker_ok" = 1 ] && [ "$price_ok" = 1 ] && [ "$old_ok" = 1 ]; then
              sha="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "https://impulsionando.com.br/impulsionando-front-sha.txt?x=$GITHUB_SHA" || true)"
              echo "PUBLIC_FRONT_SHA=$sha EXPECTED=$GITHUB_SHA"
              test "$sha" = "$GITHUB_SHA"
              echo 'IMPULSIONANDO_FAST_FRONT=PASS'
              exit 0
            fi
            sleep 3
          done
          echo '::error::Public apex did not converge to expected front'
          exit 70
