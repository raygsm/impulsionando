name: Daily Encrypted DB Backup → VPS

on:
  push:
    branches: [main]
    paths: [".github/workflows/db-backup-daily.yml"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup-on-vps:
    name: Dump, encrypt and retain on Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Transfer protected backup environment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "::error::SUPABASE_DB_URL não configurada"; exit 1; }
          test -n "${BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::BACKUP_ENCRYPTION_KEY não configurada"; exit 1; }
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          {
            printf 'SUPABASE_DB_URL=%q\n' "$SUPABASE_DB_URL"
            printf 'BACKUP_ENCRYPTION_KEY=%q\n' "$BACKUP_ENCRYPTION_KEY"
          } > "$env_file"
          chmod 0600 "$env_file"
          scp -P "$VPS_PORT" "$env_file" "${VPS_USER}@${VPS_HOST}:/tmp/impulsionando-backup.env"

      - name: Create and validate encrypted backup on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/impulsionando-backup.env /tmp/impulsionando-*.sql.gz 2>/dev/null || true' EXIT
          chmod 0600 /tmp/impulsionando-backup.env
          # shellcheck disable=SC1091
          source /tmp/impulsionando-backup.env

          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-client openssl gzip
          fi

          export PGCONNECT_TIMEOUT=15
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/tmp/impulsionando-db-check.txt
          test -s /tmp/impulsionando-db-check.txt

          ROOT=/var/backups/impulsionando
          sudo mkdir -p "$ROOT/daily" "$ROOT/weekly" "$ROOT/monthly"
          sudo chown -R "$(id -u):$(id -g)" "$ROOT"

          TS=$(date -u +%Y%m%d-%H%M%S)
          RAW="/tmp/impulsionando-${TS}.sql.gz"
          ENC="$ROOT/daily/impulsionando-${TS}.sql.gz.enc"
          META="${ENC}.sha256"

          pg_dump "$SUPABASE_DB_URL" \
            --format=plain --no-owner --no-privileges \
            --exclude-schema=auth --exclude-schema=storage \
            --exclude-schema=realtime --exclude-schema=supabase_functions \
            --exclude-schema=vault --exclude-schema=graphql \
            | gzip -9 > "$RAW"

          RAW_SHA=$(sha256sum "$RAW" | awk '{print $1}')
          SIZE=$(stat -c%s "$RAW")
          [ "$SIZE" -ge 51200 ] || { echo "Dump suspeito (<50KB)"; exit 1; }
          gzip -t "$RAW"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RAW" -out "$ENC" -pass env:BACKUP_ENCRYPTION_KEY

          ENC_SHA=$(sha256sum "$ENC" | awk '{print $1}')
          DEC_SHA=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$ENC" -pass env:BACKUP_ENCRYPTION_KEY | sha256sum | awk '{print $1}')
          [ "$DEC_SHA" = "$RAW_SHA" ] || { echo "Integridade falhou após decrypt"; exit 1; }

          {
            echo "$ENC_SHA  $(basename "$ENC")"
            echo "raw_sha=$RAW_SHA"
            echo "raw_size=$SIZE"
            echo "created_at=$TS"
            echo "source=hostinger_vps_direct_supabase"
          } > "$META"

          DOW=$(date +%u)
          DOM=$(date +%d)
          if [ "$DOW" = "7" ]; then cp -a "$ENC" "$META" "$ROOT/weekly/"; fi
          if [ "$DOM" = "01" ]; then cp -a "$ENC" "$META" "$ROOT/monthly/"; fi

          find "$ROOT/daily" -type f -mtime +30 -delete
          find "$ROOT/weekly" -type f -mtime +84 -delete
          find "$ROOT/monthly" -type f -mtime +366 -delete

          test -s "$ENC"
          test -s "$META"
          echo "Backup criado na VPS: $(basename "$ENC") size=$SIZE raw_sha=$RAW_SHA"
          REMOTE
