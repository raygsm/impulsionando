name: CHRISMED WhatsApp production wire

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-whatsapp-production-wire.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Wire Evolution and secure webhook
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/chrismed-whatsapp-production-wire.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          ENV_FILE=/etc/impulsionando-core.env
          SECURITY_ENV=/etc/impulsionando-security.env
          CORE=impulsionando-core
          EVO=impulsionando-evolution-api
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          INSTANCE=chrismed-oliver
          WEBHOOK_URL=https://chrismed.impulsionando.com.br/api/communication/whatsapp/chrismed
          sudo test -f "$ENV_FILE"
          sudo docker inspect "$EVO" >/dev/null
          EVO_KEY="$(sudo docker inspect "$EVO" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^AUTHENTICATION_API_KEY=//p' | head -n1)"
          test -n "$EVO_KEY"
          SECRET="$(sudo sed -n 's/^CHRISMED_EVOLUTION_WEBHOOK_SECRET=//p' "$SECURITY_ENV" 2>/dev/null | head -n1)"
          if [ -z "$SECRET" ]; then
            SECRET="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            sudo awk -F= '$1!="CHRISMED_EVOLUTION_WEBHOOK_SECRET"{print}' "$SECURITY_ENV" 2>/dev/null > "$tmp" || true
            printf 'CHRISMED_EVOLUTION_WEBHOOK_SECRET=%s\n' "$SECRET" >> "$tmp"
            sudo install -o root -g root -m 0600 "$tmp" "$SECURITY_ENV"
            rm -f "$tmp"
          fi
          set_env(){
            key="$1"; value="$2"; tmp="$(mktemp)"
            sudo awk -F= -v k="$key" '$1!=k{print}' "$ENV_FILE" > "$tmp"
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            sudo install -o root -g root -m 0600 "$tmp" "$ENV_FILE"
            rm -f "$tmp"
          }
          set_env CHRISMED_EVOLUTION_BASE_URL 'http://impulsionando-evolution-api:8080'
          set_env CHRISMED_EVOLUTION_API_KEY "$EVO_KEY"
          set_env CHRISMED_EVOLUTION_WEBHOOK_SECRET "$SECRET"
          core_network="$(sudo docker inspect "$CORE" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | head -n1)"
          test -n "$core_network"
          if ! sudo docker inspect "$EVO" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | grep -Fxq "$core_network"; then
            sudo docker network connect "$core_network" "$EVO"
          fi
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate "$CORE"
          for i in $(seq 1 40); do
            sudo docker exec "$CORE" node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1 && break
            [ "$i" -lt 40 ] || exit 71
            sleep 2
          done
          sudo docker exec "$CORE" node - <<'NODE'
          for (const k of ['CHRISMED_EVOLUTION_BASE_URL','CHRISMED_EVOLUTION_API_KEY','CHRISMED_EVOLUTION_WEBHOOK_SECRET']) if (!process.env[k]) process.exit(2);
          console.log('CORE_CHRISMED_WHATSAPP_ENV=PASS');
          NODE
          state_code="$(curl -sS -o /tmp/state.json -w '%{http_code}' --max-time 15 -H "apikey: $EVO_KEY" "http://127.0.0.1:8080/instance/connectionState/$INSTANCE" || true)"
          if [ "$state_code" = 404 ]; then
            create_code="$(curl -sS -o /tmp/create.json -w '%{http_code}' --max-time 20 -X POST -H "apikey: $EVO_KEY" -H 'content-type: application/json' -d '{"instanceName":"chrismed-oliver","qrcode":true,"integration":"WHATSAPP-BAILEYS"}' http://127.0.0.1:8080/instance/create)"
            case "$create_code" in 200|201|409) ;; *) echo "CREATE_HTTP=$create_code"; exit 72 ;; esac
          fi
          hook_payload="$(jq -nc --arg url "$WEBHOOK_URL" --arg secret "$SECRET" '{enabled:true,url:$url,events:["MESSAGES_UPSERT","CONNECTION_UPDATE","QRCODE_UPDATED"],headers:{"x-chrismed-webhook-secret":$secret},base64:true}')"
          hook_code="$(curl -sS -o /tmp/hook.json -w '%{http_code}' --max-time 20 -X POST -H "apikey: $EVO_KEY" -H 'content-type: application/json' -d "$hook_payload" "http://127.0.0.1:8080/webhook/set/$INSTANCE")"
          case "$hook_code" in 200|201) ;; *) echo "WEBHOOK_SET_HTTP=$hook_code"; cat /tmp/hook.json; exit 73 ;; esac
          unsigned_code="$(curl -sS -o /tmp/unsigned.json -w '%{http_code}' --max-time 15 -X POST -H 'content-type: application/json' -d '{}' "$WEBHOOK_URL" || true)"
          signed_code="$(curl -sS -o /tmp/signed.json -w '%{http_code}' --max-time 15 -X POST -H 'content-type: application/json' -H "x-chrismed-webhook-secret: $SECRET" -d '{"event":"CONNECTION_UPDATE","instance":"wrong-probe-instance","data":{"state":"connecting"}}' "$WEBHOOK_URL" || true)"
          echo "WEBHOOK_UNSIGNED_HTTP=$unsigned_code"
          echo "WEBHOOK_SIGNED_WRONG_INSTANCE_HTTP=$signed_code"
          [ "$unsigned_code" = 401 ]
          [ "$signed_code" = 200 ]
          connect_code="$(curl -sS -o /tmp/connect.json -w '%{http_code}' --max-time 20 -H "apikey: $EVO_KEY" "http://127.0.0.1:8080/instance/connect/$INSTANCE" || true)"
          case "$connect_code" in 200|201) ;; *) echo "CONNECT_HTTP=$connect_code"; exit 74 ;; esac
          qr_ready="$(jq -r 'if (.base64 // .qrcode.base64 // .data.Qrcode // .data.qrcode // .pairingCode // .qrcode.pairingCode) then "true" else "false" end' /tmp/connect.json 2>/dev/null || echo false)"
          state_code="$(curl -sS -o /tmp/state2.json -w '%{http_code}' --max-time 15 -H "apikey: $EVO_KEY" "http://127.0.0.1:8080/instance/connectionState/$INSTANCE" || true)"
          provider_state="$(jq -r '.instance.state // .state // .data.state // "unknown"' /tmp/state2.json 2>/dev/null || echo unknown)"
          echo "EVOLUTION_STATE=$provider_state QR_READY=$qr_ready"
          echo 'CHRISMED_WHATSAPP_WIRE=PASS'
          unset SECRET EVO_KEY hook_payload
          REMOTE
      - name: Sync endpoint metadata
        shell: bash
        run: |
          set -euo pipefail
          tenant="$(curl -fsS "$SUPABASE_URL/rest/v1/communication_tenants?slug=eq.chrismed&active=eq.true&select=id&limit=1" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[0].id // empty')"
          test -n "$tenant"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/communication_channel_endpoints?tenant_id=eq.$tenant&channel=eq.whatsapp&is_primary=eq.true" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d '{"provider":"evolution_api","status":"PENDING_CONNECTION","secret_reference":"CHRISMED_EVOLUTION_API_KEY","webhook_path":"/api/communication/whatsapp/chrismed","last_error":null}' >/dev/null
      - name: Persist sanitized proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          sed -E 's/[A-Fa-f0-9]{48,}/[REDACTED]/g' /tmp/chrismed-whatsapp-production-wire.txt > docs/ops/chrismed-whatsapp-production-wire.txt || echo 'proof missing' > docs/ops/chrismed-whatsapp-production-wire.txt
          git config user.name 'Impulsionito CHRISMED QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/chrismed-whatsapp-production-wire.txt
          git commit -m 'chore(chrismed): record WhatsApp production wire proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
