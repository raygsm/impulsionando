name: WMP n8n path owner diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-path-owner-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Find every workflow owning WMP canonical paths
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          sudo docker exec "$C" n8n export:workflow --all --output=/tmp/all-wmp-paths.json >/dev/null
          sudo docker exec -i "$C" node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/all-wmp-paths.json','utf8'));const ws=Array.isArray(r)?r:[r];
          const paths=new Set(['wmp-lead-intake','wmp-proposal-lifecycle','wmp-dj-booking-lifecycle','wmp-post-event-relationship']);
          for(const w of ws){for(const n of (w.nodes||[])){if(n.type==='n8n-nodes-base.webhook'&&paths.has(n.parameters?.path)){console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,activeVersionId:w.activeVersionId,versionId:w.versionId,path:n.parameters.path,webhookId:n.webhookId}));}}}
          NODE
          REMOTE
