name: Deploy Core Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - scripts/**
      - Dockerfile
      - vite.config.*
      - tsconfig*.json
      - deploy/impulsionando-core.service
      - .github/workflows/deploy-core-frontend.yml

concurrency:
  group: deploy-core-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build universal Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test universal domain routing
        run: npx vitest run src/lib/subdomain.test.ts
      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - name: Verify runtime output
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          test -d .output/public
          test -f scripts/start-core-runtime.mjs
          test -f scripts/pulsonitor-worker.mjs
          test -f scripts/colors-automation-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: impulsionando-core-output
          path: |
            .output
            scripts/start-core-runtime.mjs
            scripts/pulsonitor-worker.mjs
            scripts/colors-automation-worker.mjs
            package.json
            package-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Publish universal Core to Hostinger
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: impulsionando-core-output
          path: release

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then
              echo "SSH_KEYSCAN=PASS attempt=$attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo '::error::VPS SSH unavailable after bounded retries'
          exit 41

      - name: Prepare server-side Core environment
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMPULSIONANDO_WEBHOOK_SECRET: ${{ secrets.IMPULSIONANDO_WEBHOOK_SECRET }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          COLORS_META_APP_SECRET: ${{ secrets.COLORS_META_APP_SECRET }}
          COLORS_META_VERIFY_TOKEN: ${{ secrets.COLORS_META_VERIFY_TOKEN }}
          COLORS_META_WHATSAPP_TOKEN: ${{ secrets.COLORS_META_WHATSAPP_TOKEN }}
          COLORS_META_PHONE_NUMBER_ID: ${{ secrets.COLORS_META_PHONE_NUMBER_ID }}
          COLORS_META_PAGE_TOKEN: ${{ secrets.COLORS_META_PAGE_TOKEN }}
          COLORS_META_PAGE_ID: ${{ secrets.COLORS_META_PAGE_ID }}
          COLORS_META_IG_ACCOUNT_ID: ${{ secrets.COLORS_META_IG_ACCOUNT_ID }}
          COLORS_MAISFY_WEBHOOK_SECRET: ${{ secrets.COLORS_MAISFY_WEBHOOK_SECRET }}
          COLORS_MAISFY_WEBHOOK_TOKEN: ${{ secrets.COLORS_MAISFY_WEBHOOK_TOKEN }}
          COLORS_MONETIZZE_UNIQUE_KEY: ${{ secrets.COLORS_MONETIZZE_UNIQUE_KEY }}
          COLORS_PERFECTPAY_WEBHOOK_TOKEN: ${{ secrets.COLORS_PERFECTPAY_WEBHOOK_TOKEN }}
          COLORS_GROUP_URL: ${{ secrets.COLORS_GROUP_URL }}
          CHRISMED_REFERRAL_SECRET: ${{ secrets.CHRISMED_REFERRAL_SECRET }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_DRIVE_CLIENT_ID:-}"
          test -n "${GOOGLE_DRIVE_CLIENT_SECRET:-}"
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'IMPULSIONANDO_WEBHOOK_SECRET=%s\n' "${IMPULSIONANDO_WEBHOOK_SECRET:-}"
            printf 'GOOGLE_DRIVE_CLIENT_ID=%s\n' "$GOOGLE_DRIVE_CLIENT_ID"
            printf 'GOOGLE_DRIVE_CLIENT_SECRET=%s\n' "$GOOGLE_DRIVE_CLIENT_SECRET"
            printf 'CHRISMED_BASE_URL=https://chrismed.impulsionando.com.br\n'
            printf 'COLORS_META_APP_SECRET=%s\n' "${COLORS_META_APP_SECRET:-}"
            printf 'COLORS_META_VERIFY_TOKEN=%s\n' "${COLORS_META_VERIFY_TOKEN:-}"
            printf 'COLORS_META_WHATSAPP_TOKEN=%s\n' "${COLORS_META_WHATSAPP_TOKEN:-}"
            printf 'COLORS_META_PHONE_NUMBER_ID=%s\n' "${COLORS_META_PHONE_NUMBER_ID:-}"
            printf 'COLORS_META_PAGE_TOKEN=%s\n' "${COLORS_META_PAGE_TOKEN:-}"
            printf 'COLORS_META_PAGE_ID=%s\n' "${COLORS_META_PAGE_ID:-}"
            printf 'COLORS_META_IG_ACCOUNT_ID=%s\n' "${COLORS_META_IG_ACCOUNT_ID:-}"
            printf 'COLORS_META_GRAPH_VERSION=v23.0\n'
            printf 'COLORS_MAISFY_WEBHOOK_SECRET=%s\n' "${COLORS_MAISFY_WEBHOOK_SECRET:-}"
            printf 'COLORS_MAISFY_WEBHOOK_TOKEN=%s\n' "${COLORS_MAISFY_WEBHOOK_TOKEN:-}"
            printf 'COLORS_MONETIZZE_UNIQUE_KEY=%s\n' "${COLORS_MONETIZZE_UNIQUE_KEY:-}"
            printf 'COLORS_PERFECTPAY_WEBHOOK_TOKEN=%s\n' "${COLORS_PERFECTPAY_WEBHOOK_TOKEN:-}"
            printf 'COLORS_GROUP_URL=%s\n' "${COLORS_GROUP_URL:-}"
            printf 'CHRISMED_REFERRAL_SECRET=%s\n' "${CHRISMED_REFERRAL_SECRET:-}"
            printf 'COLORS_AUTOMATION_ENABLED=true\n'
            printf 'COLORS_AUTOMATION_INTERVAL_MS=60000\n'
            if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              printf 'PULSONITOR_ENABLED=true\n'
            else
              printf 'PULSONITOR_ENABLED=false\n'
            fi
            printf 'PULSONITOR_PROBE_REGION=hostinger-primary\n'
          } > "$env_file"
          chmod 0600 "$env_file"
          scp "$env_file" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/impulsionando-core.env"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE_ENV'
          set -euo pipefail
          incoming=/tmp/impulsionando-core.env
          security=/etc/impulsionando-security.env
          if grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=$' "$incoming" && sudo test -f "$security" && sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' "$security"; then
            secret="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$security" | head -n1)"
            tmp="$(mktemp)"
            grep -v '^IMPULSIONANDO_WEBHOOK_SECRET=' "$incoming" > "$tmp"
            printf 'IMPULSIONANDO_WEBHOOK_SECRET=%s\n' "$secret" >> "$tmp"
            install -m 0600 "$tmp" "$incoming"
            rm -f "$tmp"
            unset secret
          fi
          sudo install -o root -g root -m 0600 "$incoming" /etc/impulsionando-core.env
          rm -f "$incoming"
          sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' /etc/impulsionando-core.env
          REMOTE_ENV

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          tar -C release -czf /tmp/impulsionando-core-release.tgz .
          scp /tmp/impulsionando-core-release.tgz deploy/impulsionando-core.service "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Activate release on systemd runtime
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE_DIR="/var/www/impulsionando-core/releases/${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "RELEASE_DIR='${RELEASE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          PREVIOUS_RELEASE="$(readlink -f /var/www/impulsionando-core/current 2>/dev/null || true)"
          printf '%s\n' "$PREVIOUS_RELEASE" | sudo tee /var/www/impulsionando-core/.previous-release >/dev/null
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/impulsionando-core-release.tgz -C "$RELEASE_DIR"
          cd "$RELEASE_DIR"
          test -f .output/server/index.mjs
          test -f scripts/start-core-runtime.mjs
          test -f scripts/pulsonitor-worker.mjs
          test -f scripts/colors-automation-worker.mjs
          npm ci --omit=dev --no-audit --no-fund
          ln -sfn "$RELEASE_DIR" /var/www/impulsionando-core/current

          NODE_BIN="$(command -v node || true)"
          test -n "$NODE_BIN"
          sed -i "s|^ExecStart=.*|ExecStart=${NODE_BIN} scripts/start-core-runtime.mjs|" /tmp/impulsionando-core.service
          sudo install -m 0644 /tmp/impulsionando-core.service /etc/systemd/system/impulsionando-core.service
          sudo systemctl daemon-reload
          sudo systemctl enable impulsionando-core
          sudo systemctl restart impulsionando-core

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/tmp/core-local.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo journalctl --no-pager -u impulsionando-core -n 120
              exit 43
            fi
            sleep 1
          done

          journal_file="$(mktemp)"
          sudo journalctl --no-pager -u impulsionando-core -n 160 > "$journal_file"
          if sudo grep -q '^PULSONITOR_ENABLED=true$' /etc/impulsionando-core.env; then
            grep -q '\[Pulsonitor\] started' "$journal_file"
          fi
          if sudo grep -q '^COLORS_AUTOMATION_ENABLED=true$' /etc/impulsionando-core.env; then
            grep -q '\[Colors Automation\] started' "$journal_file"
          fi
          rm -f "$journal_file"
          REMOTE

      - name: Promote the same release to Traefik Docker edge
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE_DIR="/var/www/impulsionando-core/releases/${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "RELEASE_DIR='${RELEASE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          test -f "$COMPOSE"
          test -f "$RELEASE_DIR/.output/server/index.mjs"

          old_image="$(sudo docker inspect -f '{{.Image}}' impulsionando-core 2>/dev/null || true)"
          if [ -n "$old_image" ]; then
            printf '%s\n' "$old_image" | sudo tee /var/www/impulsionando-core/.previous-edge-image >/dev/null
            sudo docker tag "$old_image" impulsionando-core:deploy-rollback
          fi

          printf 'node_modules\n' > "$RELEASE_DIR/.dockerignore"
          cat > /tmp/Dockerfile.impulsionando-runtime <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE

          sudo docker build -f /tmp/Dockerfile.impulsionando-runtime -t impulsionando-core:latest "$RELEASE_DIR"
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core

          for attempt in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null || true)"
            if [ -n "$ip" ] && curl -fsS -H 'Host: wmp.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' "http://$ip:3000/auth" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              sudo docker logs --tail 120 impulsionando-core || true
              exit 47
            fi
            sleep 2
          done

          ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core)"
          for path in / /auth /dashboard /seguranca/senha /djs /empresas /orcamento /parceiro /onde-estou; do
            code="$(curl -sS -H 'Host: wmp.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/core-edge-probe -w '%{http_code}' "http://$ip:3000$path")"
            echo "CORE_EDGE_PROBE $path HTTP=$code"
            [ "$code" = '200' ] || exit 48
          done
          echo 'CORE_TRAEFIK_EDGE=PASS'
          REMOTE

      - name: Validate public Core and critical tenant routes
        run: |
          set -euo pipefail
          probe_html() {
            url="$1"
            label="$2"
            code="$(curl --location --silent --show-error --max-time 30 -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/probe.html -w '%{http_code}' "$url" || true)"
            echo "PUBLIC_PROBE $label HTTP=$code"
            [ "$code" = '200' ]
          }

          probe_html 'https://impulsionando.com.br/' 'core-home'
          probe_html 'https://wmp.impulsionando.com.br/' 'wmp-home'
          probe_html 'https://wmp.impulsionando.com.br/auth' 'wmp-auth'
          probe_html 'https://wmp.impulsionando.com.br/dashboard' 'wmp-dashboard'
          probe_html 'https://wmp.impulsionando.com.br/seguranca/senha' 'wmp-password'
          probe_html 'https://wmp.impulsionando.com.br/djs' 'wmp-djs'
          probe_html 'https://wmp.impulsionando.com.br/empresas' 'wmp-empresas'
          probe_html 'https://wmp.impulsionando.com.br/orcamento' 'wmp-orcamento'
          probe_html 'https://wmp.impulsionando.com.br/parceiro' 'wmp-parceiro'
          probe_html 'https://wmp.impulsionando.com.br/onde-estou' 'wmp-onde-estou'
          probe_html 'https://wmp.impulsionando.com.br/cases' 'wmp-cases'
          probe_html 'https://wmp.impulsionando.com.br/pacotes' 'wmp-pacotes'
          probe_html 'https://chrismed.impulsionando.com.br/' 'chrismed-home'
          probe_html 'https://chrismed.impulsionando.com.br/auth' 'chrismed-auth'
          probe_html 'https://colors.impulsionando.com.br/' 'colors-home'
          probe_html 'https://anamadu.impulsionando.com.br/' 'anamadu-home'

          curl --location --silent --show-error --max-time 30 -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' \
            -o /tmp/wmp-home.html "https://wmp.impulsionando.com.br/"
          if ! grep -qi 'WMP\|Wagner Miller' /tmp/wmp-home.html; then
            echo '::warning::WMP identity marker not found; keeping deployment because availability gates passed'
          fi
          for marker in '+850' 'R$ 2.900' 'R$ 7.400' 'Tech Corp' 'Festival Sertanejo de Verão' '8.000 pessoas' 'resposta garantida'; do
            if grep -Fqi "$marker" /tmp/wmp-home.html; then
              echo "::error::Legacy WMP marker still public: $marker"
              exit 49
            fi
          done
          echo 'PUBLIC_CORE_VALIDATION=PASS'

      - name: Roll back failed release and edge
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          if sudo docker image inspect impulsionando-core:deploy-rollback >/dev/null 2>&1; then
            sudo docker tag impulsionando-core:deploy-rollback impulsionando-core:latest
            cd /opt/impulsionando/deploy/hostinger
            sudo docker compose -f docker-compose.yml up -d --no-build --force-recreate impulsionando-core || true
          fi

          PREVIOUS_RELEASE="$(sudo cat /var/www/impulsionando-core/.previous-release 2>/dev/null || true)"
          if [ -n "$PREVIOUS_RELEASE" ] && [ -f "$PREVIOUS_RELEASE/.output/server/index.mjs" ]; then
            sudo ln -sfn "$PREVIOUS_RELEASE" /var/www/impulsionando-core/current
            sudo systemctl restart impulsionando-core
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
                exit 0
              fi
              sleep 1
            done
          fi
          exit 46
          REMOTE
