name: RETIRED - Deploy Core Frontend

# Historical workflow kept as an explicit fail-closed tombstone.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: this workflow must not publish production."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
