name: Deploy Core Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - scripts/**
      - Dockerfile
      - vite.config.*
      - tsconfig*.json
      - deploy/impulsionando-core.service
      - .github/workflows/deploy-core-frontend.yml

concurrency:
  group: deploy-core-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build universal Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test universal domain routing
        run: npx vitest run src/lib/subdomain.test.ts
      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      - name: Verify runtime output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          test -f scripts/start-core-runtime.mjs
          test -f scripts/pulsonitor-worker.mjs
          test -f scripts/colors-automation-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: impulsionando-core-output
          path: |
            .output
            scripts/start-core-runtime.mjs
            scripts/pulsonitor-worker.mjs
            scripts/colors-automation-worker.mjs
            package.json
            package-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Publish universal Core to Hostinger
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: impulsionando-core-output
          path: release

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare server-side Core environment
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMPULSIONANDO_WEBHOOK_SECRET: ${{ secrets.IMPULSIONANDO_WEBHOOK_SECRET }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          COLORS_META_APP_SECRET: ${{ secrets.COLORS_META_APP_SECRET }}
          COLORS_META_VERIFY_TOKEN: ${{ secrets.COLORS_META_VERIFY_TOKEN }}
          COLORS_META_WHATSAPP_TOKEN: ${{ secrets.COLORS_META_WHATSAPP_TOKEN }}
          COLORS_META_PHONE_NUMBER_ID: ${{ secrets.COLORS_META_PHONE_NUMBER_ID }}
          COLORS_META_PAGE_TOKEN: ${{ secrets.COLORS_META_PAGE_TOKEN }}
          COLORS_META_PAGE_ID: ${{ secrets.COLORS_META_PAGE_ID }}
          COLORS_META_IG_ACCOUNT_ID: ${{ secrets.COLORS_META_IG_ACCOUNT_ID }}
          COLORS_MAISFY_WEBHOOK_SECRET: ${{ secrets.COLORS_MAISFY_WEBHOOK_SECRET }}
          COLORS_MAISFY_WEBHOOK_TOKEN: ${{ secrets.COLORS_MAISFY_WEBHOOK_TOKEN }}
          COLORS_MONETIZZE_UNIQUE_KEY: ${{ secrets.COLORS_MONETIZZE_UNIQUE_KEY }}
          COLORS_PERFECTPAY_WEBHOOK_TOKEN: ${{ secrets.COLORS_PERFECTPAY_WEBHOOK_TOKEN }}
          COLORS_GROUP_URL: ${{ secrets.COLORS_GROUP_URL }}
          CHRISMED_REFERRAL_SECRET: ${{ secrets.CHRISMED_REFERRAL_SECRET }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_DRIVE_CLIENT_ID:-}"
          test -n "${GOOGLE_DRIVE_CLIENT_SECRET:-}"
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          {
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'IMPULSIONANDO_WEBHOOK_SECRET=%s\n' "${IMPULSIONANDO_WEBHOOK_SECRET:-}"
            printf 'GOOGLE_DRIVE_CLIENT_ID=%s\n' "$GOOGLE_DRIVE_CLIENT_ID"
            printf 'GOOGLE_DRIVE_CLIENT_SECRET=%s\n' "$GOOGLE_DRIVE_CLIENT_SECRET"
            printf 'CHRISMED_BASE_URL=https://chrismed.impulsionando.com.br\n'
            printf 'COLORS_META_APP_SECRET=%s\n' "${COLORS_META_APP_SECRET:-}"
            printf 'COLORS_META_VERIFY_TOKEN=%s\n' "${COLORS_META_VERIFY_TOKEN:-}"
            printf 'COLORS_META_WHATSAPP_TOKEN=%s\n' "${COLORS_META_WHATSAPP_TOKEN:-}"
            printf 'COLORS_META_PHONE_NUMBER_ID=%s\n' "${COLORS_META_PHONE_NUMBER_ID:-}"
            printf 'COLORS_META_PAGE_TOKEN=%s\n' "${COLORS_META_PAGE_TOKEN:-}"
            printf 'COLORS_META_PAGE_ID=%s\n' "${COLORS_META_PAGE_ID:-}"
            printf 'COLORS_META_IG_ACCOUNT_ID=%s\n' "${COLORS_META_IG_ACCOUNT_ID:-}"
            printf 'COLORS_META_GRAPH_VERSION=v23.0\n'
            printf 'COLORS_MAISFY_WEBHOOK_SECRET=%s\n' "${COLORS_MAISFY_WEBHOOK_SECRET:-}"
            printf 'COLORS_MAISFY_WEBHOOK_TOKEN=%s\n' "${COLORS_MAISFY_WEBHOOK_TOKEN:-}"
            printf 'COLORS_MONETIZZE_UNIQUE_KEY=%s\n' "${COLORS_MONETIZZE_UNIQUE_KEY:-}"
            printf 'COLORS_PERFECTPAY_WEBHOOK_TOKEN=%s\n' "${COLORS_PERFECTPAY_WEBHOOK_TOKEN:-}"
            printf 'COLORS_GROUP_URL=%s\n' "${COLORS_GROUP_URL:-}"
            printf 'CHRISMED_REFERRAL_SECRET=%s\n' "${CHRISMED_REFERRAL_SECRET:-}"
            printf 'COLORS_AUTOMATION_ENABLED=true\n'
            printf 'COLORS_AUTOMATION_INTERVAL_MS=60000\n'
            if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              printf 'PULSONITOR_ENABLED=true\n'
            else
              printf 'PULSONITOR_ENABLED=false\n'
            fi
            printf 'PULSONITOR_PROBE_REGION=hostinger-primary\n'
          } > "$env_file"
          chmod 0600 "$env_file"
          scp "$env_file" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/impulsionando-core.env"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'sudo install -o root -g root -m 0600 /tmp/impulsionando-core.env /etc/impulsionando-core.env && rm -f /tmp/impulsionando-core.env'

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          tar -C release -czf /tmp/impulsionando-core-release.tgz .
          scp /tmp/impulsionando-core-release.tgz deploy/impulsionando-core.service "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE_DIR="/var/www/impulsionando-core/releases/${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "RELEASE_DIR='${RELEASE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          PREVIOUS_RELEASE="$(readlink -f /var/www/impulsionando-core/current 2>/dev/null || true)"
          printf '%s\n' "$PREVIOUS_RELEASE" | sudo tee /var/www/impulsionando-core/.previous-release >/dev/null
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/impulsionando-core-release.tgz -C "$RELEASE_DIR"
          cd "$RELEASE_DIR"
          test -f .output/server/index.mjs
          test -f scripts/start-core-runtime.mjs
          test -f scripts/pulsonitor-worker.mjs
          test -f scripts/colors-automation-worker.mjs
          npm ci --omit=dev --no-audit --no-fund
          ln -sfn "$RELEASE_DIR" /var/www/impulsionando-core/current

          NODE_BIN="$(command -v node || true)"
          test -n "$NODE_BIN"
          sed -i "s|^ExecStart=.*|ExecStart=${NODE_BIN} scripts/start-core-runtime.mjs|" /tmp/impulsionando-core.service
          sudo install -m 0644 /tmp/impulsionando-core.service /etc/systemd/system/impulsionando-core.service
          sudo systemctl daemon-reload
          sudo systemctl enable impulsionando-core
          sudo systemctl restart impulsionando-core

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/tmp/core-local.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo journalctl --no-pager -u impulsionando-core -n 120
              exit 43
            fi
            sleep 1
          done

          if sudo grep -q '^PULSONITOR_ENABLED=true$' /etc/impulsionando-core.env; then
            sudo journalctl --no-pager -u impulsionando-core -n 160 | grep -q '\[Pulsonitor\] started'
          fi
          if sudo grep -q '^COLORS_AUTOMATION_ENABLED=true$' /etc/impulsionando-core.env && sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' /etc/impulsionando-core.env; then
            sudo journalctl --no-pager -u impulsionando-core -n 160 | grep -q '\[Colors Automation\] started'
          fi
          REMOTE

      - name: Validate public Core, WMP, CHRISMED and Colors
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 30 https://impulsionando.com.br/ >/tmp/impulsionando.html
          grep -qi "Impulsionando" /tmp/impulsionando.html

          # WMP: critical public conversion routes must all answer after every Core deploy.
          curl --fail --location --silent --show-error --max-time 30 https://wmp.impulsionando.com.br/ >/tmp/wmp-home.html
          curl --fail --location --silent --show-error --max-time 30 https://wmp.impulsionando.com.br/djs >/tmp/wmp-djs.html
          curl --fail --location --silent --show-error --max-time 30 https://wmp.impulsionando.com.br/empresas >/tmp/wmp-empresas.html
          curl --fail --location --silent --show-error --max-time 30 https://wmp.impulsionando.com.br/orcamento >/tmp/wmp-orcamento.html
          curl --fail --location --silent --show-error --max-time 30 https://wmp.impulsionando.com.br/parceiro >/tmp/wmp-parceiro.html
          curl --fail --location --silent --show-error --max-time 30 https://wmp.impulsionando.com.br/onde-estou >/tmp/wmp-onde-estou.html
          grep -qi "WMP\|Wagner Miller" /tmp/wmp-home.html
          grep -qi "DJ" /tmp/wmp-djs.html
          grep -qi "hotel\|empresa" /tmp/wmp-empresas.html
          grep -qi "briefing\|orçamento\|orcamento" /tmp/wmp-orcamento.html
          grep -qi "parceiro\|DJ" /tmp/wmp-parceiro.html
          grep -qi "Onde Estou\|agenda" /tmp/wmp-onde-estou.html

          # CHRISMED: every critical public route must answer successfully after each Core deploy.
          curl --fail --location --silent --show-error --max-time 30 https://chrismed.impulsionando.com.br/ >/tmp/chrismed-home.html
          curl --fail --location --silent --show-error --max-time 30 https://chrismed.impulsionando.com.br/agendar >/tmp/chrismed-agendar.html
          curl --fail --location --silent --show-error --max-time 30 https://chrismed.impulsionando.com.br/eventos >/tmp/chrismed-eventos.html
          curl --fail --location --silent --show-error --max-time 30 https://chrismed.impulsionando.com.br/auth >/tmp/chrismed-auth.html
          curl --fail --location --silent --show-error --max-time 30 https://chrismed.impulsionando.com.br/agenda/profissional >/tmp/chrismed-profissional.html
          grep -qi "CHRISMED\|CrisMed" /tmp/chrismed-home.html

          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/ >/tmp/colors-home.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/agenda >/tmp/colors-agenda.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/eventos >/tmp/colors-eventos.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/suporte >/tmp/colors-suporte.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/super-green-black >/tmp/colors-sgb.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/rastreio >/tmp/colors-rastreio.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/privacidade >/tmp/colors-privacy.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/termos >/tmp/colors-terms.html
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/api/public/webhooks/monetizze-colors >/tmp/colors-monetizze.json
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/api/public/webhooks/perfectpay-colors >/tmp/colors-perfectpay.json
          curl --fail --location --silent --show-error --max-time 30 https://colors.impulsionando.com.br/api/public/webhooks/maisfy-colors >/tmp/colors-maisfy.json

          grep -qi "Colors" /tmp/colors-home.html
          grep -qi "Agende" /tmp/colors-agenda.html
          grep -qi "Eventos" /tmp/colors-eventos.html
          grep -qi "Suporte\|atendimento" /tmp/colors-suporte.html
          grep -qi "Super Green Black" /tmp/colors-sgb.html
          grep -qi "Rastre" /tmp/colors-rastreio.html
          grep -qi "Privacidade" /tmp/colors-privacy.html
          grep -qi "Termos" /tmp/colors-terms.html

      - name: Roll back failed release
        if: failure()
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PREVIOUS_RELEASE="$(sudo cat /var/www/impulsionando-core/.previous-release 2>/dev/null || true)"
          if [ -z "$PREVIOUS_RELEASE" ] || [ ! -f "$PREVIOUS_RELEASE/.output/server/index.mjs" ]; then
            echo "No valid previous Core release is available for rollback."
            exit 45
          fi
          sudo ln -sfn "$PREVIOUS_RELEASE" /var/www/impulsionando-core/current
          sudo systemctl restart impulsionando-core
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 46
          REMOTE
