name: Deploy Core Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - src/**
      - public/**
      - scripts/**
      - vite.config.*
      - tsconfig*.json
      - deploy/**
      - .github/workflows/deploy-core-frontend.yml

concurrency:
  group: deploy-core-frontend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build TanStack Start app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test tenant domain routing
        run: npx vitest run src/lib/subdomain.test.ts

      - name: Verify CHRISMED events backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body --silent --show-error --max-time 20 \
            "$SUPABASE_URL/rest/v1/chrismed_events?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept: application/json" \
            >/tmp/chrismed-events.json
          grep -Eq '^\[[^]]*\]$' /tmp/chrismed-events.json
          echo "CHRISMED events backend is reachable."

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Verify server output
        run: |
          test -f .output/server/index.mjs
          test -d .output/public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: impulsionando-core-output
          path: |
            .output
            package.json
            package-lock.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Publish to Hostinger
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: impulsionando-core-output
          path: release

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release artifact and server configuration
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
          } > /tmp/impulsionando-core.env
          tar -C release -czf /tmp/impulsionando-core-release.tgz .
          scp /tmp/impulsionando-core-release.tgz \
            /tmp/impulsionando-core.env \
            deploy/impulsionando-core.service \
            deploy/nginx.chrismed.http.conf \
            deploy/nginx.chrismed.conf \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

      - name: Activate release and server configuration
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE_DIR="/var/www/impulsionando-core/releases/${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "RELEASE_DIR='${RELEASE_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/impulsionando-core-release.tgz -C "$RELEASE_DIR"
          cd "$RELEASE_DIR"
          test -f .output/server/index.mjs
          test -d .output/public
          npm ci --omit=dev --no-audit --no-fund
          ln -sfn "$RELEASE_DIR" /var/www/impulsionando-core/current

          NODE_BIN="$(command -v node || true)"
          if [ -z "$NODE_BIN" ]; then
            echo "Node.js is not available in the deployment shell."
            exit 41
          fi
          echo "Using Node.js: $NODE_BIN"
          "$NODE_BIN" --version
          sed -i "s|^ExecStart=.*|ExecStart=${NODE_BIN} .output/server/index.mjs|" /tmp/impulsionando-core.service

          sudo install -o root -g root -m 0600 /tmp/impulsionando-core.env /etc/impulsionando-core.env
          sudo install -m 0644 /tmp/impulsionando-core.service /etc/systemd/system/impulsionando-core.service
          sudo systemctl daemon-reload
          sudo systemctl enable impulsionando-core
          sudo systemctl restart impulsionando-core

          echo "== Core service =="
          sudo systemctl --no-pager --full status impulsionando-core || true
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/tmp/core-local.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              sudo journalctl --no-pager -u impulsionando-core -n 100
              exit 43
            fi
            sleep 1
          done

          echo "== Public listeners =="
          sudo ss -ltnp | grep -E ':(80|443|3000)\b' || true
          echo "== Active proxy services =="
          sudo systemctl --no-pager --type=service --state=running | grep -Ei 'nginx|caddy|apache|traefik|docker|coolify|dokploy' || true
          echo "== Running containers =="
          sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' 2>/dev/null || true

          if sudo docker container inspect impulsionando-core >/dev/null 2>&1; then
            echo "== Updating active Traefik container =="
            sudo docker exec impulsionando-core sh -c 'rm -rf /app/.output && mkdir -p /app/.output'
            sudo docker cp "$RELEASE_DIR/.output/." impulsionando-core:/app/.output/
            sudo docker restart impulsionando-core
            for attempt in $(seq 1 30); do
              if sudo docker exec impulsionando-core node -e \
                "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) })"; then
                exit 0
              fi
              if [ "$attempt" -eq 30 ]; then
                sudo docker logs --tail 100 impulsionando-core
                exit 44
              fi
              sleep 1
            done
          fi

          sudo install -d -m 0755 /var/www/letsencrypt
          sudo install -m 0644 /tmp/nginx.chrismed.http.conf /etc/nginx/sites-available/chrismed.impulsionando.com.br
          sudo ln -sfn /etc/nginx/sites-available/chrismed.impulsionando.com.br /etc/nginx/sites-enabled/chrismed.impulsionando.com.br
          sudo nginx -t
          if ! sudo systemctl is-active --quiet nginx; then
            echo "Nginx is installed but inactive; refusing to replace the active public proxy."
            exit 42
          fi
          sudo systemctl reload nginx

          if [ ! -f /etc/letsencrypt/live/chrismed.impulsionando.com.br/fullchain.pem ]; then
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y certbot
            fi
            sudo certbot certonly --webroot --webroot-path /var/www/letsencrypt \
              --non-interactive --agree-tos --email sac@impulsionando.com.br \
              -d chrismed.impulsionando.com.br
          fi

          sudo install -m 0644 /tmp/nginx.chrismed.conf /etc/nginx/sites-available/chrismed.impulsionando.com.br
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Validate public frontends
        run: |
          curl --fail --location --silent --show-error --max-time 30 https://impulsionando.com.br/ >/tmp/impulsionando.html
          curl --fail --location --silent --show-error --max-time 30 https://chrismed.impulsionando.com.br/ >/tmp/chrismed.html
          grep -qi "Impulsionando" /tmp/impulsionando.html
          grep -qi "CHRISMED" /tmp/chrismed.html
