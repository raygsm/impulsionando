name: Remove obsolete builder dependencies once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-obsolete-builder-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove obsolete packages and regenerate lock
        run: |
          set -euo pipefail
          npm uninstall @lovable.dev/cloud-auth-js @lovable.dev/email-js @lovable.dev/mcp-js @lovable.dev/webhooks-js @lovable.dev/vite-tanstack-config
          rm -f bun.lock
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'); p.scripts['ci:security']='npm run security:check && npm run test:rls:recent && npm run test:rls:storage'; require('fs').writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
      - name: Persist cleanup and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git rm -f .github/workflows/remove-obsolete-builder-once.yml
          git rm -f .github/workflows/purge-lovable-debug.yml 2>/dev/null || true
          git rm -f .github/workflows/purge-lovable-dependencies.yml 2>/dev/null || true
          git rm -f .github/workflows/legacy-builder-purge.yml 2>/dev/null || true
          git add package.json package-lock.json
          git add -u
          git commit -m 'chore(core): permanently remove obsolete builder dependencies'
          git pull --rebase origin main
          git push origin HEAD:main
