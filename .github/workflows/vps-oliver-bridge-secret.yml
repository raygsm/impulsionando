name: VPS Oliver Bridge Secret

on:
  push:
    branches:
      - agent/core-impulsionando-operational-foundation
    paths:
      - .github/workflows/vps-oliver-bridge-secret.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Provision shared bridge token without disclosure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -eu
            CORE_ENV=/etc/impulsionando-core.env
            N8N_DIR=/docker/n8n-umlg
            N8N_ENV="$N8N_DIR/.env"
            N8N_COMPOSE="$N8N_DIR/docker-compose.yml"

            current=$(sudo sed -n 's/^N8N_OLIVER_BRIDGE_TOKEN=//p' "$CORE_ENV" 2>/dev/null | tail -n1 || true)
            if [ -z "$current" ]; then
              current=$(openssl rand -hex 32)
            fi

            core_tmp=$(mktemp)
            sudo grep -v '^N8N_OLIVER_BRIDGE_TOKEN=' "$CORE_ENV" 2>/dev/null >"$core_tmp" || true
            printf 'N8N_OLIVER_BRIDGE_TOKEN=%s\n' "$current" >>"$core_tmp"
            sudo install -o root -g root -m 0600 "$core_tmp" "$CORE_ENV"
            rm -f "$core_tmp"

            n8n_tmp=$(mktemp)
            grep -v '^N8N_OLIVER_BRIDGE_TOKEN=' "$N8N_ENV" 2>/dev/null >"$n8n_tmp" || true
            printf 'N8N_OLIVER_BRIDGE_TOKEN=%s\n' "$current" >>"$n8n_tmp"
            install -m 0600 "$n8n_tmp" "$N8N_ENV"
            rm -f "$n8n_tmp"

            if ! grep -q 'N8N_OLIVER_BRIDGE_TOKEN=' "$N8N_COMPOSE"; then
              python3 -c "from pathlib import Path; p=Path('$N8N_COMPOSE'); s=p.read_text(); anchor='      - WEBHOOK_URL=\${WEBHOOK_URL}\n'; assert anchor in s, 'WEBHOOK_URL anchor not found'; p.write_text(s.replace(anchor, anchor+'      - N8N_OLIVER_BRIDGE_TOKEN=\${N8N_OLIVER_BRIDGE_TOKEN}\n',1))"
            fi

            sudo systemctl restart impulsionando-core
            cd "$N8N_DIR"
            docker compose up -d n8n >/dev/null

            sleep 8
            sudo systemctl is-active --quiet impulsionando-core
            C=$(docker ps --format '{{.Names}}' | grep -E '^n8n-.*-n8n-1$' | head -n1)
            test -n "$C"
            core_present=$(sudo grep -c '^N8N_OLIVER_BRIDGE_TOKEN=' "$CORE_ENV" || true)
            n8n_present=$(docker inspect "$C" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -c '^N8N_OLIVER_BRIDGE_TOKEN=' || true)
            core_hash=$(printf '%s' "$current" | sha256sum | cut -d' ' -f1)
            n8n_value=$(docker inspect "$C" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^N8N_OLIVER_BRIDGE_TOKEN=//p' | tail -n1)
            n8n_hash=$(printf '%s' "$n8n_value" | sha256sum | cut -d' ' -f1)
            echo "core_secret_present=$core_present"
            echo "n8n_secret_present=$n8n_present"
            if [ "$core_hash" = "$n8n_hash" ]; then echo 'bridge_secret_match=YES'; else echo 'bridge_secret_match=NO'; exit 1; fi

            ok=0
            i=0
            while [ $i -lt 12 ]; do
              if curl -fsS --max-time 10 https://n8n.impulsionando.com.br/healthz 2>/dev/null | grep -q 'ok'; then ok=1; break; fi
              i=$((i+1)); sleep 5
            done
            echo "n8n_health=$ok"
            test "$ok" = "1"
            curl -fsS --max-time 15 https://impulsionando.com.br/ >/dev/null
            curl -fsS --max-time 15 https://chrismed.impulsionando.com.br/ >/dev/null
            echo 'core_health=OK'
