name: Production Front

on:
  workflow_dispatch:

concurrency:
  group: production-front
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    name: Recover canonical Core via systemd
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PRIMARY_SHA: d2f7c2ba02e441b5230d5a94b076a98c11171125
      FALLBACK_SHA: c998b87c49b1950f03898e0de9c4cf4a1e942e84
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout primary
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRIMARY_SHA }}
          path: primary
          fetch-depth: 1

      - name: Checkout fallback
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FALLBACK_SHA }}
          path: fallback
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Discover production tenants
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!v:-}" || { echo "::error::Missing $v"; exit 10; }
          done
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" \
            -o /tmp/tenants.json
          jq -r '.[] | select(.subdomain != null and .root_domain == "impulsionando.com.br" and .subdomain != "impulsionando" and (.subdomain | startswith("e2e-") | not) and (.subdomain | startswith("rls-") | not)) | (.subdomain + ".impulsionando.com.br")' /tmp/tenants.json | sort -u > /tmp/domains.txt
          test -s /tmp/domains.txt

      - name: Build immutable candidates before touching production
        run: |
          set -uo pipefail
          build_candidate() {
            label="$1"; sha="$2"; dir="$3"
            cd "$GITHUB_WORKSPACE/$dir" || return 1
            test "$(git rev-parse HEAD)" = "$sha" || return 1
            npm ci --no-audit --no-fund || return 1
            npx --yes vitest run src/lib/subdomain.test.ts || return 1
            npm run build || return 1
            test -f .output/server/index.mjs || return 1
            test -f scripts/start-core-runtime.mjs || return 1
            printf '%s' "$sha" > .output/public/impulsionando-front-sha.txt
            printf '{"sha":"%s","recovery":"%s","built_at":"%s"}\n' "$sha" "$label" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .output/public/impulsionando-release.json
            tar -czf "/tmp/$label.tgz" .output scripts package.json package-lock.json
            sha256sum "/tmp/$label.tgz" > "/tmp/$label.sha256"
          }
          primary_ok=0; fallback_ok=0
          build_candidate primary "$PRIMARY_SHA" primary && primary_ok=1
          build_candidate fallback "$FALLBACK_SHA" fallback && fallback_ok=1
          printf 'PRIMARY_BUILD_OK=%s\nFALLBACK_BUILD_OK=%s\n' "$primary_ok" "$fallback_ok" > /tmp/build.env
          [ "$primary_ok" -eq 1 ] || [ "$fallback_ok" -eq 1 ] || exit 20

      - name: Upload candidates
        run: |
          set -euo pipefail
          . /tmp/build.env
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          files=()
          [ "$PRIMARY_BUILD_OK" = 1 ] && files+=(/tmp/primary.tgz /tmp/primary.sha256)
          [ "$FALLBACK_BUILD_OK" = 1 ] && files+=(/tmp/fallback.tgz /tmp/fallback.sha256)
          scp "${files[@]}" "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Promote first healthy candidate through canonical systemd runtime
        id: promote
        run: |
          set -euo pipefail
          . /tmp/build.env
          ssh "$VPS_USER@$VPS_HOST" "PRIMARY_SHA='$PRIMARY_SHA' FALLBACK_SHA='$FALLBACK_SHA' PRIMARY_BUILD_OK='$PRIMARY_BUILD_OK' FALLBACK_BUILD_OK='$FALLBACK_BUILD_OK' bash -s" <<'REMOTE'
          set -u
          root=/var/www/impulsionando-core
          previous="$(readlink -f "$root/current" 2>/dev/null || true)"
          test -n "$previous" || exit 30

          rollback() {
            sudo ln -sfn "$previous" "$root/current"
            sudo systemctl daemon-reload
            sudo systemctl restart impulsionando-core.service
          }

          try_candidate() {
            label="$1"; sha="$2"
            cd /tmp || return 1
            sha256sum -c "$label.sha256" || return 1
            release="$root/releases/recovery-$sha"
            sudo rm -rf "$release"
            sudo mkdir -p "$release"
            sudo tar -xzf "$label.tgz" -C "$release" || return 1
            test "$(sudo cat "$release/.output/public/impulsionando-front-sha.txt")" = "$sha" || return 1
            sudo chown -R www-data:www-data "$release"
            sudo ln -sfn "$release" "$root/current"
            sudo systemctl daemon-reload
            sudo systemctl restart impulsionando-core.service || { rollback; return 1; }
            for i in $(seq 1 30); do
              served="$(curl -fsS --max-time 3 -H 'Host: impulsionando.com.br' http://127.0.0.1/impulsionando-front-sha.txt 2>/dev/null | tr -d '\r\n' || true)"
              if [ "$served" = "$sha" ]; then
                echo "$sha" >/tmp/selected-recovery-sha
                return 0
              fi
              sleep 2
            done
            rollback
            return 1
          }

          selected=''
          if [ "$PRIMARY_BUILD_OK" = 1 ] && try_candidate primary "$PRIMARY_SHA"; then
            selected="$PRIMARY_SHA"
          elif [ "$FALLBACK_BUILD_OK" = 1 ] && try_candidate fallback "$FALLBACK_SHA"; then
            selected="$FALLBACK_SHA"
          fi
          [ -n "$selected" ] || exit 40
          sudo systemctl is-active --quiet impulsionando-core.service || { rollback; exit 41; }
          echo "RECOVERY_PROMOTION=PASS sha=$selected"
          REMOTE
          selected="$(ssh "$VPS_USER@$VPS_HOST" 'cat /tmp/selected-recovery-sha')"
          echo "selected_sha=$selected" >> "$GITHUB_OUTPUT"

      - name: Verify apex and all real tenants
        run: |
          set -euo pipefail
          selected='${{ steps.promote.outputs.selected_sha }}'
          verify() {
            d="$1"
            for i in $(seq 1 20); do
              code="$(curl -sS -L -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://$d/?recovery=$selected" || true)"
              sha="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "https://$d/impulsionando-front-sha.txt?recovery=$selected" 2>/dev/null | tr -d '\r\n' || true)"
              [ "$code" = 200 ] && [ "$sha" = "$selected" ] && return 0
              sleep 3
            done
            echo "FAILED_DOMAIN=$d code=${code:-000} sha=${sha:-none}"
            return 1
          }
          failed=0
          verify impulsionando.com.br || failed=1
          verify www.impulsionando.com.br || failed=1
          while read -r d; do [ -z "$d" ] || verify "$d" || failed=1; done < /tmp/domains.txt
          [ "$failed" -eq 0 ]
          echo "PRODUCTION_FRONT=PASS selected_sha=$selected"
