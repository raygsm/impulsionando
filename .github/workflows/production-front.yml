name: Production Front

# Single frontend publication authority for Impulsionando and every tenant.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - scripts/start-core-runtime.mjs
      - scripts/pulsonitor-worker.mjs
      - scripts/colors-automation-worker.mjs
      - package.json
      - package-lock.json
      - vite.config.*
      - tsconfig*.json
      - .github/workflows/production-front.yml

concurrency:
  group: production-front
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build once and publish all tenants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate and discover tenants
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do test -n "${!v:-}" || exit 10; done
          npm ci --no-audit --no-fund
          npx --yes vitest run src/lib/subdomain.test.ts
          curl -fsS -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" -o /tmp/tenants.json
          jq -r '.[] | select(.subdomain != null and .root_domain == "impulsionando.com.br" and .subdomain != "impulsionando") | (.subdomain + ".impulsionando.com.br")' /tmp/tenants.json | sort -u > /tmp/domains.txt
          test -s /tmp/domains.txt
      - name: Build immutable release
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm run build
          test -f .output/server/index.mjs
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt
          printf '{"sha":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .output/public/impulsionando-release.json
          tar -czf /tmp/production-front.tgz .output scripts package.json package-lock.json
      - name: Configure SSH and upload
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          scp /tmp/production-front.tgz "$VPS_USER@$VPS_HOST:/tmp/production-front.tgz"
      - name: Promote canonical Core and evict competing frontend routers
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          compose=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          release="/var/www/impulsionando-core/releases/prod-$RELEASE_SHA"
          sudo rm -rf "$release" && sudo mkdir -p "$release"
          sudo tar -xzf /tmp/production-front.tgz -C "$release"
          rm -f /tmp/production-front.tgz
          test "$(sudo cat "$release/.output/public/impulsionando-front-sha.txt")" = "$RELEASE_SHA"
          old_image="$(sudo docker inspect -f '{{.Image}}' impulsionando-core 2>/dev/null || true)"
          [ -z "$old_image" ] || sudo docker tag "$old_image" impulsionando-core:deploy-rollback
          cat >/tmp/Dockerfile.production-front <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.production-front -t "impulsionando-core:$RELEASE_SHA" "$release"
          sudo docker tag "impulsionando-core:$RELEASE_SHA" impulsionando-core:latest
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core
          for i in $(seq 1 45); do
            sudo docker exec impulsionando-core node -e "fetch('http://127.0.0.1:3000/',{headers:{host:'chrismed.impulsionando.com.br'}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(2))" >/dev/null 2>&1 && break
            [ "$i" -lt 45 ] || exit 30
            sleep 2
          done
          for name in $(sudo docker ps -a --format '{{.Names}}'); do
            [ "$name" = impulsionando-core ] && continue
            case "$name" in
              *fastfront*|*fast-front*|*front-emergency*|*universal-front*|*multitenant*|chrismed-front-final-live|chrismed-front-final-canary)
                sudo docker rm -f "$name" >/dev/null 2>&1 || true
                echo "REMOVED_COMPETING_FRONT=$name"
                ;;
            esac
          done
          offenders=''
          for name in $(sudo docker ps --format '{{.Names}}'); do
            [ "$name" = impulsionando-core ] && continue
            labels="$(sudo docker inspect -f '{{json .Config.Labels}}' "$name" 2>/dev/null || true)"
            if printf '%s' "$labels" | grep -q 'traefik.http.routers' && printf '%s' "$labels" | grep -q 'impulsionando.com.br'; then offenders="$offenders $name"; fi
          done
          test -z "$offenders" || { echo "COMPETING_FRONT_ROUTERS:$offenders"; exit 31; }
          sudo ln -sfn "$release" /var/www/impulsionando-core/current-front
          REMOTE
      - name: Verify exact SHA on apex and every tenant
        run: |
          set -euo pipefail
          verify() {
            d="$1"
            for i in $(seq 1 20); do
              code="$(curl -sS -L -o /tmp/h -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://$d/?release=$GITHUB_SHA" || true)"
              sha="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "https://$d/impulsionando-front-sha.txt?release=$GITHUB_SHA" 2>/dev/null || true)"
              [ "$code" = 200 ] && [ "$sha" = "$GITHUB_SHA" ] && { echo "PASS $d $sha"; return 0; }
              sleep 3
            done
            echo "::error::$d expected=$GITHUB_SHA got=${sha:-none} http=${code:-none}"
            return 1
          }
          failed=0
          verify impulsionando.com.br || failed=1
          verify www.impulsionando.com.br || failed=1
          while read -r d; do [ -z "$d" ] || verify "$d" || failed=1; done < /tmp/domains.txt
          [ "$failed" -eq 0 ]
          echo "PRODUCTION_FRONT=PASS sha=$GITHUB_SHA"