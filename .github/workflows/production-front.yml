name: Production Front

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - public/**
      - scripts/start-core-runtime.mjs
      - scripts/pulsonitor-worker.mjs
      - scripts/colors-automation-worker.mjs
      - package.json
      - package-lock.json
      - vite.config.*
      - tsconfig*.json
      - .github/workflows/production-front.yml

concurrency:
  group: production-front
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build once and publish all tenants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate inputs and routing contract
        shell: bash
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!v:-}" || { echo "::error::Missing required secret: $v"; exit 10; }
          done
          test -f src/lib/subdomain.ts
          test -f scripts/start-core-runtime.mjs
          npx --yes vitest run src/lib/subdomain.test.ts

      - name: Discover active production tenants
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" \
            -o /tmp/tenants.json
          jq -e 'type == "array"' /tmp/tenants.json >/dev/null
          jq -r '.[] | select(.subdomain != null and .root_domain == "impulsionando.com.br" and .subdomain != "impulsionando") | (.subdomain + ".impulsionando.com.br")' /tmp/tenants.json | sort -u > /tmp/domains.txt
          count="$(wc -l < /tmp/domains.txt | tr -d ' ')"
          test "$count" -gt 0
          echo "TENANT_COUNT=$count" >> "$GITHUB_ENV"
          echo "Active tenants: $count"

      - name: Build immutable current-main release
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt
          printf '{"sha":"%s","deployed_from":"main","built_at":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .output/public/impulsionando-release.json
          tar -czf /tmp/production-front.tgz .output scripts package.json package-lock.json

      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 8); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then
              break
            fi
            [ "$attempt" -lt 8 ] || { echo '::error::VPS SSH unavailable'; exit 20; }
            sleep $((attempt * 2))
          done
          scp /tmp/production-front.tgz /tmp/domains.txt "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Atomic promotion on canonical Core
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          compose=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          release="/var/www/impulsionando-core/releases/prod-$RELEASE_SHA"
          archive=/tmp/production-front.tgz
          test -f "$compose"
          test -f "$archive"

          old_image="$(sudo docker inspect -f '{{.Image}}' impulsionando-core 2>/dev/null || true)"
          if [ -n "$old_image" ]; then
            sudo docker tag "$old_image" impulsionando-core:deploy-rollback
          fi

          sudo rm -rf "$release"
          sudo mkdir -p "$release"
          sudo tar -xzf "$archive" -C "$release"
          rm -f "$archive"
          test "$(sudo cat "$release/.output/public/impulsionando-front-sha.txt")" = "$RELEASE_SHA"

          cat >/tmp/Dockerfile.production-front <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE

          sudo docker build -f /tmp/Dockerfile.production-front -t "impulsionando-core:$RELEASE_SHA" "$release"
          sudo docker tag "impulsionando-core:$RELEASE_SHA" impulsionando-core:latest
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core

          healthy=0
          for attempt in $(seq 1 45); do
            if sudo docker exec impulsionando-core node -e "Promise.all(['impulsionando.com.br','chrismed.impulsionando.com.br','wmp.impulsionando.com.br','colors.impulsionando.com.br'].map(h=>fetch('http://127.0.0.1:3000/',{headers:{host:h}}).then(r=>{if(r.status!==200)throw new Error(h+':'+r.status)}))).then(()=>process.exit(0)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" != 1 ]; then
            sudo docker logs --tail 160 impulsionando-core || true
            if sudo docker image inspect impulsionando-core:deploy-rollback >/dev/null 2>&1; then
              sudo docker tag impulsionando-core:deploy-rollback impulsionando-core:latest
              sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core || true
            fi
            exit 30
          fi

          # Only after the canonical Core is healthy: remove obsolete parallel front routers.
          stale_names="$(sudo docker ps -a --format '{{.Names}}' | grep -E '^impulsionando-(fastfront|front-emergency|universal-front)' || true)"
          if [ -n "$stale_names" ]; then
            while read -r name; do
              [ -n "$name" ] || continue
              sudo docker rm -f "$name"
              echo "REMOVED_STALE_FRONT=$name"
            done <<< "$stale_names"
          fi

          sudo ln -sfn "$release" /var/www/impulsionando-core/current-front
          echo "CANONICAL_FRONT_SHA=$RELEASE_SHA"
          REMOTE

      - name: Verify exact release on apex and every tenant
        shell: bash
        run: |
          set -euo pipefail
          verify_domain() {
            domain="$1"
            for attempt in $(seq 1 20); do
              code="$(curl -sS -L -o /tmp/front-home.html -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/?release=$GITHUB_SHA" || true)"
              marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/impulsionando-front-sha.txt?release=$GITHUB_SHA" 2>/dev/null || true)"
              if [ "$code" = 200 ] && [ "$marker" = "$GITHUB_SHA" ]; then
                echo "PASS $domain $marker"
                return 0
              fi
              sleep 3
            done
            echo "::error::Public release mismatch: $domain expected=$GITHUB_SHA got=${marker:-none} http=${code:-none}"
            return 1
          }

          failed=0
          verify_domain impulsionando.com.br || failed=1
          verify_domain www.impulsionando.com.br || failed=1
          while read -r domain; do
            [ -n "$domain" ] || continue
            verify_domain "$domain" || failed=1
          done < /tmp/domains.txt
          [ "$failed" -eq 0 ]
          echo "PRODUCTION_FRONT=PASS sha=$GITHUB_SHA tenants=$TENANT_COUNT"
