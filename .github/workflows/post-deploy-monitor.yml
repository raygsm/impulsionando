name: Post-deploy monitor (CHRISMED)

# Roda a cada 15 min e apos o espelho para a VPS concluir, executando o smoke
# Playwright que garante que somente o Oliver aparece na CHRISMED,
# capturando erros novos de console e falhas de navegacao em desktop
# e mobile. Falhas quebram o job e disparam alerta do GitHub Actions.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Mirror Deploy Impulsionando → VPS (187)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: post-deploy-monitor-chrismed
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Smoke Oliver-only (desktop + mobile)
        env:
          CHRISMED_BASE_URL: https://chrismed.impulsionando.com.br
        run: >-
          bunx playwright test e2e/chrismed-oliver-only.spec.ts
          --project=desktop-chromium --project=mobile-chromium --reporter=list
      - name: Upload artefatos em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-monitor-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
