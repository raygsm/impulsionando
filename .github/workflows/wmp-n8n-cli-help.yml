name: WMP n8n workflow bootstrap
on:
  push:
    branches: [main]
    paths: [.github/workflows/wmp-n8n-cli-help.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Install and verify HMAC-protected WMP lead intake
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          URL=https://n8n.impulsionando.com.br/webhook/wmp-lead-intake

          echo '== Runtime prerequisite =='
          if ! sudo docker exec "$C" sh -lc '[ -n "${IMPULSIONANDO_WEBHOOK_SECRET:-}" ]'; then
            echo 'IMPULSIONANDO_WEBHOOK_SECRET is missing inside n8n runtime.'
            exit 31
          fi
          echo 'IMPULSIONANDO_WEBHOOK_SECRET_PRESENT=true'

          cat >/tmp/wmp-lead.json <<'JSON'
          {
            "id":"wmpLeadIntake01",
            "name":"WMP Lead Intake",
            "active":false,
            "nodes":[
              {
                "parameters":{"httpMethod":"POST","path":"wmp-lead-intake","responseMode":"responseNode","options":{"rawBody":true}},
                "id":"wmp-lead-webhook","name":"WMP Lead","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0]
              },
              {
                "parameters":{"functionCode":"const crypto = require('crypto');\nconst item = $input.first().json;\nconst sig = String(item.headers?.['x-impulsionando-signature'] || '');\nconst raw = item.body;\nconst canonical = typeof raw === 'string' ? raw : JSON.stringify(raw);\nconst expected = crypto.createHmac('sha256', $env.IMPULSIONANDO_WEBHOOK_SECRET).update(canonical).digest('hex');\nconst a = Buffer.from(sig, 'utf8');\nconst b = Buffer.from(expected, 'utf8');\nif (a.length !== b.length || !crypto.timingSafeEqual(a,b)) throw new Error('invalid_signature');\nreturn [{json: typeof raw === 'string' ? JSON.parse(raw) : raw}];"},
                "id":"verify-hmac","name":"Verify HMAC","type":"n8n-nodes-base.function","typeVersion":1,"position":[260,0]
              },
              {
                "parameters":{"respondWith":"json","responseBody":"={{ { ok: true, workflow: 'wmp_lead_intake', event_code: $json.event_code || null, correlation_id: $json.correlation_id || null } }}","options":{"responseCode":200}},
                "id":"respond-ok","name":"Respond 200","type":"n8n-nodes-base.respondToWebhook","typeVersion":1.4,"position":[520,0]
              }
            ],
            "connections":{
              "WMP Lead":{"main":[[{"node":"Verify HMAC","type":"main","index":0}]]},
              "Verify HMAC":{"main":[[{"node":"Respond 200","type":"main","index":0}]]}
            },
            "settings":{"executionOrder":"v1"}
          }
          JSON

          sudo docker cp /tmp/wmp-lead.json "$C:/tmp/wmp-lead.json"
          sudo docker exec "$C" n8n import:workflow --input=/tmp/wmp-lead.json
          sudo docker exec "$C" n8n update:workflow --id=wmpLeadIntake01 --active=true
          sudo docker exec "$C" n8n publish:workflow --id=wmpLeadIntake01
          sudo docker restart "$C" >/dev/null

          echo '== Wait for n8n =='
          ready=0
          for i in $(seq 1 45); do
            if sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || { echo 'n8n healthz did not recover'; exit 32; }

          echo '== Unsigned request must be rejected =='
          UNSIGNED_CODE="$(curl -sS -o /tmp/wmp-unsigned.out -w '%{http_code}' --max-time 20 -X POST "$URL" -H 'content-type: application/json' -d '{"tenant_slug":"wmp","event_code":"wmp.lead.received","correlation_id":"unsigned-security-probe"}')"
          echo "unsigned_http=$UNSIGNED_CODE"
          case "$UNSIGNED_CODE" in
            2*|3*) echo 'SECURITY FAILURE: unsigned WMP webhook request was accepted'; exit 33 ;;
          esac

          echo '== Signed request must succeed =='
          sudo docker exec -e WMP_PROBE_URL="$URL" "$C" node - <<'NODE'
          const crypto = require('crypto');
          const url = process.env.WMP_PROBE_URL;
          const secret = process.env.IMPULSIONANDO_WEBHOOK_SECRET;
          const payload = JSON.stringify({tenant_slug:'wmp',event_code:'wmp.lead.received',correlation_id:`signed-security-probe-${Date.now()}`});
          const signature = crypto.createHmac('sha256', secret).update(payload).digest('hex');
          fetch(url,{method:'POST',headers:{'content-type':'application/json','x-impulsionando-signature':signature},body:payload})
            .then(async r=>{ console.log(`signed_http=${r.status}`); if(!r.ok) process.exit(34); })
            .catch(e=>{ console.error(e.message); process.exit(35); });
          NODE

          echo '== Persistent active state =='
          sudo docker exec "$C" n8n export:workflow --id=wmpLeadIntake01 --output=/tmp/wmp-lead-export.json >/dev/null
          sudo docker exec "$C" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/wmp-lead-export.json','utf8'));const w=Array.isArray(r)?r[0]:r;const names=(w.nodes||[]).map(n=>n.name);console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,activeVersionId:w.activeVersionId,nodes:names},null,2));if(!w.active||!w.activeVersionId||!names.includes('Verify HMAC'))process.exit(36)"

          echo 'WMP_N8N_HMAC_SECURITY=PASS'
          REMOTE