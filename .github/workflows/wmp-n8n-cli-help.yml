name: WMP n8n workflow bootstrap
on:
  push:
    branches: [main]
    paths: [.github/workflows/wmp-n8n-cli-help.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Validate WMP lead workflow import
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          echo '== Antes =='
          sudo docker exec "$C" n8n list:workflow 2>&1 | grep 'WMP' || true
          cat >/tmp/wmp-lead.json <<'JSON'
          {"name":"WMP Lead Intake","active":false,"nodes":[{"parameters":{"httpMethod":"POST","path":"wmp-lead-intake","responseMode":"lastNode","options":{}},"id":"wmp-lead-webhook","name":"WMP Lead","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0]}],"connections":{},"settings":{"executionOrder":"v1"}}
          JSON
          sudo docker cp /tmp/wmp-lead.json "$C:/tmp/wmp-lead.json"
          echo '== Import =='
          sudo docker exec "$C" n8n import:workflow --input=/tmp/wmp-lead.json
          echo '== Depois =='
          sudo docker exec "$C" n8n list:workflow 2>&1 | grep 'WMP' || true
          REMOTE
