name: DNS/Origin check → VPS (187)

# Confirma a cada 6h (e em cada push em main) duas camadas independentes:
# 1) DNS/HTTPS publico precisa resolver e responder, inclusive quando protegido
#    por Cloudflare ou outro proxy/CDN;
# 2) a origem Hostinger precisa responder diretamente para o mesmo hostname.
#
# Comparar o A publico diretamente com VPS_HOST e incorreto para hosts proxied.
# Secret: VPS_HOST (IP publico da origem VPS Hostinger).

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validar DNS publico, HTTPS e origem VPS
        env:
          EXPECTED_IP: ${{ secrets.VPS_HOST }}
        run: |
          set -u
          if [ -z "${EXPECTED_IP:-}" ]; then
            echo "::error::Secret VPS_HOST nao configurado"
            exit 1
          fi

          HOSTS=(
            "impulsionando.com.br"
            "chrismed.impulsionando.com.br"
            "n8n.impulsionando.com.br"
            "wmp.impulsionando.com.br"
            "colorssaude.impulsionando.com.br"
            "marocas.impulsionando.com.br"
          )

          fail=0
          for h in "${HOSTS[@]}"; do
            dns_ips=$(dig +short "$h" A | sort -u | paste -sd, -)
            if [ -z "$dns_ips" ]; then
              echo "::error::$h nao possui registro A publico"
              fail=1
            fi

            public_code=$(curl -sk --max-time 15 -o /dev/null -w "%{http_code}" "https://$h" 2>/dev/null || true)
            public_code=${public_code:-000}
            server=$(curl -skI --max-time 15 "https://$h" 2>/dev/null | awk -F': ' 'tolower($1)=="server"{print $2}' | tr -d '\r' | head -n1 || true)

            origin_code=$(curl -sk --max-time 15 --resolve "$h:443:$EXPECTED_IP" -o /dev/null -w "%{http_code}" "https://$h" 2>/dev/null || true)
            origin_code=${origin_code:-000}

            echo "$h -> DNS=${dns_ips:-NONE} PUBLIC=$public_code Server=${server:-?} ORIGIN=$origin_code"

            if [ "$public_code" = "000" ] || [ "$public_code" -lt 200 ] 2>/dev/null || [ "$public_code" -ge 400 ] 2>/dev/null; then
              echo "::error::$h falhou no HTTPS publico (HTTP $public_code)"
              fail=1
            fi
            if [ "$origin_code" = "000" ] || [ "$origin_code" -lt 200 ] 2>/dev/null || [ "$origin_code" -ge 400 ] 2>/dev/null; then
              echo "::error::$h falhou na origem VPS $EXPECTED_IP (HTTP $origin_code)"
              fail=1
            fi
          done

          exit $fail
