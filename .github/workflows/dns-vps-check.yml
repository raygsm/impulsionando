name: Official domains consistency monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [lovable_published]
  workflow_dispatch:

concurrency:
  group: official-domains-consistency
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test consistency rules
        run: node --test scripts/deployment-consistency.test.mjs

      - name: Discover and compare every active official domain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFFICIAL_ROOT_DOMAIN: impulsionando.com.br
          DEPLOYMENT_PROBE_PATH: /
        run: node scripts/verify-deployment-consistency.mjs

      - name: Upload immutable diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-consistency-${{ github.run_id }}
          path: artifacts/deployment-consistency.json
          if-no-files-found: warn
          retention-days: 30
