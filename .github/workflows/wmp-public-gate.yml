name: WMP Public Gate
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/wmp-public-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wmp-public:
    runs-on: ubuntu-latest
    steps:
      - name: Validate WMP public routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://wmp.impulsionando.com.br'
          paths=( '/' '/djs' '/empresas' '/orcamento' '/pacotes' '/cases' '/sobre' '/faq' '/parceiro' '/parceiro/cadastro' '/onde-estou' )
          for path in "${paths[@]}"; do
            code=$(curl -sS -L --max-time 20 -o /tmp/wmp-body -w '%{http_code}' "$base$path")
            echo "$path -> HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::error::WMP route $path returned HTTP $code"
              exit 1
            fi
          done

      - name: Validate current WMP journey markers
        shell: bash
        run: |
          set -euo pipefail
          base='https://wmp.impulsionando.com.br'
          home=$(mktemp)
          djs=$(mktemp)
          empresas=$(mktemp)
          cases=$(mktemp)
          curl -sS -L --max-time 20 "$base/" -o "$home"
          curl -sS -L --max-time 20 "$base/djs" -o "$djs"
          curl -sS -L --max-time 20 "$base/empresas" -o "$empresas"
          curl -sS -L --max-time 20 "$base/cases" -o "$cases"

          declare -A checks=(
            ["$home"]='O Milito acompanha a jornada comercial e operacional|Solicitar proposta|Onde estou'
            ["$djs"]='DJ|Milito'
            ["$empresas"]='Hotéis|Empresas|datas'
            ["$cases"]='Portfólio|WMP'
          )

          for file in "${!checks[@]}"; do
            IFS='|' read -r -a markers <<< "${checks[$file]}"
            for marker in "${markers[@]}"; do
              if ! grep -Fqi "$marker" "$file"; then
                echo "::error::WMP production is missing current marker: $marker"
                exit 1
              fi
            done
          done

      - name: Reject stale or unvalidated WMP content
        shell: bash
        run: |
          set -euo pipefail
          base='https://wmp.impulsionando.com.br'
          pages=( '/' '/cases' '/pacotes' )
          forbidden=(
            '+850'
            '850+ eventos'
            'R$ 2.900'
            'R$2.900'
            'R$ 7.400'
            'R$7.400'
            '24h resposta garantida'
            '100% laudo de dB'
            '50 a 10.000 pessoas'
            'Festival Sertanejo de Verão'
            'Convenção Corporativa Tech'
            'Fernanda Ribeiro'
            'Rafael e Camila Torres'
            'Marcelo Andrade'
            'festival com 8.000 pessoas'
          )

          for path in "${pages[@]}"; do
            body=$(mktemp)
            curl -sS -L --max-time 20 "$base$path" -o "$body"
            for marker in "${forbidden[@]}"; do
              if grep -Fqi "$marker" "$body"; then
                echo "::error::WMP production $path still exposes stale/unvalidated content: $marker"
                exit 1
              fi
            done
          done

      - name: Validate Milito public integration
        shell: bash
        run: |
          set -euo pipefail
          base='https://wmp.impulsionando.com.br'
          for path in '/' '/djs' '/empresas' '/orcamento'; do
            body=$(mktemp)
            curl -sS -L --max-time 20 "$base$path" -o "$body"
            if ! grep -Fqi 'Milito' "$body"; then
              echo "::error::Milito is not visible on WMP public experience: $path"
              exit 1
            fi
          done
