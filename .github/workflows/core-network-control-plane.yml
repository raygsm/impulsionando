name: RETIRED - Core network control plane

# Historical workflow kept as a fail-closed tombstone.
# It previously created a second Core/router and mutated wildcard DNS.
# Production Front is the single frontend publication authority; DNS/routing changes
# require a separately reviewed infrastructure workflow and must not publish frontend code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: competing multitenant control-plane deploy is disabled."
          echo "Use .github/workflows/production-front.yml for frontend publication."
          exit 1
