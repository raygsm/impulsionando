name: Core network control plane

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/core-network-control-plane.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-network-control-plane
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      - name: Validate credentials and discover production tenants
        shell: bash
        run: |
          set -euo pipefail
          for v in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do test -n "${!v}" || { echo "::error::Missing $v"; exit 2; }; done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"
          curl -fsS -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/rest/v1/companies?select=id,name,is_active,is_demo,status&is_active=eq.true&is_demo=eq.false&status=eq.active" -o /tmp/companies.json
          jq -e 'type=="array" and length>0' /tmp/companies.json >/dev/null
          curl -fsS -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/rest/v1/core_tenant_identity?select=company_id,subdomain,root_domain,metadata&subdomain=neq.impulsionando&order=subdomain.asc" -o /tmp/identities.json
          jq -e 'type=="array" and length>0' /tmp/identities.json >/dev/null
          jq -n -r --slurpfile c /tmp/companies.json --slurpfile t /tmp/identities.json '($c[0] | map(.id) | INDEX(.)) as $active | $t[0][] | select($active[.company_id] != null) | select(.root_domain == "impulsionando.com.br") | select((.metadata.test_fixture // false) != true) | (.subdomain + "." + .root_domain)' | sort -u > /tmp/domains.txt
          test -s /tmp/domains.txt
          echo "PRODUCTION_TENANTS=$(wc -l </tmp/domains.txt | tr -d ' ')"

      - name: Build and test one Core
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test -- --run src/lib/subdomain.test.ts
          npm run build
          test -f .output/server/index.mjs
          tar -czf /tmp/core-release.tgz .output scripts package.json package-lock.json

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          scp /tmp/core-release.tgz "$VPS_USER@$VPS_HOST:/tmp/core-release.tgz"

      - name: Back up routing state and deploy canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="/var/backups/impulsionando/routing/$stamp"
          sudo mkdir -p "$backup"
          sudo docker ps --format '{{.Names}} {{.Image}}' | sudo tee "$backup/docker-ps.txt" >/dev/null
          sudo docker inspect $(sudo docker ps -q) 2>/dev/null | sudo tee "$backup/docker-inspect.json" >/dev/null || true
          sudo cp -a /opt/impulsionando/deploy/hostinger "$backup/hostinger" 2>/dev/null || true
          release="/var/www/impulsionando-core/releases/canonical-$RELEASE_SHA"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.multitenant.yml
          envfile=/etc/impulsionando-core.env
          test -f "$base"; sudo test -f "$envfile"
          sudo mkdir -p "$release"
          sudo tar -xzf /tmp/core-release.tgz -C "$release"
          rm -f /tmp/core-release.tgz
          printf 'node_modules\n' | sudo tee "$release/.dockerignore" >/dev/null
          cat >/tmp/Dockerfile.core <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.core -t impulsionando-core:canonical "$release"
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core-multitenant:
              image: impulsionando-core:canonical
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              labels:
                traefik.enable: "true"
                traefik.http.routers.impulsionando-multitenant.entrypoints: websecure
                traefik.http.routers.impulsionando-multitenant.rule: HostRegexp(`{subdomain:[a-z0-9-]+}.impulsionando.com.br`)
                traefik.http.routers.impulsionando-multitenant.service: impulsionando-core-multitenant
                traefik.http.routers.impulsionando-multitenant.tls: "true"
                traefik.http.routers.impulsionando-multitenant.tls.certresolver: letsencrypt
                traefik.http.routers.impulsionando-multitenant.priority: "100"
                traefik.http.services.impulsionando-core-multitenant.loadbalancer.server.port: "3000"
          YAML
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-core-multitenant
          for i in $(seq 1 60); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core-multitenant 2>/dev/null || true)"
            code=000
            [ -n "$ip" ] && code="$(curl -sS -H 'Host: csi.impulsionando.com.br' -o /tmp/core -w '%{http_code}' --max-time 10 "http://$ip:3000/" || true)"
            [ "$code" = 200 ] && break
            [ "$i" -lt 60 ] || exit 60
            sleep 2
          done
          echo "CANONICAL_CORE=PASS"
          REMOTE

      - name: Create canonical wildcard DNS
        shell: bash
        run: |
          set -euo pipefail
          name='*.impulsionando.com.br'
          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$name&per_page=100" -o /tmp/wild.json
          jq -e '.success==true' /tmp/wild.json >/dev/null
          good="$(jq -r --arg ip "$ORIGIN_IP" '.result[]|select(.type=="A" and .content==$ip and .proxied==true)|.id' /tmp/wild.json|head -n1)"
          if [ -z "$good" ]; then
            jq -r '.result[]|select(.type=="A" or .type=="AAAA" or .type=="CNAME")|.id' /tmp/wild.json | while read -r id; do [ -n "$id" ] && curl -fsS -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null; done
            jq -nc --arg name "$name" --arg ip "$ORIGIN_IP" '{type:"A",name:$name,content:$ip,ttl:1,proxied:true}' >/tmp/new.json
            curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/create.json
            jq -e '.success==true' /tmp/create.json >/dev/null
          fi
          echo 'WILDCARD_DNS=PASS'

      - name: Disable conflicting tenant-specific routers only after canonical origin passes
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          canonical=impulsionando-core-multitenant
          mapfile -t conflicts < <(sudo docker ps --format '{{.Names}}' | grep -E '^impulsionando-core-(csi|wmp|colors|chrismed|anamadu|grupo-evr|grupoevr|ontap|raoni|riobeer|spartacus|perola|sulatlantica)' || true)
          for c in "${conflicts[@]}"; do [ "$c" = "$canonical" ] && continue; echo "STOP_CONFLICT $c"; sudo docker stop "$c" >/dev/null || true; done
          echo 'CONFLICTING_ROUTERS_DISABLED=PASS'
          REMOTE

      - name: Verify every production tenant on public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          failed=0; : >/tmp/proven.txt
          while read -r domain; do
            code=000; final=''
            for i in $(seq 1 18); do
              read -r code final < <(curl -sS -L -A 'ImpulsionandoControlPlane/1.2' -H 'Cache-Control: no-cache' -o /tmp/public -w '%{http_code} %{url_effective}' --max-time 25 "https://$domain/" || echo '000 -')
              host="$(printf '%s' "$final" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
              [ "$code" = 200 ] && [ "$host" = "$domain" ] && break
              sleep 4
            done
            host="$(printf '%s' "$final" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
            if [ "$code" = 200 ] && [ "$host" = "$domain" ]; then echo "$domain" >>/tmp/proven.txt; else echo "FAIL $domain HTTP=$code FINAL=$final"; failed=$((failed+1)); fi
          done </tmp/domains.txt
          total="$(wc -l </tmp/domains.txt|tr -d ' ')"; proven="$(wc -l </tmp/proven.txt|tr -d ' ')"
          echo "TOTAL=$total PROVEN=$proven FAILED=$failed"
          test "$failed" -eq 0
          test "$proven" -eq "$total"

      - name: Persist proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # checkout/build steps can legitimately modify ignored/untracked workspace files.
          # Never rebase a dirty Actions workspace; reset it to origin/main before writing proof.
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/ops
          jq -nc --arg generated_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sha "$GITHUB_SHA" '{generated_at_utc:$generated_at_utc,commit:$sha,architecture:"wildcard-dns + single-traefik-router + single-core + canonical-tenant-resolver",status:"control-plane-executed"}' >docs/ops/core-network-control-plane.json
          git config user.name 'Impulsionito Core Control Plane'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/core-network-control-plane.json
          if git diff --cached --quiet; then echo 'PROOF_UNCHANGED=PASS'; exit 0; fi
          git commit -m 'chore(core): record network control-plane execution'
          git push origin HEAD:main
