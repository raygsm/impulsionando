name: Universal Client Subdomains Provisioning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - infra/subdomains/clients.json
      - .github/workflows/universal-client-subdomains.yml

permissions:
  contents: read

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate tenant manifest only
        run: |
          set -euo pipefail
          jq -e '.version == 1 and (.clients|type=="array")' infra/subdomains/clients.json >/dev/null
          jq -r '.clients[] | select(.enabled==true) | .domain' infra/subdomains/clients.json | grep -E '^[a-z0-9.-]+\.impulsionando\.com\.br$' >/dev/null
          echo 'TENANT_MANIFEST=PASS'
      - name: Architecture invariant
        run: |
          echo 'This workflow no longer publishes frontend builds or creates Traefik routers.'
          echo 'DNS/SSL bootstrap for a brand-new tenant belongs to the infrastructure control plane.'
          echo 'After bootstrap, all frontend releases are exclusively owned by Production Front.'
