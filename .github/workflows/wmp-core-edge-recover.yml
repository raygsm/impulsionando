name: RETIRED - WMP recover canonical Core edge

# Historical workflow kept as a fail-closed tombstone.
# It previously force-recreated the shared Core outside the canonical pipeline.
# Production Front is the single frontend/Core publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: WMP Core edge recovery publication is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
