name: WMP n8n HMAC forward fix

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-hmac-forward-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          H: ${{ secrets.VPS_HOST }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep 3
          done
          exit 41
      - name: Fix canonical forwarding and prove all WMP webhooks
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          SEC=/etc/impulsionando-security.env
          CORE='https://wmp.impulsionando.com.br/api/public/hooks/n8n-verify'
          secret="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$SEC" | head -n1)"
          test -n "$secret"

          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            file="/tmp/$id-hmacfix.json"
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="$file" >/dev/null
            sudo docker exec -e WID="$id" -e CORE="$CORE" "$C" node -e "const fs=require('fs'),id=process.env.WID,p='/tmp/'+id+'-hmacfix.json',r=JSON.parse(fs.readFileSync(p,'utf8')),w=Array.isArray(r)?r[0]:r,v=(w.nodes||[]).find(n=>n.name==='Verify signature in Core'); if(!v)process.exit(2); v.parameters={method:'POST',url:process.env.CORE,sendHeaders:true,headerParameters:{parameters:[{name:'x-impulsionando-signature',value:'={{ \$(\'WMP Lifecycle Webhook\').item.json.headers?.[\'x-impulsionando-signature\'] || \'\' }}'},{name:'Content-Type',value:'application/json'}]},sendBody:true,contentType:'raw',rawContentType:'application/json',body:'={{ JSON.stringify(\$(\'WMP Lifecycle Webhook\').item.json.body) }}',options:{response:{response:{fullResponse:true,neverError:true,responseFormat:'json'}},timeout:15000}}; fs.writeFileSync(p,JSON.stringify([w]));"
            sudo docker exec "$C" n8n import:workflow --input="$file" >/dev/null
            sudo docker exec "$C" n8n update:workflow --id="$id" --active=true >/dev/null
            sudo docker exec "$C" n8n publish:workflow --id="$id" >/dev/null
          done

          sudo docker exec "$C" n8n unpublish:workflow --id=wmpDjBookingLifecycle01 >/dev/null 2>&1 || true
          sudo docker exec "$C" n8n unpublish:workflow --id=wmpPostEventRelationship01 >/dev/null 2>&1 || true
          sudo docker restart "$C" >/dev/null
          for i in $(seq 1 45); do
            if sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            [ "$i" -lt 45 ] || exit 61
            sleep 2
          done

          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/$id-prove.json" >/dev/null
            sudo docker exec -e WID="$id" -e CORE="$CORE" "$C" node -e "const fs=require('fs'),id=process.env.WID,r=JSON.parse(fs.readFileSync('/tmp/'+id+'-prove.json','utf8')),w=Array.isArray(r)?r[0]:r,h=(w.nodes||[]).find(n=>n.type==='n8n-nodes-base.webhook'),v=(w.nodes||[]).find(n=>n.name==='Verify signature in Core'); console.log(JSON.stringify({id:w.id,active:w.active,activeVersionId:w.activeVersionId,path:h?.parameters?.path,verifier:v?.parameters?.url})); if(!w.active||!w.activeVersionId||!h?.parameters?.path||v?.parameters?.url!==process.env.CORE)process.exit(65);"
          done

          probe() {
            id="$1"; path="$2"; event="$3"; url="https://n8n.impulsionando.com.br/webhook/$path"; ts="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            payload="{\"workflow_name\":\"$id\",\"event_code\":\"$event\",\"tenant_slug\":\"wmp\",\"correlation_id\":\"probe-$id-$(date +%s)\",\"company_id\":null,\"dispatched_at\":\"$ts\",\"data\":{\"probe\":true}}"
            uc="$(curl -sS -o /tmp/u -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' --data-binary "$payload" || true)"
            echo "$id unsigned=$uc body=$(head -c 180 /tmp/u)"
            [ "$uc" = 401 ] || exit 62
            sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
            sc="$(curl -sS -o /tmp/s -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" --data-binary "$payload" || true)"
            echo "$id signed=$sc body=$(head -c 220 /tmp/s)"
            [ "$sc" = 200 ] || exit 63
            grep -q '"ok":true' /tmp/s || exit 64
          }

          probe wmpLeadIntake01 wmp-lead-intake wmp.lead.received
          probe wmpProposalLifecycle01 wmp-proposal-lifecycle wmp.proposal.sent
          probe wmpDjLifecycle01 wmp-dj-booking-lifecycle wmp.dj.offered
          probe wmpPostEvent01 wmp-post-event-relationship wmp.event.completed

          sudo docker rm -f wmp-hmac-verifier >/dev/null 2>&1 || true
          sudo rm -f /opt/impulsionando/security/wmp-hmac-verifier.mjs
          echo 'WMP_N8N_HMAC_FORWARD=PASS'
          REMOTE
