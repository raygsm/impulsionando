name: RETIRED - Install Core one-click publisher

# Historical workflow kept as a fail-closed tombstone.
# The legacy VPS publisher/worker must not be installed or enabled.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: legacy Core publisher installer is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
