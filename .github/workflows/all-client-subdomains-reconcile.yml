# Forced reconciliation trigger: 2026-08-19T07:48:00-03:00
name: All client subdomains reconcile

on:
  push:
    paths:
      - .github/workflows/all-client-subdomains-reconcile.yml
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: all-client-subdomains-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate production credentials and origin
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Discover active tenant domains from Core
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&subdomain=neq.impulsionando&order=subdomain.asc" \
            -o /tmp/tenants.json
          jq -e 'type == "array"' /tmp/tenants.json >/dev/null
          domains="$(jq -r '.[] | select(.subdomain != null and .root_domain != null) | (.subdomain + "." + .root_domain)' /tmp/tenants.json | sort -u | tr '\n' ' ' | xargs)"
          test -n "$domains" || { echo '::error::No tenant domains discovered'; exit 2; }
          echo "DOMAINS=$domains" >> "$GITHUB_ENV"
          echo "TENANT_COUNT=$(wc -w <<<"$domains" | tr -d ' ')" >> "$GITHUB_ENV"
          echo "Discovered domains: $domains"

      - name: Build multi-tenant Core
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Upload multi-tenant release
        run: |
          set -euo pipefail
          tar -czf /tmp/multitenant-release.tgz .output scripts package.json package-lock.json
          scp /tmp/multitenant-release.tgz "$VPS_USER@$VPS_HOST:/tmp/multitenant-release.tgz"

      - name: Deploy generic multi-tenant runtime and low-priority router
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release="/var/www/impulsionando-core/releases/multitenant-$RELEASE_SHA"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.multitenant.yml
          envfile=/etc/impulsionando-core.env
          test -f "$base"
          sudo test -f "$envfile"
          mkdir -p "$release"
          tar -xzf /tmp/multitenant-release.tgz -C "$release"
          rm -f /tmp/multitenant-release.tgz
          printf 'node_modules\n' > "$release/.dockerignore"
          cat > /tmp/Dockerfile.multitenant <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.multitenant -t impulsionando-core:multitenant "$release"
          cd /opt/impulsionando/deploy/hostinger
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core-multitenant:
              image: impulsionando-core:multitenant
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              labels:
                traefik.enable: "true"
                traefik.http.routers.impulsionando-multitenant.entrypoints: websecure
                traefik.http.routers.impulsionando-multitenant.rule: HostRegexp(`{subdomain:[a-z0-9-]+}.impulsionando.com.br`)
                traefik.http.routers.impulsionando-multitenant.service: impulsionando-core-multitenant
                traefik.http.routers.impulsionando-multitenant.tls: "true"
                traefik.http.routers.impulsionando-multitenant.tls.certresolver: letsencrypt
                traefik.http.routers.impulsionando-multitenant.priority: "50"
                traefik.http.services.impulsionando-core-multitenant.loadbalancer.server.port: "3000"
          YAML
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-core-multitenant
          for i in $(seq 1 60); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core-multitenant 2>/dev/null || true)"
            code=000
            if [ -n "$ip" ]; then
              code="$(curl -sS -H 'Host: ontap.impulsionando.com.br' -o /tmp/multitenant-origin -w '%{http_code}' --max-time 10 "http://$ip:3000/" || true)"
            fi
            [ "$code" = '200' ] && break
            [ "$i" -lt 60 ] || { sudo docker logs --tail 200 impulsionando-core-multitenant || true; exit 60; }
            sleep 2
          done
          echo "MULTITENANT_RUNTIME=PASS HTTP=$code"
          REMOTE

      - name: Validate tenant routes at Traefik origin
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "DOMAINS='$DOMAINS' bash -s" <<'REMOTE'
          set -euo pipefail
          for domain in $DOMAINS; do
            code=000
            location=''
            for attempt in $(seq 1 20); do
              headers="$(mktemp)"
              code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -A 'ImpulsionandoTenantReconcile/4.0' -H 'Accept: text/html,application/xhtml+xml' -D "$headers" -o /tmp/tenant-origin -w '%{http_code}' --max-time 20 "https://$domain/" || true)"
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "$headers")"
              rm -f "$headers"
              echo "ORIGIN $domain attempt=$attempt HTTP=$code LOCATION=${location:-none}"
              if [ "$code" = '200' ] && [ -z "$location" ]; then break; fi
              sleep 2
            done
            [ "$code" = '200' ] || { echo "::error::Origin route unavailable for $domain"; exit 31; }
            [ -z "$location" ] || { echo "::error::Unexpected origin redirect for $domain -> $location"; exit 32; }
          done
          REMOTE

      - name: Reconcile Cloudflare DNS to validated VPS
        run: |
          set -euo pipefail
          for domain in $DOMAINS; do
            curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$domain&per_page=100" -o /tmp/dns.json
            jq -e '.success == true' /tmp/dns.json >/dev/null
            current_id="$(jq -r --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip and .proxied==true) | .id' /tmp/dns.json | head -n1)"
            if [ -z "$current_id" ]; then
              jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/dns.json | while read -r id; do
                [ -n "$id" ] && curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
              done
              jq -nc --arg name "$domain" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/new.json
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/created.json
              jq -e '.success == true' /tmp/created.json >/dev/null
              echo "DNS_RECONCILED $domain"
            else
              echo "DNS_OK $domain"
            fi
          done

      - name: Validate public HTTPS without cross-host redirects
        run: |
          set -euo pipefail
          failed=0
          : > /tmp/verified-domains
          for domain in $DOMAINS; do
            code=000
            final_url=''
            for attempt in $(seq 1 24); do
              read -r code final_url < <(curl -sS -L -A 'Mozilla/5.0 ImpulsionandoTenantReconcile/4.0' -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/public -w '%{http_code} %{url_effective}' --max-time 30 "https://$domain/" || echo '000 -')
              final_host="$(printf '%s' "$final_url" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
              echo "PUBLIC $domain attempt=$attempt HTTP=$code FINAL=$final_url"
              if [ "$code" = '200' ] && [ "$final_host" = "$domain" ]; then break; fi
              sleep 5
            done
            final_host="$(printf '%s' "$final_url" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
            if [ "$code" != '200' ] || [ "$final_host" != "$domain" ]; then
              failed=1
              echo "::error::Tenant invalid: $domain HTTP=$code FINAL=$final_url"
            else
              echo "$domain" >> /tmp/verified-domains
            fi
          done
          [ "$failed" = '0' ] || exit 40
          echo "ALL_CLIENT_SUBDOMAINS=PASS count=$TENANT_COUNT"

      - name: Persist only verified DNS and SSL status in Core
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while read -r domain; do
            [ -n "$domain" ] || continue
            subdomain="${domain%.impulsionando.com.br}"
            payload="$(jq -nc --arg now "$now" '{dns_status:"active",ssl_status:"issued",dns_last_checked_at:$now,provisioned_at:$now,dns_error:null}')"
            curl --fail --silent --show-error -X PATCH \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: return=minimal' \
              --data "$payload" \
              "$SUPABASE_URL/rest/v1/core_tenant_identity?subdomain=eq.$subdomain"
            endpoint_payload="$(jq -nc '{status:"active",monitoring_enabled:true}')"
            curl --fail --silent --show-error -X PATCH \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Prefer: return=minimal' \
              --data "$endpoint_payload" \
              "$SUPABASE_URL/rest/v1/core_company_endpoints?endpoint_kind=eq.public_site&url=eq.https%3A%2F%2F$domain"
            echo "CORE_STATUS_VERIFIED $domain"
          done < /tmp/verified-domains
