name: All client subdomains reconcile

on:
  push:
    paths:
      - .github/workflows/all-client-subdomains-reconcile.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-client-subdomains-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Validate production credentials and origin
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Validate tenant subdomains at Traefik origin
        run: |
          set -euo pipefail
          # Colors Saúde is intentionally excluded: its sole public host is colorssaude.com.br.
          domains='chrismed.impulsionando.com.br anamadu.impulsionando.com.br marocas.impulsionando.com.br riomed.impulsionando.com.br wmp.impulsionando.com.br'
          ssh -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" "DOMAINS='$domains' bash -s" <<'REMOTE'
          set -euo pipefail
          for domain in $DOMAINS; do
            code=000
            for attempt in $(seq 1 30); do
              code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -A 'ImpulsionandoTenantReconcile/1.0' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/tenant-origin -w '%{http_code}' --max-time 20 "https://$domain/" || true)"
              echo "ORIGIN $domain attempt=$attempt HTTP=$code"
              [ "$code" = '200' ] && break
              sleep 2
            done
            [ "$code" = '200' ] || { echo "::error::Origin route unavailable for $domain"; exit 31; }
          done
          REMOTE

      - name: Reconcile Cloudflare DNS to validated VPS
        run: |
          set -euo pipefail
          # Never add a Colors subdomain here. Colors uses only colorssaude.com.br.
          domains='chrismed.impulsionando.com.br anamadu.impulsionando.com.br marocas.impulsionando.com.br riomed.impulsionando.com.br wmp.impulsionando.com.br'
          for domain in $domains; do
            curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$domain&per_page=100" -o /tmp/dns.json
            jq -e '.success == true' /tmp/dns.json >/dev/null
            current_id="$(jq -r --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip and .proxied==true) | .id' /tmp/dns.json | head -n1)"
            if [ -z "$current_id" ]; then
              jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/dns.json | while read -r id; do
                [ -n "$id" ] && curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
              done
              jq -nc --arg name "$domain" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/new.json
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/created.json
              jq -e '.success == true' /tmp/created.json >/dev/null
              echo "DNS_RECONCILED $domain"
            else
              echo "DNS_OK $domain"
            fi
          done

      - name: Validate public HTTPS for every subdomain client
        run: |
          set -euo pipefail
          domains='chrismed.impulsionando.com.br anamadu.impulsionando.com.br marocas.impulsionando.com.br riomed.impulsionando.com.br wmp.impulsionando.com.br'
          failed=0
          for domain in $domains; do
            code=000
            for attempt in $(seq 1 18); do
              code="$(curl -sS -L -A 'Mozilla/5.0 ImpulsionandoTenantReconcile/1.0' -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/public -w '%{http_code}' --max-time 30 "https://$domain/" || true)"
              echo "PUBLIC $domain attempt=$attempt HTTP=$code"
              [ "$code" = '200' ] && break
              sleep 5
            done
            if [ "$code" != '200' ]; then failed=1; echo "::error::Public tenant unavailable: $domain HTTP=$code"; fi
          done
          [ "$failed" = '0' ] || exit 40
          echo 'ALL_CLIENT_SUBDOMAINS=PASS'
