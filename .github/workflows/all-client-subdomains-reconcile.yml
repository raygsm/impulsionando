name: All client subdomains verify

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: all-client-subdomains-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Discover active tenant domains
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl -fsS \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" \
            -o /tmp/tenants.json
          jq -r '.[] | select(.subdomain != null and .root_domain == "impulsionando.com.br" and .subdomain != "impulsionando" and (.subdomain | startswith("e2e-") | not) and (.subdomain | startswith("rls-") | not)) | (.subdomain + ".impulsionando.com.br")' /tmp/tenants.json | sort -u > /tmp/domains.txt
          test -s /tmp/domains.txt

      - name: Verify every tenant serves a valid canonical release marker
        run: |
          set -euo pipefail
          failed=0
          while read -r domain; do
            [ -n "$domain" ] || continue
            code="$(curl -sS -L -o /tmp/home -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 20 "https://$domain/?verify=$(date +%s)" || true)"
            marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "https://$domain/impulsionando-front-sha.txt?verify=$(date +%s)" 2>/dev/null || true)"
            if [ "$code" = 200 ] && printf '%s' "$marker" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "PASS $domain sha=$marker"
            else
              echo "::error::INVALID_FRONT $domain http=$code sha=${marker:-none}"
              failed=1
            fi
          done < /tmp/domains.txt
          [ "$failed" -eq 0 ]

      - name: Architecture invariant
        run: |
          echo 'This workflow is verification-only.'
          echo 'It MUST NOT build images, create frontend containers, change Traefik routers, or mutate DNS.'
          echo 'Production Front is the single frontend publication authority.'
