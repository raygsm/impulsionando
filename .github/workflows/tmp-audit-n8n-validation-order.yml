name: Temporary audit n8n HMAC validation order

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-validation-order.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect first nodes after webhook
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            MOUNT=$(docker inspect "$C" --format '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}')
            DB="$MOUNT/database.sqlite"
            test -f "$DB"
            cat > /tmp/audit_n8n_order.py <<'PY'
            import os, sqlite3, json
            ids=set("kjdkkV9rjIMgAMdA YT7nYlKuQryGUNEq TwxMj5XSMgUEbXiD NYX6Bo1dlyd7b3P7 J2vrRXk9L2WoRfam s1fiGRPTRcyeAPyt CUFC3smxigoC5hOx FmNmDqMNYbbW3fM7 WavassyWPggKwThY cBPqXfXfP0H3pAbs 7i5gHQnraIKzgdz1 njO3SGf3tl3j8wh0 SXW6oLezwWFvAGwN y080sHJouKP66SAH iGZ5djNpjie6WSTB VwGvbkMMVKU2CQ3E 1QysKcsGaLHountH vvqBbKmhz6gF1szf hdyhky3EYUcOPaAk NcPcGGHAbAmbrMiG QSfPQDe2C63j7ZNp JJu7F0uXxS1RN7BK 0dA5lyMj9LtObOdg SMbKe6dT2j2Qs9gt F0asmrhkiplhhrYW 3m68WaCpdlC6G9Vh".split())
            con=sqlite3.connect("file:"+os.environ["DB_PATH"]+"?mode=ro",uri=True)
            rows=con.execute("select id,active,nodes,connections from workflow_entity").fetchall()
            print("ID|WEBHOOK|NEXT|VALIDATORS|ORDER_OK")
            for wid,active,nodes_raw,conn_raw in sorted(rows):
                if wid not in ids: continue
                nodes=json.loads(nodes_raw or "[]")
                conn=json.loads(conn_raw or "{}")
                byname={n.get("name"):n for n in nodes}
                hooks=[n for n in nodes if n.get("type")=="n8n-nodes-base.webhook"]
                validators=[]
                for n in nodes:
                    text=json.dumps(n,ensure_ascii=False).lower()
                    if "x-impulsionando-signature" in text and any(x in text for x in ("hmac","sha256","createhmac")):
                        validators.append(n.get("name",""))
                for hook in hooks:
                    hname=hook.get("name","")
                    next_names=[]
                    for output_group in (conn.get(hname,{}).get("main",[]) or []):
                        for edge in output_group or []:
                            if edge.get("node"): next_names.append(edge["node"])
                    order_ok=bool(next_names) and all(n in validators for n in next_names)
                    print("|".join([wid,hname,",".join(next_names),",".join(validators),"YES" if order_ok else "NO"]))
            con.close()
            PY
            DB_PATH="$DB" python3 /tmp/audit_n8n_order.py
            rm -f /tmp/audit_n8n_order.py
