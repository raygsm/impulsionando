name: Fix WMP origin routing
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-wmp-origin.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Add explicit WMP host and verify
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          compose=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          backup="${compose}.bak-wmp"
          sudo cp -a "$compose" "$backup"
          sudo python3 - "$compose" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          a='Host(`chrismed.impulsionando.com.br`) || HostRegexp('
          b='Host(`chrismed.impulsionando.com.br`) || Host(`wmp.impulsionando.com.br`) || HostRegexp('
          if 'Host(`wmp.impulsionando.com.br`)' not in s:
              if s.count(a)!=2: raise SystemExit('unexpected router layout')
              p.write_text(s.replace(a,b))
          PY
          cd /opt/impulsionando/deploy/hostinger
          if ! sudo docker compose -f "$compose" config -q; then sudo cp -a "$backup" "$compose"; exit 48; fi
          sudo docker compose -f "$compose" up -d --no-deps impulsionando-core
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -sk --max-time 10 --resolve 'wmp.impulsionando.com.br:443:127.0.0.1' -o /dev/null -w '%{http_code}' 'https://wmp.impulsionando.com.br/' || true)
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then ok=1; echo "wmp=$code"; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then sudo cp -a "$backup" "$compose"; sudo docker compose -f "$compose" up -d --no-deps impulsionando-core; exit 49; fi
          for h in impulsionando.com.br chrismed.impulsionando.com.br; do
            code=$(curl -sk --max-time 10 --resolve "$h:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$h" || true)
            echo "$h=$code"
            test "$code" -ge 200 && test "$code" -lt 400
          done
          REMOTE
