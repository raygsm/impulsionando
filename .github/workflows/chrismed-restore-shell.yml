name: CHRISMED restore shell safely
on:
  push:
    paths: ['.github/workflows/chrismed-restore-shell.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore last known-good shell and remove R$1 test item
        run: |
          git checkout 4d7166c434c87cfb853ad01572c55c9b4669e2db -- src/components/chrismed/ChrismedShell.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/chrismed/ChrismedShell.tsx')
          s=p.read_text()
          line='      { to: "/chrismed/agendar", labels: { pt: "Teleconsulta — TESTE R$ 1,00", en: "Telehealth — R$1 TEST", es: "Teleconsulta — PRUEBA R$ 1,00" }, desc: { pt: "Homologação temporária do pagamento e bloqueio da agenda.", en: "Temporary payment and scheduling validation.", es: "Validación temporal del pago y bloqueo de agenda." } },\n'
          if line in s:
            s=s.replace(line,'',1)
          p.write_text(s)
          PY
      - name: Commit restoration
        run: |
          git config user.name impulsionando-bot
          git config user.email actions@users.noreply.github.com
          git add src/components/chrismed/ChrismedShell.tsx
          git diff --cached --check
          git commit -m "fix(chrismed): restore shell and remove R$1 test menu item"
          git push origin main
