name: Colors Bootstrap Promote

on:
  push:
    paths:
      - .github/workflows/colors-bootstrap-promote.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colors-bootstrap-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      TARGET_RELEASE_SHA: b2aee3bd043da07f9685024c2694e5e73c968bd7
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 41

      - name: Wait for exact validated release artifact
        run: |
          set -euo pipefail
          release="/var/www/impulsionando-core/releases/$TARGET_RELEASE_SHA"
          for attempt in $(seq 1 60); do
            if ssh "$VPS_USER@$VPS_HOST" "test -f '$release/.output/server/index.mjs' && test -f '$release/scripts/start-core-runtime.mjs'"; then
              echo "COLORS_BOOTSTRAP_RELEASE=$TARGET_RELEASE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Colors bootstrap release missing::$TARGET_RELEASE_SHA was not uploaded by the canonical build"
          exit 42

      - name: Promote exact release with automatic rollback
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "TARGET_RELEASE_SHA='$TARGET_RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          release="/var/www/impulsionando-core/releases/$TARGET_RELEASE_SHA"
          compose=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          test -f "$release/.output/server/index.mjs"
          test -f "$compose"

          previous_release="$(readlink -f /var/www/impulsionando-core/current 2>/dev/null || true)"
          old_image="$(sudo docker inspect -f '{{.Image}}' impulsionando-core 2>/dev/null || true)"
          if [ -n "$old_image" ]; then sudo docker tag "$old_image" impulsionando-core:colors-bootstrap-rollback; fi

          rollback() {
            echo 'COLORS_BOOTSTRAP_ROLLBACK=START'
            if sudo docker image inspect impulsionando-core:colors-bootstrap-rollback >/dev/null 2>&1; then
              sudo docker tag impulsionando-core:colors-bootstrap-rollback impulsionando-core:latest
              cd /opt/impulsionando/deploy/hostinger
              sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core || true
            fi
            if [ -n "$previous_release" ] && [ -f "$previous_release/.output/server/index.mjs" ]; then
              sudo ln -sfn "$previous_release" /var/www/impulsionando-core/current
              sudo systemctl restart impulsionando-core || true
            fi
          }
          trap 'rollback' ERR

          sudo ln -sfn "$release" /var/www/impulsionando-core/current
          sudo systemctl restart impulsionando-core
          for attempt in $(seq 1 30); do
            curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null 2>&1 && break
            [ "$attempt" -lt 30 ] || exit 43
            sleep 1
          done

          printf 'node_modules\n' > "$release/.dockerignore"
          cat > /tmp/Dockerfile.impulsionando-runtime <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.impulsionando-runtime -t impulsionando-core:latest "$release"
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core

          for attempt in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null || true)"
            if [ -n "$ip" ] && curl -fsS -H 'Host: colors.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' "http://$ip:3000/" >/dev/null 2>&1; then break; fi
            [ "$attempt" -lt 45 ] || exit 44
            sleep 2
          done
          ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core)"

          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio /entrar /criar-conta; do
            code="$(curl -sS -H 'Host: colors.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/colors-bootstrap-probe -w '%{http_code}' "http://$ip:3000$path")"
            echo "COLORS_BOOTSTRAP_PROBE $path HTTP=$code"
            [ "$code" = '200' ] || exit 45
          done
          for path in / /auth /dashboard /djs /empresas; do
            code="$(curl -sS -H 'Host: wmp.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/wmp-bootstrap-probe -w '%{http_code}' "http://$ip:3000$path")"
            echo "WMP_REGRESSION_PROBE $path HTTP=$code"
            [ "$code" = '200' ] || exit 46
          done
          trap - ERR
          echo 'COLORS_BOOTSTRAP_ORIGIN=PASS'
          REMOTE

# Triggered after the canonical release containing Colors clean-path routing was queued.
