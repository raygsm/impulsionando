name: RETIRED - Colors Bootstrap Promote

# Historical workflow kept as a fail-closed tombstone.
# It previously switched releases, rebuilt the shared Core image and restarted production for one tenant.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: Colors independent Core promotion is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
