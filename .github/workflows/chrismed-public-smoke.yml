name: CHRISMED Public Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**/chrismed*
      - src/components/chrismed/**
      - src/lib/chrismed*
      - src/data/chrismed*
      - supabase/functions/chrismed-*/**
      - supabase/migrations/*chrismed*
      - .github/workflows/chrismed-public-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Validate CHRISMED production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check critical public routes
        run: |
          set -euo pipefail
          check() {
            name="$1"
            url="$2"
            expected="$3"
            out="/tmp/chrismed-${name}.html"
            code="$(curl --location --silent --show-error --output "$out" --write-out '%{http_code}' --max-time 30 "$url")"
            printf '%s -> HTTP %s\n' "$url" "$code"
            case "$code" in
              200|301|302|307|308) ;;
              *) echo "Unexpected HTTP status for $url"; exit 1 ;;
            esac
            if [ -n "$expected" ]; then
              grep -aEqi "$expected" "$out" || { echo "Expected page signature not found for $url"; exit 1; }
            fi
          }
          check home 'https://chrismed.impulsionando.com.br/' 'CHRISMED|CrisMed'
          check agendar 'https://chrismed.impulsionando.com.br/agendar' 'Agendar|consulta|CHRISMED|CrisMed'
          check eventos 'https://chrismed.impulsionando.com.br/eventos' 'Eventos|evento|CHRISMED|CrisMed'
          check auth 'https://chrismed.impulsionando.com.br/auth' 'Entrar|Acesso|CHRISMED|CrisMed'
          check profissional 'https://chrismed.impulsionando.com.br/agenda/profissional' 'Profissional|Agenda|CHRISMED|CrisMed'

      - name: Verify canonical release marker
        run: |
          set -euo pipefail
          marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 20 "https://chrismed.impulsionando.com.br/impulsionando-front-sha.txt?verify=$(date +%s)" | tr -d '\000\r\n')"
          printf '%s' "$marker" | grep -Eq '^[0-9a-f]{40}$'
          echo "CHRISMED_CANONICAL_FRONT=PASS sha=$marker"

      - name: Reject development and mock copy in production
        run: |
          set -euo pipefail
          for file in /tmp/chrismed-home.html /tmp/chrismed-agendar.html /tmp/chrismed-eventos.html /tmp/chrismed-auth.html /tmp/chrismed-profissional.html; do
            if grep -aEqi 'Dados de demonstração|Pendente Codex|backend \(Codex\)|mock visual|frontend-only' "$file"; then
              echo "Development/mock copy leaked into production: $file"
              grep -aEin 'Dados de demonstração|Pendente Codex|backend \(Codex\)|mock visual|frontend-only' "$file" || true
              exit 1
            fi
          done
          echo 'CHRISMED_PRODUCTION_COPY=PASS'

      - name: Architecture invariant
        run: |
          echo 'Smoke is verification-only.'
          echo 'It MUST NOT build images, recreate containers, alter Traefik, mutate DNS, or publish frontend code.'
          echo 'Production Front is the single frontend publication authority.'
