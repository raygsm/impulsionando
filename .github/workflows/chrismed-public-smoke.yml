name: CHRISMED Public Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**/chrismed*
      - src/components/chrismed/**
      - src/lib/chrismed*
      - src/data/chrismed*
      - supabase/functions/chrismed-*/**
      - supabase/migrations/*chrismed*
      - .github/workflows/chrismed-public-smoke.yml

permissions:
  contents: read

jobs:
  repair-and-smoke:
    name: Restore and validate CHRISMED production
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restore CHRISMED Traefik router
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.chrismed.yml
          cd /opt/impulsionando/deploy/hostinger
          test -f "$base"
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core:
              labels:
                traefik.enable: "true"
                traefik.http.routers.chrismed.entrypoints: websecure
                traefik.http.routers.chrismed.rule: Host(`chrismed.impulsionando.com.br`)
                traefik.http.routers.chrismed.service: impulsionando-core
                traefik.http.routers.chrismed.tls: "true"
                traefik.http.routers.chrismed.tls.certresolver: letsencrypt
                traefik.http.routers.chrismed.priority: "300"
                traefik.http.services.impulsionando-core.loadbalancer.server.port: "3000"
          YAML
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-core
          for attempt in $(seq 1 60); do
            code="$(curl -k -sS --resolve 'chrismed.impulsionando.com.br:443:127.0.0.1' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/chrismed-home -w '%{http_code}' --max-time 15 'https://chrismed.impulsionando.com.br/' || true)"
            [ "$code" = '200' ] && break
            if [ "$attempt" -eq 60 ]; then
              echo "CHRISMED restore failed HTTP=$code"
              sudo docker inspect impulsionando-core --format '{{json .Config.Labels}}' || true
              sudo docker logs --tail 120 impulsionando-core || true
              exit 61
            fi
            sleep 2
          done
          echo 'CHRISMED_ROUTER_RESTORED=PASS'
          REMOTE

      - name: Check critical public routes
        run: |
          set -euo pipefail
          check() {
            name="$1"
            url="$2"
            expected="$3"
            out="/tmp/chrismed-${name}.html"
            code="$(curl --location --silent --show-error --output "$out" --write-out '%{http_code}' --max-time 30 "$url")"
            printf '%s -> HTTP %s\n' "$url" "$code"
            case "$code" in
              200|301|302|307|308) ;;
              *) echo "Unexpected HTTP status for $url"; exit 1 ;;
            esac
            if [ -n "$expected" ]; then
              grep -Eqi "$expected" "$out" || { echo "Expected page signature not found for $url"; exit 1; }
            fi
          }
          check home 'https://chrismed.impulsionando.com.br/' 'CHRISMED|CrisMed'
          check agendar 'https://chrismed.impulsionando.com.br/agendar' 'Agendar|consulta|CHRISMED|CrisMed'
          check eventos 'https://chrismed.impulsionando.com.br/eventos' 'Eventos|evento|CHRISMED|CrisMed'
          check auth 'https://chrismed.impulsionando.com.br/auth' 'Entrar|Acesso|CHRISMED|CrisMed'
          check profissional 'https://chrismed.impulsionando.com.br/agenda/profissional' 'Profissional|Agenda|CHRISMED|CrisMed'

      - name: Reject development and mock copy in production
        run: |
          set -euo pipefail
          for file in /tmp/chrismed-home.html /tmp/chrismed-agendar.html /tmp/chrismed-eventos.html /tmp/chrismed-auth.html /tmp/chrismed-profissional.html; do
            if grep -Eqi 'Dados de demonstração|Pendente Codex|backend \(Codex\)|mock visual|frontend-only' "$file"; then
              echo "Development/mock copy leaked into production: $file"
              grep -Ein 'Dados de demonstração|Pendente Codex|backend \(Codex\)|mock visual|frontend-only' "$file" || true
              exit 1
            fi
          done
          echo 'CHRISMED_PRODUCTION_COPY=PASS'

      - name: Verify deployed coupon bundle contract
        run: |
          set -euo pipefail
          html=/tmp/chrismed-agendar.html
          : > /tmp/chrismed-js-bundle.txt
          grep -Eo 'src="[^"]+\.js[^"]*"' "$html" | sed -E 's/^src="|"$//g' | while read -r asset; do
            case "$asset" in
              http*) url="$asset" ;;
              /*) url="https://chrismed.impulsionando.com.br$asset" ;;
              *) url="https://chrismed.impulsionando.com.br/$asset" ;;
            esac
            curl --location --silent --show-error --max-time 30 "$url" >> /tmp/chrismed-js-bundle.txt
            printf '\n' >> /tmp/chrismed-js-bundle.txt
          done
          test -s /tmp/chrismed-js-bundle.txt
          grep -Fq 'chrismed_set_coupon_checkout_intent' /tmp/chrismed-js-bundle.txt || { echo 'Correct coupon RPC is not in deployed bundle'; exit 1; }
          grep -Fq 'Fechar janela do cupom' /tmp/chrismed-js-bundle.txt || { echo 'Coupon close control is not in deployed bundle'; exit 1; }
          if grep -Fq 'chrismed_apply_coupon_checkout_v2' /tmp/chrismed-js-bundle.txt; then
            echo 'Obsolete coupon RPC is still in deployed bundle'
            exit 1
          fi
          echo 'CHRISMED_COUPON_BUNDLE=PASS'

      - name: Verify legacy typo is not canonical
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error --output /tmp/chrismed-alth.html --write-out '%{http_code}' --max-time 30 'https://chrismed.impulsionando.com.br/alth')"
          printf '/alth -> HTTP %s\n' "$code"
          if [ "$code" = '200' ] && grep -Eqi 'Gestão CHRISMED|Centro operacional' /tmp/chrismed-alth.html; then
            echo 'Legacy /alth is incorrectly serving the management page.'
            exit 1
          fi
