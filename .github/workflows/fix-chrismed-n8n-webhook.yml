name: Fix CHRISMED N8N canonical webhook
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-chrismed-n8n-webhook.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Repair, publish and verify CHRISMED worker
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          WF_ID=chrismedOutboxWorker01
          URL=https://n8n.impulsionando.com.br/webhook/chrismed-outbox-worker
          cat >/tmp/chrismed-worker-fixed.json <<'JSON'
          [{
            "id":"chrismedOutboxWorker01",
            "name":"CHRISMED Communication Outbox Worker",
            "active":false,
            "nodes":[
              {"parameters":{"rule":{"interval":[{"field":"minutes","minutesInterval":1}]}},"id":"chrismed-schedule","name":"Every minute","type":"n8n-nodes-base.scheduleTrigger","typeVersion":1.2,"position":[0,-100]},
              {"parameters":{"httpMethod":"POST","path":"chrismed-outbox-worker","responseMode":"lastNode","options":{}},"id":"chrismed-webhook","name":"CHRISMED Worker Webhook","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,100],"webhookId":"chrismed-outbox-worker"},
              {"parameters":{"method":"POST","url":"https://arygtqrdpcdkwnuwsgmm.supabase.co/functions/v1/chrismed-communication-worker","authentication":"genericCredentialType","genericAuthType":"httpHeaderAuth","sendHeaders":true,"headerParameters":{"parameters":[{"name":"content-type","value":"application/json"}]},"sendBody":true,"contentType":"raw","rawContentType":"application/json","body":"{}","options":{"timeout":30000}},"id":"chrismed-worker-call","name":"Process CHRISMED Outbox","type":"n8n-nodes-base.httpRequest","typeVersion":4.2,"position":[280,0],"credentials":{"httpHeaderAuth":{"id":"chrismedSupabaseHeader01","name":"CHRISMED Supabase Service Role"}}}
            ],
            "connections":{"Every minute":{"main":[[{"node":"Process CHRISMED Outbox","type":"main","index":0}]]},"CHRISMED Worker Webhook":{"main":[[{"node":"Process CHRISMED Outbox","type":"main","index":0}]]}},
            "settings":{"executionOrder":"v1","timezone":"America/Sao_Paulo"}
          }]
          JSON
          sudo docker cp /tmp/chrismed-worker-fixed.json "$N8N:/tmp/chrismed-worker-fixed.json"
          sudo docker exec "$N8N" n8n import:workflow --input=/tmp/chrismed-worker-fixed.json
          sudo docker exec "$N8N" n8n update:workflow --id="$WF_ID" --active=true || true
          sudo docker exec "$N8N" n8n publish:workflow --id="$WF_ID"
          sudo docker restart "$N8N" >/dev/null
          for i in $(seq 1 45); do
            if sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/chrismed-worker.out -w '%{http_code}' --max-time 40 -X POST "$URL" -H 'content-type: application/json' -d '{}')"
            echo "attempt_${i}_http=$code"
            if [ "${code#2}" != "$code" ]; then cat /tmp/chrismed-worker.out; echo; ready=1; break; fi
            cat /tmp/chrismed-worker.out || true; echo
            sleep 3
          done
          test "$ready" -eq 1
          sudo docker exec "$N8N" n8n export:workflow --id="$WF_ID" --output=/tmp/chrismed-final.json >/dev/null
          sudo docker exec "$N8N" node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/chrismed-final.json","utf8"));const w=Array.isArray(r)?r[0]:r;const wh=w.nodes.find(n=>n.type==="n8n-nodes-base.webhook");console.log(JSON.stringify({active:w.active,activeVersionId:w.activeVersionId,webhookId:wh?.webhookId,path:wh?.parameters?.path},null,2));if(!w.active||!w.activeVersionId||wh?.webhookId!=="chrismed-outbox-worker")process.exit(8)'
          echo 'N8N_CHRISMED_OUTBOX_WORKER=PASS'
          REMOTE
