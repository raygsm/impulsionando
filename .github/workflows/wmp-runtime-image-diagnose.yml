name: WMP runtime image diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-runtime-image-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH with bounded retries
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then
              echo "SSH_KEYSCAN=PASS attempt=$i"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo '::error::VPS SSH keyscan unavailable after bounded retries'
          exit 1
      - name: Run candidate image privately and probe
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          IMAGE='sha256:25e81a6183c8f2925331b29ae2a193b8bdac9da8c5ec56e714340e213a4cb3d9'
          sudo docker image inspect "$IMAGE" >/dev/null
          sudo docker rm -f impulsionando-core-candidate-test >/dev/null 2>&1 || true
          cleanup(){ sudo docker rm -f impulsionando-core-candidate-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          sudo docker run -d --name impulsionando-core-candidate-test \
            --env-file /opt/impulsionando/.env.production \
            --env-file /etc/impulsionando-core.env \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -p 127.0.0.1:39000:3000 "$IMAGE" >/dev/null
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:39000/ >/dev/null 2>&1 && break
            [ "$i" -lt 45 ] || { sudo docker logs --tail 120 impulsionando-core-candidate-test; exit 40; }
            sleep 2
          done
          probe(){
            label="$1"; host="$2"; path="$3"; expected="$4"
            code="$(curl -sS -o /tmp/runtime-probe -w '%{http_code}' -H "Host: $host" -H 'Accept: text/html,application/xhtml+xml' "http://127.0.0.1:39000$path" || true)"
            echo "$label HOST=$host PATH=$path HTTP=$code"
            [ "$code" = "$expected" ]
          }
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/auth' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/dashboard' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/seguranca/senha' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/djs' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/empresas' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/orcamento' 200
          probe 'WMP_IMAGE' 'wmp.impulsionando.com.br' '/parceiro' 200
          probe 'APEX_IMAGE' 'impulsionando.com.br' '/auth' 200
          probe 'APEX_IMAGE' 'impulsionando.com.br' '/dashboard' 200
          probe 'APEX_IMAGE' 'impulsionando.com.br' '/seguranca/senha' 200
          echo 'WMP_PRIVATE_RUNTIME=PASS'
          REMOTE
