name: Colors Traefik persistence diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/colors-traefik-persistence-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect Colors Traefik persistence
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          compose=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          test -f "$compose"
          echo '== LIVE_LABELS =='
          sudo docker inspect impulsionando-core --format '{{range $k,$v := .Config.Labels}}{{println $k "=" $v}}{{end}}' | grep -E 'traefik|colorssaude' || true
          echo '== COMPOSE_COLORS_REFERENCES =='
          grep -nE 'colorssaude|traefik.http.routers|impulsionando-core' "$compose" | head -n 120 || true
          echo 'COLORS_TRAEFIK_PERSISTENCE_DIAGNOSE=PASS'
          REMOTE
