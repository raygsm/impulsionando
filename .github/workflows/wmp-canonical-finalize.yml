name: RETIRED - WMP canonical finalize

# Historical workflow kept as a fail-closed tombstone.
# It previously built, promoted and recreated the shared Core while also configuring n8n.
# Core publication and tenant automation must remain separate; Production Front owns publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: WMP combined Core deploy/finalize is disabled."
          echo "Use Production Front for Core publication and a tenant-safe workflow for n8n operations."
          exit 1
