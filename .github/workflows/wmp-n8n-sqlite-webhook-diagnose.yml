name: WMP n8n sqlite webhook diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-sqlite-webhook-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect SQLite webhook registry
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          sudo docker exec "$C" sh -lc 'test -f /home/node/.n8n/database.sqlite'
          sudo docker exec -i "$C" node - <<'NODE'
          const fs=require('fs');
          const dbPath='/home/node/.n8n/database.sqlite';
          let Database;
          try { Database=require('better-sqlite3'); } catch(e) { console.error('BETTER_SQLITE3_MISSING',e.message); process.exit(71); }
          const db=new Database(dbPath,{readonly:true});
          const tables=db.prepare("select name,sql from sqlite_master where type='table' and lower(name) like '%webhook%' order by name").all();
          console.log('WEBHOOK_TABLES='+JSON.stringify(tables));
          for(const t of tables){
            const safe=t.name.replace(/"/g,'""');
            const cols=db.prepare(`pragma table_info("${safe}")`).all();
            console.log('COLUMNS '+t.name+'='+JSON.stringify(cols.map(c=>({name:c.name,type:c.type,pk:c.pk}))));
            const names=new Set(cols.map(c=>c.name));
            const pathCol=['path','webhookPath'].find(x=>names.has(x));
            const wfCol=['workflowId','workflow_id'].find(x=>names.has(x));
            if(pathCol||wfCol){
              const cond=[]; const params=[];
              if(pathCol){cond.push(`"${pathCol}" in (?,?)`);params.push('wmp-dj-booking-lifecycle','wmp-post-event-relationship');}
              if(wfCol){cond.push(`"${wfCol}" in (?,?,?,?)`);params.push('wmpDjBookingLifecycle01','wmpPostEventRelationship01','wmpDjLifecycle01','wmpPostEvent01');}
              const rows=db.prepare(`select * from "${safe}" where ${cond.join(' or ')} order by ${pathCol?`"${pathCol}"`:'rowid'}, ${wfCol?`"${wfCol}"`:'rowid'}`).all(...params);
              console.log('ROWS '+t.name+'='+JSON.stringify(rows));
            }
          }
          db.close();
          NODE
          REMOTE
