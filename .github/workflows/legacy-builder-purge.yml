name: Definitive legacy builder purge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legacy-builder-purge.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: definitive-legacy-builder-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove obsolete builder dependencies
        run: |
          set -euo pipefail
          npm uninstall @lovable.dev/cloud-auth-js @lovable.dev/email-js @lovable.dev/mcp-js @lovable.dev/webhooks-js @lovable.dev/vite-tanstack-config
          rm -f bun.lock
          git rm -f .github/workflows/purge-lovable-debug.yml 2>/dev/null || true
          git rm -f .github/workflows/purge-lovable-dependencies.yml 2>/dev/null || true

      - name: Persist dependency cleanup immediately
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git add package.json package-lock.json
          git add -u
          git commit -m 'chore(core): remove obsolete builder dependencies and legacy locks' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify source has no obsolete runtime imports
        run: |
          set -euo pipefail
          if git grep -n -I '@lovable.dev\|LOVABLE_API_KEY\|ai.gateway.lovable.dev' -- 'src/**' ':!src/routeTree.gen.ts'; then
            echo 'Obsolete runtime reference remains.'
            exit 1
          fi

      - name: Build definitive Core
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs

      - name: Remove one-shot purge workflow after successful build
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/legacy-builder-purge.yml
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git commit -m 'chore(core): retire completed legacy purge workflow'
          git push origin HEAD:main
