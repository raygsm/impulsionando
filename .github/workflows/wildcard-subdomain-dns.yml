name: Wildcard Client Subdomains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wildcard-subdomain-dns.yml
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: wildcard-client-subdomains
  cancel-in-progress: false

jobs:
  reconcile-wildcard:
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve origin and validate credentials
        run: |
          set -euo pipefail
          for value in VPS_HOST CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Reconcile wildcard A record
        run: |
          set -euo pipefail
          wildcard='*.impulsionando.com.br'
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$wildcard&per_page=100" \
            -o /tmp/wildcard.json
          jq -e '.success == true' /tmp/wildcard.json >/dev/null
          current_id="$(jq -r --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip and .proxied==true) | .id' /tmp/wildcard.json | head -n1)"
          if [ -z "$current_id" ]; then
            jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/wildcard.json | while read -r id; do
              [ -n "$id" ] && curl --fail --silent --show-error -X DELETE \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
            done
            jq -nc --arg name "$wildcard" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/new.json
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data @/tmp/new.json \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" \
              -o /tmp/created.json
            jq -e '.success == true' /tmp/created.json >/dev/null
            echo "WILDCARD_DNS=CREATED IP=$ORIGIN_IP"
          else
            echo "WILDCARD_DNS=OK IP=$ORIGIN_IP"
          fi

      - name: Validate CSI resolves through wildcard or explicit record
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if getent ahostsv4 csi.impulsionando.com.br >/tmp/csi-dns 2>/dev/null && test -s /tmp/csi-dns; then
              echo 'CSI_DNS=PASS'
              exit 0
            fi
            sleep 5
          done
          echo '::error::CSI DNS still unresolved'
          exit 70
