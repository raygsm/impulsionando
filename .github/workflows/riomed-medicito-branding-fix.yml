name: RioMed Medicito branding fix

on:
  push:
    paths:
      - '.github/workflows/riomed-medicito-branding-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riomed-medicito-branding-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind Medicito to RioMed and publish official logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/routes/__root.tsx')
          text = root.read_text()
          imp = 'import { ImpulsionitoConcierge } from "@/components/marketing/ImpulsionitoConcierge";'
          med = 'import { MedicitoConcierge } from "@/components/riomed/MedicitoConcierge";'
          if med not in text:
              text = text.replace(imp, imp + '\n' + med)
          marker = '  const isChrismedRoute =\n'
          if 'const isRiomedRoute =' not in text:
              insertion = '  const isRiomedRoute =\n    pathname.startsWith("/riomed") ||\n    (typeof window !== "undefined" && window.location.hostname.toLowerCase().startsWith("riomed."));\n'
              text = text.replace(marker, insertion + marker)
          text = text.replace('{!isChrismedRoute && <ImpulsionitoConcierge />}', '{!isChrismedRoute && !isRiomedRoute && <ImpulsionitoConcierge />}\n      {isRiomedRoute && <MedicitoConcierge />}')
          root.write_text(text)

          route = Path('src/routes/riomed.tsx')
          text = route.read_text()
          old = '            {s?.logo_url ? (\n              <img src={s.logo_url} alt={s?.brand_name ?? "Rio Med"} className="h-10" />\n            ) : (\n              <span className="text-2xl font-extrabold tracking-tight text-[color:var(--riomed-primary)]">\n                {s?.brand_name ?? "Rio Med"}\n              </span>\n            )}'
          new = '            <img\n              src="/__l5e/assets-v1/4066b94d-f9a6-431a-81f4-82a420c64bc3/riomed-logo.png"\n              alt="RIO MED — Equipos & Insumos Médicos"\n              className="h-11 w-auto object-contain"\n            />'
          if old in text:
              text = text.replace(old, new)
          route.write_text(text)
          PY

          git config user.name "Impulsionando Automation"
          git config user.email "automation@impulsionando.com.br"
          git add src/routes/__root.tsx src/routes/riomed.tsx
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix(riomed): publish Medicito and official RioMed branding"
          git push origin HEAD:main
