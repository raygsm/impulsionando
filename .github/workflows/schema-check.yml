name: Schema & Migrations Check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/audit-schema.ts"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  validate-migrations:
    name: Validar naming e sintaxe das migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar naming YYYYMMDDHHMMSS_description.sql
        run: |
          set -e
          shopt -s nullglob
          invalid=0
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{14}_[a-z0-9_-]+\.sql$ ]]; then
              echo "❌ Migration com naming inválido: $base"
              echo "   Formato esperado: YYYYMMDDHHMMSS_snake_case.sql"
              invalid=$((invalid+1))
            fi
          done
          if [ $invalid -gt 0 ]; then
            echo ""
            echo "🚫 $invalid migration(s) com naming inválido."
            exit 1
          fi
          echo "✅ Todas as migrations seguem o naming correto."

      - name: Instalar Postgres para dry-run
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Subir Postgres efêmero
        run: |
          docker run -d --name pg-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            supabase/postgres:15.8.1.085
          for attempt in {1..30}; do
            if PGPASSWORD="test" psql -h localhost -U postgres -d test -c "SELECT 1" &>/dev/null; then
              echo "✅ Postgres pronto"
              break
            fi
            echo "Waiting for Postgres (${attempt}/30)..."
            sleep 1
          done

      - name: Aplicar migrations em ordem (dry-run)
        env:
          PGPASSWORD: test
        run: |
          set -e
          # Minimal Supabase-owned objects required to validate project SQL on
          # a disposable upstream PostgreSQL container. Project migrations must
          # never create or own these objects.
          psql -h localhost -U postgres -d test -v ON_ERROR_STOP=1 <<'SQL'
          DO $bootstrap$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $bootstrap$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE AS 'SELECT NULL::uuid';
          DO $bootstrap$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname='supabase_realtime') THEN
              CREATE PUBLICATION supabase_realtime;
            END IF;
          END $bootstrap$;
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.objects (
            id uuid PRIMARY KEY,
            bucket_id text,
            name text,
            owner uuid,
            metadata jsonb
          );
          CREATE OR REPLACE FUNCTION storage.foldername(text) RETURNS text[]
          LANGUAGE sql IMMUTABLE AS 'SELECT (string_to_array($1, ''/''))[1:greatest(array_length(string_to_array($1, ''/''), 1)-1, 0)]';
          SQL
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | while IFS= read -r -d '' f; do
            echo "▶️  Aplicando $(basename "$f")..."
            if ! psql -h localhost -U postgres -d test -v ON_ERROR_STOP=1 -f "$f" &>/tmp/migration.log; then
              echo "❌ Falha ao aplicar $(basename "$f"):"
              cat /tmp/migration.log
              exit 1
            fi
          done
          echo "✅ Todas as migrations aplicaram limpo em Postgres virgem."

      - name: Verificar GRANT em toda tabela public criada
        env:
          PGPASSWORD: test
        run: |
          set -e
          missing=$(psql -h localhost -U postgres -d test -tAc "
            SELECT c.relname
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public' AND c.relkind = 'r'
              AND NOT EXISTS (
                SELECT 1 FROM information_schema.role_table_grants g
                WHERE g.table_schema = 'public'
                  AND g.table_name = c.relname
                  AND g.grantee IN ('authenticated','anon','service_role')
              )
          ")
          if [ -n "$missing" ]; then
            echo "❌ Tabelas em public sem GRANT para authenticated/anon/service_role:"
            echo "$missing"
            echo ""
            echo "Toda CREATE TABLE em public exige GRANT no mesmo arquivo."
            exit 1
          fi
          echo "✅ Todas as tabelas public têm GRANT configurado."
