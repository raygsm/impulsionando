name: Schema & Migrations Check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/schema-check.yml"
      - ".github/workflows/schema-replay-pr.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/schema-check.yml"
      - ".github/workflows/schema-replay-pr.yml"
  workflow_dispatch:

concurrency:
  group: schema-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-integrity:
    name: Core migration integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate migration naming and report historical timestamp collisions
        run: |
          set -euo pipefail
          shopt -s nullglob
          invalid=0
          declare -A seen
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{14}_[A-Za-z0-9_-]+\.sql$ ]]; then
              echo "::error file=$f::Invalid migration filename. Expected YYYYMMDDHHMMSS_description.sql"
              invalid=$((invalid+1))
            fi
            ts=${base%%_*}
            if [[ -n "${seen[$ts]:-}" ]]; then
              echo "::warning file=$f::Historical duplicate migration timestamp $ts also used by ${seen[$ts]}. Do not rename already-applied migrations; use a unique timestamp for all new migrations."
            else
              seen[$ts]=$f
            fi
          done
          test "$invalid" = "0"

      - name: Validate SQL files are non-empty and conflict-free
        run: |
          set -euo pipefail
          failures=0
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Empty migration"
              failures=$((failures+1))
            fi
            if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$f"; then
              echo "::error file=$f::Unresolved merge conflict marker"
              failures=$((failures+1))
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0)
          test "$failures" = "0"

      - name: Verify latest Core hardening migrations are present
        run: |
          set -euo pipefail
          required=(
            supabase/migrations/20260821014700_fix_core_module_update_notification_email_source.sql
            supabase/migrations/20260821015400_grant_service_role_core_operational_reads.sql
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "::error::Missing required Core migration: $f"; exit 1; }
          done

      - name: Replay ownership
        run: |
          echo "Full SQL execution is validated by the separate Full Schema Replay PR gate."
          echo "This workflow is intentionally ecosystem-only."
