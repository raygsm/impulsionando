name: Colors n8n HTTP forward diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/colors-n8n-http-forward-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Measure n8n HTTP Request transport after receiver readiness
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          cat >/tmp/colorsForwardReceiver01.json <<'JSON'
          {
            "id":"colorsForwardReceiver01","name":"Colors Forward Receiver","active":false,
            "nodes":[
              {"parameters":{"httpMethod":"POST","path":"colors-forward-receiver","responseMode":"responseNode","options":{}},"id":"recv-hook","name":"Receiver Webhook","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0],"webhookId":"colors-forward-receiver-v2"},
              {"parameters":{"respondWith":"json","responseBody":"={{ { bodyString: JSON.stringify($json.body), signatureValue: ($json.headers?.['x-impulsionando-signature'] || ''), contentType: ($json.headers?.['content-type'] || '') } }}","options":{"responseCode":200}},"id":"recv-response","name":"Receiver Response","type":"n8n-nodes-base.respondToWebhook","typeVersion":1.4,"position":[300,0]}
            ],
            "connections":{"Receiver Webhook":{"main":[[{"node":"Receiver Response","type":"main","index":0}]]}},"settings":{"executionOrder":"v1"}
          }
          JSON
          cat >/tmp/colorsForwardSender01.json <<'JSON'
          {
            "id":"colorsForwardSender01","name":"Colors Forward Sender","active":false,
            "nodes":[
              {"parameters":{"httpMethod":"POST","path":"colors-forward-sender","responseMode":"responseNode","options":{}},"id":"send-hook","name":"Sender Webhook","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0],"webhookId":"colors-forward-sender-v2"},
              {"parameters":{"method":"POST","url":"https://n8n.impulsionando.com.br/webhook/colors-forward-receiver","sendHeaders":true,"headerParameters":{"parameters":[{"name":"x-impulsionando-signature","value":"={{ $json.headers?.['x-impulsionando-signature'] || '' }}"}]},"sendBody":true,"contentType":"raw","rawContentType":"application/json","body":"={{ JSON.stringify($json.body) }}","options":{"response":{"response":{"fullResponse":true,"neverError":true,"responseFormat":"json"}},"timeout":15000}},"id":"send-http","name":"Forward Exactly Like Colors","type":"n8n-nodes-base.httpRequest","typeVersion":4.2,"position":[300,0]},
              {"parameters":{"respondWith":"json","responseBody":"={{ $json }}","options":{"responseCode":200}},"id":"send-response","name":"Sender Response","type":"n8n-nodes-base.respondToWebhook","typeVersion":1.4,"position":[600,0]}
            ],
            "connections":{"Sender Webhook":{"main":[[{"node":"Forward Exactly Like Colors","type":"main","index":0}]]},"Forward Exactly Like Colors":{"main":[[{"node":"Sender Response","type":"main","index":0}]]}},"settings":{"executionOrder":"v1"}
          }
          JSON
          for f in colorsForwardReceiver01 colorsForwardSender01; do
            sudo docker cp "/tmp/${f}.json" "$C:/tmp/${f}.json"
            sudo docker exec "$C" n8n import:workflow --input="/tmp/${f}.json" >/dev/null
            sudo docker exec "$C" n8n publish:workflow --id="$f" >/dev/null
            sudo docker exec "$C" n8n update:workflow --id="$f" --active=true >/dev/null
          done
          sudo docker restart "$C" >/dev/null
          for i in $(seq 1 45); do
            sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1 && break
            [ "$i" -lt 45 ] || exit 70
            sleep 2
          done
          probe='{"probe":"receiver-ready"}'
          for i in $(seq 1 15); do
            ready="$(curl -sS -o /tmp/colors-receiver-ready.out -w '%{http_code}' --max-time 15 -X POST 'https://n8n.impulsionando.com.br/webhook/colors-forward-receiver' -H 'content-type: application/json' --data-binary "$probe" || true)"
            [ "$ready" = 200 ] && break
            sleep 3
          done
          echo "COLORS_FORWARD_RECEIVER_READY_HTTP=$ready"
          [ "$ready" = 200 ] || exit 71

          payload='{"workflow_name":"colors-saude.affiliate.relationship","event_code":"AFFILIATE_ATTRIBUTED","tenant_slug":"colors-saude","correlation_id":"colors-forward-test","company_id":null,"dispatched_at":"2026-08-17T00:00:00.000Z","data":{"probe":true}}'
          secret="$(sudo docker inspect impulsionando-core --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' | head -n1)"
          signature="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
          original_hash="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          code=000
          for i in $(seq 1 15); do
            code="$(curl -sS -o /tmp/colors-forward.out -w '%{http_code}' --max-time 25 -X POST 'https://n8n.impulsionando.com.br/webhook/colors-forward-sender' -H 'content-type: application/json' -H "x-impulsionando-signature: $signature" --data-binary "$payload" || true)"
            [ "$code" = 200 ] && break
            sleep 3
          done
          echo "COLORS_FORWARD_SENDER_HTTP=$code"
          [ "$code" = 200 ] || exit 72
          status="$(jq -r '.statusCode // .status // 0' /tmp/colors-forward.out)"
          echo "COLORS_FORWARD_INNER_HTTP=$status"
          body_json="$(jq -c '.body // {}' /tmp/colors-forward.out)"
          forwarded="$(jq -r '.body.bodyString // empty' /tmp/colors-forward.out)"
          received_signature="$(jq -r '.body.signatureValue // empty' /tmp/colors-forward.out)"
          content_type="$(jq -r '.body.contentType // empty' /tmp/colors-forward.out)"
          forwarded_hash="$(printf '%s' "$forwarded" | sha256sum | awk '{print $1}')"
          echo "COLORS_HTTP_FORWARD_BODY_MATCH=$([ "$original_hash" = "$forwarded_hash" ] && echo yes || echo no)"
          echo "COLORS_HTTP_FORWARD_SIGNATURE_MATCH=$([ "$signature" = "$received_signature" ] && echo yes || echo no)"
          echo "COLORS_HTTP_FORWARD_BODY_LENGTH=${#forwarded}"
          echo "COLORS_HTTP_FORWARD_CONTENT_TYPE=$content_type"
          [ "$status" = 200 ] || { echo "COLORS_FORWARD_BODY_SHAPE=$body_json"; exit 73; }
          echo 'COLORS_N8N_HTTP_FORWARD_DIAGNOSE=PASS'
          REMOTE
