name: Colors HMAC payload diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/colors-hmac-payload-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Prove direct Colors Core signature and n8n forwarding
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret="$(sudo docker inspect impulsionando-core --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' | head -n1)"
          test -n "$secret"
          ts="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          payload="{\"workflow_name\":\"colors-saude.affiliate.relationship\",\"event_code\":\"AFFILIATE_ATTRIBUTED\",\"tenant_slug\":\"colors-saude\",\"correlation_id\":\"colors-hmac-diag-$(date +%s)\",\"company_id\":null,\"dispatched_at\":\"$ts\",\"data\":{\"probe\":true}}"
          sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
          direct="$(curl -sS -o /tmp/colors-direct -w '%{http_code}' --max-time 20 -X POST 'https://colorssaude.impulsionando.com.br/api/public/hooks/n8n-verify' -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" --data-binary "$payload")"
          echo "COLORS_DIRECT_CORE_HTTP=$direct"
          [ "$direct" = 200 ] || { head -c 300 /tmp/colors-direct; exit 70; }
          via="$(curl -sS -o /tmp/colors-via -w '%{http_code}' --max-time 20 -X POST 'https://n8n.impulsionando.com.br/webhook/colors-affiliate-relationship' -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" --data-binary "$payload")"
          echo "COLORS_VIA_N8N_HTTP=$via"
          head -c 300 /tmp/colors-via || true
          echo
          [ "$via" = 200 ] || exit 71
          grep -q '"ok":true' /tmp/colors-via || exit 72
          echo 'COLORS_HMAC_PAYLOAD_DIAGNOSE=PASS'
          REMOTE
