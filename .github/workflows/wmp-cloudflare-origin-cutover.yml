name: WMP Cloudflare origin cutover

on:
  push:
    paths:
      - .github/workflows/wmp-cloudflare-origin-cutover.yml

permissions:
  contents: read

concurrency:
  group: wmp-origin-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: wmp.impulsionando.com.br
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Validate production configuration
        run: |
          set -euo pipefail
          for value in DEPLOY_HOST VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing required secret: $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          [[ "$CF_ZONE_ID" =~ ^[[:xdigit:]]{32}$ ]] || { echo '::error::Invalid Cloudflare Zone ID'; exit 1; }
          printf 'CF_ZONE_ID=%s\n' "$CF_ZONE_ID" >> "$GITHUB_ENV"
          ORIGIN_IP="$(getent ahostsv4 "$DEPLOY_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP" || { echo '::error::Could not resolve DEPLOY_HOST'; exit 1; }
          printf 'ORIGIN_IP=%s\n' "$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Verify Cloudflare access and back up WMP DNS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" -o /tmp/cf-token.json
          jq -e '.success == true' /tmp/cf-token.json >/dev/null
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" \
            -o /tmp/wmp-dns-before.json
          jq -e '.success == true' /tmp/wmp-dns-before.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length' /tmp/wmp-dns-before.json)"
          echo "WMP_ROUTING_RECORD_COUNT=$count"
          [ "$count" -gt 0 ] || { echo '::error::No WMP routing DNS record found'; exit 2; }
          if jq -e --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip)' /tmp/wmp-dns-before.json >/dev/null; then
            echo 'WMP_CLOUDFLARE_ORIGIN_ALREADY_TARGETS_DEPLOY_HOST=yes'
          else
            echo 'WMP_CLOUDFLARE_ORIGIN_ALREADY_TARGETS_DEPLOY_HOST=no'
          fi

      - name: Configure SSH with retries
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then
              echo "SSH_KEYSCAN=PASS attempt=$i"
              exit 0
            fi
            sleep $((i * 3))
          done
          echo '::error::VPS unavailable for cutover'
          exit 3

      - name: Promote validated Core image at Traefik edge
        id: edge
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          VALIDATED='sha256:25e81a6183c8f2925331b29ae2a193b8bdac9da8c5ec56e714340e213a4cb3d9'
          COMPOSE='/opt/impulsionando/deploy/hostinger/docker-compose.yml'
          SECURITY_ENV='/etc/impulsionando-security.env'
          CORE_ENV='/etc/impulsionando-core.env'
          sudo docker image inspect "$VALIDATED" >/dev/null
          old="$(sudo docker inspect -f '{{.Image}}' impulsionando-core)"
          echo "$old" | sudo tee /tmp/wmp-edge-old-image >/dev/null
          sudo docker tag "$old" impulsionando-core:wmp-cutover-rollback

          if sudo test -f "$SECURITY_ENV" && sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' "$SECURITY_ENV"; then
            secret="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$SECURITY_ENV" | head -n1)"
            tmp="$(mktemp)"
            sudo awk '!/^IMPULSIONANDO_WEBHOOK_SECRET=/' "$CORE_ENV" > "$tmp"
            printf 'IMPULSIONANDO_WEBHOOK_SECRET=%s\n' "$secret" >> "$tmp"
            sudo install -o root -g root -m 0600 "$tmp" "$CORE_ENV"
            rm -f "$tmp"
            unset secret
          fi
          sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' "$CORE_ENV"

          sudo docker tag "$VALIDATED" impulsionando-core:latest
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core
          for i in $(seq 1 45); do
            if sudo docker exec impulsionando-core node -e "fetch('http://127.0.0.1:3000/auth',{headers:{host:'wmp.impulsionando.com.br',accept:'text/html,application/xhtml+xml'}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            [ "$i" -lt 45 ] || { sudo docker logs --tail 100 impulsionando-core; exit 31; }
            sleep 2
          done
          for path in / /auth /dashboard /seguranca/senha /djs /empresas /orcamento /parceiro; do
            code="$(sudo docker exec impulsionando-core node -e "fetch('http://127.0.0.1:3000${path}',{headers:{host:'wmp.impulsionando.com.br',accept:'text/html,application/xhtml+xml'}}).then(async r=>{console.log(r.status)}).catch(()=>{console.log(0)})")"
            echo "EDGE_INTERNAL ${path} HTTP=${code}"
            [ "$code" = '200' ] || exit 32
          done
          echo 'WMP_EDGE_INTERNAL=PASS'
          REMOTE

      - name: Point only WMP Cloudflare record to validated origin
        id: dns
        run: |
          set -euo pipefail
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/wmp-dns-before.json | while read -r id; do
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
          done
          jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" \
            '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/wmp-dns-new.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/wmp-dns-new.json \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/wmp-dns-created.json
          jq -e '.success == true' /tmp/wmp-dns-created.json >/dev/null
          echo 'WMP_DNS_CUTOVER=APPLIED'

      - name: Purge WMP Cloudflare cache
        run: |
          set -euo pipefail
          jq -nc --arg p1 "https://$DOMAIN/" --arg p2 "https://$DOMAIN/auth" --arg p3 "https://$DOMAIN/dashboard" \
            '{files:[$p1,$p2,$p3]}' >/tmp/wmp-purge.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/wmp-purge.json \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -o /tmp/wmp-purge-result.json
          jq -e '.success == true' /tmp/wmp-purge-result.json >/dev/null

      - name: Verify WMP publicly and roll back DNS and edge on failure
        id: verify
        run: |
          set -euo pipefail
          ok=1
          for path in / /auth /dashboard /seguranca/senha /djs /empresas /orcamento /parceiro; do
            code='000'
            for attempt in $(seq 1 10); do
              code="$(curl -sS -L -H 'Accept: text/html,application/xhtml+xml' -o /tmp/wmp-public -w '%{http_code}' --max-time 20 "https://$DOMAIN$path" || true)"
              [ "$code" = '200' ] && break
              sleep 5
            done
            echo "PUBLIC_WMP ${path} HTTP=${code}"
            [ "$code" = '200' ] || ok=0
          done
          if [ "$ok" = '1' ]; then
            echo 'WMP_PUBLIC_CUTOVER=PASS'
            exit 0
          fi

          echo '::error::WMP public verification failed. Restoring DNS and edge.'
          new_id="$(jq -r '.result.id' /tmp/wmp-dns-created.json)"
          curl --fail --silent --show-error -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$new_id" >/dev/null || true
          jq -c '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | del(.id,.zone_id,.zone_name,.created_on,.modified_on,.meta,.proxiable,.locked,.comment_modified_on,.tags_modified_on)' /tmp/wmp-dns-before.json | while read -r payload; do
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              --data "$payload" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" >/dev/null || true
          done
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo docker tag impulsionando-core:wmp-cutover-rollback impulsionando-core:latest
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f docker-compose.yml up -d --no-build --force-recreate impulsionando-core
          REMOTE
          exit 40

      - name: Upload DNS backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmp-dns-backup-${{ github.run_id }}
          path: /tmp/wmp-dns-before.json
          retention-days: 30
