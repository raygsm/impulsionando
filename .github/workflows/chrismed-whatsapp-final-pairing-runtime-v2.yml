name: CHRISMED WhatsApp final pairing runtime v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-whatsapp-final-pairing-runtime-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrismed-whatsapp-final-pairing-runtime
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Initialize
        run: printf 'workflow=CHRISMED WhatsApp final pairing runtime v2\nsha=%s\n' "$GITHUB_SHA" > /tmp/proof.txt
      - name: SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Prepare secure runtime and provider
        shell: bash
        run: |
          set -o pipefail
          set +e
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' 2>&1 | tee /tmp/remote.txt
          set -Eeuo pipefail
          ENV_FILE=/etc/impulsionando-core.env
          CORE=impulsionando-core
          EVO=impulsionando-evolution-api
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          INSTANCE=chrismed-oliver
          sudo test -f "$ENV_FILE"; sudo test -f "$COMPOSE"
          sudo docker inspect "$CORE" >/dev/null; sudo docker inspect "$EVO" >/dev/null
          EVO_KEY="$(sudo docker inspect "$EVO" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^AUTHENTICATION_API_KEY=//p' | head -n1)"
          test -n "$EVO_KEY"
          WEBHOOK_SECRET="$(sudo sed -n 's/^CHRISMED_EVOLUTION_WEBHOOK_SECRET=//p' "$ENV_FILE" | tail -n1)"
          [ -n "$WEBHOOK_SECRET" ] || WEBHOOK_SECRET="$(openssl rand -hex 32)"
          network="$(sudo docker inspect "$CORE" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | head -n1)"
          test -n "$network"
          if ! sudo docker inspect "$EVO" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | grep -Fxq "$network"; then sudo docker network connect "$network" "$EVO"; fi
          set_env(){ key="$1"; value="$2"; tmp="$(mktemp)"; sudo awk -F= -v k="$key" '$1!=k{print}' "$ENV_FILE" > "$tmp"; printf '%s=%s\n' "$key" "$value" >> "$tmp"; sudo install -o root -g root -m 0600 "$tmp" "$ENV_FILE"; rm -f "$tmp"; }
          set_env CHRISMED_EVOLUTION_BASE_URL 'http://impulsionando-evolution-api:8080'
          set_env CHRISMED_EVOLUTION_API_KEY "$EVO_KEY"
          set_env CHRISMED_EVOLUTION_WEBHOOK_SECRET "$WEBHOOK_SECRET"
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate "$CORE" >/dev/null
          ready=0
          for i in $(seq 1 50); do
            if sudo docker exec "$CORE" node -e "fetch('http://127.0.0.1:3000/api/public/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(2))" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          sudo docker exec -e INSTANCE="$INSTANCE" -i "$CORE" node - <<'NODE'
const base=(process.env.CHRISMED_EVOLUTION_BASE_URL||'').replace(/\/$/,'');
const key=process.env.CHRISMED_EVOLUTION_API_KEY||'';
const secret=process.env.CHRISMED_EVOLUTION_WEBHOOK_SECRET||'';
const instance=process.env.INSTANCE;
if(!base||!key||!secret) process.exit(20);
const headers={apikey:key,'content-type':'application/json'};
let state=await fetch(`${base}/instance/connectionState/${instance}`,{headers});
if(state.status===404){const c=await fetch(`${base}/instance/create`,{method:'POST',headers,body:JSON.stringify({instanceName:instance,qrcode:true,integration:'WHATSAPP-BAILEYS'})});if(!c.ok&&c.status!==409){console.error(`create=${c.status}`);process.exit(21)}}
const connect=await fetch(`${base}/instance/connect/${instance}`,{headers});
if(!connect.ok){console.error(`connect=${connect.status}`);process.exit(22)}
let p={};try{p=await connect.json()}catch{}
const qr=Boolean(p?.base64||p?.qrcode?.base64||p?.data?.Qrcode||p?.data?.qrcode||p?.pairingCode||p?.qrcode?.pairingCode);
const hook=await fetch(`${base}/webhook/set/${instance}`,{method:'POST',headers,body:JSON.stringify({enabled:true,url:'https://chrismed.impulsionando.com.br/api/communication/whatsapp/chrismed',events:['MESSAGES_UPSERT','CONNECTION_UPDATE','QRCODE_UPDATED'],headers:{'x-chrismed-webhook-secret':secret},base64:true})});
if(!hook.ok){console.error(`webhook=${hook.status}`);process.exit(23)}
state=await fetch(`${base}/instance/connectionState/${instance}`,{headers});let b={};try{b=await state.json()}catch{};const st=b?.instance?.state||b?.state||b?.data?.state||null;const connected=['open','connected','CONNECTED'].includes(String(st));if(!connected&&!qr){console.error('pairing_not_ready');process.exit(24)};console.log(`PAIRING_READY connected=${connected} qr_ready=${qr} state=${st||'unknown'}`)
NODE
          REMOTE
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then echo "FAIL runtime_rc=$rc" >> /tmp/proof.txt; sed -n '1,180p' /tmp/remote.txt >> /tmp/proof.txt; exit "$rc"; fi
          grep 'PAIRING_READY' /tmp/remote.txt | tail -n1 >> /tmp/proof.txt
          echo 'PASS runtime' >> /tmp/proof.txt
      - name: Sync endpoint metadata
        run: |
          set -euo pipefail
          tenant="$(curl -fsS -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/rest/v1/communication_tenants?slug=eq.chrismed&active=eq.true&select=id" | jq -r '.[0].id // empty')"
          test -n "$tenant"
          curl -fsS -X PATCH -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' --data '{"provider":"evolution_api","status":"PENDING_CONNECTION","secret_reference":"CHRISMED_EVOLUTION_API_KEY","webhook_path":"/api/communication/whatsapp/chrismed","last_error":null}' "$SUPABASE_URL/rest/v1/communication_channel_endpoints?tenant_id=eq.$tenant&channel=eq.whatsapp&is_primary=eq.true" >/dev/null
          echo 'PASS endpoint_metadata' >> /tmp/proof.txt
      - name: Persist proof
        if: always()
        run: |
          set -euo pipefail
          printf 'finished_at_utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/proof.txt
          mkdir -p docs/ops
          cp /tmp/proof.txt docs/ops/chrismed-whatsapp-final-pairing-runtime-v2-proof.txt
          git config user.name 'Impulsionito CHRISMED WhatsApp QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/chrismed-whatsapp-final-pairing-runtime-v2-proof.txt
          git commit -m 'chore(chrismed): record WhatsApp final pairing v2 proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
