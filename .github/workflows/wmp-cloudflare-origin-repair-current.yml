name: WMP Cloudflare origin repair current

on:
  push:
    paths:
      - .github/workflows/wmp-cloudflare-origin-repair-current.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: wmp.impulsionando.com.br
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve canonical VPS and backup current WMP record
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID; do test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }; done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          VPS_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$VPS_IP"
          printf 'CF_ZONE_ID=%s\nVPS_IP=%s\n' "$CF_ZONE_ID" "$VPS_IP" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/wmp-dns-before.json
          jq -e '.success == true' /tmp/wmp-dns-before.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A")] | length' /tmp/wmp-dns-before.json)"
          [ "$count" = 1 ] || { echo "::error::Expected exactly one WMP A record, found $count"; exit 2; }
          id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/wmp-dns-before.json)"
          printf 'CF_RECORD_ID=%s\n' "$id" >> "$GITHUB_ENV"

      - name: Verify canonical VPS HMAC before DNS mutation
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          secret="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' /etc/impulsionando-security.env | head -n1)"
          test -n "$secret"
          ts="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          payload="{\"workflow_name\":\"wmpPreCutover\",\"event_code\":\"wmp.pre.cutover\",\"tenant_slug\":\"wmp\",\"correlation_id\":\"pre-$(date +%s)\",\"company_id\":null,\"dispatched_at\":\"$ts\",\"data\":{\"probe\":true}}"
          sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
          code="$(curl -k -sS -o /tmp/pre -w '%{http_code}' --max-time 20 -X POST -H 'Host: wmp.impulsionando.com.br' 'https://127.0.0.1/api/public/hooks/n8n-verify' -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" --data-binary "$payload")"
          echo "LOCAL_TRAEFIK_HMAC HTTP=$code"
          [ "$code" = 200 ]
          grep -q '"ok":true' /tmp/pre
          REMOTE

      - name: Update only WMP Cloudflare A record
        run: |
          set -euo pipefail
          jq -nc --arg type A --arg name "$DOMAIN" --arg content "$VPS_IP" '{type:$type,name:$name,content:$content,ttl:1,proxied:true}' > /tmp/wmp-dns-new.json
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/wmp-dns-new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$CF_RECORD_ID" -o /tmp/wmp-dns-updated.json
          jq -e '.success == true' /tmp/wmp-dns-updated.json >/dev/null
          echo 'WMP_CF_DNS_UPDATE=APPLIED'

      - name: Validate public WMP and canonical HMAC with rollback on failure
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 18); do
            auth_code="$(curl -sS -L -o /tmp/auth -w '%{http_code}' --max-time 20 "https://$DOMAIN/auth" || true)"
            ts="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            payload="{\"workflow_name\":\"wmpCfCutover\",\"event_code\":\"wmp.cf.cutover\",\"tenant_slug\":\"wmp\",\"correlation_id\":\"cf-$attempt-$(date +%s)\",\"company_id\":null,\"dispatched_at\":\"$ts\",\"data\":{\"probe\":true}}"
            secret="$(ssh "$VPS_USER@$VPS_HOST" "sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' /etc/impulsionando-security.env | head -n1")"
            sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
            post_code="$(curl -sS -o /tmp/post -w '%{http_code}' --max-time 20 -X POST "https://$DOMAIN/api/public/hooks/n8n-verify" -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" --data-binary "$payload" || true)"
            echo "PUBLIC_ATTEMPT=$attempt AUTH=$auth_code HMAC=$post_code"
            if [ "$auth_code" = 200 ] && [ "$post_code" = 200 ] && grep -q '"ok":true' /tmp/post; then success=1; break; fi
            sleep 5
          done
          if [ "$success" = 1 ]; then
            echo 'WMP_CLOUDFLARE_CANONICAL_ORIGIN=PASS'
            exit 0
          fi
          echo '::error::WMP public verification failed; restoring previous DNS record'
          old_type="$(jq -r '.result[] | select(.type=="A") | .type' /tmp/wmp-dns-before.json)"
          old_name="$(jq -r '.result[] | select(.type=="A") | .name' /tmp/wmp-dns-before.json)"
          old_content="$(jq -r '.result[] | select(.type=="A") | .content' /tmp/wmp-dns-before.json)"
          old_proxied="$(jq -r '.result[] | select(.type=="A") | .proxied' /tmp/wmp-dns-before.json)"
          jq -nc --arg type "$old_type" --arg name "$old_name" --arg content "$old_content" --argjson proxied "$old_proxied" '{type:$type,name:$name,content:$content,ttl:1,proxied:$proxied}' >/tmp/wmp-dns-rollback.json
          curl --silent --show-error -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/wmp-dns-rollback.json \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$CF_RECORD_ID" >/dev/null || true
          exit 40

      - name: Upload DNS backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmp-dns-backup-current-${{ github.run_id }}
          path: /tmp/wmp-dns-before.json
          retention-days: 30
