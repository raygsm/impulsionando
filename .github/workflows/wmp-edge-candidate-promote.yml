name: RETIRED - WMP edge candidate promote

# Historical workflow kept as a fail-closed tombstone.
# It previously rebuilt and promoted a pinned candidate as the shared Core.
# Production Front is the single frontend/Core publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: WMP edge candidate promotion is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
