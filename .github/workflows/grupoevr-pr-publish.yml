name: Grupo EVR PR publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/grupoevr-pr-publish.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  publish:
    if: github.head_ref == 'ops/grupoevr-publish-pr-run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOMAIN: grupoevr.impulsionando.com.br
      ORIGIN_IP: 187.77.232.52
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Upsert and verify Cloudflare record
        id: publish
        shell: bash
        run: |
          set +e
          result='STARTED'
          detail=''
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            result='FAIL'
            detail='missing Cloudflare repository secrets'
          else
            zone="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
            curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$DOMAIN&per_page=100" -o /tmp/dns.json
            if [ $? -ne 0 ] || ! jq -e '.success == true' /tmp/dns.json >/dev/null 2>&1; then
              result='FAIL'
              detail='Cloudflare lookup failed'
            else
              id="$(jq -r '.result[] | select(.type=="A") | .id' /tmp/dns.json | head -n1)"
              payload="$(jq -nc --arg name "$DOMAIN" --arg ip "$ORIGIN_IP" '{type:"A",name:$name,content:$ip,ttl:1,proxied:true}')"
              if [ -n "$id" ]; then
                curl -fsS -X PUT -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records/$id" -o /tmp/upsert.json
              else
                curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" -o /tmp/upsert.json
              fi
              if [ $? -ne 0 ] || ! jq -e '.success == true' /tmp/upsert.json >/dev/null 2>&1; then
                result='FAIL'
                detail='Cloudflare upsert failed'
              else
                rid="$(jq -r '.result.id // empty' /tmp/upsert.json)"
                rcontent="$(jq -r '.result.content // empty' /tmp/upsert.json)"
                rproxied="$(jq -r '.result.proxied // empty' /tmp/upsert.json)"
                result='DNS_API_OK'
                detail="record_id=$rid content=$rcontent proxied=$rproxied"
                code="$(curl -sS -L -o /tmp/page -w '%{http_code}' --max-time 8 "https://$DOMAIN/" || true)"
                if [ "$code" = 200 ]; then
                  result='HTTPS_OK'
                  detail="$detail http=200"
                else
                  detail="$detail http=$code"
                fi
              fi
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"

      - name: Report result on this PR
        if: always()
        run: gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="GRUPOEVR_PR_PUBLISH: ${{ steps.publish.outputs.result }} — ${{ steps.publish.outputs.detail }}"

      - name: Fail only on Cloudflare API failure
        if: steps.publish.outputs.result == 'FAIL'
        run: exit 1
