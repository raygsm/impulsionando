name: Universal Front Emergency Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/universal-front-emergency-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-front-emergency-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Discover current tenant domains
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_URL/rest/v1/core_tenant_identity?select=subdomain,root_domain&order=subdomain.asc" -o /tmp/tenants.json
          jq -r '.[] | select(.subdomain != null and .root_domain != null and .subdomain != "impulsionando") | (.subdomain + "." + .root_domain)' /tmp/tenants.json | sort -u > /tmp/domains
          test -s /tmp/domains
          echo "TENANT_COUNT=$(wc -l </tmp/domains | tr -d ' ')" >> "$GITHUB_ENV"

      - name: Verify mandatory universal UX baseline
        run: |
          set -euo pipefail
          grep -Fq 'EyeOff' src/components/ui/input.tsx
          grep -Fq 'CANONICAL_RECOVERY_URL' src/integrations/supabase/client.ts
          grep -Fq 'Área do Cliente' src/lib/niche-plans.ts
          grep -Fq 'Portal do Cliente' src/lib/niche-plans.ts
          grep -Fq 'Dashboard' src/lib/niche-plans.ts
          grep -Fq 'O básico não é módulo extra. É plataforma.' src/components/marketing/HomePageLive.tsx
          grep -Fq 'Captar' src/components/marketing/HomePageLive.tsx
          grep -Fq 'Converter' src/components/marketing/HomePageLive.tsx
          grep -Fq 'Operar' src/components/marketing/HomePageLive.tsx
          grep -Fq 'Relacionar' src/components/marketing/HomePageLive.tsx

      - name: Build latest main
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test "$ORIGIN_IP" = '187.77.232.52'
          echo "ORIGIN_IP=$ORIGIN_IP" >> "$GITHUB_ENV"
          echo "CF_ZONE_ID=$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Upload release
        run: |
          set -euo pipefail
          tar -czf /tmp/universal-front-release.tgz .output scripts package.json package-lock.json
          scp /tmp/universal-front-release.tgz "$VPS_USER@$VPS_HOST:/tmp/universal-front-release.tgz"

      - name: Deploy isolated universal front runtime
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release="/var/www/impulsionando-core/releases/universal-front-$RELEASE_SHA"
          base=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          override=/opt/impulsionando/deploy/hostinger/docker-compose.universal-front.yml
          envfile=/etc/impulsionando-core.env
          sudo test -f "$base"
          sudo test -f "$envfile"
          sudo rm -rf "$release"
          sudo mkdir -p "$release"
          sudo tar -xzf /tmp/universal-front-release.tgz -C "$release"
          rm -f /tmp/universal-front-release.tgz
          printf 'node_modules\n' | sudo tee "$release/.dockerignore" >/dev/null
          cat > /tmp/Dockerfile.universal-front <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          sudo docker build -f /tmp/Dockerfile.universal-front -t "impulsionando-core:universal-front-$RELEASE_SHA" "$release"
          sudo docker tag "impulsionando-core:universal-front-$RELEASE_SHA" impulsionando-core:universal-front-current
          cd /opt/impulsionando/deploy/hostinger
          sudo tee "$override" >/dev/null <<'YAML'
          services:
            impulsionando-core-universal-front:
              image: impulsionando-core:universal-front-current
              env_file:
                - /etc/impulsionando-core.env
              restart: unless-stopped
              labels:
                traefik.enable: "true"
                traefik.http.routers.universal-front-apex.entrypoints: websecure
                traefik.http.routers.universal-front-apex.rule: (Host(`impulsionando.com.br`) || Host(`www.impulsionando.com.br`)) && !PathPrefix(`/api`)
                traefik.http.routers.universal-front-apex.service: impulsionando-core-universal-front
                traefik.http.routers.universal-front-apex.tls: "true"
                traefik.http.routers.universal-front-apex.tls.certresolver: letsencrypt
                traefik.http.routers.universal-front-apex.priority: "3000"
                traefik.http.routers.universal-front-tenants.entrypoints: websecure
                traefik.http.routers.universal-front-tenants.rule: HostRegexp(`{subdomain:[a-z0-9-]+}.impulsionando.com.br`) && !PathPrefix(`/api`)
                traefik.http.routers.universal-front-tenants.service: impulsionando-core-universal-front
                traefik.http.routers.universal-front-tenants.tls: "true"
                traefik.http.routers.universal-front-tenants.tls.certresolver: letsencrypt
                traefik.http.routers.universal-front-tenants.priority: "2900"
                traefik.http.services.impulsionando-core-universal-front.loadbalancer.server.port: "3000"
          YAML
          sudo docker compose -f "$base" -f "$override" config -q
          sudo docker compose -f "$base" -f "$override" up -d --no-build --force-recreate impulsionando-core-universal-front
          for i in $(seq 1 60); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core-universal-front 2>/dev/null || true)"
            code=000
            if [ -n "$ip" ]; then code="$(curl -sS -H 'Host: impulsionando.com.br' -o /tmp/origin-home -w '%{http_code}' --max-time 10 "http://$ip:3000/" || true)"; fi
            [ "$code" = 200 ] && break
            [ "$i" -lt 60 ] || { sudo docker logs --tail 200 impulsionando-core-universal-front || true; exit 60; }
            sleep 2
          done
          echo "UNIVERSAL_FRONT_ORIGIN=PASS HTTP=$code"
          REMOTE

      - name: Reconcile tenant DNS
        run: |
          set -euo pipefail
          while read -r domain; do
            curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$domain&per_page=100" -o /tmp/dns.json
            jq -e '.success == true' /tmp/dns.json >/dev/null
            good="$(jq -r --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip and .proxied==true) | .id' /tmp/dns.json | head -n1)"
            if [ -z "$good" ]; then
              jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/dns.json | while read -r id; do [ -n "$id" ] && curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null; done
              jq -nc --arg name "$domain" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/new.json
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/created.json
              jq -e '.success == true' /tmp/created.json >/dev/null
            fi
          done < /tmp/domains

      - name: Public validation and proof
        id: validate
        shell: bash
        run: |
          set -uo pipefail
          proof=/tmp/universal-front-emergency-proof.txt
          : > "$proof"
          printf 'generated_at_utc=%s\nsha=%s\ntenant_count=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$TENANT_COUNT" >> "$proof"
          failed=0
          validate_domain() {
            domain="$1"
            for attempt in $(seq 1 24); do
              read -r code final < <(curl -sS -L -H 'Cache-Control: no-cache' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/public-home -w '%{http_code} %{url_effective}' --max-time 25 "https://$domain/?release=$GITHUB_SHA" || echo '000 -')
              final_host="$(printf '%s' "$final" | sed -E 's#^[a-zA-Z]+://([^/:]+).*#\1#')"
              if [ "$code" = 200 ] && [ "$final_host" = "$domain" ]; then echo "PUBLIC_PASS $domain HTTP=200" | tee -a "$proof"; return 0; fi
              sleep 4
            done
            echo "PUBLIC_FAIL $domain HTTP=${code:-000} FINAL=${final:--}" | tee -a "$proof"
            return 1
          }
          validate_domain impulsionando.com.br || failed=1
          while read -r domain; do validate_domain "$domain" || failed=1; done < /tmp/domains
          if [ "$failed" = 0 ]; then echo "UNIVERSAL_FRONT_RELEASE=PASS" | tee -a "$proof"; else echo "UNIVERSAL_FRONT_RELEASE=PARTIAL" | tee -a "$proof"; fi
          exit "$failed"

      - name: Persist release proof
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          cp /tmp/universal-front-emergency-proof.txt docs/ops/universal-front-emergency-proof.txt || printf 'proof_unavailable\n' > docs/ops/universal-front-emergency-proof.txt
          git config user.name 'Impulsionito Emergency Release QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/universal-front-emergency-proof.txt
          git commit -m 'chore(front): record universal emergency release proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
