name: Temporary final branch cleanup

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/tmp-final-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-n8n-centralization-20260813
      - name: Remove stale patient copy and temporary workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/chrismed/ChrismedOliverPanel.tsx')
          s = p.read_text()
          replacements = {
            '// sábado 09-13h. Ajuste pelo Codex quando integração de agenda entrar.': '// sábado 09-13h. A disponibilidade real deve ser mantida pela configuração operacional.',
            "{ label: 'Meus agendamentos', hint: 'Área do paciente — pendente Codex', icon: ClipboardList, info: 'A área do paciente com histórico de agendamentos e pagamentos está em preparação (Pendente Codex). Assim que liberada, você acessa por aqui.' },": "{ label: 'Meus agendamentos', hint: 'Área do paciente', icon: ClipboardList, to: '/chrismed/minha-conta' },",
            "{ label: 'Pagamento', hint: 'PIX no fluxo de agendamento', icon: CreditCard, info: 'O pagamento acontece dentro do fluxo de agendamento, após você escolher horário e confirmar seus dados. Aceitamos PIX via Mercado Pago; cartão e parcelamento serão liberados em breve pela integração Codex.' },": "{ label: 'Pagamento', hint: 'No fluxo de agendamento', icon: CreditCard, info: 'O pagamento acontece dentro do fluxo oficial de agendamento, após a escolha do horário e a confirmação dos dados. As formas disponíveis são apresentadas pelo próprio checkout.' },",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print -delete
          git diff --check
          git diff -- src/components/chrismed/ChrismedOliverPanel.tsx .github/workflows
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "chore: remove temporary workflows and stale Codex copy"
          git push origin HEAD:agent/core-n8n-centralization-20260813
