name: WMP diagnose canonical Core HMAC v2

on:
  push:
    paths:
      - .github/workflows/wmp-hmac-core-diagnose-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for attempt in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep 3
          done
          exit 41
      - name: Inspect live Docker topology
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== RUNNING CONTAINERS ==='
          sudo docker ps --format 'NAME={{.Names}} IMAGE={{.Image}} PORTS={{.Ports}}'
          echo '=== ALL CORE-LIKE CONTAINERS ==='
          sudo docker ps -a --format 'ID={{.ID}} NAME={{.Names}} IMAGE={{.Image}} STATUS={{.Status}}' | grep -Ei 'core|impulsionando' || true
          echo '=== COMPOSE SERVICES ==='
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f docker-compose.yml ps -a || true
          echo '=== CORE SERVICE CONFIG (SECRET VALUES REDACTED) ==='
          sudo awk '
            /^  impulsionando-core:/ {show=1}
            show && /^  [a-zA-Z0-9_-]+:/ && $1 != "impulsionando-core:" && NR>1 {exit}
            show {gsub(/(SECRET|KEY|TOKEN|PASSWORD):.*/,"\\1: [REDACTED]"); print}
          ' docker-compose.yml || true
          echo '=== SYSTEMD ==='
          sudo systemctl is-active impulsionando-core || true
          sudo systemctl status impulsionando-core --no-pager -n 5 || true
          REMOTE
