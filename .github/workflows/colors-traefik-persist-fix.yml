name: Colors Traefik persist fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/colors-traefik-persist-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in 1 2 3; do ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts && break || sleep 2; done
          test -s ~/.ssh/known_hosts

      - name: Persist and validate Colors Traefik router
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          compose=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          work=/tmp/colors-compose-before.yml
          domain='colorssaude.impulsionando.com.br'
          cp "$compose" "$work"

          rollback() {
            echo 'COLORS_TRAEFIK_PERSIST_ROLLBACK=START'
            sudo cp "$work" "$compose"
            cd /opt/impulsionando/deploy/hostinger
            sudo docker compose -f "$compose" config -q || true
            sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core || true
          }
          trap 'rollback' ERR

          python3 - "$compose" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          labels = [
              '      - traefik.http.routers.colorssaude.rule=Host(`colorssaude.impulsionando.com.br`)',
              '      - traefik.http.routers.colorssaude.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}',
              '      - traefik.http.routers.colorssaude.tls=true',
              '      - traefik.http.routers.colorssaude.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}',
              '      - traefik.http.routers.colorssaude.service=impulsionando-core',
              '      - traefik.http.routers.colorssaude.priority=200',
          ]
          if all(label in s for label in labels):
              raise SystemExit(0)
          anchor = '      - traefik.http.services.impulsionando-core.loadbalancer.server.port=3000\n'
          if anchor not in s:
              raise SystemExit('compose anchor not found')
          missing = [x for x in labels if x not in s]
          s = s.replace(anchor, anchor + ''.join(x + '\n' for x in missing), 1)
          p.write_text(s)
          PY

          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$compose" config -q
          sudo docker compose -f "$compose" up -d --no-build --force-recreate impulsionando-core

          for attempt in $(seq 1 45); do
            code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -o /tmp/colors-router-ready -w '%{http_code}' --max-time 15 "https://$domain/" || true)"
            [ "$code" = '200' ] && break
            [ "$attempt" -lt 45 ] || exit 61
            sleep 2
          done

          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio /entrar /criar-conta /privacidade /termos; do
            code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -H 'Accept: text/html,application/xhtml+xml' -o /tmp/colors-router-page -w '%{http_code}' --max-time 20 "https://$domain$path")"
            echo "COLORS_ROUTER_PAGE $path HTTP=$code"
            [ "$code" = '200' ] || exit 62
          done
          for path in /api/public/webhooks/maisfy-colors /api/public/webhooks/monetizze-colors /api/public/webhooks/perfectpay-colors /api/public/hooks/n8n-verify; do
            code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -H 'Accept: application/json' -o /tmp/colors-router-api -w '%{http_code}' --max-time 20 "https://$domain$path")"
            echo "COLORS_ROUTER_API $path HTTP=$code"
            [ "$code" = '200' ] || exit 63
          done

          grep -q 'traefik.http.routers.colorssaude.rule=Host(`colorssaude.impulsionando.com.br`)' "$compose"
          trap - ERR
          echo 'COLORS_TRAEFIK_PERSIST=PASS'
          REMOTE
