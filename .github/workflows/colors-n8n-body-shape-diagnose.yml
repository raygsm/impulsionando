name: Colors n8n body shape diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/colors-n8n-body-shape-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Measure n8n body and HMAC header transport without exposing values
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          cat >/tmp/colorsBodyShape01.json <<'JSON'
          {
            "id":"colorsBodyShape01",
            "name":"Colors Body Shape Diagnostic",
            "active":false,
            "nodes":[
              {"parameters":{"httpMethod":"POST","path":"colors-body-shape-diagnostic","responseMode":"responseNode","options":{}},"id":"colors-body-shape-hook","name":"Diagnostic Webhook","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0],"webhookId":"colors-body-shape-v2"},
              {"parameters":{"respondWith":"json","responseBody":"={{ { bodyString: JSON.stringify($json.body), signatureValue: ($json.headers?.['x-impulsionando-signature'] || ''), headerKeys: Object.keys($json.headers || {}) } }}","options":{"responseCode":200}},"id":"colors-body-shape-response","name":"Echo Transport Shape","type":"n8n-nodes-base.respondToWebhook","typeVersion":1.4,"position":[300,0]}
            ],
            "connections":{"Diagnostic Webhook":{"main":[[{"node":"Echo Transport Shape","type":"main","index":0}]]}},
            "settings":{"executionOrder":"v1"}
          }
          JSON
          sudo docker cp /tmp/colorsBodyShape01.json "$C:/tmp/colorsBodyShape01.json"
          sudo docker exec "$C" n8n import:workflow --input=/tmp/colorsBodyShape01.json >/dev/null
          sudo docker exec "$C" n8n publish:workflow --id=colorsBodyShape01 >/dev/null
          sudo docker exec "$C" n8n update:workflow --id=colorsBodyShape01 --active=true >/dev/null
          sudo docker restart "$C" >/dev/null
          for i in $(seq 1 45); do
            sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1 && break
            [ "$i" -lt 45 ] || exit 70
            sleep 2
          done
          payload='{"workflow_name":"colors-saude.affiliate.relationship","event_code":"AFFILIATE_ATTRIBUTED","tenant_slug":"colors-saude","correlation_id":"colors-body-shape","company_id":null,"dispatched_at":"2026-08-17T00:00:00.000Z","data":{"probe":true}}'
          secret="$(sudo docker inspect impulsionando-core --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' | head -n1)"
          test -n "$secret"
          signature="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
          original_hash="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          code=000
          for i in $(seq 1 12); do
            code="$(curl -sS -o /tmp/colors-body-shape.out -w '%{http_code}' --max-time 20 -X POST 'https://n8n.impulsionando.com.br/webhook/colors-body-shape-diagnostic' -H 'content-type: application/json' -H "x-impulsionando-signature: $signature" --data-binary "$payload" || true)"
            [ "$code" = 200 ] && break
            sleep 3
          done
          [ "$code" = 200 ] || exit 71
          echoed="$(jq -r '.bodyString' /tmp/colors-body-shape.out)"
          received_signature="$(jq -r '.signatureValue' /tmp/colors-body-shape.out)"
          echoed_hash="$(printf '%s' "$echoed" | sha256sum | awk '{print $1}')"
          echo "COLORS_BODY_HASH_MATCH=$([ "$original_hash" = "$echoed_hash" ] && echo yes || echo no)"
          echo "COLORS_SIGNATURE_PRESENT=$([ -n "$received_signature" ] && echo yes || echo no)"
          echo "COLORS_SIGNATURE_LENGTH=${#received_signature}"
          echo "COLORS_SIGNATURE_MATCH=$([ "$signature" = "$received_signature" ] && echo yes || echo no)"
          keys="$(jq -r '.headerKeys | join(",")' /tmp/colors-body-shape.out)"
          echo "COLORS_SIGNATURE_KEY_PRESENT=$([[ ",$keys," == *,x-impulsionando-signature,* ]] && echo yes || echo no)"
          echo 'COLORS_N8N_TRANSPORT_DIAGNOSE=PASS'
          REMOTE
