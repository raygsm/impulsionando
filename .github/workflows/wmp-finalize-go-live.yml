name: RETIRED - WMP finalize go-live

# Historical workflow kept as a fail-closed tombstone.
# It previously promoted a pinned release and rebuilt/recreated the shared Core before n8n setup.
# Production Front is the single frontend/Core publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: WMP go-live Core promotion is disabled."
          echo "Use Production Front for Core publication and tenant-safe automation workflows separately."
          exit 1
