name: Dispatch Core deploy once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-core-deploy-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Core deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run deploy-core-frontend.yml --repo "$REPO" --ref main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Retire dispatcher
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git rm -f .github/workflows/ops-dispatch-core-deploy-once.yml
          git commit -m 'chore(core): retire Core deploy dispatcher'
          git pull --rebase origin main
          git push origin HEAD:main
