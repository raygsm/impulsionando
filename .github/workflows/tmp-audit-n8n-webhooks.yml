name: Temporary n8n webhook audit

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-webhooks.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live webhook nodes without secrets
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            OUT=/tmp/impulsionando-n8n-workflows.json
            docker exec "$C" rm -f "$OUT" || true
            docker exec "$C" n8n export:workflow --all --output="$OUT" >/dev/null
            docker cp "$C:$OUT" /tmp/impulsionando-n8n-workflows.json
            node -e 'const fs=require("fs"); const raw=JSON.parse(fs.readFileSync("/tmp/impulsionando-n8n-workflows.json","utf8")); const list=Array.isArray(raw)?raw:[raw]; for(const w of list){ const hooks=(w.nodes||[]).filter(n=>String(n.type||"").includes("webhook")).map(n=>({path:n.parameters&&n.parameters.path||null,method:n.parameters&&n.parameters.httpMethod||"GET"})); if(hooks.length) console.log(JSON.stringify({id:w.id,name:w.name,active:!!w.active,hooks})); }'
            rm -f /tmp/impulsionando-n8n-workflows.json
            docker exec "$C" rm -f "$OUT" || true
