name: Temporary n8n webhook audit

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-webhooks.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect registered webhook paths without secrets
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            MOUNT=$(docker inspect "$C" --format '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}')
            DB="$MOUNT/database.sqlite"
            if [ ! -f "$DB" ]; then
              echo "DATABASE=missing"
              exit 2
            fi
            if ! command -v python3 >/dev/null 2>&1; then
              echo "PYTHON3=missing"
              exit 3
            fi
            DB_PATH="$DB" python3 -c 'import os,sqlite3; ids=set("kjdkkV9rjIMgAMdA YT7nYlKuQryGUNEq TwxMj5XSMgUEbXiD NYX6Bo1dlyd7b3P7 J2vrRXk9L2WoRfam s1fiGRPTRcyeAPyt CUFC3smxigoC5hOx FmNmDqMNYbbW3fM7 WavassyWPggKwThY cBPqXfXfP0H3pAbs 7i5gHQnraIKzgdz1 njO3SGf3tl3j8wh0 SXW6oLezwWFvAGwN y080sHJouKP66SAH iGZ5djNpjie6WSTB VwGvbkMMVKU2CQ3E 1QysKcsGaLHountH vvqBbKmhz6gF1szf hdyhky3EYUcOPaAk NcPcGGHAbAmbrMiG QSfPQDe2C63j7ZNp JJu7F0uXxS1RN7BK 0dA5lyMj9LtObOdg SMbKe6dT2j2Qs9gt F0asmrhkiplhhrYW 3m68WaCpdlC6G9Vh".split()); con=sqlite3.connect("file:"+os.environ["DB_PATH"]+"?mode=ro",uri=True); cur=con.cursor(); rows=cur.execute("select workflowId,webhookPath,method from webhook_entity order by workflowId,webhookPath").fetchall(); [print("|".join(str(x) if x is not None else "" for x in r)) for r in rows if r[0] in ids]; con.close()'
