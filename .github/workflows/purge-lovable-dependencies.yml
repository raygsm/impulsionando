# Forced definitive purge trigger: 2026-08-19T17:38:00-03:00
name: Purge Lovable dependencies

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/purge-lovable-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purge-lovable-dependencies
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove all Lovable packages using canonical npm lock
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall \
            @lovable.dev/cloud-auth-js \
            @lovable.dev/email-js \
            @lovable.dev/mcp-js \
            @lovable.dev/webhooks-js \
            @lovable.dev/vite-tanstack-config
          rm -f bun.lock

      - name: Assert zero Lovable dependency in canonical manifests
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --include='package.json' --include='package-lock.json' '@lovable.dev' .; then
            echo '::error::Lovable package reference remains in npm manifests'
            exit 1
          fi
          if grep -Rni --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' '@lovable.dev' src vite.config.ts server.ts 2>/dev/null; then
            echo '::error::Lovable runtime import remains in source'
            exit 1
          fi

      - name: Install and build definitive Core
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs

      - name: Commit validated dependency cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git add package.json package-lock.json src/routeTree.gen.ts || true
          git rm -f bun.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git commit -m 'chore(core): remove all Lovable package dependencies and retire bun lock'
          git pull --rebase origin main
          git push origin HEAD:main
