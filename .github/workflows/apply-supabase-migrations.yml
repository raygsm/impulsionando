name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente planejar, sem alterar o banco"
        required: true
        default: true
        type: boolean

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase target
        run: node scripts/verify-supabase-target.mjs

      - name: Verify Supabase pooler connection
        run: node scripts/verify-supabase-pooler.mjs

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: |
          supabase db push --include-all --db-url "postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"

      - name: Plan migrations (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          supabase db push --include-all --dry-run --db-url "postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
