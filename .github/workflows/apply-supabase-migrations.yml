name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente planejar, sem alterar o banco"
        required: true
        default: true
        type: boolean

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_ID"
          test "$SUPABASE_PROJECT_ID" = "$VITE_SUPABASE_PROJECT_ID"
          test "$SUPABASE_URL" = "https://${SUPABASE_PROJECT_ID}.supabase.co"
          test "$VITE_SUPABASE_URL" = "$SUPABASE_URL"
          case "$PGUSER" in
            *"$SUPABASE_PROJECT_ID"*) ;;
            *) echo "::error::PGUSER não pertence ao projeto esperado"; exit 1 ;;
          esac
          echo "Destino Supabase validado sem exibir credenciais."

      - name: Verify Supabase pooler connection
        shell: bash
        run: |
          node -e "const net=require('net');const s=net.createConnection({host:process.env.PGHOST,port:Number(process.env.PGPORT)},()=>{console.log('Pooler acessível.');s.end();});s.setTimeout(10000);s.on('timeout',()=>{console.error('Timeout no pooler.');process.exit(1)});s.on('error',e=>{console.error('Pooler indisponível:',e.code);process.exit(1)});"

      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: |
          supabase db push --include-all --db-url "postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"

      - name: Plan migrations (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          supabase db push --include-all --dry-run --db-url "postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
