name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente validar o alvo e planejar as migracoes"
        required: true
        default: true
        type: boolean
      verify_only:
        description: "Executar somente o pos-gate, sem reaplicar SQL"
        required: true
        default: false
        type: boolean
      booking_hotfix_only:
        description: "Aplicar somente o hotfix da funcao de reserva CHRISMED"
        required: true
        default: false
        type: boolean

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: ${{ secrets.SUPABASE_DB_HOST }}
      PGPORT: "5432"
      PGUSER: postgres.${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGDATABASE: postgres
      PGSSLMODE: require
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_ID"
          test "$SUPABASE_PROJECT_ID" = "$VITE_SUPABASE_PROJECT_ID"
          test "$SUPABASE_URL" = "https://${SUPABASE_PROJECT_ID}.supabase.co"
          test "$VITE_SUPABASE_URL" = "$SUPABASE_URL"
          case "${PGUSER}@${PGHOST}" in
            *"$SUPABASE_PROJECT_ID"*) ;;
            *)
              echo "::error::O pooler configurado nao pertence ao projeto Supabase esperado."
              exit 1
              ;;
          esac

      - name: Verify Supabase pooler connection
        shell: bash
        run: |
          set -euo pipefail
          psql -X --no-psqlrc --set ON_ERROR_STOP=1 \
            --command "select current_database(), current_user;"

      - name: Apply migrations
        if: ${{ !inputs.dry_run && !inputs.verify_only && !inputs.booking_hotfix_only }}
        shell: bash
        run: |
          set -euo pipefail
          db_url="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          migrations=(
            "20260808210000_chrismed_mercado_pago_current_core"
            "20260808213000_chrismed_secure_booking"
            "20260808223000_chrismed_communication_settings"
            "20260809111500_fix_current_core_staff_functions"
            "20260809124500_chrismed_offerings_and_occupational_intake"
          )

          args=(-X --no-psqlrc --single-transaction --set ON_ERROR_STOP=1 "$db_url")
          for migration in "${migrations[@]}"; do
            args+=(--file "supabase/migrations/${migration}.sql")
          done

          args+=(--command "
            insert into supabase_migrations.schema_migrations(version, name, statements)
            values
              ('20260808210000', 'chrismed_mercado_pago_current_core', array[]::text[]),
              ('20260808213000', 'chrismed_secure_booking', array[]::text[]),
              ('20260808223000', 'chrismed_communication_settings', array[]::text[]),
              ('20260809111500', 'fix_current_core_staff_functions', array[]::text[]),
              ('20260809124500', 'chrismed_offerings_and_occupational_intake', array[]::text[])
            on conflict (version) do nothing;
          ")

          psql "${args[@]}"

      - name: Apply CHRISMED booking hotfix only
        if: ${{ !inputs.dry_run && inputs.booking_hotfix_only }}
        shell: bash
        run: |
          set -euo pipefail
          db_url="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          psql -X --no-psqlrc --single-transaction --set ON_ERROR_STOP=1 "$db_url" \
            --file supabase/migrations/20260809133000_fix_chrismed_booking_hold_ambiguity.sql \
            --command "
              insert into supabase_migrations.schema_migrations(version, name, statements)
              values (
                '20260809133000',
                'fix_chrismed_booking_hold_ambiguity',
                array[]::text[]
              )
              on conflict (version) do nothing;
            "

      - name: Post-apply CHRISMED gate
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          db_url="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          psql -X --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align "$db_url" <<'SQL'
          do $$
          begin
            if to_regclass('public.chrismed_service_offerings') is null then
              raise exception 'chrismed_service_offerings ausente';
            end if;
            if to_regclass('public.chrismed_occupational_intakes') is null then
              raise exception 'chrismed_occupational_intakes ausente';
            end if;
            if to_regprocedure('public.is_super_admin(uuid)') is null then
              raise exception 'is_super_admin(uuid) ausente';
            end if;
            if to_regprocedure('public.is_impulsionando_staff(uuid)') is null then
              raise exception 'is_impulsionando_staff(uuid) ausente';
            end if;
          end
          $$;

          select version
          from supabase_migrations.schema_migrations
          where version in (
            '20260808210000', '20260808213000', '20260808223000',
            '20260809111500', '20260809124500', '20260809133000'
          )
          order by version;
          SQL

          supabase db lint --db-url "$db_url" --level error --fail-on error

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Alvo e conectividade validados. Nenhuma migracao foi aplicada (dry_run=true)."
