name: Colors Cloudflare origin cutover

on:
  push:
    paths:
      - .github/workflows/colors-cloudflare-origin-cutover.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colors-origin-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: colors.impulsionando.com.br
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve validated origin and current Cloudflare state
        run: |
          set -euo pipefail
          for value in DEPLOY_HOST VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$DEPLOY_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/colors-dns-before.json
          jq -e '.success == true' /tmp/colors-dns-before.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length' /tmp/colors-dns-before.json)"
          echo "COLORS_ROUTING_RECORD_COUNT=$count"
          echo "COLORS_ORIGIN_IP=$ORIGIN_IP"

      - name: Configure SSH with retries
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep $((i*3))
          done
          exit 2

      - name: Validate Colors routes on current Traefik Core before DNS cutover
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          container='impulsionando-core'
          sudo docker inspect "$container" >/dev/null
          for attempt in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container" 2>/dev/null || true)"
            if [ -n "$ip" ] && curl -fsS -H 'Host: colors.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' "http://$ip:3000/" >/dev/null 2>&1; then break; fi
            [ "$attempt" -lt 45 ] || { sudo docker logs --tail 120 "$container"; exit 31; }
            sleep 2
          done
          ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$container")"
          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio /entrar /criar-conta; do
            code="$(curl -sS -H 'Host: colors.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/colors-edge-probe -w '%{http_code}' "http://$ip:3000$path")"
            echo "COLORS_EDGE_PROBE $path HTTP=$code"
            [ "$code" = '200' ] || exit 32
          done
          echo 'COLORS_TRAEFIK_ORIGIN_READY=PASS'
          REMOTE

      - name: Replace Colors routing record in Cloudflare
        run: |
          set -euo pipefail
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/colors-dns-before.json | while read -r id; do
            [ -n "$id" ] || continue
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
          done
          jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/colors-dns-new.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/colors-dns-new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/colors-dns-created.json
          jq -e '.success == true' /tmp/colors-dns-created.json >/dev/null
          echo 'COLORS_CLOUDFLARE_CUTOVER=APPLIED'

      - name: Purge Colors cache
        run: |
          set -euo pipefail
          jq -nc --arg a "https://$DOMAIN/" --arg b "https://$DOMAIN/super-green-black" --arg c "https://$DOMAIN/agenda" --arg d "https://$DOMAIN/eventos" '{files:[$a,$b,$c,$d]}' >/tmp/colors-purge.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/colors-purge.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -o /tmp/colors-purge-result.json
          jq -e '.success == true' /tmp/colors-purge-result.json >/dev/null

      - name: Public verification with DNS rollback on failure
        run: |
          set -euo pipefail
          failed=0
          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio /entrar /criar-conta; do
            code=000
            for attempt in $(seq 1 18); do
              code="$(curl -sS -L -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/colors-public -w '%{http_code}' --max-time 20 "https://$DOMAIN$path?colors_cutover=${GITHUB_SHA}" || true)"
              [ "$code" = '200' ] && break
              sleep 5
            done
            echo "PUBLIC_COLORS $path HTTP=$code"
            [ "$code" = '200' ] || failed=1
          done
          if [ "$failed" = '0' ]; then
            echo 'COLORS_PUBLIC_ORIGIN_CUTOVER=PASS'
            exit 0
          fi
          echo '::error::Public Colors validation failed; restoring previous Cloudflare state.'
          new_id="$(jq -r '.result.id // empty' /tmp/colors-dns-created.json)"
          if [ -n "$new_id" ]; then
            curl --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$new_id" >/dev/null || true
          fi
          jq -c '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | del(.id,.zone_id,.zone_name,.created_on,.modified_on,.meta,.proxiable,.locked,.comment_modified_on,.tags_modified_on)' /tmp/colors-dns-before.json | while read -r payload; do
            curl --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" >/dev/null || true
          done
          exit 40

      - name: Upload DNS backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colors-dns-backup-${{ github.run_id }}
          path: /tmp/colors-dns-before.json
          retention-days: 30

# Production cutover triggered only after the Colors origin and regression probes were green.
