name: Colors canonical domain reconcile

on:
  push:
    paths:
      - .github/workflows/colors-cloudflare-origin-cutover.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colors-canonical-domain-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: colorssaude.com.br
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IMPULSIONANDO_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Validate credentials and resolve zones
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN IMPULSIONANDO_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          IMPULSIONANDO_ZONE_ID="$(printf '%s' "$IMPULSIONANDO_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/zones?name=colorssaude.com.br&status=active&per_page=50' -o /tmp/colors-zone.json
          jq -e '.success == true' /tmp/colors-zone.json >/dev/null
          COLORS_ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/colors-zone.json)"
          test -n "$COLORS_ZONE_ID" || { echo '::error::Cloudflare zone colorssaude.com.br not found or token has no access'; exit 2; }
          printf 'IMPULSIONANDO_ZONE_ID=%s\nCOLORS_ZONE_ID=%s\nORIGIN_IP=%s\n' "$IMPULSIONANDO_ZONE_ID" "$COLORS_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep $((i*3))
          done
          exit 3

      - name: Validate official Colors host at Traefik origin before DNS changes
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          code=000
          for attempt in $(seq 1 30); do
            code="$(curl -k -sS --resolve "$DOMAIN:443:127.0.0.1" -H 'Accept: text/html,application/xhtml+xml' -A 'ColorsCanonical/1.0' -o /tmp/colors-origin -w '%{http_code}' --max-time 20 "https://$DOMAIN/" || true)"
            echo "COLORS_CANONICAL_ORIGIN attempt=$attempt HTTP=$code"
            [ "$code" = '200' ] && break
            sleep 2
          done
          [ "$code" = '200' ] || { echo '::error::colorssaude.com.br is not routed by Traefik yet; no DNS change performed'; exit 31; }
          REMOTE

      - name: Backup official and legacy DNS records
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$COLORS_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/colors-official-before.json
          jq -e '.success == true' /tmp/colors-official-before.json >/dev/null
          : > /tmp/colors-legacy-before.ndjson
          for legacy in colors.impulsionando.com.br colorssaude.impulsionando.com.br colors-saude.impulsionando.com.br; do
            curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$IMPULSIONANDO_ZONE_ID/dns_records?name=$legacy&per_page=100" -o /tmp/legacy-one.json
            jq -e '.success == true' /tmp/legacy-one.json >/dev/null
            jq -c --arg legacy "$legacy" '{legacy:$legacy,result:.result}' /tmp/legacy-one.json >> /tmp/colors-legacy-before.ndjson
          done

      - name: Reconcile colorssaude.com.br to validated VPS
        run: |
          set -euo pipefail
          current_id="$(jq -r --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip and .proxied==true) | .id' /tmp/colors-official-before.json | head -n1)"
          if [ -z "$current_id" ]; then
            jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/colors-official-before.json | while read -r id; do
              [ -n "$id" ] && curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
                "https://api.cloudflare.com/client/v4/zones/$COLORS_ZONE_ID/dns_records/$id" >/dev/null
            done
            jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/colors-official-new.json
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              --data @/tmp/colors-official-new.json "https://api.cloudflare.com/client/v4/zones/$COLORS_ZONE_ID/dns_records" -o /tmp/colors-official-created.json
            jq -e '.success == true' /tmp/colors-official-created.json >/dev/null
            echo 'COLORS_OFFICIAL_DNS=RECONCILED'
          else
            echo 'COLORS_OFFICIAL_DNS=OK'
          fi

      - name: Delete duplicate Colors hostnames
        run: |
          set -euo pipefail
          for legacy in colors.impulsionando.com.br colorssaude.impulsionando.com.br colors-saude.impulsionando.com.br; do
            curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$IMPULSIONANDO_ZONE_ID/dns_records?name=$legacy&per_page=100" -o /tmp/legacy-delete.json
            jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/legacy-delete.json | while read -r id; do
              [ -n "$id" ] || continue
              curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
                "https://api.cloudflare.com/client/v4/zones/$IMPULSIONANDO_ZONE_ID/dns_records/$id" >/dev/null
            done
            echo "COLORS_LEGACY_DNS_DELETED $legacy"
          done
          # User requested a single address; remove www as a separate hostname too.
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$COLORS_ZONE_ID/dns_records?name=www.colorssaude.com.br&per_page=100" -o /tmp/colors-www.json
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/colors-www.json | while read -r id; do
            [ -n "$id" ] || continue
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$COLORS_ZONE_ID/dns_records/$id" >/dev/null
          done
          echo 'COLORS_DUPLICATE_HOSTS=REMOVED'

      - name: Purge official Colors cache
        continue-on-error: true
        run: |
          set -euo pipefail
          jq -nc --arg a "https://$DOMAIN/" --arg b "https://$DOMAIN/super-green-black" --arg c "https://$DOMAIN/agenda" --arg d "https://$DOMAIN/eventos" '{files:[$a,$b,$c,$d]}' >/tmp/colors-purge.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/colors-purge.json "https://api.cloudflare.com/client/v4/zones/$COLORS_ZONE_ID/purge_cache" >/tmp/colors-purge-result.json || true

      - name: Validate official domain and absence of duplicate DNS
        run: |
          set -euo pipefail
          code=000
          for attempt in $(seq 1 18); do
            code="$(curl -sS -L -A 'Mozilla/5.0 ColorsCanonical/1.0' -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/colors-public -w '%{http_code}' --max-time 30 "https://$DOMAIN/" || true)"
            echo "COLORS_OFFICIAL_PUBLIC attempt=$attempt HTTP=$code"
            [ "$code" = '200' ] && break
            sleep 5
          done
          [ "$code" = '200' ] || exit 40

          for legacy in colors.impulsionando.com.br colorssaude.impulsionando.com.br colors-saude.impulsionando.com.br; do
            curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$IMPULSIONANDO_ZONE_ID/dns_records?name=$legacy&per_page=100" -o /tmp/legacy-check.json
            count="$(jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length' /tmp/legacy-check.json)"
            echo "COLORS_LEGACY_DNS_COUNT $legacy=$count"
            [ "$count" = '0' ] || exit 41
          done
          echo 'COLORS_CANONICAL_DOMAIN=PASS'

      - name: Upload DNS backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colors-domain-backup-${{ github.run_id }}
          path: |
            /tmp/colors-official-before.json
            /tmp/colors-legacy-before.ndjson
          retention-days: 30
