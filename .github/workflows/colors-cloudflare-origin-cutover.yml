name: Colors subdomain DNS audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colors-subdomain-dns-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: colorssaude.impulsionando.com.br
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IMPULSIONANDO_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          for value in CF_API_TOKEN IMPULSIONANDO_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done

      - name: Audit official Colors subdomain without mutations
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$IMPULSIONANDO_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" \
            -o /tmp/colors-subdomain.json
          jq -e '.success == true' /tmp/colors-subdomain.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length' /tmp/colors-subdomain.json)"
          echo "COLORS_SUBDOMAIN_DNS_RECORDS=$count"
          [ "$count" -ge 1 ] || { echo '::error::Official Colors subdomain has no routable DNS record'; exit 20; }

      - name: Validate official Colors subdomain reachability
        run: |
          set -euo pipefail
          code="$(curl -sS -A 'Mozilla/5.0 ColorsSubdomainAudit/1.0' -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/colors-official -w '%{http_code}' --max-time 30 "https://$DOMAIN/" || true)"
          echo "COLORS_SUBDOMAIN_PUBLIC_HTTP=$code"
          [ "$code" != '000' ] || { echo '::error::Official Colors subdomain is unreachable'; exit 21; }
          echo 'COLORS_CLIENT_OWNED_DOMAINS=UNTOUCHED'
