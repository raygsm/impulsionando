name: Colors Cloudflare origin cutover

on:
  push:
    paths:
      - .github/workflows/colors-cloudflare-origin-cutover.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colors-origin-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: colorssaude.impulsionando.com.br
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve validated VPS origin and current Cloudflare state
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$VPS_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/colors-dns-before.json
          jq -e '.success == true' /tmp/colors-dns-before.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length' /tmp/colors-dns-before.json)"
          echo "COLORS_ROUTING_RECORD_COUNT=$count"
          echo 'COLORS_VALIDATED_ORIGIN=VPS'

      - name: Configure SSH with retries
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep $((i*3))
          done
          exit 2

      - name: Validate Colors routes on current Traefik Core before DNS cutover
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          domain='colorssaude.impulsionando.com.br'
          for attempt in $(seq 1 45); do
            code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -H 'Accept: text/html,application/xhtml+xml' -H 'User-Agent: Mozilla/5.0 ColorsCutover/1.0' -o /tmp/colors-edge-ready -w '%{http_code}' --max-time 15 "https://$domain/" || true)"
            [ "$code" = '200' ] && break
            [ "$attempt" -lt 45 ] || exit 31
            sleep 2
          done
          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio /entrar /criar-conta /privacidade /termos; do
            code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -H 'Accept: text/html,application/xhtml+xml' -H 'User-Agent: Mozilla/5.0 ColorsCutover/1.0' -o /tmp/colors-edge-probe -w '%{http_code}' --max-time 20 "https://$domain$path")"
            echo "COLORS_EDGE_TLS_PROBE $path HTTP=$code"
            [ "$code" = '200' ] || exit 32
          done
          for path in /api/public/webhooks/maisfy-colors /api/public/webhooks/monetizze-colors /api/public/webhooks/perfectpay-colors; do
            code="$(curl -k -sS --resolve "$domain:443:127.0.0.1" -H 'Accept: application/json' -H 'User-Agent: ColorsProviderHealth/1.0' -o /tmp/colors-edge-api-probe -w '%{http_code}' --max-time 20 "https://$domain$path")"
            echo "COLORS_EDGE_TLS_API $path HTTP=$code"
            [ "$code" = '200' ] || exit 33
          done
          echo 'COLORS_TRAEFIK_ORIGIN_READY=PASS'
          REMOTE

      - name: Replace Colors routing record in Cloudflare
        run: |
          set -euo pipefail
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/colors-dns-before.json | while read -r id; do
            [ -n "$id" ] || continue
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
          done
          jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/colors-dns-new.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/colors-dns-new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/colors-dns-created.json
          jq -e '.success == true' /tmp/colors-dns-created.json >/dev/null
          echo 'COLORS_CLOUDFLARE_CUTOVER=APPLIED'

      - name: Purge Colors cache
        continue-on-error: true
        run: |
          set -euo pipefail
          jq -nc \
            --arg a "https://$DOMAIN/" \
            --arg b "https://$DOMAIN/super-green-black" \
            --arg c "https://$DOMAIN/agenda" \
            --arg d "https://$DOMAIN/eventos" \
            --arg e "https://$DOMAIN/api/public/webhooks/maisfy-colors" \
            --arg f "https://$DOMAIN/api/public/webhooks/monetizze-colors" \
            --arg g "https://$DOMAIN/api/public/webhooks/perfectpay-colors" \
            '{files:[$a,$b,$c,$d,$e,$f,$g]}' >/tmp/colors-purge.json
          if ! curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/colors-purge.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -o /tmp/colors-purge-result.json; then
            echo '::warning title=Cloudflare cache purge unavailable::DNS token lacks cache-purge permission; public verification remains the hard gate.'
            exit 0
          fi
          jq -e '.success == true' /tmp/colors-purge-result.json >/dev/null || true

      - name: Public verification with DNS rollback on failure
        run: |
          set -euo pipefail
          browser_ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36'
          rollback_dns() {
            echo '::error::Public Colors validation failed; restoring previous Cloudflare state.'
            new_id="$(jq -r '.result.id // empty' /tmp/colors-dns-created.json)"
            if [ -n "$new_id" ]; then
              curl --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
                "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$new_id" >/dev/null || true
            fi
            jq -c '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | del(.id,.zone_id,.zone_name,.created_on,.modified_on,.meta,.proxiable,.locked,.comment_modified_on,.tags_modified_on)' /tmp/colors-dns-before.json | while read -r payload; do
              curl --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
                "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" >/dev/null || true
            done
          }

          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS -L -A "$browser_ua" -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -o /tmp/colors-public-ready -w '%{http_code}' --max-time 20 "https://$DOMAIN/" || true)"
            if [ "$code" = '200' ]; then
              ready=1
              echo "COLORS_PUBLIC_DNS_READY=PASS attempt=$attempt"
              break
            fi
            echo "COLORS_PUBLIC_DNS_WAIT attempt=$attempt HTTP=$code"
            sleep 5
          done
          if [ "$ready" != '1' ]; then
            rollback_dns
            exit 40
          fi

          failed=0
          for path in / /super-green-black /agenda /eventos /suporte /afiliados /rastreio /entrar /criar-conta /privacidade /termos; do
            code="$(curl -sS -L -A "$browser_ua" -H 'Accept: text/html,application/xhtml+xml' -H 'Cache-Control: no-cache' -D /tmp/colors-public-headers -o /tmp/colors-public -w '%{http_code}' --max-time 30 "https://$DOMAIN$path" || true)"
            echo "PUBLIC_COLORS $path HTTP=$code"
            if [ "$code" != '200' ]; then
              grep -Ei '^(server|cf-ray|cf-cache-status|location|content-type):' /tmp/colors-public-headers || true
              head -c 200 /tmp/colors-public | tr '\n' ' '; echo
              failed=1
            fi
          done
          for path in /api/public/webhooks/maisfy-colors /api/public/webhooks/monetizze-colors /api/public/webhooks/perfectpay-colors; do
            code="$(curl -sS -L -A 'ColorsProviderHealth/1.0' -H 'Accept: application/json' -H 'Cache-Control: no-cache, no-store' -D /tmp/colors-public-api-headers -o /tmp/colors-public-api -w '%{http_code}' --max-time 30 "https://$DOMAIN$path" || true)"
            echo "PUBLIC_COLORS_API $path HTTP=$code"
            if [ "$code" != '200' ]; then
              grep -Ei '^(server|cf-ray|cf-cache-status|location|content-type):' /tmp/colors-public-api-headers || true
              head -c 200 /tmp/colors-public-api | tr '\n' ' '; echo
              failed=1
            fi
          done
          if [ "$failed" = '0' ]; then
            echo 'COLORS_PUBLIC_ORIGIN_CUTOVER=PASS'
            exit 0
          fi
          rollback_dns
          exit 40

      - name: Upload DNS backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colors-dns-backup-${{ github.run_id }}
          path: /tmp/colors-dns-before.json
          retention-days: 30

# Origin TLS and public route health are hard gates; canonical DNS targets the validated VPS origin only.
