name: RETIRED - CHRISMED publish front now

# Historical workflow kept as a fail-closed tombstone.
# It previously invoked legacy publishers installed on the VPS.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: CHRISMED legacy frontend publisher is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
