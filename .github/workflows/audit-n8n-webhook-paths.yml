name: Repair n8n dynamic webhook routes

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/audit-n8n-webhook-paths.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Backup, repair, republish and validate Impulsionando webhooks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            CONTAINER=n8n-umlg-n8n-1
            BACKUP_ROOT=/docker/n8n-umlg/backups
            TS=$(date +%Y%m%d-%H%M%S)
            mkdir -p "$BACKUP_ROOT"
            docker ps --format '{{.Names}}' | grep -Fx "$CONTAINER" >/dev/null
            DB_DIR=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}' "$CONTAINER")
            test -n "$DB_DIR"
            test -f "$DB_DIR/database.sqlite"
            DB_OWNER=$(stat -c '%u:%g' "$DB_DIR/database.sqlite")
            DB_BACKUP="$BACKUP_ROOT/database-pre-webhook-route-fix-$TS.sqlite"
            WF_BACKUP="$BACKUP_ROOT/workflows-pre-webhook-route-fix-$TS.json"
            python3 -c 'import sqlite3,sys; src=sqlite3.connect(sys.argv[1]); dst=sqlite3.connect(sys.argv[2]); src.backup(dst); dst.close(); src.close()' "$DB_DIR/database.sqlite" "$DB_BACKUP"
            chmod 600 "$DB_BACKUP"
            docker exec -u node "$CONTAINER" sh -lc 'rm -f /tmp/pre-route-fix.json /tmp/fixed-route.json /tmp/active-route-ids.txt && n8n export:workflow --all --output=/tmp/pre-route-fix.json >/dev/null'
            docker cp "$CONTAINER:/tmp/pre-route-fix.json" "$WF_BACKUP"
            chmod 600 "$WF_BACKUP"

            rollback() {
              set +e
              echo 'ROLLBACK_START'
              docker stop "$CONTAINER" >/dev/null 2>&1
              cp "$DB_BACKUP" "$DB_DIR/database.sqlite"
              rm -f "$DB_DIR/database.sqlite-wal" "$DB_DIR/database.sqlite-shm"
              chown "$DB_OWNER" "$DB_DIR/database.sqlite"
              docker start "$CONTAINER" >/dev/null 2>&1
              sleep 8
              echo 'ROLLBACK_DONE'
            }
            trap 'rollback' ERR

            docker exec -u node "$CONTAINER" node -e 'const fs=require("fs");const f="/tmp/pre-route-fix.json";const x=JSON.parse(fs.readFileSync(f,"utf8"));const a=Array.isArray(x)?x:[x];let changed=0;const ids=[];for(const w of a){if(!String(w.name||"").startsWith("Impulsionando ·"))continue;let touched=false;for(const n of (w.nodes||[])){if(n.type!=="n8n-nodes-base.webhook")continue;const p=n.parameters||{};if(typeof p.path==="string"&&p.path.includes("{{tenant_slug}}")){p.path=p.path.replaceAll("{{tenant_slug}}",":tenant_slug");changed++;touched=true;}}if(touched&&w.active)ids.push(w.id);}if(changed!==26||ids.length!==26)throw new Error(`expected 26 active route fixes, got changed=${changed} active=${ids.length}`);fs.writeFileSync("/tmp/fixed-route.json",JSON.stringify(a));fs.writeFileSync("/tmp/active-route-ids.txt",ids.join("\n"));console.log(`ROUTES_PREPARED=${changed}`);'

            docker exec -u node "$CONTAINER" n8n import:workflow --input=/tmp/fixed-route.json >/dev/null
            IDS=$(docker exec "$CONTAINER" cat /tmp/active-route-ids.txt)
            test "$(printf '%s\n' "$IDS" | sed '/^$/d' | wc -l)" -eq 26
            for ID in $IDS; do
              docker exec -u node "$CONTAINER" n8n publish:workflow --id="$ID" >/dev/null
            done

            docker restart "$CONTAINER" >/dev/null
            for i in $(seq 1 24); do
              if curl -fsS https://n8n.impulsionando.com.br/healthz >/dev/null 2>&1; then break; fi
              sleep 5
            done
            curl -fsS https://n8n.impulsionando.com.br/healthz >/dev/null

            DB_DIR=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}' "$CONTAINER")
            python3 -c 'import sqlite3,sys; db=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True); rows=db.execute("select workflowId,method,webhookPath from webhook_entity where webhookPath like ? order by workflowId",("impulsionando/%",)).fetchall(); bad=[r for r in rows if "{{tenant_slug}}" in (r[2] or "") or "/:tenant_slug/" not in (r[2] or "")]; print("REGISTERED_IMPULSIONANDO_WEBHOOKS="+str(len(rows))); print("INVALID_DYNAMIC_ROUTES="+str(len(bad))); [print("|".join(str(v or "") for v in r)) for r in rows]; db.close(); assert len(rows)==26 and not bad' "$DB_DIR/database.sqlite"

            trap - ERR
            docker exec "$CONTAINER" rm -f /tmp/pre-route-fix.json /tmp/fixed-route.json /tmp/active-route-ids.txt
            echo 'N8N_DYNAMIC_ROUTE_REPAIR_OK'
