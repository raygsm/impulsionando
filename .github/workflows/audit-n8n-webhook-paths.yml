name: Audit n8n registered webhooks

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/audit-n8n-webhook-paths.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify registered webhook routes in live n8n
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            CONTAINER=n8n-umlg-n8n-1
            docker ps --format '{{.Names}}' | grep -Fx "$CONTAINER" >/dev/null
            docker exec "$CONTAINER" sh -lc 'cd /usr/local/lib/node_modules/n8n && node -e '\''let D;try{D=require("better-sqlite3")}catch(e){console.log("BETTER_SQLITE3_NOT_AVAILABLE");process.exit(0)};const db=new D("/home/node/.n8n/database.sqlite",{readonly:true});const rows=db.prepare("select workflowId,method,webhookPath from webhook_entity order by workflowId,webhookPath").all();console.log("REGISTERED_WEBHOOKS");for(const r of rows)console.log([r.workflowId,r.method,r.webhookPath].join("|"));db.close();'\'''
