name: Audit n8n registered webhooks

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/audit-n8n-webhook-paths.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify registered webhook routes in live n8n
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            CONTAINER=n8n-umlg-n8n-1
            docker ps --format '{{.Names}}' | grep -Fx "$CONTAINER" >/dev/null
            DB_DIR=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}' "$CONTAINER")
            test -n "$DB_DIR"
            test -f "$DB_DIR/database.sqlite"
            python3 -c 'import sqlite3,sys; db=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro",uri=True); rows=db.execute("select workflowId,method,webhookPath from webhook_entity order by workflowId,webhookPath").fetchall(); print("REGISTERED_WEBHOOKS"); [print("|".join(str(v or "") for v in r)) for r in rows]; db.close()' "$DB_DIR/database.sqlite"
