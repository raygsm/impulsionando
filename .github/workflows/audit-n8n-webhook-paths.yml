name: Audit n8n webhook paths

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/audit-n8n-webhook-paths.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Extract public webhook metadata from live n8n
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            CONTAINER=n8n-umlg-n8n-1
            docker ps --format '{{.Names}}' | grep -Fx "$CONTAINER" >/dev/null
            docker exec "$CONTAINER" sh -lc 'rm -f /tmp/impulsionando-workflows.json && n8n export:workflow --all --output=/tmp/impulsionando-workflows.json >/dev/null'
            docker exec "$CONTAINER" node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/impulsionando-workflows.json","utf8"));const a=Array.isArray(x)?x:[x];for(const w of a){for(const n of (w.nodes||[])){if(n.type==="n8n-nodes-base.webhook"){const p=n.parameters||{};console.log([w.id,w.name,w.active?"ACTIVE":"INACTIVE",String(p.httpMethod||"GET").toUpperCase(),String(p.path||"")].join("\t"));}}}'
            docker exec "$CONTAINER" rm -f /tmp/impulsionando-workflows.json
