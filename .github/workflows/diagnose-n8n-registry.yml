name: Diagnose n8n registry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-n8n-registry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Export n8n workflow metadata without changes
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${VPS_USER}@${VPS_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          container='n8n-umlg-n8n-1'
          sudo docker exec "$container" n8n export:workflow --all --output=/tmp/impulsionando-workflows.json >/tmp/n8n-export.log 2>&1
          sudo docker cp "$container:/tmp/impulsionando-workflows.json" /tmp/impulsionando-workflows.json
          echo '== n8n workflow inventory =='
          jq -r '.[] | [.id,.name,(.active|tostring)] | @tsv' /tmp/impulsionando-workflows.json | sort
          echo '== totals =='
          jq -r '"total=" + (length|tostring) + " active=" + ([.[]|select(.active==true)]|length|tostring)' /tmp/impulsionando-workflows.json
          rm -f /tmp/impulsionando-workflows.json /tmp/n8n-export.log
          sudo docker exec "$container" rm -f /tmp/impulsionando-workflows.json
          REMOTE
