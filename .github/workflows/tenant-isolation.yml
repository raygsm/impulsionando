name: tenant-isolation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-isolation:
    name: Core tenant isolation + contract email delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      CORE_E2E_PRIVILEGED_CLEANUP: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      PGHOST_SOURCE: ${{ secrets.SUPABASE_DB_HOST }}
      PGPASSWORD_SOURCE: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Verify required secrets
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY PGHOST_SOURCE PGPASSWORD_SOURCE PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; missing=1; fi
          done
          test "$missing" = "0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare results dir
        run: mkdir -p test-results

      - name: Run Core tenant isolation E2E
        id: isolation
        run: |
          set -o pipefail
          suite=tests/e2e/tenant-isolation.test.ts
          test -f "$suite" || { echo "::error::Missing ecosystem isolation suite: $suite"; exit 2; }
          bunx vitest --config vitest.e2e.config.ts run "$suite" \
            --reporter=verbose --reporter=junit \
            --outputFile=test-results/isolation.junit.xml 2>&1 | tee test-results/isolation.log

      - name: Run Core contract email queue E2E
        id: email
        if: always()
        run: |
          set -o pipefail
          suite=tests/e2e/contract-email-delivery.test.ts
          test -f "$suite" || { echo "::error::Missing ecosystem email suite: $suite"; exit 2; }
          bunx vitest --config vitest.e2e.config.ts run "$suite" \
            --reporter=verbose --reporter=junit \
            --outputFile=test-results/email.junit.xml 2>&1 | tee test-results/email.log

      - name: Privileged cleanup of exact Core E2E companies
        if: always()
        run: |
          set -euo pipefail
          cat > /tmp/cleanup-core-e2e.sql <<'SQL'
          begin;
          create temporary table _e2e_companies on commit drop as
            select id from public.companies where name like 'E2E Core Iso %';

          delete from public.core_service_access_events where company_id in (select id from _e2e_companies);
          delete from public.core_service_access_state where company_id in (select id from _e2e_companies);
          delete from public.communication_tenants where company_id in (select id from _e2e_companies);
          delete from public.core_client_enrollment where company_id in (select id from _e2e_companies);
          delete from public.user_roles where company_id in (select id from _e2e_companies);
          delete from public.companies where id in (select id from _e2e_companies);
          commit;
          SQL

          source_user="postgres.${PROJECT_REF}"
          if ! docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD_SOURCE" \
            -v /tmp/cleanup-core-e2e.sql:/cleanup.sql:ro postgres:17 \
            psql -h "$PGHOST_SOURCE" -p 5432 -U "$source_user" -d postgres -v ON_ERROR_STOP=1 -f /cleanup.sql; then
            docker run --rm --network host \
              -e PGPASSWORD="$PGPASSWORD_SOURCE" \
              -v /tmp/cleanup-core-e2e.sql:/cleanup.sql:ro postgres:17 \
              psql -h "$PGHOST_SOURCE" -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /cleanup.sql
          fi

      - name: Snapshot canonical contract outbox metadata
        if: always()
        run: |
          set -euo pipefail
          cat > /tmp/outbox-snapshot.sql <<'SQL'
          select created_at, event_code, status, left(coalesce(idempotency_key,''),80) as idempotency_key
          from public.message_outbox
          where event_code in ('contracts.contract-generated','contracts.contract-signed')
          order by created_at desc
          limit 50;
          SQL
          source_user="postgres.${PROJECT_REF}"
          if ! docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD_SOURCE" \
            -v /tmp/outbox-snapshot.sql:/snapshot.sql:ro postgres:17 \
            psql -h "$PGHOST_SOURCE" -p 5432 -U "$source_user" -d postgres -f /snapshot.sql \
              > test-results/message_outbox_tail.txt 2>&1; then
            echo "snapshot unavailable" > test-results/message_outbox_tail.txt
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Core tenant isolation + contract email queue"
            echo "| Suite | Outcome |"
            echo "|---|---|"
            echo "| tenant-isolation | ${{ steps.isolation.outcome }} |"
            echo "| contract-email-queue | ${{ steps.email.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-results
          path: test-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail job if any suite failed
        if: always()
        run: |
          fail=0
          for o in "${{ steps.isolation.outcome }}" "${{ steps.email.outcome }}"; do
            [ "$o" = "success" ] || fail=1
          done
          test "$fail" = "0" || { echo "::error::One or more Core isolation suites failed"; exit 1; }
