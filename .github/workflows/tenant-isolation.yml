name: tenant-isolation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tenant-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-isolation:
    name: Core tenant isolation + contract email delivery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Verify required secrets
        run: |
          missing=0
          for v in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; missing=1; fi
          done
          test "$missing" = "0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare results dir
        run: mkdir -p test-results

      - name: Run Core tenant isolation E2E
        id: isolation
        run: |
          set -o pipefail
          suite=tests/e2e/tenant-isolation.test.ts
          test -f "$suite" || { echo "::error::Missing ecosystem isolation suite: $suite"; exit 2; }
          bunx vitest --config vitest.e2e.config.ts run "$suite" \
            --reporter=verbose --reporter=junit \
            --outputFile=test-results/isolation.junit.xml 2>&1 | tee test-results/isolation.log

      - name: Run Core contract email delivery E2E
        id: email
        if: always()
        run: |
          set -o pipefail
          suite=tests/e2e/contract-email-delivery.test.ts
          test -f "$suite" || { echo "::error::Missing ecosystem email suite: $suite"; exit 2; }
          bunx vitest --config vitest.e2e.config.ts run "$suite" \
            --reporter=verbose --reporter=junit \
            --outputFile=test-results/email.junit.xml 2>&1 | tee test-results/email.log

      - name: Snapshot email_send_log (last 50)
        if: always()
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${{ secrets.SUPABASE_DB_HOST }}" ]; then
            psql "postgres://postgres:${PGPASSWORD}@${{ secrets.SUPABASE_DB_HOST }}:5432/postgres" \
              -c "SELECT created_at, template_name, recipient_email, status, left(coalesce(error_message,''),120) AS error FROM email_send_log ORDER BY created_at DESC LIMIT 50;" \
              > test-results/email_send_log_tail.txt 2>&1 || echo "snapshot skipped" > test-results/email_send_log_tail.txt
          else
            echo "SUPABASE_DB_HOST not set — snapshot skipped" > test-results/email_send_log_tail.txt
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Core tenant isolation + contract email delivery"
            echo "| Suite | Outcome |"
            echo "|---|---|"
            echo "| tenant-isolation | ${{ steps.isolation.outcome }} |"
            echo "| contract-email-delivery | ${{ steps.email.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-results
          path: test-results
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail job if any suite failed
        if: always()
        run: |
          fail=0
          for o in "${{ steps.isolation.outcome }}" "${{ steps.email.outcome }}"; do
            [ "$o" = "success" ] || fail=1
          done
          test "$fail" = "0" || { echo "::error::One or more Core isolation suites failed"; exit 1; }
