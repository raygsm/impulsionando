# Forced diagnostic trigger: 2026-08-19T23:12:00-03:00
name: n8n READY debug

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/n8n-ready-debug.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Capture HMAC diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p docs/ops
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' >docs/ops/n8n-ready-debug.txt 2>&1
          set +e
          CORE_ENV=/etc/impulsionando-core.env
          SECURITY_ENV=/etc/impulsionando-security.env
          C=n8n-umlg-n8n-1
          echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "container_state=$(sudo docker inspect "$C" --format '{{.State.Status}}' 2>&1)"
          SEC_SECRET="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$SECURITY_ENV" | head -n1)"
          CORE_SECRET="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$CORE_ENV" | head -n1)"
          echo "security_secret_present=$([ -n "$SEC_SECRET" ] && echo yes || echo no)"
          echo "core_secret_present=$([ -n "$CORE_SECRET" ] && echo yes || echo no)"
          if [ -n "$SEC_SECRET" ] && [ -n "$CORE_SECRET" ]; then
            [ "$SEC_SECRET" = "$CORE_SECRET" ] && echo 'secret_match=yes' || echo 'secret_match=no'
          else
            echo 'secret_match=unknown'
          fi
          payload='{"workflow_name":"chrismed.appointment.cancelled","event_code":"appointment.cancelled","tenant_slug":"chrismed","correlation_id":"hmac-diagnostic-20260819","dispatched_at":"2026-08-20T02:12:00.000Z","data":{"probe":true}}'
          code_unsigned="$(curl -sS -o /tmp/u.out -w '%{http_code}' --max-time 20 -X POST 'https://impulsionando.com.br/api/public/hooks/n8n-verify' -H 'content-type: application/json' -d "$payload" || true)"
          echo "unsigned_http=$code_unsigned body=$(cat /tmp/u.out 2>/dev/null | head -c 240)"
          if [ -n "$SEC_SECRET" ]; then
            sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$SEC_SECRET" -hex | awk '{print $2}')"
            code_sec="$(curl -sS -o /tmp/s.out -w '%{http_code}' --max-time 20 -X POST 'https://impulsionando.com.br/api/public/hooks/n8n-verify' -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" -d "$payload" || true)"
            echo "security_secret_http=$code_sec body=$(cat /tmp/s.out 2>/dev/null | head -c 300)"
          fi
          if [ -n "$CORE_SECRET" ]; then
            sig2="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$CORE_SECRET" -hex | awk '{print $2}')"
            code_core="$(curl -sS -o /tmp/c.out -w '%{http_code}' --max-time 20 -X POST 'https://impulsionando.com.br/api/public/hooks/n8n-verify' -H 'content-type: application/json' -H "x-impulsionando-signature: $sig2" -d "$payload" || true)"
            echo "core_secret_http=$code_core body=$(cat /tmp/c.out 2>/dev/null | head -c 300)"
          fi
          echo '--- first READY ---'
          SUPABASE_URL="$(sudo sed -n 's/^SUPABASE_URL=//p' "$CORE_ENV" | head -n1)"
          SERVICE_KEY="$(sudo sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' "$CORE_ENV" | head -n1)"
          curl -fsS "$SUPABASE_URL/rest/v1/n8n_workflow_registry?status=eq.READY&n8n_workflow_id=is.null&select=workflow_slug,version,config&order=workflow_slug.asc&limit=3" -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true
          echo
          REMOTE
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/n8n-ready-debug.txt
          git commit -m 'chore(n8n): record READY provisioning diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
