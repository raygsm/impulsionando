name: CHRISMED direct guided dashboard access
on:
  push:
    paths: ['.github/workflows/chrismed-finalize-cpf-coupon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enable safe prefilled email and direct destination
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/routes/auth.tsx')
          s=p.read_text()
          s=s.replace('''interface AuthSearch {\n  persona?: AuthPersona;\n  mode?: AuthMode;\n  next?: string;\n}''','''interface AuthSearch {\n  persona?: AuthPersona;\n  mode?: AuthMode;\n  next?: string;\n  email?: string;\n}''')
          s=s.replace('''    next: typeof s.next === "string" ? s.next : undefined,\n  }),''','''    next: typeof s.next === "string" ? s.next : undefined,\n    email: typeof s.email === "string" ? s.email : undefined,\n  }),''')
          s=s.replace('''    return <ChrismedProfessionalAuth initialMode={search.mode === "signup" ? "signup" : "login"} />;''','''    return <ChrismedProfessionalAuth initialMode={search.mode === "signup" ? "signup" : "login"} initialEmail={search.email} nextPath={safeNext(search.next)} />;''')
          p.write_text(s)

          p=Path('src/components/chrismed/ChrismedProfessionalAuth.tsx')
          s=p.read_text()
          s=s.replace('''export function ChrismedProfessionalAuth({ initialMode = "login" }: { initialMode?: AuthMode }) {''','''export function ChrismedProfessionalAuth({ initialMode = "login", initialEmail = "", nextPath = null }: { initialMode?: AuthMode; initialEmail?: string; nextPath?: string | null }) {''')
          s=s.replace('''  const [email, setEmail] = useState("");''','''  const [email, setEmail] = useState(initialEmail.trim());''',1)
          s=s.replace('''    if (isMaster) {\n      window.location.assign("/chrismed/admin");\n      return;\n    }''','''    if (isMaster) {\n      window.location.assign(nextPath || "/chrismed/admin");\n      return;\n    }''')
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name impulsionando-bot
          git config user.email actions@users.noreply.github.com
          git add src/routes/auth.tsx src/components/chrismed/ChrismedProfessionalAuth.tsx
          git commit -m "fix(chrismed): prefill admin email and honor direct destination"
          git pull --rebase origin main
          git push origin main
