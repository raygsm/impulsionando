name: CHRISMED finalize CPF and guided access
on:
  push:
    paths: ['.github/workflows/chrismed-finalize-cpf-coupon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch CHRISMED guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/routes/auth.tsx')
          s=p.read_text()
          s=s.replace('return msg || "Não foi possível concluir. Tente novamente.";', 'return "Não foi possível concluir o acesso. Confira os dados informados e tente novamente. Se continuar, use a ajuda disponível na tela.";', 1)
          p.write_text(s)

          p=Path('src/components/chrismed/ChrismedProfessionalAuth.tsx')
          s=p.read_text()
          s=s.replace('return message || "Não foi possível concluir. Tente novamente.";', 'return "Não foi possível concluir o acesso. Confira os dados informados e tente novamente. Se continuar, fale com o atendimento CHRISMED.";', 1)
          p.write_text(s)

          p=Path('src/routes/chrismed.agendar.tsx')
          s=p.read_text()
          s=s.replace('CPF inválido. Confira os números informados.</p>', 'CPF inválido — não é possível avançar. Confira os 11 números e corrija o CPF antes de continuar.</p>')
          old='<Button className="w-full bg-[var(--chrismed-ink)] text-[var(--chrismed-ivory)]" disabled={!patient.first_name || !isValidEmail(patient.email) || !isValidCPF(patient.doc)} onClick={() => setStep(\'confirm\')}>Continuar para confirmação</Button>'
          new='<div className="rounded-lg border border-[var(--chrismed-sand)] bg-[var(--chrismed-bone)] px-4 py-3 text-xs leading-relaxed text-[var(--chrismed-graphite)]"><strong>Antes de avançar:</strong> nome, e-mail e CPF precisam estar válidos. Se houver erro, corrija o campo indicado. O Impulsionito e o Oliver estão disponíveis para orientar você.</div><Button className="w-full bg-[var(--chrismed-ink)] text-[var(--chrismed-ivory)]" onClick={() => { if (!patient.first_name.trim()) { toast.error(\'Informe seu nome para continuar.\'); document.getElementById(\'fn\')?.focus(); return; } if (!isValidEmail(patient.email)) { toast.error(\'E-mail inválido. Confira o endereço completo antes de continuar.\'); document.getElementById(\'em\')?.focus(); return; } if (!isValidCPF(patient.doc)) { toast.error(\'CPF inválido. Confira os 11 números e corrija o CPF antes de continuar.\'); document.getElementById(\'doc\')?.focus(); return; } setStep(\'confirm\'); }}>Validar dados e continuar</Button><Button type="button" variant="outline" className="w-full" onClick={openOliver}>Preciso de ajuda</Button>'
          if old not in s: raise SystemExit('booking continue button not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/components/chrismed/ChrismedShell.tsx')
          s=p.read_text()
          old='''          <ChrismedFooter />\n        </div>'''
          new='''          <ChrismedFooter />\n          <button type="button" onClick={() => openChrismedOliver({ source: "journey_assist", intent: "help" })} className="fixed bottom-5 right-5 z-[70] rounded-full border border-white/20 bg-[var(--chrismed-forest-deep)] px-4 py-3 text-left text-xs font-semibold text-white shadow-2xl" aria-label="Pedir ajuda ao assistente CHRISMED"><span className="block text-[10px] uppercase tracking-[0.16em] text-[var(--chrismed-amber-soft)]">Impulsionito a postos</span><span className="block">Precisa de orientação? Fale com Oliver.</span></button>\n        </div>'''
          if old not in s: raise SystemExit('shell footer marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name impulsionando-bot
          git config user.email actions@users.noreply.github.com
          git add src/routes/auth.tsx src/components/chrismed/ChrismedProfessionalAuth.tsx src/routes/chrismed.agendar.tsx src/components/chrismed/ChrismedShell.tsx
          git commit -m "fix(chrismed): guide access errors and block invalid CPF"
          git pull --rebase origin main
          git push origin main
