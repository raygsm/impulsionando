name: CHRISMED Portuguese-only access guidance
on:
  push:
    paths: ['.github/workflows/chrismed-finalize-cpf-coupon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove raw provider errors from access journeys
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/routes/auth.tsx')
          s=p.read_text()
          raw='return msg ? `Não foi possível concluir a solicitação: ${msg}` : "Não foi possível concluir o acesso. Tente novamente.";'
          safe='return "Não foi possível concluir o acesso. Confira os dados informados e tente novamente. Se continuar, peça ajuda ao Impulsionito nesta tela.";'
          if raw not in s: raise SystemExit('raw auth fallback not found')
          s=s.replace(raw,safe,1)
          p.write_text(s)

          p=Path('src/routes/reset-password.tsx')
          s=p.read_text()
          raw='if (error) return toast.error(error.message);'
          safe='if (error) return toast.error("Não foi possível salvar a nova senha. Confira os requisitos, solicite um novo link se este tiver expirado e tente novamente.");'
          if raw in s: s=s.replace(raw,safe,1)
          p.write_text(s)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name impulsionando-bot
          git config user.email actions@users.noreply.github.com
          git add src/routes/auth.tsx src/routes/reset-password.tsx
          git commit -m "fix(chrismed): keep access errors actionable and Portuguese-only"
          git pull --rebase origin main
          git push origin main
