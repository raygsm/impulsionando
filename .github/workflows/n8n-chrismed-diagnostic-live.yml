name: CHRISMED n8n live diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/n8n-chrismed-diagnostic-live.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Collect read-only runtime proof
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/n8n-diagnostic.txt 2>&1 <<'REMOTE'
          set -u
          C=n8n-umlg-n8n-1
          echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo '--- container ---'
          sudo docker inspect "$C" --format 'status={{.State.Status}} started={{.State.StartedAt}}' || true
          echo '--- health ---'
          sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(async r=>{console.log(r.status,await r.text())}).catch(e=>{console.error(e.message);process.exit(1)})" || true
          echo '--- networks ---'
          sudo docker inspect "$C" --format '{{json .NetworkSettings.Networks}}' || true
          echo '--- export summary ---'
          sudo docker exec "$C" n8n export:workflow --all --output=/tmp/all-workflows.json >/tmp/n8n-export.out 2>&1 || { cat /tmp/n8n-export.out; true; }
          sudo docker exec "$C" node - <<'NODE' || true
const fs=require('fs');
try {
 const raw=JSON.parse(fs.readFileSync('/tmp/all-workflows.json','utf8'));
 const arr=Array.isArray(raw)?raw:[raw];
 const chr=arr.filter(w=>String(w.id||'').startsWith('iu') || String(w.name||'').toLowerCase().includes('chrismed'));
 console.log(JSON.stringify({total:arr.length,active:arr.filter(w=>w.active).length,chrismed_like:chr.length,chrismed_active:chr.filter(w=>w.active).length,sample:chr.slice(0,12).map(w=>({id:w.id,name:w.name,active:w.active,activeVersionId:w.activeVersionId||null}))},null,2));
} catch(e){ console.log('export_parse_error='+e.message); }
NODE
          echo '--- recent n8n logs ---'
          sudo docker logs --tail 120 "$C" 2>&1 || true
          REMOTE
          mkdir -p docs/ops
          cp /tmp/n8n-diagnostic.txt docs/ops/n8n-chrismed-live-diagnostic.txt
      - name: Commit diagnostic proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito CHRISMED QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/n8n-chrismed-live-diagnostic.txt
          git commit -m 'chore(chrismed): record live n8n diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
