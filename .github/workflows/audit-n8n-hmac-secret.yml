name: Audit n8n HMAC secret

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/audit-n8n-hmac-secret.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit sanitized secret presence and equality
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -eu
            CORE_ENV=/etc/impulsionando-core.env
            N8N_ENV=/docker/n8n-umlg/.env
            N8N_CONTAINER=n8n-umlg-n8n-1

            get_var() {
              file="$1"
              key="$2"
              [ -f "$file" ] || return 0
              awk -v k="$key" 'index($0,k"=")==1 {print substr($0,length(k)+2); exit}' "$file"
            }

            CORE_HMAC=$(get_var "$CORE_ENV" IMPULSIONANDO_WEBHOOK_SECRET)
            CORE_BRIDGE=$(get_var "$CORE_ENV" N8N_OLIVER_BRIDGE_TOKEN)
            N8N_HMAC=$(get_var "$N8N_ENV" IMPULSIONANDO_WEBHOOK_SECRET)
            N8N_BRIDGE=$(get_var "$N8N_ENV" N8N_OLIVER_BRIDGE_TOKEN)

            [ -n "$CORE_HMAC" ] && echo CORE_HMAC=PRESENT || echo CORE_HMAC=MISSING
            [ -n "$CORE_BRIDGE" ] && echo CORE_BRIDGE=PRESENT || echo CORE_BRIDGE=MISSING
            [ -n "$N8N_HMAC" ] && echo N8N_HMAC=PRESENT || echo N8N_HMAC=MISSING
            [ -n "$N8N_BRIDGE" ] && echo N8N_BRIDGE=PRESENT || echo N8N_BRIDGE=MISSING

            if [ -n "$N8N_HMAC" ] && [ -n "$N8N_BRIDGE" ]; then
              [ "$N8N_HMAC" = "$N8N_BRIDGE" ] && echo N8N_HMAC_EQUALS_BRIDGE=YES || echo N8N_HMAC_EQUALS_BRIDGE=NO
            fi
            if [ -n "$CORE_BRIDGE" ] && [ -n "$N8N_HMAC" ]; then
              [ "$CORE_BRIDGE" = "$N8N_HMAC" ] && echo CORE_BRIDGE_EQUALS_N8N_HMAC=YES || echo CORE_BRIDGE_EQUALS_N8N_HMAC=NO
            fi

            if docker ps --format '{{.Names}}' | grep -qx "$N8N_CONTAINER"; then
              if docker inspect "$N8N_CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.'; then
                echo N8N_RUNTIME_HMAC=PRESENT
              else
                echo N8N_RUNTIME_HMAC=MISSING
              fi
              if docker inspect "$N8N_CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^N8N_OLIVER_BRIDGE_TOKEN=.'; then
                echo N8N_RUNTIME_BRIDGE=PRESENT
              else
                echo N8N_RUNTIME_BRIDGE=MISSING
              fi
            else
              echo N8N_RUNTIME=CONTAINER_MISSING
              exit 1
            fi
