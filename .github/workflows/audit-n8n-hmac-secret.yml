name: Audit n8n HMAC secret

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/audit-n8n-hmac-secret.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit sanitized secret presence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            CORE_ENV=/etc/impulsionando-core.env
            N8N_DIR=/docker/n8n-umlg
            N8N_ENV=$N8N_DIR/.env
            N8N_CONTAINER=n8n-umlg-n8n-1

            present_file_var() {
              file="$1"
              key="$2"
              if [ -f "$file" ] && grep -q "^${key}=." "$file"; then echo PRESENT; else echo MISSING; fi
            }

            echo "CORE_IMPULSIONANDO_WEBHOOK_SECRET=$(present_file_var "$CORE_ENV" IMPULSIONANDO_WEBHOOK_SECRET)"
            echo "CORE_N8N_OLIVER_BRIDGE_TOKEN=$(present_file_var "$CORE_ENV" N8N_OLIVER_BRIDGE_TOKEN)"
            echo "N8N_FILE_IMPULSIONANDO_WEBHOOK_SECRET=$(present_file_var "$N8N_ENV" IMPULSIONANDO_WEBHOOK_SECRET)"
            echo "N8N_FILE_N8N_OLIVER_BRIDGE_TOKEN=$(present_file_var "$N8N_ENV" N8N_OLIVER_BRIDGE_TOKEN)"

            if docker ps --format '{{.Names}}' | grep -qx "$N8N_CONTAINER"; then
              if docker exec "$N8N_CONTAINER" sh -lc 'test -n "$IMPULSIONANDO_WEBHOOK_SECRET"' >/dev/null 2>&1; then
                echo "N8N_RUNTIME_IMPULSIONANDO_WEBHOOK_SECRET=PRESENT"
              else
                echo "N8N_RUNTIME_IMPULSIONANDO_WEBHOOK_SECRET=MISSING"
              fi
              if docker exec "$N8N_CONTAINER" sh -lc 'test -n "$N8N_OLIVER_BRIDGE_TOKEN"' >/dev/null 2>&1; then
                echo "N8N_RUNTIME_N8N_OLIVER_BRIDGE_TOKEN=PRESENT"
              else
                echo "N8N_RUNTIME_N8N_OLIVER_BRIDGE_TOKEN=MISSING"
              fi
            else
              echo "N8N_RUNTIME=CONTAINER_MISSING"
            fi
