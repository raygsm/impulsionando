name: WMP n8n verifier node diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-verifier-node-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Inspect verifier input chain
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/$id-v.json" >/dev/null
            sudo docker exec -i -e WID="$id" "$C" node - <<'NODE'
          const fs=require('fs');
          const id=process.env.WID;
          const raw=JSON.parse(fs.readFileSync('/tmp/'+id+'-v.json','utf8'));
          const w=Array.isArray(raw)?raw[0]:raw;
          console.log('WORKFLOW='+id);
          console.log('NODES='+JSON.stringify((w.nodes||[]).map(n=>({name:n.name,type:n.type,parameters:n.parameters})),null,2));
          console.log('CONNECTIONS='+JSON.stringify(w.connections||{},null,2));
          NODE
          done
          REMOTE
