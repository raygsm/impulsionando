name: Dispatch core reconciliations once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-dispatch-reconcile-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reconciliations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run all-client-subdomains-reconcile.yml --repo "$REPO" --ref main
          gh workflow run n8n-universal-ready-provisioner-v3.yml --repo "$REPO" --ref main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove dispatcher
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git rm -f .github/workflows/ops-dispatch-reconcile-once.yml
          git commit -m 'chore(core): retire reconciliation dispatcher'
          git pull --rebase origin main
          git push origin HEAD:main
