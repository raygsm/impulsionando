name: RETIRED - Impulsionando Front Final Recovery

# Historical recovery workflow kept as an explicit fail-closed tombstone.
# It must never invoke the legacy VPS publisher or write release proof back to main.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: legacy recovery publisher is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
