name: Provision Ana Madu OpenAI Credential

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/anamadu-client-openai-secret.yml

concurrency:
  group: anamadu-openai-credential
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provision:
    name: Provision client-specific credential and publish Ana Madu
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required secrets
        env:
          ANAMADU_OPENAI_API_KEY: ${{ secrets.ANAMADU_OPENAI_API_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ANAMADU_OPENAI_API_KEY:-}"
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_SSH_KEY:-}"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Install Ana Madu credential without exposing value
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          ANAMADU_OPENAI_API_KEY: ${{ secrets.ANAMADU_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf 'ANAMADU_OPENAI_API_KEY=%s\n' "$ANAMADU_OPENAI_API_KEY" > "$secret_file"
          chmod 0600 "$secret_file"
          scp "$secret_file" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/anamadu-openai.env"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          incoming=/tmp/anamadu-openai.env
          target=/etc/impulsionando-core.env
          sudo test -f "$target"
          sudo test -s "$incoming"
          tmp="$(mktemp)"
          sudo grep -v '^ANAMADU_OPENAI_API_KEY=' "$target" > "$tmp" || true
          sudo cat "$incoming" >> "$tmp"
          sudo install -o root -g root -m 0600 "$tmp" "$target"
          rm -f "$tmp" "$incoming"
          sudo grep -q '^ANAMADU_OPENAI_API_KEY=.' "$target"
          REMOTE

      - name: Promote validated Ana Madu release to runtime and edge
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          RELEASE_DIR=/var/www/impulsionando-core/releases/23c7d1ba2abc3f8616adf61cb1115141985ebc32
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          test -f "$RELEASE_DIR/.output/server/index.mjs"
          test -f "$COMPOSE"

          sudo ln -sfn "$RELEASE_DIR" /var/www/impulsionando-core/current
          sudo systemctl restart impulsionando-core
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then break; fi
            [ "$attempt" -lt 30 ] || exit 61
            sleep 1
          done

          catalog_code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -H 'Accept: application/json' -o /tmp/anamadu-catalog.json -w '%{http_code}' http://127.0.0.1:3000/api/anamadu/catalog || true)"
          echo "ANAMADU_CATALOG_PRIME HTTP=$catalog_code"
          [ "$catalog_code" = '200' ] || { cat /tmp/anamadu-catalog.json; exit 60; }

          printf 'node_modules\n' > "$RELEASE_DIR/.dockerignore"
          cat > /tmp/Dockerfile.impulsionando-runtime <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE

          sudo docker build -f /tmp/Dockerfile.impulsionando-runtime -t impulsionando-core:latest "$RELEASE_DIR"
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core

          for attempt in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null || true)"
            if [ -n "$ip" ]; then
              code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -o /tmp/anamadu-home -w '%{http_code}' "http://$ip:3000/" || true)"
              case "$code" in 2*|3*) break ;; esac
            fi
            [ "$attempt" -lt 45 ] || { sudo docker logs --tail 120 impulsionando-core || true; exit 62; }
            sleep 2
          done

          health_code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -o /tmp/anamadu-health.json -w '%{http_code}' "http://$ip:3000/api/anamadu/health" || true)"
          echo "ANAMADU_HEALTH HTTP=$health_code"
          cat /tmp/anamadu-health.json
          [ "$health_code" = '200' ] || exit 63
          grep -q '"openaiConfigured":true' /tmp/anamadu-health.json
          echo 'ANAMADU_RUNTIME_EDGE=PASS'
          REMOTE

      - name: Validate public Ana Madu
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            code="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/anamadu-public.html -w '%{http_code}' 'https://anamadu.impulsionando.com.br/' || true)"
            echo "PUBLIC_ANAMADU HTTP=$code attempt=$attempt"
            if [ "$code" = '200' ]; then exit 0; fi
            sleep 3
          done
          exit 64
