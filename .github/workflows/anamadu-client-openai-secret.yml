name: Provision Ana Madu OpenAI Credential

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/anamadu-client-openai-secret.yml

concurrency:
  group: anamadu-openai-credential
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  provision:
    name: Provision client-specific credential
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required secrets
        env:
          ANAMADU_OPENAI_API_KEY: ${{ secrets.ANAMADU_OPENAI_API_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ANAMADU_OPENAI_API_KEY:-}"
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_SSH_KEY:-}"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Install Ana Madu credential without exposing value
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          ANAMADU_OPENAI_API_KEY: ${{ secrets.ANAMADU_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf 'ANAMADU_OPENAI_API_KEY=%s\n' "$ANAMADU_OPENAI_API_KEY" > "$secret_file"
          chmod 0600 "$secret_file"
          scp "$secret_file" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/anamadu-openai.env"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          incoming=/tmp/anamadu-openai.env
          target=/etc/impulsionando-core.env
          sudo test -f "$target"
          sudo test -s "$incoming"
          tmp="$(mktemp)"
          sudo grep -v '^ANAMADU_OPENAI_API_KEY=' "$target" > "$tmp" || true
          sudo cat "$incoming" >> "$tmp"
          sudo install -o root -g root -m 0600 "$tmp" "$target"
          rm -f "$tmp" "$incoming"
          sudo grep -q '^ANAMADU_OPENAI_API_KEY=.' "$target"
          REMOTE

      - name: Restart Core runtimes and verify local health
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo systemctl restart impulsionando-core
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then break; fi
            [ "$attempt" -lt 30 ] || exit 61
            sleep 1
          done
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          if sudo test -f "$COMPOSE"; then
            cd /opt/impulsionando/deploy/hostinger
            sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core
            for attempt in $(seq 1 30); do
              ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null || true)"
              if [ -n "$ip" ] && curl -fsS -H 'Host: anamadu.impulsionando.com.br' "http://$ip:3000/api/anamadu/health" >/tmp/anamadu-health.json; then break; fi
              [ "$attempt" -lt 30 ] || { sudo docker logs --tail 100 impulsionando-core || true; exit 62; }
              sleep 2
            done
          fi
          REMOTE
