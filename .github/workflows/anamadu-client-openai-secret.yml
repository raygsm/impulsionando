name: Publish Ana Madu Storefront

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/anamadu-client-openai-secret.yml

concurrency:
  group: anamadu-storefront-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build, provision and publish Ana Madu
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required secrets
        env:
          ANAMADU_OPENAI_API_KEY: ${{ secrets.ANAMADU_OPENAI_API_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${ANAMADU_OPENAI_API_KEY:-}"
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_SSH_KEY:-}"

      - name: Build current Core with Ana Madu fixes
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx vitest run src/lib/subdomain.test.ts
          npm run build
          test -f .output/server/index.mjs
          test -f scripts/start-core-runtime.mjs

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts

      - name: Package and upload release
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          tar -czf /tmp/anamadu-release.tgz .output scripts package.json package-lock.json
          scp /tmp/anamadu-release.tgz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/anamadu-release.tgz"

      - name: Install dedicated credential and publish runtime
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          ANAMADU_OPENAI_API_KEY: ${{ secrets.ANAMADU_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf 'ANAMADU_OPENAI_API_KEY=%s\n' "$ANAMADU_OPENAI_API_KEY" > "$secret_file"
          chmod 0600 "$secret_file"
          scp "$secret_file" "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/anamadu-openai.env"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "RELEASE_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          RELEASE_DIR="/var/www/impulsionando-core/releases/$RELEASE_SHA"
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          ENV_FILE=/etc/impulsionando-core.env

          sudo test -f "$ENV_FILE"
          tmp="$(mktemp)"
          sudo grep -v '^ANAMADU_OPENAI_API_KEY=' "$ENV_FILE" > "$tmp" || true
          sudo cat /tmp/anamadu-openai.env >> "$tmp"
          sudo install -o root -g root -m 0600 "$tmp" "$ENV_FILE"
          rm -f "$tmp" /tmp/anamadu-openai.env
          sudo grep -q '^ANAMADU_OPENAI_API_KEY=.' "$ENV_FILE"

          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/anamadu-release.tgz -C "$RELEASE_DIR"
          rm -f /tmp/anamadu-release.tgz
          cd "$RELEASE_DIR"
          test -f .output/server/index.mjs
          npm ci --omit=dev --no-audit --no-fund

          sudo ln -sfn "$RELEASE_DIR" /var/www/impulsionando-core/current
          sudo systemctl restart impulsionando-core
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null; then break; fi
            [ "$attempt" -lt 30 ] || { sudo journalctl --no-pager -u impulsionando-core -n 120; exit 61; }
            sleep 1
          done

          catalog_code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -H 'Accept: application/json' -o /tmp/anamadu-catalog.json -w '%{http_code}' http://127.0.0.1:3000/api/anamadu/catalog || true)"
          echo "ANAMADU_SYSTEMD_CATALOG HTTP=$catalog_code"
          [ "$catalog_code" = '200' ] || { cat /tmp/anamadu-catalog.json || true; exit 60; }

          printf 'node_modules\n' > "$RELEASE_DIR/.dockerignore"
          cat > /tmp/Dockerfile.anamadu-runtime <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE

          sudo docker build -f /tmp/Dockerfile.anamadu-runtime -t impulsionando-core:latest "$RELEASE_DIR"
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core

          for attempt in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null || true)"
            if [ -n "$ip" ]; then
              home_code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -o /tmp/anamadu-home -w '%{http_code}' "http://$ip:3000/" || true)"
              case "$home_code" in 2*|3*) break ;; esac
            fi
            [ "$attempt" -lt 45 ] || { sudo docker logs --tail 120 impulsionando-core || true; exit 62; }
            sleep 2
          done

          health_code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -o /tmp/anamadu-health.json -w '%{http_code}' "http://$ip:3000/api/anamadu/health" || true)"
          catalog_code="$(curl -sS -H 'Host: anamadu.impulsionando.com.br' -o /tmp/anamadu-edge-catalog.json -w '%{http_code}' "http://$ip:3000/api/anamadu/catalog" || true)"
          echo "ANAMADU_EDGE home=$home_code health=$health_code catalog=$catalog_code"
          [ "$health_code" = '200' ] || { cat /tmp/anamadu-health.json || true; exit 63; }
          [ "$catalog_code" = '200' ] || exit 64
          grep -q '"openaiConfigured":true' /tmp/anamadu-health.json
          grep -Eq '"productCount":[1-9][0-9]*' /tmp/anamadu-health.json
          grep -Eq '"count":[1-9][0-9]*' /tmp/anamadu-edge-catalog.json
          REMOTE

      - name: Validate public Ana Madu
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            home_code="$(curl --location --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/anamadu-public.html -w '%{http_code}' 'https://anamadu.impulsionando.com.br/' || true)"
            health_code="$(curl --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/anamadu-public-health.json -w '%{http_code}' 'https://anamadu.impulsionando.com.br/api/anamadu/health' || true)"
            catalog_code="$(curl --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/anamadu-public-catalog.json -w '%{http_code}' 'https://anamadu.impulsionando.com.br/api/anamadu/catalog' || true)"
            echo "PUBLIC_ANAMADU home=$home_code health=$health_code catalog=$catalog_code attempt=$attempt"
            if [ "$home_code" = '200' ] && [ "$health_code" = '200' ] && [ "$catalog_code" = '200' ]; then
              grep -q '"openaiConfigured":true' /tmp/anamadu-public-health.json
              grep -Eq '"productCount":[1-9][0-9]*' /tmp/anamadu-public-health.json
              grep -Eq '"count":[1-9][0-9]*' /tmp/anamadu-public-catalog.json
              exit 0
            fi
            sleep 3
          done
          exit 65
