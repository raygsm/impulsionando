name: Verify CHRISMED N8N worker
on:
  push:
    branches: [main]
    paths: [.github/workflows/install-chrismed-n8n-worker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Verify persistent CHRISMED N8N worker
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          WF_ID=chrismedOutboxWorker01
          URL=https://n8n.impulsionando.com.br/webhook/chrismed-outbox-worker

          sudo docker exec "$N8N" n8n export:workflow --id="$WF_ID" --output=/tmp/chrismed-worker-export.json >/dev/null
          sudo docker exec "$N8N" node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/chrismed-worker-export.json","utf8"));const w=Array.isArray(r)?r[0]:r;console.log(JSON.stringify({id:w.id,name:w.name,active:w.active,activeVersionId:w.activeVersionId||null},null,2));if(!w.active||!w.activeVersionId)process.exit(9)'

          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/chrismed-worker-response.json -w '%{http_code}' --max-time 40 -X POST "$URL" -H 'content-type: application/json' -d '{}')"
            echo "attempt_${i}_http=$code"
            if [ "${code#2}" != "$code" ]; then
              cat /tmp/chrismed-worker-response.json
              echo
              ready=1
              break
            fi
            if [ "$code" != "404" ]; then cat /tmp/chrismed-worker-response.json || true; echo; fi
            sleep 3
          done
          test "$ready" -eq 1

          sudo docker restart "$N8N" >/dev/null
          for i in $(seq 1 45); do
            if sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/chrismed-worker-response-after.json -w '%{http_code}' --max-time 40 -X POST "$URL" -H 'content-type: application/json' -d '{}')"
            echo "post_restart_attempt_${i}_http=$code"
            if [ "${code#2}" != "$code" ]; then
              cat /tmp/chrismed-worker-response-after.json
              echo
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1
          echo 'N8N_CHRISMED_OUTBOX_WORKER=PASS'
          REMOTE
