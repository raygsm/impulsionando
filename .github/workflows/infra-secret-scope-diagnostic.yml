name: Infra secret scope diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/infra-secret-scope-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${1:-}" ]; then printf true; else printf false; fi; }
          mkdir -p docs/ops
          cat > docs/ops/infra-secret-scope-status.json <<JSON
          {
            "generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_sha": "$GITHUB_SHA",
            "repo_scope": {
              "vps_host": $(present "$VPS_HOST"),
              "vps_user": $(present "$VPS_USER"),
              "vps_ssh_key": $(present "$VPS_SSH_KEY"),
              "cloudflare_api_token": $(present "$CF_API_TOKEN"),
              "cloudflare_zone_id": $(present "$CF_ZONE_ID"),
              "supabase_url": $(present "$SUPABASE_URL"),
              "supabase_service_role_key": $(present "$SUPABASE_SERVICE_ROLE_KEY")
            }
          }
          JSON
          cat docs/ops/infra-secret-scope-status.json

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/infra-secret-scope-status.json
          git commit -m 'chore(infra): record GitHub secret scope diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
