name: Temporary audit n8n webhook security

on:
  push:
    branches:
      - agent/core-n8n-centralization-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-webhook-security.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Classify webhook authentication without secrets
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            MOUNT=$(docker inspect "$C" --format '{{range .Mounts}}{{if eq .Destination "/home/node/.n8n"}}{{.Source}}{{end}}{{end}}')
            DB="$MOUNT/database.sqlite"
            test -f "$DB"
            DB_PATH="$DB" python3 -c 'import os,sqlite3,json; ids=set("kjdkkV9rjIMgAMdA YT7nYlKuQryGUNEq TwxMj5XSMgUEbXiD NYX6Bo1dlyd7b3P7 J2vrRXk9L2WoRfam s1fiGRPTRcyeAPyt CUFC3smxigoC5hOx FmNmDqMNYbbW3fM7 WavassyWPggKwThY cBPqXfXfP0H3pAbs 7i5gHQnraIKzgdz1 njO3SGf3tl3j8wh0 SXW6oLezwWFvAGwN y080sHJouKP66SAH iGZ5djNpjie6WSTB VwGvbkMMVKU2CQ3E 1QysKcsGaLHountH vvqBbKmhz6gF1szf hdyhky3EYUcOPaAk NcPcGGHAbAmbrMiG QSfPQDe2C63j7ZNp JJu7F0uXxS1RN7BK 0dA5lyMj9LtObOdg SMbKe6dT2j2Qs9gt F0asmrhkiplhhrYW 3m68WaCpdlC6G9Vh".split()); con=sqlite3.connect("file:"+os.environ["DB_PATH"]+"?mode=ro",uri=True); cur=con.cursor(); rows=cur.execute("select id,name,active,nodes from workflow_entity where id in (%s)" % ",".join("?"*len(ids)), tuple(ids)).fetchall(); print("ID|ACTIVE|WEBHOOK_AUTH|SIG_HEADER_REF|CRYPTO_HMAC_REF|CODE_NODES|HTTP_NODES");
for wid,name,active,nodes_raw in sorted(rows):
  try: nodes=json.loads(nodes_raw or "[]")
  except Exception: nodes=[]
  web=[n for n in nodes if "webhook" in str(n.get("type","")).lower() and "respond" not in str(n.get("type","")).lower()]
  auth=",".join(sorted(set(str((n.get("parameters") or {}).get("authentication","none")) for n in web))) or "none"
  text=json.dumps(nodes,ensure_ascii=False).lower()
  sig="yes" if "x-impulsionando-signature" in text else "no"
  hmac="yes" if "hmac" in text or "createhmac" in text or "sha256" in text else "no"
  code=sum(1 for n in nodes if any(x in str(n.get("type","")).lower() for x in ("code","function")))
  http=sum(1 for n in nodes if "httprequest" in str(n.get("type","")).lower())
  print(f"{wid}|{1 if active else 0}|{auth}|{sig}|{hmac}|{code}|{http}")
con.close()'