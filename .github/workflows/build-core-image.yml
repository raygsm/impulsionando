name: Build Core Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - pnpm-lock.yaml
      - bun.lock
      - src/**
      - public/**
      - scripts/**
      - vite.config.*
      - tsconfig.json
      - .github/workflows/build-core-image.yml

concurrency:
  group: core-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/raygsm/impulsionando-core

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish one immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VITE_PUBLIC_SITE_URL=https://impulsionando.com.br
            VITE_SUPABASE_URL=https://arygtqrdpcdkwnuwsgmm.supabase.co

      - name: Publish build identity
        run: |
          echo "IMAGE=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "VPS_BUILD_REQUIRED=false" >> "$GITHUB_STEP_SUMMARY"
