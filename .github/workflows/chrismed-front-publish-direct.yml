name: RETIRED - CHRISMED front publish direct

# Historical workflow kept as a fail-closed tombstone.
# CHRISMED is a tenant of the canonical Core and must never publish frontend independently.
# Production Front is the single frontend publication authority.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Canonical publication authority
        run: |
          echo "::error::RETIRED: CHRISMED direct frontend publication is disabled."
          echo "Use .github/workflows/production-front.yml (Production Front)."
          exit 1
