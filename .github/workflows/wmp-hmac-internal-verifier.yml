name: WMP HMAC internal verifier

on:
  push:
    paths:
      - .github/workflows/wmp-hmac-internal-verifier.yml

permissions:
  contents: read

concurrency:
  group: wmp-hmac-internal-verifier
  cancel-in-progress: false

jobs:
  secure-cutover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Install internal verifier and cut over canonical WMP workflows
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          N8N=n8n-umlg-n8n-1
          VERIFY=wmp-hmac-verifier
          SEC=/etc/impulsionando-security.env
          test -f "$SEC"
          sudo grep -q '^IMPULSIONANDO_WEBHOOK_SECRET=.' "$SEC"
          network="$(sudo docker inspect "$N8N" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | head -n1)"
          test -n "$network"

          sudo install -d -m 0755 /opt/impulsionando/security
          cat >/tmp/wmp-hmac-verifier.mjs <<'NODE'
          import http from 'node:http';
          import fs from 'node:fs';
          import { createHmac, timingSafeEqual } from 'node:crypto';
          const env = fs.readFileSync('/run/secrets/security.env','utf8');
          const line = env.split(/\r?\n/).find((x)=>x.startsWith('IMPULSIONANDO_WEBHOOK_SECRET=')) || '';
          const secret = line.slice('IMPULSIONANDO_WEBHOOK_SECRET='.length);
          if (!secret) throw new Error('hmac secret unavailable');
          function safe(a,b){
            if(!/^[a-f0-9]{64}$/i.test(a||'')) return false;
            const x=Buffer.from(a,'hex'), y=Buffer.from(b,'hex');
            return x.length===y.length && timingSafeEqual(x,y);
          }
          const server=http.createServer((req,res)=>{
            if(req.method==='GET' && req.url==='/healthz'){
              res.writeHead(200,{'content-type':'application/json'}); return res.end('{"ok":true}');
            }
            if(req.method!=='POST' || req.url!=='/verify'){
              res.writeHead(404,{'content-type':'application/json'}); return res.end('{"ok":false}');
            }
            const chunks=[]; req.on('data',(c)=>chunks.push(c)); req.on('end',()=>{
              const raw=Buffer.concat(chunks).toString('utf8');
              const supplied=String(req.headers['x-impulsionando-signature']||'').replace(/^sha256=/,'');
              const expected=createHmac('sha256',secret).update(raw).digest('hex');
              if(!safe(supplied,expected)){
                res.writeHead(401,{'content-type':'application/json'}); return res.end('{"ok":false,"authorized":false,"error":"invalid_signature"}');
              }
              try {
                const p=JSON.parse(raw);
                for (const k of ['workflow_name','event_code','tenant_slug','correlation_id','dispatched_at','data']) if (!(k in p)) throw new Error('invalid');
                res.writeHead(200,{'content-type':'application/json'});
                return res.end(JSON.stringify({ok:true,authorized:true,workflow_name:p.workflow_name,event_code:p.event_code,tenant_slug:p.tenant_slug,correlation_id:p.correlation_id}));
              } catch {
                res.writeHead(422,{'content-type':'application/json'}); return res.end('{"ok":false,"authorized":false,"error":"invalid_dispatch_payload"}');
              }
            });
          });
          server.listen(8080,'0.0.0.0');
          NODE
          sudo install -m 0644 /tmp/wmp-hmac-verifier.mjs /opt/impulsionando/security/wmp-hmac-verifier.mjs
          rm -f /tmp/wmp-hmac-verifier.mjs

          sudo docker rm -f "$VERIFY" >/dev/null 2>&1 || true
          sudo docker run -d --name "$VERIFY" --restart unless-stopped \
            --network "$network" \
            -v /opt/impulsionando/security/wmp-hmac-verifier.mjs:/srv/verifier.mjs:ro \
            -v /etc/impulsionando-security.env:/run/secrets/security.env:ro \
            node:22-alpine node /srv/verifier.mjs >/dev/null

          for i in $(seq 1 30); do
            if sudo docker exec "$N8N" node -e "fetch('http://$VERIFY:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            [ "$i" -lt 30 ] || exit 70
            sleep 1
          done

          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$N8N" n8n export:workflow --id="$id" --output="/tmp/$id-secure.json" >/dev/null
            sudo docker exec -e WID="$id" "$N8N" node - <<'NODE'
          const fs=require('fs');
          const id=process.env.WID;
          const path='/tmp/'+id+'-secure.json';
          const raw=JSON.parse(fs.readFileSync(path,'utf8'));
          const w=Array.isArray(raw)?raw[0]:raw;
          const n=(w.nodes||[]).find(x=>x.name==='Verify signature in Core' || x.type==='n8n-nodes-base.httpRequest');
          if(!n) process.exit(2);
          n.name='Verify signature internally';
          n.parameters.url='http://wmp-hmac-verifier:8080/verify';
          fs.writeFileSync(path,JSON.stringify([w]));
          NODE
            sudo docker exec "$N8N" n8n import:workflow --input="/tmp/$id-secure.json" >/dev/null
            sudo docker exec "$N8N" n8n publish:workflow --id="$id" >/dev/null
          done
          sudo docker restart "$N8N" >/dev/null

          for i in $(seq 1 45); do
            if sudo docker exec "$N8N" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            [ "$i" -lt 45 ] || exit 71
            sleep 2
          done

          probe() {
            id="$1"; path="$2"; event="$3"; ts="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"; url="https://n8n.impulsionando.com.br/webhook/$path"
            payload="{\"workflow_name\":\"$id\",\"event_code\":\"$event\",\"tenant_slug\":\"wmp\",\"correlation_id\":\"probe-$id-$(date +%s)\",\"company_id\":null,\"dispatched_at\":\"$ts\",\"data\":{\"probe\":true}}"
            uc="$(curl -sS -o /tmp/u -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' --data-binary "$payload")"
            echo "$id unsigned=$uc"; [ "$uc" = 401 ] || exit 72
            secret="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$SEC" | head -n1)"
            sig="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}')"
            sc="$(curl -sS -o /tmp/s -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' -H "x-impulsionando-signature: $sig" --data-binary "$payload")"
            echo "$id signed=$sc body=$(head -c 160 /tmp/s)"; [ "$sc" = 200 ] || exit 73
            grep -q '"ok":true' /tmp/s || exit 74
          }
          probe wmpLeadIntake01 wmp-lead-intake wmp.lead.received
          probe wmpProposalLifecycle01 wmp-proposal-lifecycle wmp.proposal.sent
          probe wmpDjLifecycle01 wmp-dj-booking-lifecycle wmp.dj.offered
          probe wmpPostEvent01 wmp-post-event-relationship wmp.event.completed
          echo 'WMP_HMAC_INTERNAL=PASS'
          REMOTE
