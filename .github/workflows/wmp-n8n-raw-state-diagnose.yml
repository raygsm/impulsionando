name: WMP n8n raw state diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-raw-state-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect workflow state and activation logs
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          echo "N8N_VERSION=$(sudo docker exec "$C" n8n --version)"
          echo 'CLI:'
          sudo docker exec "$C" n8n --help 2>/dev/null | grep -E 'workflow|publish|unpublish|activate' || true
          for id in wmpLeadIntake01 wmpProposalLifecycle01 wmpDjLifecycle01 wmpPostEvent01; do
            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/$id-state.json" >/dev/null
            sudo docker exec -i -e WID="$id" "$C" node - <<'NODE'
          const fs=require('fs'),id=process.env.WID;
          const r=JSON.parse(fs.readFileSync('/tmp/'+id+'-state.json','utf8'));const w=Array.isArray(r)?r[0]:r;
          const h=(w.nodes||[]).find(n=>n.type==='n8n-nodes-base.webhook');const v=(w.nodes||[]).find(n=>n.name==='Verify signature in Core');
          console.log(JSON.stringify({id:w.id,active:w.active,activeVersionId:w.activeVersionId,versionId:w.versionId,path:h?.parameters?.path,webhookId:h?.webhookId,rawBody:h?.parameters?.options?.rawBody,contentType:v?.parameters?.contentType,input:v?.parameters?.inputDataFieldName}));
          NODE
          done
          echo 'RECENT_N8N_LOGS:'
          sudo docker logs --since 15m "$C" 2>&1 | grep -Ei 'wmp|webhook|workflow|error|activate|publish' | tail -n 240 || true
          REMOTE
