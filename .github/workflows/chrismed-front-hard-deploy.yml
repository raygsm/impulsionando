name: CHRISMED final front hard deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-front-hard-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrismed-front-hard-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build current main in Actions
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          test -d .output/public
          test -f scripts/start-core-runtime.mjs
          printf '%s\n' "${GITHUB_SHA}" > .output/public/chrismed-release-sha.txt
          tar -czf /tmp/chrismed-core-release.tgz .output scripts package.json package-lock.json
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          scp /tmp/chrismed-core-release.tgz "$VPS_USER@$VPS_HOST:/tmp/chrismed-core-release.tgz"
      - name: Activate release with rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "TARGET_SHA='${GITHUB_SHA}' bash -s" > /tmp/chrismed-front-hard-deploy.txt 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          RELEASE_ROOT=/var/www/impulsionando-core/releases
          CURRENT=/var/www/impulsionando-core/current
          COMPOSE=/opt/impulsionando/deploy/hostinger/docker-compose.yml
          RELEASE="$RELEASE_ROOT/chrismed-$TARGET_SHA"
          PREVIOUS="$(readlink -f "$CURRENT" 2>/dev/null || true)"
          OLD_IMAGE="$(sudo docker inspect -f '{{.Image}}' impulsionando-core 2>/dev/null || true)"
          switched=0
          edge_switched=0
          rollback(){
            rc=$?
            set +e
            echo "ROLLBACK rc=$rc"
            if [ "$switched" -eq 1 ] && [ -n "$PREVIOUS" ] && [ -f "$PREVIOUS/.output/server/index.mjs" ]; then
              sudo ln -sfn "$PREVIOUS" "$CURRENT"
              sudo systemctl restart impulsionando-core >/dev/null 2>&1 || true
            fi
            if [ "$edge_switched" -eq 1 ] && sudo docker image inspect impulsionando-core:chrismed-rollback >/dev/null 2>&1; then
              sudo docker tag impulsionando-core:chrismed-rollback impulsionando-core:latest
              cd /opt/impulsionando/deploy/hostinger
              sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core >/dev/null 2>&1 || true
            fi
            exit "$rc"
          }
          trap rollback ERR
          sudo mkdir -p "$RELEASE"
          sudo tar -xzf /tmp/chrismed-core-release.tgz -C "$RELEASE"
          sudo chown -R "$(id -u):$(id -g)" "$RELEASE"
          cd "$RELEASE"
          npm ci --omit=dev --no-audit --no-fund
          test -f .output/server/index.mjs
          test -f .output/public/chrismed-release-sha.txt
          grep -Fxq "$TARGET_SHA" .output/public/chrismed-release-sha.txt
          if [ -n "$PREVIOUS" ]; then printf '%s\n' "$PREVIOUS" | sudo tee /var/www/impulsionando-core/.previous-release >/dev/null; fi
          sudo ln -sfn "$RELEASE" "$CURRENT"
          switched=1
          sudo systemctl restart impulsionando-core
          for i in $(seq 1 45); do
            curl -fsS --max-time 5 http://127.0.0.1:3000/ >/dev/null 2>&1 && break
            [ "$i" -lt 45 ] || { sudo journalctl --no-pager -u impulsionando-core -n 100; exit 51; }
            sleep 1
          done
          if [ -n "$OLD_IMAGE" ]; then sudo docker tag "$OLD_IMAGE" impulsionando-core:chrismed-rollback; fi
          cat >/tmp/Dockerfile.chrismed-runtime <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          WORKDIR /app
          ENV NODE_ENV=production HOST=0.0.0.0 PORT=3000
          COPY package.json package-lock.json ./
          RUN npm ci --omit=dev --no-audit --no-fund
          COPY .output ./.output
          COPY scripts ./scripts
          EXPOSE 3000
          CMD ["node","scripts/start-core-runtime.mjs"]
          DOCKERFILE
          printf 'node_modules\n' > .dockerignore
          sudo docker build -f /tmp/Dockerfile.chrismed-runtime -t impulsionando-core:latest "$RELEASE"
          cd /opt/impulsionando/deploy/hostinger
          sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core
          edge_switched=1
          for i in $(seq 1 60); do
            IP="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core 2>/dev/null || true)"
            if [ -n "$IP" ] && curl -fsS --max-time 5 -H 'Host: chrismed.impulsionando.com.br' -H 'Accept: text/html' "http://$IP:3000/" >/tmp/chrismed-home.html 2>/dev/null; then break; fi
            [ "$i" -lt 60 ] || { sudo docker logs --tail 120 impulsionando-core || true; exit 52; }
            sleep 2
          done
          grep -qi 'CHRISMED' /tmp/chrismed-home.html
          IP="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core)"
          CODE_ADMIN="$(curl -sS -o /tmp/admin-probe -w '%{http_code}' -H 'Host: chrismed.impulsionando.com.br' -H 'Accept: text/html' "http://$IP:3000/chrismed/admin")"
          CODE_INV="$(curl -sS -o /tmp/inv-probe -w '%{http_code}' -H 'Host: chrismed.impulsionando.com.br' -H 'Accept: text/html' "http://$IP:3000/chrismed/convites")"
          CODE_PAT="$(curl -sS -o /tmp/pat-probe -w '%{http_code}' -H 'Host: chrismed.impulsionando.com.br' -H 'Accept: text/html' "http://$IP:3000/chrismed/pacientes-gestao")"
          echo "ROUTES admin=$CODE_ADMIN invites=$CODE_INV patients=$CODE_PAT"
          [ "$CODE_ADMIN" = 200 ] && [ "$CODE_INV" = 200 ] && [ "$CODE_PAT" = 200 ]
          curl -fsS --max-time 15 https://chrismed.impulsionando.com.br/ >/tmp/chrismed-public.html
          grep -qi 'CHRISMED' /tmp/chrismed-public.html
          PUBLIC_SHA="$(curl -fsS --max-time 15 https://chrismed.impulsionando.com.br/chrismed-release-sha.txt | tr -d '\r\n')"
          echo "PUBLIC_SHA=$PUBLIC_SHA TARGET_SHA=$TARGET_SHA"
          [ "$PUBLIC_SHA" = "$TARGET_SHA" ]
          echo 'CHRISMED_FRONT_DEPLOY=PASS'
          REMOTE
      - name: Persist deployment proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          if [ -f /tmp/chrismed-front-hard-deploy.txt ]; then cp /tmp/chrismed-front-hard-deploy.txt docs/ops/chrismed-front-hard-deploy.txt; else echo 'deploy evidence missing' > docs/ops/chrismed-front-hard-deploy.txt; fi
          git config user.name 'Impulsionito CHRISMED QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/chrismed-front-hard-deploy.txt
          git commit -m 'chore(chrismed): record final front deployment proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
