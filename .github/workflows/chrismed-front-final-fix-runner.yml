name: CHRISMED remove final front environment gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-front-final-fix-runner.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Keep final publisher immediate and idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/chrismed-fast-front-final.yml')
          s=p.read_text()
          s=s.replace('    environment: production\n','',1)
          pre='          npm test -- --run tests/chrismed-no-regression-go-live.test.ts\n\n      - name: Install, test and build current main'
          if pre in s:
            s=s.replace('          npm test -- --run tests/chrismed-no-regression-go-live.test.ts\n','',1)
          ci='          npm ci --no-audit --no-fund\n'
          test='          npm test -- --run tests/chrismed-no-regression-go-live.test.ts\n'
          if test not in s and ci in s:
            s=s.replace(ci,ci+test,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'Impulsionito CHRISMED Front QA'
          git config user.email 'automation@impulsionando.com.br'
          git add .github/workflows/chrismed-fast-front-final.yml
          git commit -m 'fix(chrismed): make final front publication immediate' || exit 0
          git pull --rebase origin main
          git push origin main
