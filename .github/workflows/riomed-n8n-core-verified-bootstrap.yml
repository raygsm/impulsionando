name: RioMed n8n Core-verified bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/riomed-n8n-core-verified-bootstrap.yml
  workflow_run:
    workflows: ["Deploy Core Frontend"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in 1 2 3; do ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts && break || sleep 2; done
          test -s ~/.ssh/known_hosts

      - name: Install, verify and bind RioMed lifecycle workflows
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          CORE_VERIFY='https://impulsionando.com.br/api/public/hooks/n8n-verify'
          SECURITY_ENV=/etc/impulsionando-security.env
          CORE_ENV=/etc/impulsionando-core.env

          verifier_code="$(curl -sS -o /tmp/riomed-verifier-get.out -w '%{http_code}' --max-time 20 "$CORE_VERIFY")"
          echo "CORE_VERIFIER_GET_HTTP=$verifier_code"
          [ "$verifier_code" = '200' ] || { cat /tmp/riomed-verifier-get.out; exit 50; }
          sudo docker inspect "$C" >/dev/null

          create_workflow() {
            local id="$1" name="$2" path="$3" slug="$4" webhook_id="$5"
            local file="/tmp/${id}-core-verified.json"
            cat >"$file" <<JSON
          {
            "id":"${id}",
            "name":"${name}",
            "active":false,
            "nodes":[
              {
                "parameters":{"httpMethod":"POST","path":"${path}","responseMode":"responseNode","options":{}},
                "id":"${id}-webhook","name":"RioMed Lifecycle Webhook","type":"n8n-nodes-base.webhook","typeVersion":2,"position":[0,0],"webhookId":"${webhook_id}"
              },
              {
                "parameters":{
                  "method":"POST","url":"${CORE_VERIFY}","sendHeaders":true,
                  "headerParameters":{"parameters":[
                    {"name":"x-impulsionando-signature","value":"={{ \$json.headers?.['x-impulsionando-signature'] || '' }}"},
                    {"name":"Content-Type","value":"application/json"}
                  ]},
                  "sendBody":true,"contentType":"raw","rawContentType":"application/json",
                  "body":"={{ JSON.stringify(\$json.body) }}",
                  "options":{"response":{"response":{"fullResponse":true,"neverError":true,"responseFormat":"json"}},"timeout":15000}
                },
                "id":"${id}-core-verify","name":"Verify signature in Core","type":"n8n-nodes-base.httpRequest","typeVersion":4.2,"position":[260,0]
              },
              {
                "parameters":{"jsCode":"const r = \$input.first().json;\nconst body = r.body || {};\nconst authorized = Number(r.statusCode) === 200 && body.authorized === true && body.ok === true && body.tenant_slug === 'rio-med';\nreturn [{json:{authorized,statusCode:Number(r.statusCode)||0,error:authorized?null:(body.error||'verification_failed'),verification:body,payload:authorized?(body.payload||null):null}}];"},
                "id":"${id}-normalize","name":"Normalize verification result","type":"n8n-nodes-base.code","typeVersion":2,"position":[520,0]
              },
              {
                "parameters":{"respondWith":"json","responseBody":"={{ { ok: \$json.authorized === true, workflow: '${slug}', error: \$json.authorized === true ? null : \$json.error, event_code: \$json.payload?.event_code || null, correlation_id: \$json.payload?.correlation_id || null, accepted_at: \$json.authorized === true ? \$now : null } }}","options":{"responseCode":"={{ \$json.authorized === true ? 200 : 401 }}"}},
                "id":"${id}-respond","name":"Respond Security Result","type":"n8n-nodes-base.respondToWebhook","typeVersion":1.4,"position":[780,0]
              }
            ],
            "connections":{
              "RioMed Lifecycle Webhook":{"main":[[{"node":"Verify signature in Core","type":"main","index":0}]]},
              "Verify signature in Core":{"main":[[{"node":"Normalize verification result","type":"main","index":0}]]},
              "Normalize verification result":{"main":[[{"node":"Respond Security Result","type":"main","index":0}]]}
            },
            "settings":{"executionOrder":"v1"}
          }
          JSON
            sudo docker cp "$file" "$C:$file"
            sudo docker exec "$C" n8n import:workflow --input="$file" >/dev/null
            sudo docker exec "$C" n8n publish:workflow --id="$id" >/dev/null
            sudo docker exec "$C" n8n update:workflow --id="$id" --active=true >/dev/null
          }

          workflows='\
          rmLeadIntake01|RioMed Lead Intake|riomed-lead-intake|rio-med.lead.intake|riomed-lead-intake-v1|LEAD_CREATED
          rmLeadAssign01|RioMed Lead Assignment|riomed-lead-assignment|rio-med.lead.assignment|riomed-lead-assignment-v1|SELLER_ASSIGNMENT_REQUIRED
          rmQuoteLife01|RioMed Quote Lifecycle|riomed-quote-lifecycle|rio-med.quote.lifecycle|riomed-quote-lifecycle-v1|QUOTE_REQUESTED
          rmMeetingLife01|RioMed Meeting Lifecycle|riomed-meeting-lifecycle|rio-med.meeting.lifecycle|riomed-meeting-lifecycle-v1|MEETING_REQUESTED
          rmSupportLife01|RioMed Support Lifecycle|riomed-support-lifecycle|rio-med.support.lifecycle|riomed-support-lifecycle-v1|SUPPORT_TICKET_CREATED
          rmOrderLife01|RioMed Order Lifecycle|riomed-order-lifecycle|rio-med.order.lifecycle|riomed-order-lifecycle-v1|ORDER_CREATED
          rmPaymentLife01|RioMed Payment Lifecycle|riomed-payment-lifecycle|rio-med.payment.lifecycle|riomed-payment-lifecycle-v1|PAYMENT_PENDING
          rmDeliveryLife01|RioMed Delivery Lifecycle|riomed-delivery-lifecycle|rio-med.delivery.lifecycle|riomed-delivery-lifecycle-v1|SHIPMENT_CREATED
          rmAbandonedCart01|RioMed Abandoned Cart|riomed-abandoned-cart|rio-med.abandoned.cart|riomed-abandoned-cart-v1|CART_ABANDONED
          rmPostSale01|RioMed Post Sale|riomed-post-sale|rio-med.post.sale|riomed-post-sale-v1|POST_SALE_DUE
          rmRentalLife01|RioMed Rental Lifecycle|riomed-rental-lifecycle|rio-med.rental.lifecycle|riomed-rental-lifecycle-v1|RENTAL_REQUESTED
          rmMaintenance01|RioMed Maintenance Lifecycle|riomed-maintenance-lifecycle|rio-med.maintenance.lifecycle|riomed-maintenance-v1|MAINTENANCE_REQUESTED
          rmReactivation01|RioMed Reactivation|riomed-reactivation|rio-med.reactivation|riomed-reactivation-v1|CUSTOMER_INACTIVE
          rmSlaWatch01|RioMed SLA Watch|riomed-sla-watch|rio-med.sla.watch|riomed-sla-watch-v1|SLA_NEAR_DUE
          rmIntegrationErr01|RioMed Integration Error|riomed-integration-error|rio-med.integration.error|riomed-integration-error-v1|INTEGRATION_ERROR
          rmInventoryAlert01|RioMed Inventory Alerts|riomed-inventory-alerts|rio-med.inventory.alerts|riomed-inventory-alerts-v1|STOCK_CRITICAL'

          while IFS='|' read -r id name path slug webhook event; do
            [ -n "$id" ] || continue
            create_workflow "$id" "$name" "$path" "$slug" "$webhook"
          done <<EOF
          $workflows
          EOF

          sudo docker restart "$C" >/dev/null
          for i in $(seq 1 45); do
            if sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            [ "$i" -lt 45 ] || exit 51
            sleep 2
          done

          make_signature() {
            local payload="$1" secret
            secret="$(sudo sed -n 's/^IMPULSIONANDO_WEBHOOK_SECRET=//p' "$SECURITY_ENV" | head -n1)"
            test -n "$secret"
            printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" -hex | awk '{print $2}'
          }

          probe_workflow() {
            local id="$1" path="$2" slug="$3" event="$4"
            local url="https://n8n.impulsionando.com.br/webhook/${path}"
            local payload code signature
            payload="{\"workflow_name\":\"${slug}\",\"event_code\":\"${event}\",\"tenant_slug\":\"rio-med\",\"correlation_id\":\"unsigned-${id}\",\"company_id\":null,\"dispatched_at\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",\"data\":{\"probe\":true}}"
            code="$(curl -sS -o "/tmp/${id}-unsigned.out" -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' -d "$payload")"
            echo "${id}_unsigned_http=$code"
            [ "$code" = '401' ] || exit 52

            payload="{\"workflow_name\":\"${slug}\",\"event_code\":\"${event}\",\"tenant_slug\":\"rio-med\",\"correlation_id\":\"signed-${id}-$(date +%s)\",\"company_id\":null,\"dispatched_at\":\"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",\"data\":{\"probe\":true}}"
            signature="$(make_signature "$payload")"
            code="$(curl -sS -o "/tmp/${id}-signed.out" -w '%{http_code}' --max-time 20 -X POST "$url" -H 'content-type: application/json' -H "x-impulsionando-signature: $signature" -d "$payload")"
            echo "${id}_signed_http=$code"
            [ "$code" = '200' ] || { cat "/tmp/${id}-signed.out"; exit 53; }
            grep -q '"ok":true' "/tmp/${id}-signed.out" || exit 54

            sudo docker exec "$C" n8n export:workflow --id="$id" --output="/tmp/${id}-verified.json" >/dev/null
            sudo docker exec -i -e WF_ID="$id" "$C" node - <<'NODE'
          const fs=require('fs');
          const id=process.env.WF_ID;
          const r=JSON.parse(fs.readFileSync(`/tmp/${id}-verified.json`,'utf8'));
          const w=Array.isArray(r)?r[0]:r;
          const hook=(w.nodes||[]).find(n=>n.type==='n8n-nodes-base.webhook');
          const names=(w.nodes||[]).map(n=>n.name);
          if(!w.active||!w.activeVersionId||!hook?.webhookId||!names.includes('Verify signature in Core')||!names.includes('Respond Security Result')) process.exit(55);
          NODE
          }

          while IFS='|' read -r id name path slug webhook event; do
            [ -n "$id" ] || continue
            probe_workflow "$id" "$path" "$slug" "$event"
          done <<EOF
          $workflows
          EOF

          SUPABASE_URL="$(sudo sed -n 's/^SUPABASE_URL=//p' "$CORE_ENV" | head -n1)"
          SERVICE_KEY="$(sudo sed -n 's/^SUPABASE_SERVICE_ROLE_KEY=//p' "$CORE_ENV" | head -n1)"
          test -n "$SUPABASE_URL" && test -n "$SERVICE_KEY"

          while IFS='|' read -r id name path slug webhook event; do
            [ -n "$id" ] || continue
            curl -fsS --max-time 20 -X PATCH \
              "$SUPABASE_URL/rest/v1/n8n_workflow_registry?workflow_slug=eq.${slug}&version=eq.1" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H 'Content-Type: application/json' \
              -H 'Prefer: return=minimal' \
              -d "{\"n8n_workflow_id\":\"${id}\",\"status\":\"ACTIVE\"}" >/dev/null
            curl -fsS --max-time 20 -X PATCH \
              "$SUPABASE_URL/rest/v1/communication_automations?automation_key=eq.${slug}&version=eq.1" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H 'Content-Type: application/json' \
              -H 'Prefer: return=minimal' \
              -d "{\"n8n_workflow_id\":\"${id}\",\"status\":\"ACTIVE\"}" >/dev/null
          done <<EOF
          $workflows
          EOF

          unset SERVICE_KEY
          echo 'RIOMED_N8N_CORE_VERIFIED_LIFECYCLES=PASS'
          REMOTE
