name: Temporary audit live n8n webhook paths

on:
  push:
    branches:
      - ops/audit-live-n8n-webhooks-20260812
    paths:
      - .github/workflows/tmp-audit-live-n8n-webhook-paths.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit registered webhook paths from live n8n
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 90s
          command_timeout: 5m
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            echo "N8N_DB_AUDIT_BEGIN"
            DBTYPE=$(docker exec "$C" sh -lc 'printf "%s" "${DB_TYPE:-sqlite}"')
            echo "DB_TYPE=$DBTYPE"
            if [ "$DBTYPE" = "sqlite" ] || [ "$DBTYPE" = "sqlite3" ]; then
              if docker exec "$C" sh -lc 'command -v sqlite3 >/dev/null 2>&1'; then
                docker exec "$C" sh -lc 'sqlite3 -readonly /home/node/.n8n/database.sqlite "select workflowId,webhookPath,method from webhook_entity order by workflowId,webhookPath;"' | sed 's/|/\t/g'
              else
                echo "SQLITE_CLI=ABSENT"
              fi
            else
              echo "NON_SQLITE_DB=true"
            fi
            echo "N8N_DB_AUDIT_END"
