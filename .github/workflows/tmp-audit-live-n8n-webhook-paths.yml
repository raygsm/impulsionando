name: Temporary audit live n8n webhook paths

on:
  push:
    branches:
      - ops/audit-live-n8n-webhooks-20260812
    paths:
      - .github/workflows/tmp-audit-live-n8n-webhook-paths.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit registered webhook paths from n8n SQLite
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 90s
          command_timeout: 5m
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            TMP=/tmp/n8n-webhook-audit-$$.sqlite
            docker cp "$C":/home/node/.n8n/database.sqlite "$TMP" >/dev/null
            echo "N8N_REGISTERED_WEBHOOKS_BEGIN"
            python3 -c 'import sqlite3,sys; db=sys.argv[1]; c=sqlite3.connect("file:"+db+"?mode=ro",uri=True); cols=[r[1] for r in c.execute("pragma table_info(webhook_entity)")]; print("COLUMNS="+",".join(cols)); wanted=[x for x in ["workflowId","webhookPath","method","node"] if x in cols]; q="select "+",".join([chr(34)+x+chr(34) for x in wanted])+" from webhook_entity order by "+",".join([chr(34)+x+chr(34) for x in wanted]); [print("\t".join("" if v is None else str(v) for v in row)) for row in c.execute(q)]' "$TMP"
            echo "N8N_REGISTERED_WEBHOOKS_END"
            rm -f "$TMP"
