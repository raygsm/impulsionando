# rerun: 2026-08-20T11:43:00-03:00
name: CHRISMED n8n availability guard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-n8n-availability-guard.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Restore n8n availability without mutating workflows
        shell: bash
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' > /tmp/chrismed-n8n-availability.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          state="$(sudo docker inspect "$C" --format '{{.State.Status}}' 2>/dev/null || echo missing)"
          echo "initial_state=$state"
          echo '--- related processes ---'
          ps -eo pid,ppid,etime,stat,cmd | grep -E 'n8n|chrismed-all-v4|import:workflow|publish:workflow|update:workflow' | grep -v grep | head -100 || true
          if [ "$state" != running ]; then
            sudo docker start "$C" >/dev/null
            echo 'action=start_live_n8n'
          fi
          healthy=0
          for i in $(seq 1 45); do
            if sudo docker exec "$C" node -e "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then healthy=1; break; fi
            sleep 2
          done
          echo "healthy=$healthy"
          sudo docker inspect "$C" --format 'final_state={{.State.Status}} started={{.State.StartedAt}}'
          sudo docker logs --tail 80 "$C" 2>&1 || true
          test "$healthy" -eq 1
          echo 'N8N_AVAILABILITY=PASS'
          REMOTE
      - name: Persist proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          cp /tmp/chrismed-n8n-availability.txt docs/ops/chrismed-n8n-availability.txt || true
          git config user.name 'Impulsionito CHRISMED QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/chrismed-n8n-availability.txt
          git commit -m 'chore(chrismed): record n8n availability recovery' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
