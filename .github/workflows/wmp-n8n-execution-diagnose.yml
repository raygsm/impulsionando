name: WMP n8n execution diagnose
on:
  push:
    paths:
      - .github/workflows/wmp-n8n-execution-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          H: ${{ secrets.VPS_HOST }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep 3
          done
          exit 41
      - name: Parse latest execution entities safely
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          sudo docker exec "$C" sh -lc 'rm -rf /tmp/wmp-exec-export && mkdir -p /tmp/wmp-exec-export'
          sudo docker exec "$C" n8n export:entities --outputDir=/tmp/wmp-exec-export --includeExecutionHistoryDataTables=true --includeDataTableRows=false >/dev/null
          sudo docker exec "$C" sh -lc 'unzip -p /tmp/wmp-exec-export/entities.zip "executionentity*.jsonl" > /tmp/all-executionentity.jsonl'
          sudo docker exec "$C" node -e "const fs=require('fs');const lines=fs.readFileSync('/tmp/all-executionentity.jsonl','utf8').trim().split(/\n/);const rows=lines.map(x=>{try{return JSON.parse(x)}catch{return null}}).filter(Boolean);console.log('count='+rows.length);console.log('keys='+Object.keys(rows.at(-1)||{}).join(','));for(const r of rows.filter(x=>String(x.workflowId||'').toLowerCase().includes('wmp')||String(x.workflowName||'').toLowerCase().includes('wmp')).slice(-12)){console.log(JSON.stringify({id:r.id,workflowId:r.workflowId,workflowName:r.workflowName,status:r.status,startedAt:r.startedAt,stoppedAt:r.stoppedAt,mode:r.mode}));}"
          REMOTE
