name: WMP n8n execution diagnose
on:
  push:
    paths:
      - .github/workflows/wmp-n8n-execution-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          H: ${{ secrets.VPS_HOST }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep 3
          done
          exit 41
      - name: Export and inspect latest WMP execution metadata
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          sudo docker exec "$C" sh -lc 'rm -rf /tmp/wmp-exec-export && mkdir -p /tmp/wmp-exec-export'
          sudo docker exec "$C" n8n export:entities --outputDir=/tmp/wmp-exec-export --includeExecutionHistoryDataTables=true --includeDataTableRows=false >/dev/null
          echo '== execution export files =='
          sudo docker exec "$C" sh -lc 'find /tmp/wmp-exec-export -maxdepth 2 -type f -printf "%f\n" | grep -Ei "execution|workflow" | sort | head -80'
          echo '== file sizes =='
          sudo docker exec "$C" sh -lc 'du -h /tmp/wmp-exec-export/* 2>/dev/null | grep -Ei "execution|workflow" | tail -40'
          REMOTE
