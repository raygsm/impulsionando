name: WMP n8n execution diagnose
on:
  push:
    paths:
      - .github/workflows/wmp-n8n-execution-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          H: ${{ secrets.VPS_HOST }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep 3
          done
          exit 41
      - name: Inspect sqlite execution storage safely
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          echo '== sqlite files =='
          sudo docker exec "$C" sh -lc 'find /home/node/.n8n -maxdepth 2 -type f -name "*.sqlite" -o -name "database.sqlite" 2>/dev/null | head -20'
          echo '== sqlite cli =='
          sudo docker exec "$C" sh -lc 'command -v sqlite3 || true'
          echo '== export entities help =='
          sudo docker exec "$C" n8n export:entities --help 2>&1 | head -120 || true
          REMOTE
