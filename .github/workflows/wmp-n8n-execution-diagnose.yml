name: WMP n8n execution diagnose
on:
  push:
    paths:
      - .github/workflows/wmp-n8n-execution-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          H: ${{ secrets.VPS_HOST }}
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$K" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$H" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep 3
          done
          exit 41
      - name: Inspect execution backend safely
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          echo '== n8n database mode =='
          sudo docker inspect "$C" -f '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(DB_TYPE|DB_POSTGRESDB_HOST|DB_POSTGRESDB_DATABASE|DB_POSTGRESDB_USER)=' || true
          echo '== related containers =='
          sudo docker ps --format '{{.Names}}' | grep -Ei 'n8n|postgres|redis' || true
          echo '== n8n cli relevant commands =='
          sudo docker exec "$C" n8n --help 2>/dev/null | grep -Ei 'execution|export|workflow' | head -80 || true
          REMOTE
