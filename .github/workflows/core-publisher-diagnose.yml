name: Core publisher diagnose

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/core-publisher-diagnose.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
      - name: Capture publisher diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' > docs/ops/core-publisher-diagnostic.txt 2>&1
          set +e
          echo "generated_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo '--- worker service ---'
          sudo systemctl --no-pager --full status impulsionando-publish-worker.service
          echo '--- publisher state ---'
          sudo cat /var/lib/impulsionando-publisher/status.json 2>/dev/null || true
          echo
          echo '--- journal ---'
          sudo journalctl --no-pager -u impulsionando-publish-worker.service -n 220
          echo '--- disk ---'
          df -h / /var /tmp
          echo '--- node/npm ---'
          node --version || true
          npm --version || true
          echo '--- publisher files ---'
          sudo ls -la /usr/local/lib/impulsionando/publisher || true
          echo '--- repo state ---'
          sudo git -C /var/lib/impulsionando-publisher/repo status --short --branch 2>/dev/null || true
          sudo git -C /var/lib/impulsionando-publisher/repo rev-parse HEAD 2>/dev/null || true
          REMOTE
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Impulsionito Core Automation'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/core-publisher-diagnostic.txt
          git commit -m 'chore(core): record publisher failure diagnostic' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
