name: WMP VPS Disk Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wmp-vps-disk-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Audit disk without deleting data
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '== FILESYSTEM =='
          df -hT /
          df -ih /
          echo '== CORE LINKS =='
          readlink -f /var/www/impulsionando-core/current 2>/dev/null || true
          sudo cat /var/www/impulsionando-core/.previous-release 2>/dev/null || true
          echo '== CORE RELEASES =='
          sudo du -sh /var/www/impulsionando-core/releases 2>/dev/null || true
          sudo find /var/www/impulsionando-core/releases -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 30 || true
          echo '== TOP /var =='
          sudo du -x -h -d 2 /var 2>/dev/null | sort -h | tail -n 30 || true
          echo '== TOP /home =='
          sudo du -x -h -d 2 /home 2>/dev/null | sort -h | tail -n 30 || true
          echo '== NPM CACHES =='
          sudo du -sh /root/.npm /home/*/.npm 2>/dev/null || true
          echo '== JOURNAL =='
          sudo journalctl --disk-usage || true
          echo '== DOCKER =='
          sudo docker system df || true
          echo '== LARGE LOGS =='
          sudo find /var/log -xdev -type f -size +50M -printf '%s %p\n' 2>/dev/null | sort -nr | head -n 20 || true
          REMOTE
