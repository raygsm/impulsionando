name: WMP VPS Disk Audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wmp-vps-disk-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts && break || sleep 2; done
          test -s ~/.ssh/known_hosts

      - name: Quick disk and cleanup progress probe
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/var/www/impulsionando-core/releases
          echo 'QUICK_AUDIT_VERSION=3'
          df -hT /
          df -ih /
          echo "RELEASE_COUNT=$(sudo find "$BASE" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)"
          echo "CURRENT=$(readlink -f /var/www/impulsionando-core/current 2>/dev/null || true)"
          echo "PREVIOUS=$(sudo cat /var/www/impulsionando-core/.previous-release 2>/dev/null || true)"
          echo 'ACTIVE_DISK_PROCESSES:'
          ps -eo pid,etime,comm,args | grep -E '[r]m -rf|[d]u -x|[d]u -sh|docker builder prune|npm cache clean' | head -n 30 || true
          echo 'ROOT_USAGE_TOP:'
          sudo du -x -s /var/www/impulsionando-core /var/lib/docker /var/log /home 2>/dev/null | sort -n || true
          REMOTE
