name: WMP n8n webhook registry diagnose

on:
  push:
    paths:
      - .github/workflows/wmp-n8n-webhook-registry-diagnose.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Inspect n8n database and webhook ownership
        env:
          H: ${{ secrets.VPS_HOST }}
          U: ${{ secrets.VPS_USER }}
        run: |
          ssh "$U@$H" 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=n8n-umlg-n8n-1
          echo 'DB_ENV_KEYS:'
          sudo docker exec "$C" sh -lc "env | cut -d= -f1 | grep '^DB_' | sort" || true
          echo 'CONTAINERS:'
          sudo docker ps --format '{{.Names}}' | grep -Ei 'n8n|postgres|pg|db' | sort

          dbtype="$(sudo docker exec "$C" sh -lc "printf '%s' \"\${DB_TYPE:-}\"")"
          echo "DB_TYPE=${dbtype:-unset}"
          if [ "$dbtype" = postgresdb ] || [ "$dbtype" = postgres ]; then
            host="$(sudo docker exec "$C" sh -lc "printf '%s' \"\${DB_POSTGRESDB_HOST:-}\"")"
            port="$(sudo docker exec "$C" sh -lc "printf '%s' \"\${DB_POSTGRESDB_PORT:-5432}\"")"
            db="$(sudo docker exec "$C" sh -lc "printf '%s' \"\${DB_POSTGRESDB_DATABASE:-n8n}\"")"
            user="$(sudo docker exec "$C" sh -lc "printf '%s' \"\${DB_POSTGRESDB_USER:-}\"")"
            pass="$(sudo docker exec "$C" sh -lc "printf '%s' \"\${DB_POSTGRESDB_PASSWORD:-}\"")"
            test -n "$host" -a -n "$user"
            sudo docker exec -e PGPASSWORD="$pass" "$C" sh -lc "command -v psql >/dev/null" || { echo 'PSQL_NOT_IN_N8N'; exit 71; }
            q="select table_schema,table_name from information_schema.tables where table_schema not in ('pg_catalog','information_schema') and table_name ilike '%webhook%' order by 1,2;"
            sudo docker exec -e PGPASSWORD="$pass" "$C" psql -h "$host" -p "$port" -U "$user" -d "$db" -Atc "$q"
            for t in webhook_entity webhookEntity webhook; do
              exists="$(sudo docker exec -e PGPASSWORD="$pass" "$C" psql -h "$host" -p "$port" -U "$user" -d "$db" -Atc "select to_regclass('public.\"$t\"') is not null" 2>/dev/null || true)"
              [ "$exists" = t ] || continue
              echo "TABLE=$t COLUMNS:"
              sudo docker exec -e PGPASSWORD="$pass" "$C" psql -h "$host" -p "$port" -U "$user" -d "$db" -Atc "select column_name||':'||data_type from information_schema.columns where table_schema='public' and table_name='$t' order by ordinal_position"
            done
            echo 'CANDIDATE_ROWS_JSON:'
            sudo docker exec -e PGPASSWORD="$pass" "$C" psql -h "$host" -p "$port" -U "$user" -d "$db" -Atc "select row_to_json(x) from (select * from webhook_entity where path in ('wmp-dj-booking-lifecycle','wmp-post-event-relationship') or \"workflowId\" in ('wmpDjBookingLifecycle01','wmpPostEventRelationship01','wmpDjLifecycle01','wmpPostEvent01')) x order by x.path,x.\"workflowId\"" 2>/dev/null || true
          else
            echo 'NON_POSTGRES_DB'
            exit 72
          fi
          REMOTE
