name: WMP Cloudflare origin cutover v2

on:
  push:
    paths:
      - .github/workflows/wmp-cloudflare-origin-cutover-v2.yml

permissions:
  contents: read

concurrency:
  group: wmp-origin-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOMAIN: wmp.impulsionando.com.br
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Resolve validated origin and Cloudflare state
        run: |
          set -euo pipefail
          for value in DEPLOY_HOST VPS_HOST VPS_USER VPS_SSH_KEY CF_API_TOKEN CF_ZONE_ID; do
            test -n "${!value}" || { echo "::error::Missing $value"; exit 1; }
          done
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          ORIGIN_IP="$(getent ahostsv4 "$DEPLOY_HOST" | awk 'NR==1{print $1}')"
          test -n "$ORIGIN_IP"
          printf 'CF_ZONE_ID=%s\nORIGIN_IP=%s\n' "$CF_ZONE_ID" "$ORIGIN_IP" >> "$GITHUB_ENV"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records?name=$DOMAIN&per_page=100" -o /tmp/wmp-dns-before.json
          jq -e '.success == true' /tmp/wmp-dns-before.json >/dev/null
          count="$(jq '[.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME")] | length' /tmp/wmp-dns-before.json)"
          [ "$count" -gt 0 ]
          echo "WMP_ROUTING_RECORD_COUNT=$count"
          if jq -e --arg ip "$ORIGIN_IP" '.result[] | select(.type=="A" and .content==$ip)' /tmp/wmp-dns-before.json >/dev/null; then
            echo 'WMP_CURRENT_CF_ORIGIN_MATCHES_TARGET=yes'
          else
            echo 'WMP_CURRENT_CF_ORIGIN_MATCHES_TARGET=no'
          fi

      - name: Configure SSH with retries
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts
          for i in $(seq 1 10); do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && test -s ~/.ssh/known_hosts; then exit 0; fi
            sleep $((i*3))
          done
          exit 2

      - name: Ensure validated image is the Traefik service and probe with real Host header
        run: |
          set -euo pipefail
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=10 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          VALIDATED='sha256:25e81a6183c8f2925331b29ae2a193b8bdac9da8c5ec56e714340e213a4cb3d9'
          COMPOSE='/opt/impulsionando/deploy/hostinger/docker-compose.yml'
          sudo docker image inspect "$VALIDATED" >/dev/null
          target_id="$(sudo docker image inspect -f '{{.Id}}' "$VALIDATED")"
          current_id="$(sudo docker inspect -f '{{.Image}}' impulsionando-core)"
          if [ "$current_id" != "$target_id" ]; then
            sudo docker tag "$current_id" impulsionando-core:wmp-cutover-rollback-v2
            sudo docker tag "$VALIDATED" impulsionando-core:latest
            cd /opt/impulsionando/deploy/hostinger
            sudo docker compose -f "$COMPOSE" up -d --no-build --force-recreate impulsionando-core
          else
            echo 'EDGE_ALREADY_ON_VALIDATED_IMAGE=yes'
          fi
          for i in $(seq 1 45); do
            ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core)"
            if [ -n "$ip" ] && curl -fsS -H 'Host: wmp.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' "http://$ip:3000/auth" >/dev/null 2>&1; then break; fi
            [ "$i" -lt 45 ] || { sudo docker logs --tail 100 impulsionando-core; exit 31; }
            sleep 2
          done
          ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' impulsionando-core)"
          for path in / /auth /dashboard /seguranca/senha /djs /empresas /orcamento /parceiro; do
            code="$(curl -sS -H 'Host: wmp.impulsionando.com.br' -H 'Accept: text/html,application/xhtml+xml' -o /tmp/wmp-edge-probe -w '%{http_code}' "http://$ip:3000$path")"
            echo "EDGE_HOST_PROBE $path HTTP=$code"
            [ "$code" = '200' ] || exit 32
          done
          echo 'WMP_TRAEFIK_ORIGIN_READY=PASS'
          REMOTE

      - name: Replace only WMP routing record in Cloudflare
        id: dns
        run: |
          set -euo pipefail
          jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' /tmp/wmp-dns-before.json | while read -r id; do
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$id" >/dev/null
          done
          jq -nc --arg name "$DOMAIN" --arg content "$ORIGIN_IP" '{type:"A",name:$name,content:$content,ttl:1,proxied:true}' >/tmp/wmp-dns-new.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/wmp-dns-new.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" -o /tmp/wmp-dns-created.json
          jq -e '.success == true' /tmp/wmp-dns-created.json >/dev/null
          echo 'WMP_CLOUDFLARE_CUTOVER=APPLIED'

      - name: Purge WMP cache
        run: |
          set -euo pipefail
          jq -nc --arg a "https://$DOMAIN/" --arg b "https://$DOMAIN/auth" --arg c "https://$DOMAIN/dashboard" '{files:[$a,$b,$c]}' >/tmp/wmp-purge.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            --data @/tmp/wmp-purge.json "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -o /tmp/wmp-purge-result.json
          jq -e '.success == true' /tmp/wmp-purge-result.json >/dev/null

      - name: Public verification with DNS rollback on failure
        run: |
          set -euo pipefail
          failed=0
          for path in / /auth /dashboard /seguranca/senha /djs /empresas /orcamento /parceiro; do
            code=000
            for attempt in $(seq 1 12); do
              code="$(curl -sS -L -H 'Accept: text/html,application/xhtml+xml' -o /tmp/wmp-public -w '%{http_code}' --max-time 20 "https://$DOMAIN$path" || true)"
              [ "$code" = '200' ] && break
              sleep 5
            done
            echo "PUBLIC_WMP $path HTTP=$code"
            [ "$code" = '200' ] || failed=1
          done
          if [ "$failed" = '0' ]; then
            echo 'WMP_PUBLIC_ORIGIN_CUTOVER=PASS'
            exit 0
          fi
          echo '::error::Public WMP validation failed; restoring previous Cloudflare record.'
          new_id="$(jq -r '.result.id' /tmp/wmp-dns-created.json)"
          curl --silent --show-error -X DELETE -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records/$new_id" >/dev/null || true
          jq -c '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | del(.id,.zone_id,.zone_name,.created_on,.modified_on,.meta,.proxiable,.locked,.comment_modified_on,.tags_modified_on)' /tmp/wmp-dns-before.json | while read -r payload; do
            curl --silent --show-error -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/dns_records" >/dev/null || true
          done
          exit 40

      - name: Upload DNS backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmp-dns-backup-v2-${{ github.run_id }}
          path: /tmp/wmp-dns-before.json
          retention-days: 30
