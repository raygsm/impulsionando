name: P0 recover all fronts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/p0-recover-fronts.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  recover:
    if: github.head_ref == 'ops/p0-recover-fronts-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect Nginx TLS and Core reachability
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee /tmp/p0-report.txt
          set -euo pipefail
          echo '=== PORTS ==='
          sudo ss -ltnp | grep -E ':(80|443|3000)\b' || true
          echo '=== NGINX TEST ==='
          sudo nginx -t || true
          echo '=== NGINX RELEVANT CONFIG ==='
          sudo nginx -T 2>&1 | grep -E 'server_name|listen |proxy_pass|ssl_certificate' || true
          echo '=== SITES ENABLED ==='
          sudo find /etc/nginx/sites-enabled -maxdepth 1 -type l -printf '%f -> %l\n' 2>/dev/null || true
          echo '=== LETSENCRYPT CERTS ==='
          sudo find /etc/letsencrypt/live -maxdepth 2 -type f -o -type l 2>/dev/null | sed -n '1,120p' || true
          echo '=== DOCKER IPS ==='
          for c in $(sudo docker ps --format '{{.Names}}'); do
            case "$c" in *impulsionando-core*|impulsionando-core)
              ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "$c" 2>/dev/null || true)"
              echo "$c IP=$ip"
              ;;
            esac
          done
          echo '=== CORE DIRECT TESTS ==='
          for c in $(sudo docker ps --format '{{.Names}}'); do
            case "$c" in *impulsionando-core*|impulsionando-core)
              ip="$(sudo docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$c" 2>/dev/null || true)"
              [ -n "$ip" ] || continue
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: chrismed.impulsionando.com.br' --max-time 8 "http://$ip:3000/" || true)"
              echo "$c DIRECT=$code"
              ;;
            esac
          done
          REMOTE

      - name: Report inspection
        if: always()
        run: |
          body="$(printf 'P0_NGINX_INSPECTION\n\n```text\n%s\n```\n' "$(tail -n 160 /tmp/p0-report.txt 2>/dev/null || true)")"
          gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$body"
