name: P0 recover all fronts

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/p0-recover-fronts.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: p0-recover-all-fronts
  cancel-in-progress: true

jobs:
  recover:
    if: github.head_ref == 'ops/p0-recover-fronts-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build current main
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          npm ci --no-audit --no-fund
          npm run build
          test -f .output/server/index.mjs
          printf '%s' "$MAIN_SHA" > .output/public/impulsionando-front-sha.txt
          tar -czf /tmp/p0-main.tgz .output scripts package.json package-lock.json

      - name: Configure SSH and upload
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          scp /tmp/p0-main.tgz "$VPS_USER@$VPS_HOST:/tmp/p0-main.tgz"

      - name: Promote current main to systemd Core
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" "MAIN_SHA='$MAIN_SHA' bash -s" <<'REMOTE' | tee /tmp/runtime-report.txt
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="/var/backups/impulsionando/p0-$stamp"
          sudo mkdir -p "$backup"
          sudo systemctl cat impulsionando-core.service > /tmp/unit.txt || true
          sudo cp /tmp/unit.txt "$backup/impulsionando-core.service.before.txt" || true
          sudo cp -a /etc/nginx "$backup/nginx" || true

          release="/var/www/impulsionando-core/releases/p0-$MAIN_SHA"
          sudo rm -rf "$release"
          sudo mkdir -p "$release"
          sudo tar -xzf /tmp/p0-main.tgz -C "$release"
          sudo chown -R www-data:www-data "$release"
          rm -f /tmp/p0-main.tgz
          test -f "$release/.output/server/index.mjs"

          sudo mkdir -p /etc/systemd/system/impulsionando-core.service.d
          sudo tee /etc/systemd/system/impulsionando-core.service.d/90-canonical-runtime.conf >/dev/null <<EOF
          [Service]
          WorkingDirectory=$release
          ExecStart=
          ExecStart=/usr/bin/node .output/server/index.mjs
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart impulsionando-core.service

          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/root -w '%{http_code}' -H 'Host: impulsionando.com.br' --max-time 8 http://127.0.0.1:3000/ || true)"
            [ "$code" = 200 ] && break
            [ "$i" -lt 30 ] || { sudo journalctl -u impulsionando-core.service -n 120 --no-pager; exit 31; }
            sleep 2
          done
          echo "CORE_ROOT=$code"
          failed=0
          for host in impulsionando.com.br chrismed.impulsionando.com.br grupoevr.impulsionando.com.br wmp.impulsionando.com.br; do
            code="$(curl -sS -o /tmp/body -w '%{http_code}' -H "Host: $host" --max-time 10 http://127.0.0.1:3000/ || true)"
            echo "$host CORE=$code"
            [ "$code" = 200 ] || failed=1
          done
          [ "$failed" -eq 0 ]
          sudo ln -sfn "$release" /var/www/impulsionando-core/current
          sudo ln -sfn "$release" /var/www/impulsionando-core/current-front
          REMOTE

      - name: Issue wildcard certificate and configure Nginx HTTPS
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          printf 'dns_cloudflare_api_token = %s\n' "$CF_API_TOKEN" > /tmp/cloudflare.ini
          chmod 600 /tmp/cloudflare.ini
          scp /tmp/cloudflare.ini "$VPS_USER@$VPS_HOST:/tmp/cloudflare.ini"
          rm -f /tmp/cloudflare.ini
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee /tmp/edge-report.txt
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y certbot python3-certbot-dns-cloudflare >/dev/null
          sudo install -m 600 /tmp/cloudflare.ini /root/.cloudflare.ini
          rm -f /tmp/cloudflare.ini

          sudo certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials /root/.cloudflare.ini \
            --dns-cloudflare-propagation-seconds 30 \
            --non-interactive --agree-tos \
            --email sac@impulsionando.com.br \
            --cert-name impulsionando.com.br \
            -d impulsionando.com.br -d '*.impulsionando.com.br' \
            --keep-until-expiring

          sudo tee /etc/nginx/sites-available/00-impulsionando-wildcard >/dev/null <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name impulsionando.com.br *.impulsionando.com.br;
            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
          }

          server {
            listen 443 ssl http2;
            listen [::]:443 ssl http2;
            server_name impulsionando.com.br *.impulsionando.com.br;
            ssl_certificate /etc/letsencrypt/live/impulsionando.com.br/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/impulsionando.com.br/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;
            location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
            }
          }
          NGINX
          sudo ln -sfn /etc/nginx/sites-available/00-impulsionando-wildcard /etc/nginx/sites-enabled/00-impulsionando-wildcard
          sudo nginx -t
          sudo systemctl reload nginx
          sudo ss -ltnp | grep -E ':(80|443)\b'

          failed=0
          for host in impulsionando.com.br chrismed.impulsionando.com.br grupoevr.impulsionando.com.br wmp.impulsionando.com.br; do
            code="$(curl -k -sS -o /tmp/local -w '%{http_code}' --resolve "$host:443:127.0.0.1" "https://$host/" --max-time 12 || true)"
            echo "$host LOCAL_HTTPS=$code"
            [ "$code" = 200 ] || failed=1
          done
          [ "$failed" -eq 0 ]
          sudo rm -f /root/.cloudflare.ini
          REMOTE

      - name: Public validation
        id: public
        run: |
          set +e
          failed=0
          result=''
          for host in impulsionando.com.br chrismed.impulsionando.com.br grupoevr.impulsionando.com.br wmp.impulsionando.com.br; do
            code=000
            for i in $(seq 1 12); do
              code="$(curl -sS -L -o /tmp/page -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 20 "https://$host/?p0=$MAIN_SHA" || true)"
              [ "$code" = 200 ] && break
              sleep 5
            done
            echo "$host PUBLIC=$code"
            result="$result $host=$code"
            [ "$code" = 200 ] || failed=1
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$failed"

      - name: Report result
        if: always()
        run: |
          body="$(printf 'P0_CANONICAL_RECOVERY\n\nMain SHA: %s\nPublic:%s\n\nRuntime:\n```text\n%s\n```\nEdge:\n```text\n%s\n```\n' "$MAIN_SHA" '${{ steps.public.outputs.result }}' "$(tail -n 80 /tmp/runtime-report.txt 2>/dev/null || true)" "$(tail -n 80 /tmp/edge-report.txt 2>/dev/null || true)")"
          gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$body"
