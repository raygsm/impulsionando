name: CHRISMED Fast Front Final

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chrismed-fast-front-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chrismed-fast-front-final
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify CHRISMED final source guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CPF inválido — não é possível avançar' src/routes/chrismed.agendar.tsx
          grep -Fq 'Validar dados e continuar' src/routes/chrismed.agendar.tsx
          grep -Fq 'Impulsionito a postos' src/components/chrismed/ChrismedShell.tsx
          grep -Fq 'initialEmail={search.email}' src/routes/auth.tsx
          grep -Fq 'nextPath={safeNext(search.next)}' src/routes/auth.tsx
          if grep -Fq 'Não foi possível concluir a solicitação: ${msg}' src/routes/auth.tsx; then exit 31; fi

      - name: Install, test and build current main
        env:
          VITE_PUBLIC_SITE_URL: https://impulsionando.com.br
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test -- --run tests/chrismed-no-regression-go-live.test.ts
          npm run build
          test -f .output/server/index.mjs
          printf '%s' "$GITHUB_SHA" > .output/public/impulsionando-front-sha.txt
          tar -czf /tmp/chrismed-final-front.tgz .output scripts

      - name: Configure SSH and upload
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          scp /tmp/chrismed-final-front.tgz "$VPS_USER@$VPS_HOST:/tmp/chrismed-final-$GITHUB_SHA.tgz"

      - name: Safe canary and CHRISMED-only promotion
        shell: bash
        run: |
          set -o pipefail
          set +e
          ssh "$VPS_USER@$VPS_HOST" "RELEASE_SHA='$GITHUB_SHA' bash -s" <<'REMOTE' 2>&1 | tee /tmp/chrismed-front-remote.log
          set -Eeuo pipefail
          release="/var/www/impulsionando-core/releases/chrismed-final-$RELEASE_SHA"
          archive="/tmp/chrismed-final-$RELEASE_SHA.tgz"
          envfile=/etc/impulsionando-core.env
          canary=chrismed-front-final-canary
          live=chrismed-front-final-live

          sudo test -f "$envfile"
          sudo docker inspect impulsionando-core >/dev/null
          image="$(sudo docker inspect -f '{{.Config.Image}}' impulsionando-core)"
          network="$(sudo docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{printf "%s " $k}}{{end}}' impulsionando-core | awk '{print $1}')"
          test -n "$image"; test -n "$network"

          sudo rm -rf "$release" && sudo mkdir -p "$release"
          sudo tar -xzf "$archive" -C "$release"
          rm -f "$archive"
          test "$(sudo cat "$release/.output/public/impulsionando-front-sha.txt")" = "$RELEASE_SHA"

          sudo docker rm -f "$canary" >/dev/null 2>&1 || true
          sudo docker run -d --name "$canary" --network "$network" --env-file "$envfile" \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -e PULSONITOR_ENABLED=false -e COLORS_AUTOMATION_ENABLED=false \
            -v "$release/.output:/app/.output:ro" -v "$release/scripts:/app/scripts:ro" \
            "$image" node scripts/start-core-runtime.mjs >/dev/null

          ok=0
          for i in $(seq 1 75); do
            if sudo docker exec "$canary" node -e "fetch('http://127.0.0.1:3000/chrismed',{headers:{host:'chrismed.impulsionando.com.br'}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(2))" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo 'CANARY_FAIL'
            sudo docker inspect "$canary" --format 'state={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' || true
            sudo docker logs --tail 260 "$canary" || true
            sudo docker rm -f "$canary" >/dev/null 2>&1 || true
            exit 71
          fi
          sudo docker rm -f "$canary" >/dev/null

          sudo docker rm -f "$live" >/dev/null 2>&1 || true
          sudo docker run -d --name "$live" --network "$network" --env-file "$envfile" --restart unless-stopped \
            -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=3000 \
            -e PULSONITOR_ENABLED=false -e COLORS_AUTOMATION_ENABLED=false \
            -v "$release/.output:/app/.output:ro" -v "$release/scripts:/app/scripts:ro" \
            --label 'traefik.enable=true' \
            --label 'traefik.http.routers.chrismed-final.entrypoints=websecure' \
            --label 'traefik.http.routers.chrismed-final.rule=Host(`chrismed.impulsionando.com.br`) && !PathPrefix(`/api`)' \
            --label 'traefik.http.routers.chrismed-final.tls=true' \
            --label 'traefik.http.routers.chrismed-final.tls.certresolver=letsencrypt' \
            --label 'traefik.http.routers.chrismed-final.priority=20000' \
            --label 'traefik.http.routers.chrismed-final.service=chrismed-final' \
            --label 'traefik.http.services.chrismed-final.loadbalancer.server.port=3000' \
            "$image" node scripts/start-core-runtime.mjs >/dev/null

          live_ok=0
          for i in $(seq 1 75); do
            if sudo docker exec "$live" node -e "fetch('http://127.0.0.1:3000/chrismed',{headers:{host:'chrismed.impulsionando.com.br'}}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(2))" >/dev/null 2>&1; then live_ok=1; break; fi
            sleep 2
          done
          if [ "$live_ok" != 1 ]; then
            echo 'LIVE_FAIL'
            sudo docker logs --tail 260 "$live" || true
            sudo docker rm -f "$live" >/dev/null 2>&1 || true
            exit 72
          fi
          echo "CHRISMED_PROMOTION_PASS sha=$RELEASE_SHA"
          REMOTE
          rc=${PIPESTATUS[0]}
          test "$rc" -eq 0

      - name: Verify real public CHRISMED
        shell: bash
        run: |
          set -euo pipefail
          marker=''; h=''; a=''; b=''
          for i in $(seq 1 35); do
            marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 12 "https://chrismed.impulsionando.com.br/impulsionando-front-sha.txt?t=$GITHUB_SHA" 2>/dev/null || true)"
            h="$(curl -sS -L -o /tmp/h -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://chrismed.impulsionando.com.br/?t=$GITHUB_SHA" || true)"
            a="$(curl -sS -L -o /tmp/a -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://chrismed.impulsionando.com.br/auth?email=raygs%40hotmail.com&next=%2Fchrismed%2Fwhatsapp&t=$GITHUB_SHA" || true)"
            b="$(curl -sS -L -o /tmp/b -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 "https://chrismed.impulsionando.com.br/chrismed/agendar?t=$GITHUB_SHA" || true)"
            if [ "$marker" = "$GITHUB_SHA" ] && [ "$h" = 200 ] && [ "$a" = 200 ] && [ "$b" = 200 ]; then
              printf 'sha=%s\nhome=%s\nauth=%s\nbooking=%s\nstatus=PASS\n' "$marker" "$h" "$a" "$b" > /tmp/chrismed-final-front-proof.txt
              exit 0
            fi
            sleep 2
          done
          printf 'sha=%s\nhome=%s\nauth=%s\nbooking=%s\nstatus=FAIL\n' "$marker" "$h" "$a" "$b" > /tmp/chrismed-final-front-proof.txt
          exit 81

      - name: Persist proof
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docs/ops
          cp /tmp/chrismed-final-front-proof.txt docs/ops/chrismed-final-front-proof.txt 2>/dev/null || printf 'status=proof_unavailable\n' > docs/ops/chrismed-final-front-proof.txt
          git config user.name 'Impulsionito CHRISMED Front QA'
          git config user.email 'automation@impulsionando.com.br'
          git add docs/ops/chrismed-final-front-proof.txt
          git commit -m 'chore(chrismed): record final front publication proof' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
