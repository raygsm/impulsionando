name: CHRISMED Front Verification (canonical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify CHRISMED is served by canonical production release
        shell: bash
        run: |
          set -euo pipefail
          marker="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 'https://chrismed.impulsionando.com.br/impulsionando-front-sha.txt')"
          test -n "$marker"
          code="$(curl -sS -L -o /tmp/home -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 15 'https://chrismed.impulsionando.com.br/')"
          test "$code" = '200'
          echo "CHRISMED_CANONICAL_FRONT=PASS sha=$marker"

      - name: Legacy router policy
        run: |
          echo 'Dedicated CHRISMED frontend containers and Traefik routers are retired.'
          echo 'All CHRISMED frontend publication is owned exclusively by Production Front.'
