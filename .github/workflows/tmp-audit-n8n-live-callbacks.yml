name: Temporary repair n8n Core API base

on:
  push:
    branches:
      - ops/audit-n8n-live-callbacks-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-live-callbacks.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Set canonical Core API base for n8n
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -eu
            cd /docker/n8n-umlg
            TS=$(date +%Y%m%d%H%M%S)
            cp .env ".env.bak.$TS"
            cp docker-compose.yml "docker-compose.yml.bak.$TS"

            if grep -q '^IMPULSIONANDO_API_BASE=' .env; then
              sed -i 's#^IMPULSIONANDO_API_BASE=.*#IMPULSIONANDO_API_BASE=https://impulsionando.com.br#' .env
            else
              printf '\nIMPULSIONANDO_API_BASE=https://impulsionando.com.br\n' >> .env
            fi

            if ! grep -q 'IMPULSIONANDO_API_BASE' docker-compose.yml; then
              awk '
                /IMPULSIONANDO_WEBHOOK_SECRET/ && !done {
                  print;
                  match($0,/^[[:space:]]*/); indent=substr($0,1,RLENGTH);
                  print indent "- IMPULSIONANDO_API_BASE=${IMPULSIONANDO_API_BASE}";
                  done=1; next
                }
                {print}
              ' docker-compose.yml > docker-compose.yml.tmp
              mv docker-compose.yml.tmp docker-compose.yml
            fi

            docker compose config >/dev/null
            docker compose up -d n8n
            sleep 15

            C=n8n-umlg-n8n-1
            BASE=$(docker exec "$C" sh -lc 'printf "%s" "${IMPULSIONANDO_API_BASE:-}"')
            if [ "$BASE" != 'https://impulsionando.com.br' ]; then
              echo 'CORE_API_BASE=INVALID'
              cp "docker-compose.yml.bak.$TS" docker-compose.yml
              cp ".env.bak.$TS" .env
              docker compose up -d n8n
              exit 1
            fi

            STATUS=$(docker inspect -f '{{.State.Status}}' "$C")
            RESTARTS=$(docker inspect -f '{{.RestartCount}}' "$C")
            HTTP=$(curl -sk --max-time 20 -o /dev/null -w '%{http_code}' https://n8n.impulsionando.com.br/healthz || true)
            echo "CORE_API_BASE=OK STATUS=$STATUS RESTARTS=$RESTARTS HEALTH=${HTTP:-000}"
            [ "$STATUS" = 'running' ]
            [ "${HTTP:-000}" != '000' ]
            [ "${HTTP:-000}" -lt 500 ]
