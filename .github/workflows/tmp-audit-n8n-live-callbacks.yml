name: Temporary inspect n8n environment wiring

on:
  push:
    branches:
      - ops/audit-n8n-live-callbacks-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-live-callbacks.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect non-secret environment wiring
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -eu
            cd /docker/n8n-umlg
            echo '--- raw compose key locations ---'
            grep -nE 'environment:|IMPULSIONANDO_API_BASE|IMPULSIONANDO_WEBHOOK_SECRET|WEBHOOK_URL|N8N_HOST|N8N_PROTOCOL' docker-compose.yml | sed -E 's#(IMPULSIONANDO_WEBHOOK_SECRET[=: -]*).*#\1REDACTED#' || true
            echo '--- rendered n8n env key presence ---'
            docker compose config | awk '
              /n8n:/ {seen=1}
              seen && /environment:/ {env=1; next}
              env && /^[[:space:]]{6}[A-Za-z0-9_]+:/ {
                key=$1; sub(/:$/, "", key);
                if (key ~ /^(IMPULSIONANDO_API_BASE|IMPULSIONANDO_WEBHOOK_SECRET|WEBHOOK_URL|N8N_HOST|N8N_PROTOCOL)$/) print key "=PRESENT";
              }
            '
            echo '--- container key presence ---'
            C=n8n-umlg-n8n-1
            for key in IMPULSIONANDO_API_BASE IMPULSIONANDO_WEBHOOK_SECRET WEBHOOK_URL N8N_HOST N8N_PROTOCOL; do
              if docker exec "$C" sh -lc "test -n \"\${$key:-}\""; then echo "$key=PRESENT"; else echo "$key=MISSING"; fi
            done
