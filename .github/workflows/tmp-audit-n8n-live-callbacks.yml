name: Temporary audit n8n live callbacks

on:
  push:
    branches:
      - ops/audit-n8n-live-callbacks-20260813
    paths:
      - .github/workflows/tmp-audit-n8n-live-callbacks.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sanitized callback targets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            C=n8n-umlg-n8n-1
            docker exec "$C" n8n export:workflow --all --output=/tmp/impulsionando-workflows.json >/dev/null 2>&1
            docker exec "$C" node -e '
              const fs=require("fs");
              let data=JSON.parse(fs.readFileSync("/tmp/impulsionando-workflows.json","utf8"));
              if(!Array.isArray(data)) data=[data];
              for(const w of data.filter(x=>x.active)){
                const callbacks=[];
                for(const n of (w.nodes||[])){
                  const p=n.parameters||{};
                  const raw=String(p.url||"");
                  if(!raw.includes("n8n-callback")&&!raw.includes("/api/public/hooks/n8n-log")) continue;
                  const safeUrl=raw.split("?")[0].split("#")[0].replace(/(Bearer|token|secret|key)[=:][^ }&]+/ig,"$1=REDACTED");
                  callbacks.push({node:String(n.name||""),type:String(n.type||""),method:String(p.method||p.httpMethod||""),url:safeUrl,authentication:String(p.authentication||"none"),sendHeaders:!!p.sendHeaders});
                }
                console.log(JSON.stringify({id:String(w.id||""),name:String(w.name||""),callbacks}));
              }
            '
            docker exec "$C" rm -f /tmp/impulsionando-workflows.json
