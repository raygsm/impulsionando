name: Reconstruct legacy schema (disposable)

on:
  workflow_dispatch:
  push:
    branches:
      - agent/chrismed-phase1-stabilization
    paths:
      - .github/workflows/reconstruct-legacy-schema.yml

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated legacy migration set
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations supabase/migrations_canonical
          mv supabase/migrations_legacy supabase/migrations
          rm -f supabase/migrations/README.md
          # Legacy data seeds reference tenants that existed in the source
          # database but are not created by its migration history. Fixtures are
          # confined to this disposable reconstruction database.
          cat > supabase/migrations/20260616232527_reconstruction_tenant_fixtures.sql <<'SQL'
          INSERT INTO public.companies (id, name)
          VALUES
            ('8e90a584-a5f6-40b3-8975-dad968db39ba', 'Imobiliaria Garrido'),
            ('642096b5-a9ff-4521-a82a-c004f6d2e2d2', 'CHRISMED')
          ON CONFLICT (id) DO NOTHING;
          SQL
          cat > supabase/migrations/20260617202256_reconstruction_profile_fixtures.sql <<'SQL'
          INSERT INTO public.profiles (id, slug, name)
          VALUES ('fcaf3905-2f47-4afa-b16e-0844b92706e5', 'gestor', 'Gestor')
          ON CONFLICT (id) DO NOTHING;
          SQL
          cat > supabase/migrations/20260621141708_reconstruction_master_fixtures.sql <<'SQL'
          INSERT INTO auth.users (
            id, email, encrypted_password, email_confirmed_at,
            raw_app_meta_data, raw_user_meta_data, created_at, updated_at
          ) VALUES (
            '3f2e2101-190d-44f2-8102-57dddfd34c91', 'raygs@hotmail.com', '', now(),
            '{}'::jsonb, '{}'::jsonb, now(), now()
          ) ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.companies (id, name, is_master)
          VALUES ('eb102fc8-5575-4c71-91dc-3ed48be9b353', 'Impulsionando legacy reference', false)
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO public.profiles (id, slug, name, is_master_profile)
          VALUES ('6fbbb7e6-01ae-447f-bd66-85aeba9f54c4', 'super-admin-impulsionando', 'Super Admin Impulsionando', true)
          ON CONFLICT (id) DO NOTHING;
          SQL
          echo "Legacy migrations to validate: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)"

      - name: Reconstruct schema in disposable Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase start

      - name: Inventory reconstructed schema
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          supabase db dump --local --schema public --file reconstructed-public-schema.sql
          grep -c '^CREATE TABLE' reconstructed-public-schema.sql | xargs -I{} echo "Public tables reconstructed: {}"

      - name: Upload reconstructed schema
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-public-schema
          path: reconstructed-public-schema.sql
          if-no-files-found: error
          retention-days: 3
